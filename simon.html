<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>いろメモリ | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0a16;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#eef0ff;--sub:#9aa0c3;--acc:#fb7185}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;height:calc(100dvh - 46px);overflow:hidden}
.ttl{font-size:24px;font-weight:900;text-align:center;padding:8px 0 2px}
.sub{text-align:center;color:var(--sub);font-size:13px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.hidden{display:none!important}
#modeSeg{display:flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px;gap:2px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
#modeSeg button.on{background:var(--acc);color:#2a0a12}
.btn{background:var(--acc);color:#2a0a12;border:none;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;width:100%}
.btn:active{transform:scale(.97)}
.btn.subBtn{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line)}
.netBtns{display:flex;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
input[type=text]{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:18px;padding:11px;text-align:center;font-family:inherit;text-transform:uppercase}
#onlineStatus{font-size:13px;color:var(--sub);text-align:center;min-height:20px;line-height:1.6;margin-top:10px}
#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}
#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.25em;color:var(--acc);display:block;margin-top:4px}
.best{text-align:center;color:var(--sub);font-size:13px}
.level{text-align:center;font-size:20px;font-weight:900}
.level span{color:var(--acc);font-size:28px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:340px;margin:0 auto;width:100%}
.pad{aspect-ratio:1;border:none;border-radius:20px;cursor:pointer;opacity:.55;transition:opacity .12s,transform .12s;font-family:inherit}
.pad:active{transform:scale(.96)}
.pad.lit{opacity:1;filter:brightness(1.5);transform:scale(1.03)}
.pad:disabled{cursor:default}
.pad0{background:#22c55e}.pad1{background:#ef4444}.pad2{background:#eab308}.pad3{background:#3b82f6}
.msg{text-align:center;font-size:16px;font-weight:800;min-height:26px;line-height:1.5}
.turn{text-align:center;font-weight:900;padding:9px;border-radius:10px;background:rgba(251,113,133,.18)}
.phase{text-align:center;color:var(--sub);font-size:13px;min-height:18px}
/* 1画面フィット（共通ヘッダー46pxを除く高さに収め、パッドだけが伸縮） */
.ttl{padding-top:2px}
#gameArea{flex:1;min-height:0;display:flex}
#gameArea>.card{flex:1;min-height:0;width:100%}
#onlinePane{flex:0 1 auto;min-height:0;overflow-y:auto}
.pads{flex:1;min-height:0;grid-template-rows:1fr 1fr}
.pad{aspect-ratio:auto;height:100%}
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#onlinePane{overscroll-behavior:none;}
</style>
</head>
<body>
<div class="wrap">
<div class="ttl">🎵 いろメモリ</div>
<p class="sub">光る色の順番を覚えて同じ順にタップ！<br>オンラインは交互に1色ずつ伸ばす脱落制です。</p>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="soloPane"><div class="card"><p class="sub" style="margin-bottom:10px">シーケンスを覚えて再現してください。</p><button class="btn" id="soloStartBtn">スタート</button></div></div>
<div id="onlinePane" class="hidden"><div class="card">
<div class="netBtns"><button class="btn" id="hostBtn">部屋を作る</button></div>
<div class="row" style="margin-top:10px"><input type="text" id="joinCode" maxlength="6" placeholder="コード6文字"><button class="btn" id="joinBtn" style="width:auto;flex:none">参加する</button></div>
<div id="onlineCodeWrap" class="hidden">ルームコード<span id="roomCodeText">------</span></div>
<div id="onlineStatus"></div>
<button class="btn subBtn hidden" id="leaveBtn" style="margin-top:10px">退出する</button>
<div style="margin-top:10px"><button class="btn subBtn" id="onlineStartBtn">対戦スタート（ホスト）</button></div>
</div></div>
<div id="gameArea"><div class="card" style="display:flex;flex-direction:column;gap:12px">
<div class="level">レベル <span id="levelText">0</span></div>
<div class="turn hidden" id="turnText"></div>
<div class="pads">
<button class="pad pad0" data-c="0" disabled aria-label="緑"></button>
<button class="pad pad1" data-c="1" disabled aria-label="赤"></button>
<button class="pad pad2" data-c="2" disabled aria-label="黄"></button>
<button class="pad pad3" data-c="3" disabled aria-label="青"></button>
</div>
<div class="phase" id="phaseText">スタートを押してね</div>
<div class="msg" id="gameMsg"></div>
<button class="btn hidden" id="rematchBtn">もう一度</button>
</div></div>
<div class="best" id="bestLine">ベスト: ー</div>
</div>
<script>
let AC=null;function tone(f,d,type,v,delay){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.14,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.2));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.2));}catch(e){}}
const $=id=>document.getElementById(id);
const FREQS=[329.63,261.63,392.00,440.00];
let mode='solo';
let save={best:0};try{const s=localStorage.getItem('mini_simon_v1');if(s)save=Object.assign(save,JSON.parse(s));}catch(e){}
/* account.js のクラウドマージは読み込み後に localStorage へ値を書き戻すため、
   読み込み時点のメモリだけで保存すると後着した良い記録を古い値で上書きしてしまう。
   保存・表示のたびに保存済みの値と union（大きい方）を取ってから使う。 */
function unionSave(){try{const r=localStorage.getItem('mini_simon_v1');if(r){const s=JSON.parse(r);if(s&&typeof s.best==='number'&&s.best>save.best)save.best=s.best;}}catch(e){}}
function persist(){unionSave();try{localStorage.setItem('mini_simon_v1',JSON.stringify(save));}catch(e){} renderBest();}
function renderBest(){unionSave();$('bestLine').textContent='ベスト: '+(save.best?('長さ '+save.best):'ー');}
renderBest();
window.addEventListener('focus',renderBest);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)renderBest();});
setTimeout(renderBest,2000);setTimeout(renderBest,5000);
function setPadsEnabled(en){document.querySelectorAll('.pad').forEach(p=>p.disabled=!en);}
function flash(c,cb){const el=document.querySelector('.pad[data-c="'+c+'"]');if(el)el.classList.add('lit');tone(FREQS[c],.28,'sine',.15);setTimeout(()=>{if(el)el.classList.remove('lit');if(cb)cb();},320);}
function playSeq(seq,done){setPadsEnabled(false);$('phaseText').textContent='再生中…よく見てね';let i=0;function next(){if(i>=seq.length){setTimeout(()=>{if(done)done();},250);return;}flash(seq[i],()=>{i++;setTimeout(next,140);});}setTimeout(next,400);}
// Solo
let sSeq=[],sInputIdx=0,sPlaying=false;
/* ベストは「新しい長さに到達した時点」で即保存する。
   以前はゲームオーバー時にしか保存しなかったため、好記録の途中で
   やめる／スタートし直す／モードを切り替えるとベストが残らなかった。 */
function noteSoloBest(){unionSave();if(sSeq.length>save.best){save.best=sSeq.length;persist();}}
function soloStart(){sSeq=[Math.floor(Math.random()*4)];sPlaying=true;$('levelText').textContent=sSeq.length;$('gameMsg').textContent='';$('rematchBtn').classList.add('hidden');noteSoloBest();playSeq(sSeq,()=>{sInputIdx=0;$('phaseText').textContent='あなたの番：同じ順にタップ';setPadsEnabled(true);});}
function soloTap(c){flash(c);if(sSeq[sInputIdx]!==c){sPlaying=false;setPadsEnabled(false);$('phaseText').textContent='ゲームオーバー';$('gameMsg').textContent='記録：長さ '+sSeq.length+' まで到達';noteSoloBest();tone(160,.4,'sawtooth',.1);return;}sInputIdx++;if(sInputIdx>=sSeq.length){setPadsEnabled(false);$('phaseText').textContent='正解！次へ…';tone(784,.15,'sine',.12);setTimeout(()=>{sSeq.push(Math.floor(Math.random()*4));$('levelText').textContent=sSeq.length;noteSoloBest();playSeq(sSeq,()=>{sInputIdx=0;$('phaseText').textContent='あなたの番：同じ順にタップ';setPadsEnabled(true);});},700);}}
// Online
let oSeq=[],oInputIdx=0,oPhase='idle',oFinished=false,oRecorded=false,oMyTurn=false;
function updateTurnText(){const t=$('turnText');if(mode!=='online'){t.classList.add('hidden');return;}t.classList.remove('hidden');if(oFinished){t.textContent='対戦終了';return;}if(oPhase==='idle'){t.textContent='対戦開始を待っています';return;}t.textContent=oMyTurn?'🟢 あなたのターンです':'⏳ 相手のターンです';}
function onlineReceiveSeq(seq){oSeq=seq.slice();$('levelText').textContent=oSeq.length;oMyTurn=true;oFinished=false;updateTurnText();playSeq(oSeq,()=>{oInputIdx=0;oPhase='repro';$('phaseText').textContent='再現してね（'+oSeq.length+'色）';setPadsEnabled(true);});}
function onlineTap(c){if(oPhase==='repro'){flash(c);if(oSeq[oInputIdx]!==c){setPadsEnabled(false);oPhase='idle';oFinished=true;updateTurnText();$('phaseText').textContent='ミス！';$('gameMsg').textContent='😢 あなたの負け… シーケンス長さ '+oSeq.length;$('rematchBtn').classList.remove('hidden');sendNet({t:'fail'});if(!oRecorded){oRecorded=true;if(window.PWFriends&&PWFriends.recordMatch)PWFriends.recordMatch('lose');}tone(160,.4,'sawtooth',.1);return;}oInputIdx++;if(oInputIdx>=oSeq.length){oPhase='add';$('phaseText').textContent='正解！好きな色を1つタップして追加してね';}return;}
if(oPhase==='add'){flash(c);oSeq.push(c);$('levelText').textContent=oSeq.length;setPadsEnabled(false);oPhase='idle';oMyTurn=false;updateTurnText();$('phaseText').textContent='相手へ送信しました。相手のターンを待ってね';sendNet({t:'seq',seq:oSeq});tone(784,.15,'sine',.12);return;}}
function resetOnlineGame(){oSeq=[];oInputIdx=0;oPhase='idle';oFinished=false;oRecorded=false;oMyTurn=false;$('levelText').textContent='0';$('gameMsg').textContent='';$('phaseText').textContent='接続を待っています…';$('rematchBtn').classList.add('hidden');setPadsEnabled(false);updateTurnText();}
function startOnlineHost(){if(!isHost){$('gameMsg').textContent='スタートはホストが押します';return;}const seq=[Math.floor(Math.random()*4)];oSeq=[];oMyTurn=false;oPhase='idle';oFinished=false;oRecorded=false;updateTurnText();$('phaseText').textContent='相手へ最初のシーケンスを送りました';$('gameMsg').textContent='相手のターンを待ってね';sendNet({t:'seq',seq:seq});}
document.querySelectorAll('.pad').forEach(p=>{p.addEventListener('click',()=>{const c=parseInt(p.dataset.c,10);if(mode==='solo'){if(sPlaying)soloTap(c);}else{if(oPhase==='repro'||oPhase==='add')onlineTap(c);}});});
document.querySelectorAll('#modeSeg button').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;const on=mode==='online';$('soloPane').classList.toggle('hidden',on);$('onlinePane').classList.toggle('hidden',!on);if(on){resetOnlineGame();}else{$('turnText').classList.add('hidden');setPadsEnabled(false);$('phaseText').textContent='スタートを押してね';$('levelText').textContent='0';}tone(660,.08,'sine',.08);});});
$('soloStartBtn').addEventListener('click',soloStart);
$('onlineStartBtn').addEventListener('click',startOnlineHost);
$('rematchBtn').addEventListener('click',()=>{if(isHost){startOnlineHost();}else{sendNet({t:'rematch'});$('gameMsg').textContent='再戦を申し込みました…';}});
function onNetData(m){if(!m||!m.t)return;if(m.t==='ping')return;
if(m.t==='hello'){setOnlineStatus('接続しました！ホストがスタートを押すと始まります。');return;}
if(m.t==='seq'){onlineReceiveSeq(m.seq);return;}
if(m.t==='fail'){oFinished=true;oPhase='idle';setPadsEnabled(false);updateTurnText();$('phaseText').textContent='相手がミスしました';$('gameMsg').textContent='🎉 あなたの勝ち！ シーケンス長さ '+oSeq.length;$('rematchBtn').classList.remove('hidden');if(!oRecorded){oRecorded=true;if(window.PWFriends&&PWFriends.recordMatch)PWFriends.recordMatch('win');}tone(523,.15,'sine',.12);tone(784,.25,'sine',.12,.15);return;}
if(m.t==='rematch'){if(isHost)startOnlineHost();return;}
}
function onNetDisconnected(){setOnlineStatus('<span class="err">相手との接続が切れました。</span>');setPadsEnabled(false);}
</script>
<script>
const PEER_PREFIX = 'playweb-sm-';
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
] } };
let peer=null, conn=null, isHost=false, roomCode='', heartbeatTimer=null, connTimer=null;
function genRoomCode(){ const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=C.charAt(Math.floor(Math.random()*C.length)); return s; }
function peerAvailable(){ return typeof window.Peer !== 'undefined'; }
function sendNet(o){ if (conn && conn.open){ try{ conn.send(o); }catch(e){} } }
function setOnlineStatus(html){ const el=document.getElementById('onlineStatus'); if(el) el.innerHTML=html; }
function startHeartbeat(){ stopHeartbeat(); heartbeatTimer=setInterval(()=>sendNet({t:'ping'}),8000); }
function stopHeartbeat(){ if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; } }
function armConnTimer(msg){ clearTimeout(connTimer); connTimer=setTimeout(()=>{ if(!conn||!conn.open) setOnlineStatus('<span class="err">'+msg+'</span>'); },25000); }
function disarmConnTimer(){ clearTimeout(connTimer); }
function gateOk(){ if (window.PWFriends && PWFriends.gateState){ const g=PWFriends.gateState(); if (g==='guest'||g==='sdk-down'){ setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>'); return false; } } return true; }
function setupConn(c){ conn=c; c.on('data', onNetData); c.on('open', ()=>{ disarmConnTimer(); startHeartbeat(); }); c.on('close', ()=>{ if(conn===c) onNetDisconnected(); }); c.on('error', ()=>{ if(conn===c) onNetDisconnected(); }); }
function teardownOnline(){ stopHeartbeat(); clearTimeout(connTimer); try{if(conn)conn.close();}catch(e){} try{if(peer)peer.destroy();}catch(e){} conn=null; peer=null; }
function hostRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; teardownOnline(); isHost=true; roomCode=genRoomCode(); window.PW_ROOM_CODE=roomCode; resetOnlineGame(); setOnlineStatus('部屋を作成中…');
  try{ peer=new Peer(PEER_PREFIX+roomCode, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ document.getElementById('roomCodeText').textContent=roomCode; document.getElementById('onlineCodeWrap').classList.remove('hidden'); document.getElementById('leaveBtn').classList.remove('hidden'); setOnlineStatus('フレンドの参加を待っています…'); });
  peer.on('connection', c=>{ setupConn(c); armConnTimer('相手との接続を確立できませんでした。'); });
  peer.on('error', err=>{ if(err&&err.type==='unavailable-id') setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>'); });
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
}
function joinRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; const code=(document.getElementById('joinCode').value||'').trim().toUpperCase(); if(code.length!==6){ setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; } teardownOnline(); isHost=false; roomCode=code; resetOnlineGame(); setOnlineStatus('接続中…');
  try{ peer=new Peer(undefined, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ armConnTimer('接続を確立できませんでした。'); const c=peer.connect(PEER_PREFIX+code,{reliable:true}); setupConn(c); c.on('open', ()=>{ document.getElementById('leaveBtn').classList.remove('hidden'); sendNet({t:'hello'}); setOnlineStatus('接続しました！対戦開始を待っています…'); }); });
  peer.on('error', err=>{ if(err&&err.type==='peer-unavailable') setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>'); });
}
function leaveOnline(){ teardownOnline(); window.PW_ROOM_CODE=''; document.getElementById('onlineCodeWrap').classList.add('hidden'); document.getElementById('leaveBtn').classList.add('hidden'); setOnlineStatus(''); resetOnlineGame(); }
document.getElementById('hostBtn').addEventListener('click',hostRoom);
document.getElementById('joinBtn').addEventListener('click',joinRoom);
document.getElementById('leaveBtn').addEventListener('click',leaveOnline);
</script>
<script>window.PW_GAME='simon';window.PW_JOIN_CFG={openers:[{click:'button[data-m="online"]'}],input:'#joinCode',joinBtn:'#joinBtn',hostBtn:'#hostBtn'};</script>
<script src="friends.js"></script>
</body>
</html>
