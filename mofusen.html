<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>にゃんこ小戦争 | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#141021; }
  body { font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif; color:#fff4e0;
         touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  button { font-family:inherit; cursor:pointer; }
  /* ── 画面共通 ── */
  .scr { position:fixed; inset:0; z-index:40; display:none; flex-direction:column; align-items:center; justify-content:flex-start;
         padding:calc(var(--pw-header-h,46px) + 10px) 14px 14px; overflow-y:auto;
         background:radial-gradient(ellipse at 50% 18%, #3b2a63 0%, #241a44 55%, #141021 100%); }
  .scr.show { display:flex; }
  .card { width:min(560px,96vw); background:rgba(24,16,48,.92); border:1px solid rgba(255,205,120,.35); border-radius:20px;
          padding:22px 18px; box-shadow:0 18px 50px rgba(0,0,0,.55); text-align:center; margin:auto 0; }
  .gameTitle { font-size:clamp(30px,8vw,44px); font-weight:900; letter-spacing:.04em; color:#ffe9b0;
               text-shadow:0 0 20px rgba(255,170,60,.55), 0 3px 0 #8a4b12; }
  .gameSub { font-size:13px; color:#e8d5ff; margin:8px 0 2px; line-height:1.7; }
  .fishBar { display:inline-flex; align-items:center; gap:6px; background:rgba(0,0,0,.35); border:1px solid rgba(255,205,120,.4);
             border-radius:999px; padding:5px 14px; font-weight:900; font-size:15px; color:#ffe9b0; margin-top:10px; }
  .bigBtn { display:block; width:100%; margin:10px 0 0; padding:14px; border:none; border-radius:13px;
            font-size:16.5px; font-weight:900; color:#4a2403; background:linear-gradient(90deg,#ffb340,#ffd76e);
            box-shadow:0 5px 0 #a86a12; }
  .bigBtn:active { transform:translateY(2px); box-shadow:0 3px 0 #a86a12; }
  .subBtn { display:block; width:100%; margin:10px 0 0; padding:12px; border-radius:13px; font-size:15px; font-weight:800;
            color:#ffe9b0; background:rgba(255,255,255,.08); border:1px solid rgba(255,205,120,.45); }
  .subBtn:active { transform:translateY(1px); }
  .backBtn { align-self:flex-start; padding:8px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.3);
             background:rgba(0,0,0,.3); color:#fff; font-weight:800; font-size:14px; margin-bottom:10px; }
  .secTitle { font-size:20px; font-weight:900; color:#ffe9b0; margin:2px 0 10px; letter-spacing:.05em; }
  /* ── ステージ選択 ── */
  #stageList { width:min(560px,96vw); display:flex; flex-direction:column; gap:9px; padding-bottom:16px; }
  .stageBtn { display:flex; align-items:center; gap:12px; text-align:left; padding:12px 14px; border-radius:14px; border:1px solid rgba(255,205,120,.35);
              background:linear-gradient(90deg, rgba(90,60,160,.55), rgba(40,26,80,.75)); color:#fff; }
  .stageBtn:active { transform:scale(.99); }
  .stageBtn.locked { opacity:.45; }
  .stageNo { flex:0 0 44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#ffb340,#ff7847); color:#4a2403;
             font-weight:900; font-size:18px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 #a86a12; }
  .stageBtn .sname { font-size:16px; font-weight:900; }
  .stageBtn .smeta { font-size:11.5px; color:#d9c8ff; margin-top:2px; line-height:1.5; }
  .stageBtn .sclear { margin-left:auto; font-size:19px; flex:0 0 auto; }
  /* ── 強化 ── */
  #upList { width:min(560px,96vw); display:flex; flex-direction:column; gap:9px; padding-bottom:16px; }
  .upRow { display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:14px; text-align:left;
           background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); }
  .upRow .uemoji { font-size:30px; flex:0 0 42px; text-align:center; }
  .upRow .uname { font-size:15px; font-weight:900; }
  .upRow .ustat { font-size:11.5px; color:#d9c8ff; line-height:1.5; }
  .upRow .ulv { color:#ffd76e; font-weight:900; }
  .upBtn { margin-left:auto; flex:0 0 auto; padding:10px 12px; border:none; border-radius:11px; font-weight:900; font-size:13.5px;
           color:#4a2403; background:linear-gradient(90deg,#ffb340,#ffd76e); box-shadow:0 3px 0 #a86a12; line-height:1.35; text-align:center; }
  .upBtn:disabled { background:#5a5470; color:#bdb6d6; box-shadow:none; }
  /* ── ロビー ── */
  .codeInput { width:150px; padding:11px; font-size:19px; font-weight:900; text-align:center; letter-spacing:.25em; text-transform:uppercase;
               border-radius:11px; border:1px solid rgba(255,205,120,.5); background:rgba(0,0,0,.4); color:#ffe9b0; font-family:inherit; }
  #roomCodeWrap { display:none; margin:12px 0 2px; }
  #roomCodeText { font-size:30px; font-weight:900; letter-spacing:.3em; color:#ffd76e; text-shadow:0 2px 0 #8a4b12; }
  #lobbyStatus { font-size:13px; color:#e8d5ff; margin-top:12px; line-height:1.7; min-height:22px; }
  #lobbyStatus .err { color:#ff9d9d; }
  .joinRow { display:flex; gap:9px; justify-content:center; align-items:center; margin-top:4px; }
  /* ── バトル ── */
  #battleScr { position:fixed; inset:0; z-index:40; display:none; flex-direction:column; background:#1a1430;
               padding-top:var(--pw-header-h,46px); }
  #battleScr.show { display:flex; }
  #castleBar { flex:0 0 auto; display:flex; align-items:center; gap:8px; padding:6px 10px; background:rgba(10,6,24,.85); }
  .castleHp { flex:1; min-width:0; }
  .castleHp .clabel { font-size:11px; font-weight:900; letter-spacing:.04em; display:flex; justify-content:space-between; margin-bottom:3px; }
  .hpTrack { height:11px; border-radius:99px; background:rgba(255,255,255,.14); overflow:hidden; border:1px solid rgba(255,255,255,.25); }
  .hpFill { height:100%; width:100%; border-radius:99px; transition:width .18s; }
  #myCastleFill { background:linear-gradient(90deg,#57d977,#a5ec8a); }
  #foeCastleFill { background:linear-gradient(90deg,#ff7a59,#ffb340); }
  #battleTimer { flex:0 0 auto; font-size:14px; font-weight:900; color:#ffe9b0; background:rgba(0,0,0,.4);
                 border:1px solid rgba(255,205,120,.4); border-radius:9px; padding:4px 9px; min-width:58px; text-align:center; }
  #cvWrap { flex:1 1 auto; position:relative; min-height:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; }
  #battleMsg { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:5; font-size:clamp(17px,4.6vw,26px); font-weight:900;
               color:#ffd76e; text-shadow:0 2px 0 #8a4b12, 0 0 16px rgba(255,150,50,.7); opacity:0; transition:opacity .25s; pointer-events:none;
               white-space:nowrap; }
  #battleMsg.on { opacity:1; }
  #ctrlBar { flex:0 0 auto; background:rgba(10,6,24,.92); border-top:1px solid rgba(255,205,120,.3); padding:7px 8px calc(7px + env(safe-area-inset-bottom)); }
  #moneyRow { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
  #moneyDisp { font-size:16px; font-weight:900; color:#ffe9b0; background:rgba(0,0,0,.45); border:1px solid rgba(255,205,120,.45);
               border-radius:10px; padding:5px 12px; min-width:118px; text-align:center; }
  #walletBtn { flex:1; padding:8px 6px; border:none; border-radius:11px; font-weight:900; font-size:13.5px; color:#20300a;
               background:linear-gradient(90deg,#9be15d,#cdea7a); box-shadow:0 3px 0 #5d8a2a; line-height:1.3; }
  #walletBtn:disabled { background:#5a5470; color:#bdb6d6; box-shadow:none; }
  #walletBtn:active:not(:disabled) { transform:translateY(1px); }
  #pauseBtnB { flex:0 0 auto; width:42px; height:42px; border-radius:11px; border:1px solid rgba(255,255,255,.3);
               background:rgba(255,255,255,.08); color:#fff; font-size:16px; }
  #unitBar { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .unitBtn { position:relative; overflow:hidden; border:1px solid rgba(255,255,255,.25); border-radius:12px; padding:5px 2px 4px;
             background:linear-gradient(180deg, rgba(120,90,200,.5), rgba(50,34,100,.65)); color:#fff; text-align:center; }
  .unitBtn .ue { font-size:21px; line-height:1.15; display:block; }
  .unitBtn .un { font-size:10.5px; font-weight:800; display:block; white-space:nowrap; overflow:hidden; }
  .unitBtn .uc { font-size:11px; font-weight:900; color:#ffd76e; display:block; }
  .unitBtn .cdov { position:absolute; left:0; right:0; bottom:0; height:0%; background:rgba(5,2,16,.62); pointer-events:none; }
  .unitBtn.poor { filter:grayscale(.75) brightness(.72); }
  .unitBtn:active { transform:scale(.96); }
  @media (min-width:760px) { #unitBar { grid-template-columns:repeat(8,1fr); } .unitBtn .ue { font-size:24px; } }
  /* ── 結果・ポーズ ── */
  .ovl { position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:18px;
         background:rgba(5,3,14,.72); }
  .ovl.show { display:flex; }
  #resultTitle { font-size:34px; font-weight:900; letter-spacing:.06em; }
  #resultTitle.win { color:#ffd76e; text-shadow:0 0 18px rgba(255,170,60,.8); }
  #resultTitle.lose { color:#9db4ff; text-shadow:0 0 18px rgba(90,120,255,.7); }
  #resultDetail { font-size:14px; line-height:1.9; color:#efe6ff; margin-top:8px; }
</style>
</head>
<body>

<!-- タイトル -->
<div class="scr show" id="titleScr">
  <div class="card">
    <div class="gameTitle">にゃんこ小戦争</div>
    <div class="gameSub">もふもふ軍団を生産して、敵のお城を落とそう！<br>お金を貯めて、お財布を育てて、押し切れ！</div>
    <div class="fishBar">🐟 にぼし <span id="fishDisp">0</span></div>
    <button class="bigBtn" id="btnStage">⚔️ ステージへ出撃</button>
    <button class="subBtn" id="mpBtn">🤝 フレンドと対戦</button>
    <button class="subBtn" id="btnUp">⬆️ ユニット強化</button>
    <div class="gameSub" style="font-size:11.5px;opacity:.85">ステージをクリアして「にぼし」を集めると<br>ユニットを永続強化できます。</div>
  </div>
</div>

<!-- ステージ選択 -->
<div class="scr" id="stageScr">
  <div style="width:min(560px,96vw)">
    <button class="backBtn" id="backFromStage">← もどる</button>
    <div class="secTitle">🗺️ 第1章 もふもふ平原</div>
  </div>
  <div id="stageList"></div>
</div>

<!-- 強化 -->
<div class="scr" id="upScr">
  <div style="width:min(560px,96vw)">
    <button class="backBtn" id="backFromUp">← もどる</button>
    <div class="secTitle">⬆️ ユニット強化</div>
    <div class="fishBar" style="margin:0 0 12px">🐟 にぼし <span id="fishDisp2">0</span></div>
  </div>
  <div id="upList"></div>
</div>

<!-- 対戦ロビー -->
<div class="scr" id="lobbyScr">
  <div class="card">
    <button class="backBtn" id="backFromLobby">← もどる</button>
    <div class="secTitle">🤝 フレンド対戦</div>
    <div class="gameSub">部屋を作ってフレンドを招待するか、<br>フレンドの部屋コードで参加しよう。<br>お互いの城を落とし合う押し合いバトル！</div>
    <button class="bigBtn" id="hostBtn">🏠 部屋を作る</button>
    <div id="roomCodeWrap">部屋コード<br><span id="roomCodeText">------</span>
      <div class="gameSub" style="font-size:11.5px">アカウント画面のフレンド一覧から<br>このゲームに招待できます</div>
    </div>
    <div class="joinRow">
      <input class="codeInput" id="joinCode" maxlength="6" placeholder="コード" autocomplete="off">
      <button class="subBtn" id="joinBtn" style="margin:0;width:auto;padding:11px 18px">参加する</button>
    </div>
    <div id="lobbyStatus"></div>
  </div>
</div>

<!-- バトル -->
<div id="battleScr">
  <div id="castleBar">
    <div class="castleHp">
      <div class="clabel"><span id="myCastleName">🏯 自城</span><span id="myCastleHpTx"></span></div>
      <div class="hpTrack"><div class="hpFill" id="myCastleFill"></div></div>
    </div>
    <div id="battleTimer">0:00</div>
    <div class="castleHp">
      <div class="clabel"><span id="foeCastleHpTx"></span><span id="foeCastleName">敵城 🏯</span></div>
      <div class="hpTrack"><div class="hpFill" id="foeCastleFill"></div></div>
    </div>
  </div>
  <div id="cvWrap"><canvas id="cv"></canvas><div id="battleMsg"></div></div>
  <div id="ctrlBar">
    <div id="moneyRow">
      <div id="moneyDisp">💰 0</div>
      <button id="walletBtn">👛 お財布Lv.1<br>強化 100</button>
      <button id="pauseBtnB">⏸</button>
    </div>
    <div id="unitBar"></div>
  </div>
</div>

<!-- 結果 -->
<div class="ovl" id="resultOv">
  <div class="card">
    <div id="resultTitle">勝利！</div>
    <div id="resultDetail"></div>
    <button class="bigBtn" id="resNext">次のステージへ ▶</button>
    <button class="subBtn" id="resRetry">🔁 もう一度</button>
    <button class="subBtn" id="resMap">🗺️ マップへもどる</button>
  </div>
</div>

<!-- ポーズ -->
<div class="ovl" id="pauseOv">
  <div class="card">
    <div class="secTitle">⏸ ポーズ中</div>
    <button class="bigBtn" id="resumeBtn">▶ つづける</button>
    <button class="subBtn" id="quitBtn">🏳️ あきらめる</button>
  </div>
</div>

<script>
/*__MOFU_MAIN__*/
(function () {
'use strict';
/* ═══════════════ データ定義 ═══════════════ */
/* ユニット（自軍ねこ軍団・全てオリジナル）
   hp/atk は Lv1 の値。レベル倍率 = 1 + 0.2*(lv-1)（hp・atk 共通）
   range: 攻撃射程（中心間距離） / kb: ノックバック回数 / area: 範囲攻撃 */
var UNITS = [
  { id:'mofu',    name:'もふねこ',     emoji:'🐱', cost:75,   hp:430,  atk:95,  range:115, speed:57,  atkInt:1.05, repro:1.4,  kb:3, area:false, desc:'基本のもふもふ。安くて速く出せる主力。' },
  { id:'kabe',    name:'かべもふ',     emoji:'🐈‍⬛', cost:160,  hp:1750, atk:35,  range:95,  speed:40,  atkInt:1.20, repro:2.2,  kb:2, area:false, desc:'まるまる太った壁役。敵の進軍を止める。' },
  { id:'hayate',  name:'はやてねこ',   emoji:'😼', cost:220,  hp:520,  atk:125, range:105, speed:112, atkInt:0.85, repro:2.6,  kb:3, area:false, desc:'赤いマフラーの俊足ねこ。手数で攻める。' },
  { id:'battle',  name:'バトルもふ',   emoji:'🐯', cost:380,  hp:1150, atk:265, range:115, speed:62,  atkInt:1.15, repro:4.2,  kb:2, area:false, desc:'トラ柄の格闘ねこ。一撃が重い。' },
  { id:'yumi',    name:'ゆみねこ',     emoji:'🏹', cost:480,  hp:560,  atk:210, range:330, speed:46,  atkInt:1.50, repro:5.0,  kb:3, area:false, desc:'緑フードの弓ねこ。遠くから狙い撃つ。' },
  { id:'sui',     name:'すいもふ',     emoji:'😻', cost:650,  hp:1350, atk:310, range:155, speed:52,  atkInt:1.20, repro:6.0,  kb:3, area:true,  desc:'ラグドール風の美ねこ。範囲攻撃でなぎ払う。' },
  { id:'kinniku', name:'きんにくもふ', emoji:'🦁', cost:850,  hp:2100, atk:430, range:135, speed:44,  atkInt:1.35, repro:8.0,  kb:2, area:true,  desc:'たてがみ自慢の筋肉ねこ。重い範囲攻撃。' },
  { id:'dragon',  name:'ドラゴンもふ', emoji:'🐲', cost:1250, hp:3300, atk:720, range:265, speed:39,  atkInt:1.60, repro:12.0, kb:1, area:true,  desc:'翼と角を持つ伝説のもふ。超火力の範囲攻撃。' }
];
var UNIT_BY_ID = {}; UNITS.forEach(function (u) { UNIT_BY_ID[u.id] = u; });

/* 敵（オリジナルの動物たち） bounty: 倒した時に得るお金 */
var ENEMIES = {
  tanuki:    { id:'tanuki',    name:'たぬき',       hp:320,   atk:65,  range:105, speed:46, atkInt:1.20, kb:3, area:false, bounty:40 },
  crow:      { id:'crow',      name:'からす',       hp:210,   atk:85,  range:100, speed:98, atkInt:0.90, kb:3, area:false, bounty:45 },
  boar:      { id:'boar',      name:'いのしし',     hp:950,   atk:160, range:110, speed:74, atkInt:1.40, kb:2, area:false, bounty:80 },
  monkey:    { id:'monkey',    name:'さる',         hp:540,   atk:115, range:120, speed:62, atkInt:1.00, kb:3, area:false, bounty:65 },
  snake:     { id:'snake',     name:'へび',         hp:700,   atk:140, range:175, speed:50, atkInt:1.30, kb:2, area:false, bounty:85 },
  turtle:    { id:'turtle',    name:'かめ',         hp:2600,  atk:105, range:105, speed:24, atkInt:1.60, kb:1, area:false, bounty:130 },
  bossCrow:  { id:'bossCrow',  name:'大からす',     hp:5200,  atk:270, range:120, speed:66, atkInt:1.00, kb:4, area:false, bounty:550, boss:true },
  bossTanuki:{ id:'bossTanuki',name:'たぬき大将',   hp:9500,  atk:380, range:140, speed:34, atkInt:1.50, kb:4, area:true,  bounty:600, boss:true },
  bossKame:  { id:'bossKame',  name:'要塞がめ',     hp:17000, atk:320, range:130, speed:20, atkInt:1.80, kb:3, area:true,  bounty:800, boss:true }
};

/* ステージ（第1章・10ステージ）
   trickle: {from, every, ids:[...]} 一定間隔でローテーション出現
   events:  [[秒, 敵id, 頭数], ...]  /  rush: 一定周期のバースト [[周期秒, 敵id, 頭数]]
   boss:    {id, at:0.5} 敵城HPが割合以下で出現（複数可） */
var STAGES = [
  { id:1,  name:'もふ草原',       castle:3000,  reward:120,  scale:1.00, trickle:{ from:5,  every:7.0, ids:['tanuki'] }, events:[], rush:null, bosses:[] },
  { id:2,  name:'たぬきの丘',     castle:4500,  reward:160,  scale:1.15, trickle:{ from:5,  every:6.0, ids:['tanuki'] }, events:[[40,'crow',2]], rush:null, bosses:[] },
  { id:3,  name:'からす海岸',     castle:6500,  reward:220,  scale:1.30, trickle:{ from:5,  every:5.5, ids:['tanuki','crow'] }, events:[[55,'crow',3]], rush:null, bosses:[{ id:'bossCrow', at:0.5 }] },
  { id:4,  name:'いのしし街道',   castle:9000,  reward:280,  scale:1.50, trickle:{ from:5,  every:5.0, ids:['tanuki','tanuki','crow'] }, events:[[30,'boar',1],[75,'boar',2]], rush:null, bosses:[] },
  { id:5,  name:'さる山の砦',     castle:12000, reward:360,  scale:1.70, trickle:{ from:5,  every:5.5, ids:['monkey','tanuki'] }, events:[[50,'monkey',3]], rush:null, bosses:[{ id:'bossTanuki', at:0.5 }] },
  { id:6,  name:'へび沼地',       castle:16000, reward:450,  scale:1.95, trickle:{ from:5,  every:6.0, ids:['snake','tanuki'] }, events:[[60,'turtle',1],[110,'snake',3]], rush:null, bosses:[] },
  { id:7,  name:'かめ甲羅要塞',   castle:21000, reward:560,  scale:2.20, trickle:{ from:5,  every:5.0, ids:['tanuki','monkey','crow'] }, events:[[45,'turtle',2]], rush:null, bosses:[{ id:'bossKame', at:0.5 }] },

/* ═══════════════ SFX（WebAudio 簡易シンセ） ═══════════════ */

  else if (name === 'wallet') { beep(700, 0.07, 'square', 0.04); setTimeout(function () { beep(980, 0.09, 'square', 0.04); }, 60); }
  else if (name === 'boss') { beep(140, 0.3, 'sawtooth', 0.06, 70); }

    $('resultDetail').innerHTML = '敵城を落とした！<br>タイム ' + fmtTime(battle.t) + '／撃破数 ' + battle.kills[0] + '<br>報酬 🐟 にぼし +' + reward + (first ? '' : '（再クリア）');
    $('resNext').style.display = STAGE_BY_ID[curStage.id + 1] ? '' : 'none';
    sfx('win');
  } else {
    title.textContent = '💦 敗北…'; title.className = 'lose';
    $('resultDetail').innerHTML = '自城が落ちてしまった…<br>タイム ' + fmtTime(battle.t) + '／撃破数 ' + battle.kills[0] + '<br>ユニットを強化して再挑戦しよう！';
    $('resNext').style.display = 'none';
    sfx('lose');
  }
  setTimeout(function () { $('resultOv').classList.add('show'); }, 650);
}
function endBattleToTitle() {
  stopLoop(); battle = null; uiMode = 'idle'; battleDone = false; paused = false;
  $('resultOv').classList.remove('show'); $('pauseOv').classList.remove('show');
  updateFish(); showScr('titleScr');
}

/* ═══════════════ ネット対戦（ホスト権威＋スナップショット） ═══════════════ */
var PEER_PREFIX = 'playweb-mf-';
var PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
] } };
var NET = { role: null, peer: null, conn: null, code: null, inGame: false, recorded: false,
            snapTimer: 0, heartbeatTimer: 0, connTimer: 0, guestLv: null };
function genRoomCode() {
  var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', s = '';
  for (var i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function netSend(obj) { if (NET.conn && NET.conn.open) { try { NET.conn.send(obj); } catch (e) {} } }
function setLobbyStatus(html) { var el = $('lobbyStatus'); if (el) el.innerHTML = html; }
function startHeartbeat() { stopHeartbeat(); NET.heartbeatTimer = setInterval(function () { netSend({ t: 'ping' }); }, 8000); }
function stopHeartbeat() { if (NET.heartbeatTimer) clearInterval(NET.heartbeatTimer); NET.heartbeatTimer = 0; }
function armConnTimer(msg) { disarmConnTimer(); NET.connTimer = setTimeout(function () { if (!NET.inGame) setLobbyStatus('<span class="err">' + msg + '</span>'); }, 25000); }
function disarmConnTimer() { if (NET.connTimer) clearTimeout(NET.connTimer); NET.connTimer = 0; }
function netCleanup(full) {
  if (NET.snapTimer) clearInterval(NET.snapTimer); NET.snapTimer = 0;
  stopHeartbeat(); disarmConnTimer();
  if (NET.conn) { try { NET.conn.close(); } catch (e) {} NET.conn = null; }
  if (full) {
    if (NET.peer) { try { NET.peer.destroy(); } catch (e) {} NET.peer = null; }
    NET.role = null; NET.code = null; NET.inGame = false; NET.guestLv = null;
    try { delete window.PW_ROOM_CODE; } catch (e) { window.PW_ROOM_CODE = undefined; }
    var w = $('roomCodeWrap'); if (w) w.style.display = 'none';
  }
}
function bindConn(c) {
  if (NET.conn && NET.conn !== c) { try { NET.conn.close(); } catch (e) {} }
  NET.conn = c;
  c.on('data', function (msg) { if (NET.conn === c) handleNetData(msg); });
  c.on('open', function () {
    if (NET.conn !== c) return;
    disarmConnTimer(); startHeartbeat();
    if (NET.role === 'guest') {
      netSend({ t: 'hello', lv: save.unitLv });
      setLobbyStatus('接続しました。ホストの開始を待っています…');
    } else setLobbyStatus('フレンドが接続しました。まもなく対戦開始！');
  });
  c.on('close', function () { if (NET.conn === c) onConnClose(); });
}
function onConnClose() {
  NET.conn = null; stopHeartbeat();
  if (NET.snapTimer) { clearInterval(NET.snapTimer); NET.snapTimer = 0; }
  if (uiMode === 'vs-host' && battle && !battleDone) {
    showMsg('相手が切断しました', 2000);
    NET.inGame = false;
    finishBattle(1); /* ホストの不戦勝 */
  } else if (uiMode === 'vs-guest' && battle && !battleDone) {
    showMsg('接続が切れました', 2200);
    setTimeout(function () { if (uiMode === 'vs-guest') { netCleanup(true); endBattleToTitle(); } }, 1600);
  } else if (!NET.inGame) {
    setLobbyStatus('相手が切断しました。');
  }
  NET.inGame = false;
}
function hostCreateRoom() {
  if (typeof Peer === 'undefined') { setLobbyStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  netCleanup(true);
  NET.role = 'host'; NET.code = genRoomCode();
  try { NET.peer = new Peer(PEER_PREFIX + NET.code, PEER_OPTS); }
  catch (e) { setLobbyStatus('<span class="err">接続の作成に失敗しました。</span>'); NET.role = null; return; }
  var myPeer = NET.peer, opened = false;
  NET.peer.on('open', function () {
    if (NET.peer !== myPeer || opened) return; opened = true;
    window.PW_ROOM_CODE = NET.code;
    $('roomCodeText').textContent = NET.code;
    $('roomCodeWrap').style.display = 'block';
    setLobbyStatus('部屋を作りました。フレンドの参加を待っています…');
  });
  NET.peer.on('connection', function (c) {
    if (NET.peer !== myPeer) return;
    bindConn(c);
    if (!NET.inGame) armConnTimer('相手との接続を確立できませんでした。もう一度参加してもらうか、ネットワーク環境を変えてお試しください。');
  });
  NET.peer.on('error', function (err) {
    if (NET.peer !== myPeer) return;
    if (err && err.type === 'unavailable-id') { try { NET.peer.destroy(); } catch (e) {} hostCreateRoom(); }
  });
}
function guestJoin(codeRaw) {
  var code = String(codeRaw || '').trim().toUpperCase();
  if (!/^[A-HJ-NP-Z2-9]{6}$/.test(code)) { setLobbyStatus('<span class="err">部屋コードは6文字で入力してください。</span>'); return; }
  if (typeof Peer === 'undefined') { setLobbyStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  netCleanup(true);
  NET.role = 'guest'; NET.code = code;
  setLobbyStatus('接続しています…');
  try { NET.peer = new Peer(undefined, PEER_OPTS); }
  catch (e) { setLobbyStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  var myPeer = NET.peer, tried = false;
  NET.peer.on('open', function () {
    if (NET.peer !== myPeer || tried) return; tried = true;
    var c = NET.peer.connect(PEER_PREFIX + code, { reliable: true });
    bindConn(c);
    armConnTimer('ホストに接続できませんでした。コードが合っているか、ホストが部屋を開いているか確認してください。');
  });
  NET.peer.on('error', function (err) {
    if (NET.peer !== myPeer) return;
    if (err && err.type === 'peer-unavailable') setLobbyStatus('<span class="err">その部屋が見つかりませんでした。コードを確認してください。</span>');
  });
}
function startVersusHost() {
  battle = createBattle({ mode: 'vs', lvMap0: save.unitLv, lvMap1: NET.guestLv });
  uiMode = 'vs-host'; paused = false; battleDone = false; NET.inGame = true; NET.recorded = false;
  $('myCastleName').textContent = '🏯 自城（あなた）';
  $('foeCastleName').textContent = '敵城（フレンド） 🏯';
  $('resultOv').classList.remove('show');
  netSend({ t: 'start' });
  showBattle(); startLoop();
  if (NET.snapTimer) clearInterval(NET.snapTimer);
  NET.snapTimer = setInterval(sendSnapshot, 100);
  showMsg('⚔️ 対戦スタート！', 1500);
}
function makeSnapshot() {
  return {
    t: 'snap',
    u: battle.units.map(function (u) { return [u.type, u.side, Math.round(u.x), Math.ceil(u.hp), u.maxHp, u.kbT > 0 ? 1 : 0, u.lungeT > 0 ? 1 : 0, u.enemy ? 1 : 0, u.boss ? 1 : 0]; }),
    c: [Math.max(0, Math.ceil(battle.castle[0])), Math.max(0, Math.ceil(battle.castle[1]))],
    cm: battle.castleMax,
    m: [Math.floor(battle.money[0]), Math.floor(battle.money[1])],
    w: battle.walletLv,
    r: battle.repro[1],
    tm: Math.round(battle.t * 10) / 10,
    k: battle.kills,
    over: battle.over
  };
}
function sendSnapshot() { if (battle && NET.role === 'host') netSend(makeSnapshot()); }
var guestPrev = [];
function applySnapshot(msg) {
  if (!battle) return;
  battle.castle = msg.c.slice(); battle.castleMax = msg.cm.slice();
  battle.money = msg.m.slice(); battle.walletLv = msg.w.slice();
  battle.repro[1] = msg.r || {};
  battle.t = msg.tm; battle.kills = msg.k || [0, 0];
  var used = {};
  var news = msg.u.map(function (a, idx) {
    /* 前フレームの同一個体を探して walkPh とエフェクトを引き継ぐ */
    var match = -1, matchD = 46;
    guestPrev.forEach(function (p, pi) {
      if (used[pi] || p.type !== a[0] || p.side !== a[1]) return;
      var d = Math.abs(p.x - a[2]); if (d < matchD) { matchD = d; match = pi; }
    });
    var prev = match >= 0 ? guestPrev[match] : null;
    if (prev) {
      used[match] = 1;
      if (a[3] < prev.hp) battle.effects.push({ k: 'hit', x: a[2], side: a[1], t: 0.18, max: 0.18 });
    }
    return { type: a[0], side: a[1], x: a[2], hp: a[3], maxHp: a[4], kbT: a[5] ? 0.2 : 0, lungeT: a[6] ? 0.1 : 0,
             enemy: !!a[7], boss: !!a[8], walkPh: prev ? prev.walkPh : idx * 1.3, atkCd: 0, hitT: prev && a[3] < prev.hp ? 0.12 : 0, dmgKb: 0, kbLeft: 1, kbMax: 1 };
  });
  guestPrev.forEach(function (p, pi) {
    if (!used[pi]) battle.effects.push({ k: 'die', x: p.x, side: p.side, t: 0.35, max: 0.35, boss: p.boss });
  });
  guestPrev = news.map(function (u) { return { type: u.type, side: u.side, x: u.x, hp: u.hp, walkPh: u.walkPh, boss: u.boss }; });
  battle.units = news;
  stepEffects(battle, 0.1);
  if (msg.over && !battleDone) finishBattle(msg.over);
}
function handleNetData(msg) {
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'ping') return;
  if (NET.role === 'host') {
    if (msg.t === 'hello') {
      NET.guestLv = msg.lv || null;
      setLobbyStatus('フレンドが参加しました！対戦開始！');
      startVersusHost();
    } else if (msg.t === 'cmd' && battle && uiMode === 'vs-host' && !battleDone) {
      if (msg.a === 'spawn') trySpawn(battle, 1, msg.u);
      else if (msg.a === 'wallet') tryWallet(battle, 1);
    } else if (msg.t === 'rematch' && battleDone) {
      startVersusHost();
    }
  } else if (NET.role === 'guest') {
    if (msg.t === 'start') {
      battle = createBattle({ mode: 'vs' });
      uiMode = 'vs-guest'; paused = false; battleDone = false; NET.inGame = true; NET.recorded = false;
      guestPrev = [];
      $('myCastleName').textContent = '🏯 自城（あなた）';
      $('foeCastleName').textContent = '敵城（フレンド） 🏯';
      $('resultOv').classList.remove('show');
      showBattle(); startLoop();
      showMsg('⚔️ 対戦スタート！', 1500);
    } else if (msg.t === 'snap' && uiMode === 'vs-guest') {
      applySnapshot(msg);
    } else if (msg.t === 'end' && battle && !battleDone) {
      finishBattle(msg.winner);
    }
  }
}
function recordVs(won) {
  if (NET.recorded) return; NET.recorded = true;
  try { if (window.PWFriends && PWFriends.recordMatch) PWFriends.recordMatch(won ? 'win' : 'lose', {}); } catch (e) {}
}
function finishVersus(won) {
  if (NET.role === 'host') {
    if (NET.snapTimer) { clearInterval(NET.snapTimer); NET.snapTimer = 0; }
    sendSnapshot();
    netSend({ t: 'end', winner: battle.over });
  }
  NET.inGame = false;
  recordVs(won);
  var title = $('resultTitle');
  title.textContent = won ? '🎉 勝利！' : '💦 敗北…';
  title.className = won ? 'win' : 'lose';
  $('resultDetail').innerHTML = 'フレンド対戦<br>タイム ' + fmtTime(battle.t) + '／あなたの撃破数 ' + battle.kills[mySide()];
  $('resNext').style.display = 'none';
  $('resRetry').textContent = '🔁 再戦する';
  $('resMap').textContent = '🏠 タイトルへもどる';
  if (won) sfx('win'); else sfx('lose');
  setTimeout(function () { $('resultOv').classList.add('show'); }, 650);
}
function leaveVersus() {
  netCleanup(true);
  endBattleToTitle();
}

/* ═══════════════ 起動・配線 ═══════════════ */
function init() {
  cv = $('cv'); if (cv) ctx = cv.getContext('2d');
  buildUnitBar();
  updateFish();
  $('btnStage').onclick = function () { initAudio(); sfx('click'); renderStageList(); showScr('stageScr'); };
  $('backFromStage').onclick = function () { sfx('click'); showScr('titleScr'); };
  $('btnUp').onclick = function () { initAudio(); sfx('click'); renderUpList(); showScr('upScr'); };
  $('backFromUp').onclick = function () { sfx('click'); showScr('titleScr'); };
  $('mpBtn').onclick = function () { initAudio(); sfx('click'); showScr('lobbyScr'); };
  $('backFromLobby').onclick = function () { sfx('click'); netCleanup(true); setLobbyStatus(''); showScr('titleScr'); };
  $('hostBtn').onclick = function () { initAudio(); hostCreateRoom(); };
  $('joinBtn').onclick = function () { initAudio(); guestJoin($('joinCode').value); };
  $('walletBtn').onclick = function () { initAudio(); onWalletButton(); };
  $('pauseBtnB').onclick = function () {
    initAudio();
    if (uiMode === 'solo' && battle && !battleDone) { paused = true; $('pauseOv').classList.add('show'); }
    else if (uiMode !== 'idle') showMsg('対戦中はポーズできません', 1300);
  };
  $('resumeBtn').onclick = function () { paused = false; $('pauseOv').classList.remove('show'); };
  $('quitBtn').onclick = function () { $('pauseOv').classList.remove('show'); endBattleToTitle(); };
  $('resNext').onclick = function () {
    $('resultOv').classList.remove('show');
    if (uiMode === 'solo' && curStage && STAGE_BY_ID[curStage.id + 1]) startSolo(curStage.id + 1);
  };
  $('resRetry').onclick = function () {
    $('resultOv').classList.remove('show');
    if (uiMode === 'solo') startSolo(curStage.id);
    else if (uiMode === 'vs-host') startVersusHost();
    else if (uiMode === 'vs-guest') { netSend({ t: 'rematch' }); showMsg('再戦を申し込みました…', 1600); }
  };
  $('resMap').onclick = function () {
    $('resultOv').classList.remove('show');
    $('resRetry').textContent = '🔁 もう一度';
    $('resMap').textContent = '🗺️ マップへもどる';
    if (uiMode === 'solo') { stopLoop(); battle = null; uiMode = 'idle'; renderStageList(); showScr('stageScr'); }
    else leaveVersus();
  };
  window.addEventListener('resize', function () { if ($('battleScr').classList.contains('show')) fitCanvas(); });
}
/* テスト・検証用フック */
window.__mofu = {
  UNITS: UNITS, ENEMIES: ENEMIES, STAGES: STAGES, UNIT_BY_ID: UNIT_BY_ID,
  createBattle: createBattle, stepBattle: stepBattle, trySpawn: trySpawn, tryWallet: tryWallet,
  spawnEnemy: spawnEnemy, walletCap: walletCap, walletRate: walletRate, walletCost: walletCost,
  lvMult: lvMult, upCost: upCost, FIELD_W: FIELD_W, SAVE_KEY: SAVE_KEY,
  NET: NET, hostCreateRoom: hostCreateRoom, guestJoin: guestJoin, handleNetData: handleNetData,
  makeSnapshot: makeSnapshot, applySnapshot: applySnapshot, drainEvents: drainEvents,
  isDone: function () { return battleDone; },
  getBattle: function () { return battle; }, getSave: function () { return save; },
  getUiMode: function () { return uiMode; }
};
init();
})();
