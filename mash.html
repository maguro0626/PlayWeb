<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>れんだバトル | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0a16;--accent:#f97316;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#f2f4ff;--sub:#9aa0c3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
.ttl{font-size:24px;font-weight:900;text-align:center}.ttl span{color:var(--accent)}
#modeSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
#modeSeg button.on{background:var(--accent);color:#111}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.hidden{display:none!important}
.netBtns{display:flex;gap:8px;margin-bottom:10px}
.btn{background:var(--accent);color:#111;border:none;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;flex:1}
.btn.sub{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.joinRow{display:flex;gap:8px}.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-size:16px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit}
#onlineStatus{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px;line-height:1.6;text-align:center}#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.3em;color:var(--accent)}
.best{text-align:center;color:var(--sub);font-size:13px}
#mashBtn{width:100%;height:220px;border-radius:50%;max-width:280px;margin:10px auto;display:block;border:none;background:radial-gradient(circle at 35% 30%,#fdba74,var(--accent) 60%,#c2410c);color:#fff;font-size:28px;font-weight:900;cursor:pointer;box-shadow:0 10px 0 #7c2d12,0 18px 30px rgba(0,0,0,.4);font-family:inherit}
#mashBtn:active{transform:translateY(4px);box-shadow:0 6px 0 #7c2d12}
#mashBtn:disabled{opacity:.55;cursor:default;transform:none}
.countBig{font-size:52px;font-weight:900;text-align:center;line-height:1}
.timer{text-align:center;font-size:20px;font-weight:900;color:var(--accent)}
.gaugeRow{margin-top:10px}.gaugeLabel{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px}
.gauge{height:18px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.gaugeFill{height:100%;width:0%;transition:width .12s}
.gaugeFill.me{background:linear-gradient(90deg,#f97316,#fbbf24)}.gaugeFill.opp{background:linear-gradient(90deg,#38bdf8,#818cf8)}
.info{text-align:center;font-size:15px;line-height:1.7;min-height:26px}
.help{font-size:12px;color:var(--sub);line-height:1.8;text-align:center}
/* 1画面フィット（共通ヘッダー46pxを除く高さに収め、連打ボタンが伸縮） */
.wrap{height:calc(100dvh - 46px);overflow:hidden;padding:10px 14px 12px;gap:9px}
#gameArea{flex:1;min-height:0;display:flex;flex-direction:column}
#mashBtn{flex:1;min-height:120px;height:auto;max-height:220px;margin:6px auto}
#onlinePane{flex:0 1 auto;min-height:0;overflow-y:auto}
#soloPane .card{padding:10px}
#soloPane .help,.wrap>.help{line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
<div class="ttl">🔥 れんだ<span>バトル</span></div>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="soloPane"><div class="card"><p class="help">3秒カウントダウンのあと、10秒間ひたすら連打！ 何回押せるか挑戦しよう。</p><button id="soloStart" class="btn" style="width:100%;margin-top:8px">スタート</button></div></div>
<div id="onlinePane" class="hidden"><div class="card">
<div class="netBtns"><button id="hostBtn" class="btn">部屋を作る</button></div>
<div class="joinRow"><input id="joinCode" maxlength="6" placeholder="コード6文字"><button id="joinBtn" class="btn">参加する</button></div>
<div id="onlineCodeWrap" class="hidden">ルームコード<br><span id="roomCodeText">------</span></div>
<div id="onlineStatus"></div>
<button id="leaveBtn" class="btn sub hidden" style="width:100%;margin-top:8px">退出する</button>
</div></div>
<div id="gameArea">
<div class="timer" id="timerText">10.0秒</div>
<div class="countBig" id="countText">0</div>
<button id="mashBtn" disabled>れんだ！</button>
<div class="info" id="mashInfo">スタートを押してね</div>
<div class="gaugeRow"><div class="gaugeLabel"><span>あなた</span><span id="myCountLbl">0</span></div><div class="gauge"><div class="gaugeFill me" id="myGauge"></div></div></div>
<div class="gaugeRow hidden" id="oppRow"><div class="gaugeLabel"><span>相手</span><span id="oppCountLbl">0</span></div><div class="gauge"><div class="gaugeFill opp" id="oppGauge"></div></div></div>
<div class="best" id="bestText" style="margin-top:10px"></div>
<button id="rematchBtn" class="btn hidden" style="width:100%;margin-top:10px">もう一度</button>
</div>
<p class="help">オンラインは同時スタートで10秒勝負。多く連打した方が勝ちです。</p>
</div>
<script>
let AC=null;
function tone(f,d,type,v,delay){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+(d||0.12));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||0.12)+0.02);}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem('mini_mash_v1')||'{}');}catch(e){return{};}}
function storeSave(o){try{localStorage.setItem('mini_mash_v1',JSON.stringify(o));}catch(e){}}
function showBest(){const s=loadSave();document.getElementById('bestText').textContent='ベスト: '+(s.best? s.best+'回':'-');}
let mode='solo';
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;document.getElementById('soloPane').classList.toggle('hidden',mode!=='solo');document.getElementById('onlinePane').classList.toggle('hidden',mode!=='online');stopAll();resetOnlineGame();if(mode==='solo'){document.getElementById('oppRow').classList.add('hidden');setInfo('スタートを押してね');}}));
showBest();
const mashBtn=document.getElementById('mashBtn'),countText=document.getElementById('countText'),timerText=document.getElementById('timerText');
function setInfo(t){document.getElementById('mashInfo').textContent=t;}
function updateGauges(my,opp){const max=Math.max(100,my||0,opp||0);document.getElementById('myGauge').style.width=((my||0)/max*100)+'%';document.getElementById('myCountLbl').textContent=my||0;document.getElementById('oppGauge').style.width=((opp||0)/max*100)+'%';document.getElementById('oppCountLbl').textContent=opp||0;countText.textContent=my||0;}
let rafId=null,intId=null;
function stopAll(){if(rafId)cancelAnimationFrame(rafId);rafId=null;if(intId)clearInterval(intId);intId=null;mashBtn.disabled=true;}
const PEER_PREFIX='playweb-mb-';
const PEER_OPTS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}};
let peer=null,conn=null,isHost=false,roomCode='',heartbeatTimer=null,connTimer=null;
function genRoomCode(){const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=C.charAt(Math.floor(Math.random()*C.length));return s;}
function peerAvailable(){return typeof window.Peer!=='undefined';}
function sendNet(o){if(conn&&conn.open){try{conn.send(o);}catch(e){}}}
function setOnlineStatus(html){const el=document.getElementById('onlineStatus');if(el)el.innerHTML=html;}
function startHeartbeat(){stopHeartbeat();heartbeatTimer=setInterval(()=>sendNet({t:'ping'}),8000);}
function stopHeartbeat(){if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}}
function armConnTimer(msg){clearTimeout(connTimer);connTimer=setTimeout(()=>{if(!conn||!conn.open)setOnlineStatus('<span class="err">'+msg+'</span>');},25000);}
function disarmConnTimer(){clearTimeout(connTimer);}
function gateOk(){if(window.PWFriends&&PWFriends.gateState){const g=PWFriends.gateState();if(g==='guest'||g==='sdk-down'){setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>');return false;}}return true;}
function setupConn(c){conn=c;c.on('data',onNetData);c.on('open',()=>{disarmConnTimer();startHeartbeat();});c.on('close',()=>{if(conn===c)onNetDisconnected();});c.on('error',()=>{if(conn===c)onNetDisconnected();});}
function teardownOnline(){stopHeartbeat();clearTimeout(connTimer);try{if(conn)conn.close();}catch(e){}try{if(peer)peer.destroy();}catch(e){}conn=null;peer=null;}
function hostRoom(){if(!peerAvailable()){setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>');return;}if(!gateOk())return;teardownOnline();isHost=true;roomCode=genRoomCode();window.PW_ROOM_CODE=roomCode;resetOnlineGame();setOnlineStatus('部屋を作成中…');try{peer=new Peer(PEER_PREFIX+roomCode,PEER_OPTS);}catch(e){setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>');return;}peer.on('open',()=>{document.getElementById('roomCodeText').textContent=roomCode;document.getElementById('onlineCodeWrap').classList.remove('hidden');document.getElementById('leaveBtn').classList.remove('hidden');setOnlineStatus('フレンドの参加を待っています…');});peer.on('connection',c=>{setupConn(c);armConnTimer('相手との接続を確立できませんでした。');});peer.on('error',err=>{if(err&&err.type==='unavailable-id')setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>');});peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});}
function joinRoom(){if(!peerAvailable()){setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>');return;}if(!gateOk())return;const code=(document.getElementById('joinCode').value||'').trim().toUpperCase();if(code.length!==6){setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>');return;}teardownOnline();isHost=false;roomCode=code;resetOnlineGame();setOnlineStatus('接続中…');try{peer=new Peer(undefined,PEER_OPTS);}catch(e){setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>');return;}peer.on('open',()=>{armConnTimer('接続を確立できませんでした。');const c=peer.connect(PEER_PREFIX+code,{reliable:true});setupConn(c);c.on('open',()=>{document.getElementById('leaveBtn').classList.remove('hidden');sendNet({t:'hello'});setOnlineStatus('接続しました！対戦開始を待っています…');});});peer.on('error',err=>{if(err&&err.type==='peer-unavailable')setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>');});}
function leaveOnline(){teardownOnline();window.PW_ROOM_CODE='';document.getElementById('onlineCodeWrap').classList.add('hidden');document.getElementById('leaveBtn').classList.add('hidden');setOnlineStatus('');resetOnlineGame();}
document.getElementById('hostBtn').addEventListener('click',hostRoom);
document.getElementById('joinBtn').addEventListener('click',joinRoom);
document.getElementById('leaveBtn').addEventListener('click',leaveOnline);
// ---- shared play ----
let myCount=0,oppCount=0,playing=false,myFinal=null,oppFinal=null,recorded=false,playEndsAt=0;
function runCountdown(sec,cb){stopAll();let n=sec;setInfo(n);tone(440,0.1,'sine',0.12);timerText.textContent='10.0秒';intId=setInterval(()=>{n--;if(n<=0){clearInterval(intId);intId=null;cb();}else{setInfo(n);tone(440,0.1,'sine',0.12);}},1000);}
function startPlay(isOnline){myCount=0;oppCount=isOnline?oppCount:0;myFinal=null;oppFinal=null;playing=true;mashBtn.disabled=false;setInfo('れんだ！れんだ！');updateGauges(0,oppCount);tone(880,0.18,'sine',0.15);playEndsAt=performance.now()+10000;const tick=()=>{const left=Math.max(0,playEndsAt-performance.now());timerText.textContent=(left/1000).toFixed(1)+'秒';if(left<=0){endPlay(isOnline);return;}rafId=requestAnimationFrame(tick);};rafId=requestAnimationFrame(tick);if(isOnline){intId=setInterval(()=>{sendNet({t:'count',n:myCount});},100);}}
function endPlay(isOnline){playing=false;mashBtn.disabled=true;if(intId)clearInterval(intId);intId=null;timerText.textContent='0.0秒';tone(660,0.2,'sine',0.14);if(!isOnline){setInfo('終了！ '+myCount+'回');const s=loadSave();if(!s.best||myCount>s.best){s.best=myCount;storeSave(s);showBest();setInfo('終了！ '+myCount+'回 🎉ベスト更新！');}}else{myFinal=myCount;sendNet({t:'count',n:myCount});sendNet({t:'final',n:myCount});setInfo('終了！結果を待っています…');checkFinal();}}
mashBtn.addEventListener('pointerdown',e=>{e.preventDefault();if(!playing)return;myCount++;updateGauges(myCount,oppCount);tone(300+Math.random()*200,0.05,'square',0.06);});
document.getElementById('soloStart').addEventListener('click',()=>{if(mode!=='solo')return;myCount=0;oppCount=0;updateGauges(0,0);runCountdown(3,()=>startPlay(false));});
// ---- online ----
function resetOnlineGame(){stopAll();myCount=0;oppCount=0;myFinal=null;oppFinal=null;recorded=false;playing=false;document.getElementById('rematchBtn').classList.add('hidden');if(mode==='online'){document.getElementById('oppRow').classList.remove('hidden');updateGauges(0,0);timerText.textContent='10.0秒';setInfo('接続すると自動で始まります');}}
function hostStartOnline(){recorded=false;myFinal=null;oppFinal=null;oppCount=0;sendNet({t:'start',delay:2500});beginOnlineDelayed(2500);}
function beginOnlineDelayed(delay){stopAll();setInfo('まもなくスタート…');timerText.textContent='10.0秒';updateGauges(0,0);myCount=0;oppCount=0;setTimeout(()=>{if(mode==='online')startPlay(true);},delay);}
function checkFinal(){if(myFinal===null||oppFinal===null)return;let res=myFinal>oppFinal?'win':myFinal<oppFinal?'lose':'draw';const label=res==='win'?'🏆 あなたの勝ち！':res==='lose'?'相手の勝ち':'引き分け';setInfo(label+' あなた '+myFinal+'回 / 相手 '+oppFinal+'回');document.getElementById('rematchBtn').classList.remove('hidden');if(!recorded){recorded=true;if(window.PWFriends&&PWFriends.recordMatch)PWFriends.recordMatch(res);}const s=loadSave();if(!s.best||myFinal>s.best){s.best=myFinal;storeSave(s);showBest();}}
function onNetData(m){if(!m||m.t==='ping')return;if(m.t==='hello'){if(isHost)hostStartOnline();return;}if(m.t==='start'){if(!isHost)beginOnlineDelayed(m.delay||2500);return;}if(m.t==='count'){oppCount=m.n;if(playing||myFinal!==null)updateGauges(myCount,oppCount);return;}if(m.t==='final'){oppFinal=m.n;oppCount=m.n;updateGauges(myCount,oppCount);checkFinal();return;}if(m.t==='rematch'){if(isHost)hostStartOnline();return;}}
function onNetDisconnected(){setOnlineStatus('<span class="err">接続が切れました。</span>');stopAll();playing=false;setInfo('接続が切れました');}
document.getElementById('rematchBtn').addEventListener('click',()=>{if(isHost){hostStartOnline();}else{sendNet({t:'rematch'});setInfo('再戦をリクエストしました…');document.getElementById('rematchBtn').classList.add('hidden');}});
</script>
<script>window.PW_GAME='mash';window.PW_JOIN_CFG={openers:[{click:'button[data-m="online"]'}],input:'#joinCode',joinBtn:'#joinBtn',hostBtn:'#hostBtn'};</script>
<script src="friends.js"></script>
</body>
</html>
