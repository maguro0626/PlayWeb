<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>クレープ工房 - PlayWeb</title>
<style>
  :root{ --bg:#17100d; --panel:rgba(255,255,255,.055); --line:rgba(255,255,255,.1); --txt:#fdf6ec; --sub:#cbb9a3; --acc:#fb923c; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1000px 650px at 12% -10%, #4a2410 0%, transparent 55%), radial-gradient(900px 650px at 95% 110%, #3d1030 0%, transparent 55%), var(--bg);
    color:var(--txt); font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; min-height:100%; display:flex; flex-direction:column; align-items:center; user-select:none; -webkit-user-select:none;}
  header{width:100%;max-width:1060px;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
  .logo{font-weight:900;letter-spacing:.14em;font-size:20px;background:linear-gradient(90deg,#fdba74,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit}
  .hbtn:active{transform:scale(.96)}
  main{display:flex;gap:16px;justify-content:center;align-items:flex-start;padding:10px 12px 8px;width:100%;max-width:1060px;flex-wrap:wrap}
  #stageWrap{position:relative;border-radius:20px;padding:10px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.55)}
  #stage{display:block;border-radius:12px;background:#241611;touch-action:none;cursor:crosshair}
  #side{width:308px;display:flex;flex-direction:column;gap:12px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:13px 14px;backdrop-filter:blur(8px)}
  .box h3{font-size:11px;letter-spacing:.22em;color:var(--sub);margin-bottom:9px;font-weight:800}
  .steps{display:flex;gap:4px}
  .step{flex:1;text-align:center;font-size:10.5px;padding:7px 2px;border-radius:9px;background:rgba(0,0,0,.28);color:var(--sub);line-height:1.35}
  .step.on{background:linear-gradient(90deg,#ea580c,#db2777);color:#fff;font-weight:800;box-shadow:0 6px 16px rgba(234,88,12,.35)}
  .step.done{background:rgba(74,222,128,.18);color:#86efac}
  .items{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .item{border:1px solid var(--line);background:rgba(0,0,0,.25);border-radius:12px;padding:8px 4px 6px;cursor:pointer;text-align:center;color:var(--txt);font-family:inherit;transition:.15s}
  .item:hover{filter:brightness(1.3)}
  .item.on{border-color:var(--acc);background:rgba(251,146,60,.18);box-shadow:0 0 0 1.5px var(--acc)}
  .item .em{font-size:21px;display:block;line-height:1.2}
  .item .nm{font-size:10.5px;display:block;margin-top:2px}
  .item .pr{font-size:9.5px;color:var(--sub);display:block}
  .bigbtn{background:linear-gradient(90deg,#ea580c,#db2777);border:none;color:#fff;font-weight:800;font-size:15px;padding:13px 20px;border-radius:999px;cursor:pointer;box-shadow:0 10px 26px rgba(234,88,12,.35);letter-spacing:.05em;width:100%;font-family:inherit}
  .bigbtn:disabled{opacity:.38;box-shadow:none;cursor:not-allowed}
  .bigbtn:active:not(:disabled){transform:scale(.97)}
  .subbtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:9px 14px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .subbtn:active{transform:scale(.96)}
  .rowBtns{display:flex;gap:8px;flex-wrap:wrap}
  .gauge{height:16px;border-radius:999px;background:rgba(0,0,0,.4);overflow:hidden;position:relative}
  .gauge>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#facc15,#f97316,#ef4444);transition:width .1s linear}
  .gauge .zone{position:absolute;top:0;bottom:0;background:rgba(74,222,128,.35);border-left:1px dashed #4ade80;border-right:1px dashed #4ade80}
  .hint{font-size:12.5px;color:var(--sub);line-height:1.75}
  .hint b{color:#fdba74}
  .price{font-size:24px;font-weight:900;text-align:center;font-variant-numeric:tabular-nums}
  .price small{font-size:11px;color:var(--sub);font-weight:600}
  #toast{position:absolute;left:50%;top:16px;transform:translateX(-50%) translateY(-8px);background:rgba(20,10,5,.88);border:1px solid rgba(255,255,255,.2);color:#fff;padding:9px 18px;border-radius:999px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.3s;z-index:9;white-space:nowrap}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .overlay{position:absolute;inset:10px;border-radius:12px;background:rgba(16,8,4,.82);backdrop-filter:blur(5px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;text-align:center;padding:24px;z-index:8}
  .overlay.hidden{display:none}
  .overlay h2{font-size:29px;font-weight:900;letter-spacing:.06em}
  .overlay p{color:var(--sub);font-size:13.5px;line-height:1.85}
  .modeBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .modeBtn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:16px;padding:14px 18px;color:var(--txt);cursor:pointer;font-family:inherit;text-align:left;max-width:230px}
  .modeBtn b{font-size:15.5px;display:block;margin-bottom:4px}
  .modeBtn span{font-size:11.5px;color:var(--sub);line-height:1.6;display:block}
  .modeBtn:hover{border-color:var(--acc)}
  #nameInput{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:10px;color:#fff;padding:10px 14px;font-size:15px;width:min(320px,84%);text-align:center;font-family:inherit;outline:none}
  .stars{font-size:21px;letter-spacing:.15em;color:#fbbf24}
  .judgeLine{display:flex;justify-content:space-between;font-size:13px;padding:4px 2px;border-bottom:1px dashed rgba(255,255,255,.09)}
  .judgeLine b{font-variant-numeric:tabular-nums}
  #gallery{display:flex;gap:8px;flex-wrap:wrap}
  #gallery figure{width:76px;text-align:center}
  #gallery img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  #gallery figcaption{font-size:9.5px;color:var(--sub);margin-top:3px;line-height:1.3;word-break:break-all}
  @media (max-width:900px){ #side{width:min(640px,100%)} }
</style>
</head>
<body>
<header>
  <div class="logo">🥞 クレープ工房</div>
  <div style="display:flex;gap:8px">
    <button class="hbtn" id="soundBtn">🔊 サウンド</button>
    <a class="hbtn" href="index.html">← もどる</a>
  </div>
</header>

<main>
  <div id="stageWrap">
    <canvas id="stage" width="640" height="640"></canvas>
    <div id="toast"></div>

    <div class="overlay" id="startOv">
      <h2>🥞 クレープ工房</h2>
      <p>生地をのばして、焼いて、好きな具材を<b>自由に配置</b>。<br>ソースは指で描けるよ。世界にひとつのクレープを作ろう。</p>
      <div class="modeBtns">
        <button class="modeBtn" id="freeBtn"><b>🎨 フリーモード</b><span>思いのままに作る。具材もソースも無制限（気分で値段がつく）。</span></button>
        <button class="modeBtn" id="orderBtn"><b>🧾 注文チャレンジ</b><span>お客さんの注文どおりに作って、一致度で採点される職人モード。</span></button>
      </div>
    </div>

    <div class="overlay hidden" id="serveOv">
      <h2 id="serveTitle">完成！</h2>
      <div class="stars" id="serveStars"></div>
      <input id="nameInput" maxlength="24" placeholder="クレープの名前">
      <p id="serveComment" style="max-width:400px"></p>
      <div class="rowBtns" style="justify-content:center">
        <button class="subbtn" id="savePngBtn">🖼 画像で保存</button>
        <button class="subbtn" id="againBtn">↻ もう一枚作る</button>
      </div>
    </div>
  </div>

  <div id="side">
    <div class="box">
      <h3>STEP</h3>
      <div class="steps" id="steps"></div>
    </div>
    <div class="box" id="orderBox" style="display:none">
      <h3>🧾 注文</h3>
      <div class="hint" id="orderText"></div>
    </div>
    <div class="box" id="panelBox">
      <h3 id="panelTitle">生地をえらぶ</h3>
      <div id="panelBody"></div>
    </div>
    <div class="box">
      <h3>お会計（材料費）</h3>
      <div class="price"><small>¥</small><span id="price">180</span></div>
      <div class="hint" id="countInfo" style="text-align:center">生地 ¥180</div>
    </div>
    <div class="box" id="judgeBox" style="display:none">
      <h3>🏆 審査結果</h3>
      <div id="judgeBody"></div>
    </div>
    <div class="box" id="galleryBox" style="display:none">
      <h3>🖼 マイギャラリー</h3>
      <div id="gallery"></div>
    </div>
  </div>
</main>

<p class="hint" style="max-width:900px;text-align:center;padding:2px 18px 26px">
  遊び方: 生地を選ぶ → 鉄板でドラッグして円くのばす → 焼き加減を見て取り上げる → 具材をタップで配置＆ソースをドラッグで描く → 包み方を選ぶ → 仕上げデコ → 完成！
</p>

<script>
"use strict";
/* ================= データ ================= */
const W = 640, H = 640, CX = 320, CY = 320, CREPE_R = 238, PLATE_R = 292;
const BATTERS = [
  { id:'plain',  name:'プレーン',   em:'🥞', base:'#f2cf96', edge:'#dfa856', spot:'#c98f3d' },
  { id:'matcha', name:'抹茶',       em:'🍵', base:'#b3c078', edge:'#8fa353', spot:'#71823c' },
  { id:'cocoa',  name:'ココア',     em:'🍫', base:'#9a6742', edge:'#77492a', spot:'#5d3820' },
  { id:'berry',  name:'いちご',     em:'🍓', base:'#f4b7c3', edge:'#e58ca1', spot:'#cf6d86' },
  { id:'black',  name:'竹炭ブラック', em:'🖤', base:'#5a5560', edge:'#3d3a44', spot:'#2c2a33' },
];
const FILLINGS = [
  { id:'whip',     name:'ホイップ',     em:'🍦', price:60,  r:30 },
  { id:'custard',  name:'カスタード',   em:'🍮', price:70,  r:27 },
  { id:'chocobanana', name:'チョコバナナ', em:'🍌', price:90, r:30 },
  { id:'strawberry', name:'いちご',     em:'🍓', price:80,  r:24 },
  { id:'banana',   name:'バナナ',       em:'🍌', price:60,  r:23 },
  { id:'kiwi',     name:'キウイ',       em:'🥝', price:70,  r:22 },
  { id:'berry',    name:'ブルーベリー', em:'🫐', price:70,  r:20 },
  { id:'mikan',    name:'みかん',       em:'🍊', price:60,  r:22 },
  { id:'ice_vanilla', name:'アイス・バニラ', em:'🍨', price:120, r:32 },
  { id:'ice_choco',   name:'アイス・チョコ', em:'🍫', price:120, r:32 },
  { id:'ice_matcha',  name:'アイス・抹茶',   em:'🍵', price:120, r:32 },
  { id:'ice_berry',   name:'アイス・いちご', em:'🍓', price:120, r:32 },
  { id:'brownie',  name:'ブラウニー',   em:'🍫', price:90,  r:24 },
  { id:'cheesecake', name:'チーズケーキ', em:'🍰', price:110, r:26 },
  { id:'anko',     name:'あんこ',       em:'🫘', price:70,  r:26 },
  { id:'shiratama', name:'白玉',        em:'🍡', price:80,  r:22 },
  { id:'oreo',     name:'クッキー',     em:'🍪', price:70,  r:23 },
  { id:'nuts',     name:'ナッツ',       em:'🥜', price:60,  r:20 },
  { id:'marshmallow', name:'マシュマロ', em:'☁️', price:60, r:22 },
  { id:'pudding',  name:'プリン',       em:'🍮', price:100, r:27 },
];
const SAUCES = [
  { id:'choco',  name:'チョコソース',   color:'#4a2410', w:7 },
  { id:'caramel', name:'キャラメル',    color:'#c47b28', w:7 },
  { id:'berry',  name:'いちごソース',   color:'#e5486c', w:7 },
  { id:'matcha', name:'抹茶ソース',     color:'#6d8f3e', w:7 },
  { id:'milk',   name:'練乳',           color:'#fdf6e3', w:6 },
];
const DECOS = [
  { id:'whip', name:'ホイップ', em:'🍦', price:60, r:28 },
  { id:'strawberry', name:'いちご', em:'🍓', price:80, r:22 },
  { id:'ice_vanilla', name:'アイス', em:'🍨', price:120, r:30 },
  { id:'mint', name:'ミント', em:'🌿', price:30, r:18 },
  { id:'berry', name:'ブルーベリー', em:'🫐', price:70, r:18 },
  { id:'sugar', name:'粉砂糖', em:'❄️', price:20, r:26 },
  { id:'cocoa_powder', name:'ココアパウダー', em:'🍫', price:20, r:26 },
];
const FOLDS = [
  { id:'cone',   name:'コーン巻き', em:'🍦', desc:'定番！ 三角コーンにくるっと' },
  { id:'half',   name:'二つ折り',   em:'🌮', desc:'半分に折って手持ちスタイル' },
  { id:'square', name:'四角包み',   em:'🎁', desc:'四方を折るブリトー包み' },
  { id:'roll',   name:'くるくるロール', em:'🌀', desc:'端から巻いてロールケーキ風' },
];
const ORDERS = [
  { name:'いちご大好きな女の子', batter:'plain', fold:'cone', needs:{ strawberry:2, whip:1 }, sauce:'choco', text:'プレーン生地のコーン巻き。いちご×2とホイップ、チョコソースをかけて！' },
  { name:'抹茶マニアのおじさん', batter:'matcha', fold:'square', needs:{ anko:1, shiratama:1, ice_matcha:1 }, sauce:'matcha', text:'抹茶生地の四角包み。あんこ・白玉・抹茶アイス入り、抹茶ソースも忘れずに。' },
  { name:'甘党の男子高校生', batter:'cocoa', fold:'roll', needs:{ chocobanana:1, brownie:1, ice_choco:1 }, sauce:'caramel', text:'ココア生地でくるくるロール。チョコバナナ・ブラウニー・チョコアイス、キャラメルソースたっぷりで！' },
  { name:'さっぱり派のマダム', batter:'berry', fold:'half', needs:{ kiwi:1, berry:1, mikan:1, whip:1 }, sauce:'milk', text:'いちご生地の二つ折り。キウイ・ブルーベリー・みかん・ホイップに練乳をかけて。' },
];
const STEP_NAMES = ['生地','のばす','焼く','具材','包む','デコ','完成'];
const BASE_PRICE = 180;

/* ================= 状態 ================= */
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
let phase = 'start'; // start|batter|spread|bake|fill|fold|deco|serve
let mode = 'free', order = null;
let batter = BATTERS[0];
let spreadGrid = null, spreadCount = null, spreadDone = false, spreadScore = 0;
let bake = 0, bakeTimer = null, bakeScore = 0, baked = false;
let items = [];        // {kind:'fill'|'deco', id, x, y, rot, scale}
let strokes = [];      // {stage:'fill'|'deco', color, w, pts:[{x,y}]}
let fold = FOLDS[0];
let tool = null;       // {type:'fill'|'sauce'|'deco'|'eraser', id}
let pointer = { x:0, y:0, down:false };
let sizzleGain = null;

/* ================= サウンド ================= */
let audioCtx = null, soundOn = true;
function ac(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx; }
function tone(f, d=0.08, type='sine', v=0.05, delay=0){
  if(!soundOn) return;
  try{ const a=ac(), o=a.createOscillator(), g=a.createGain(), t=a.currentTime+delay;
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+d); }catch(e){}
}
function noiseBurst(dur=0.15, v=0.06){
  if(!soundOn) return;
  try{ const a=ac(), len=a.sampleRate*dur, buf=a.createBuffer(1,len,a.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=a.createBufferSource(); s.buffer=buf; const g=a.createGain(); g.gain.value=v;
    const f=a.createBiquadFilter(); f.type='highpass'; f.frequency.value=3000;
    s.connect(f).connect(g).connect(a.destination); s.start(); }catch(e){}
}
const sfx = {
  pop:()=>tone(540,0.07,'triangle',0.06),
  place:()=>{ tone(320,0.06,'sine',0.07); noiseBurst(0.05,0.03); },
  sauce:()=>noiseBurst(0.08,0.02),
  flip:()=>{ noiseBurst(0.25,0.09); tone(180,0.2,'sine',0.04); },
  good:()=>{ [523,659,784,1046].forEach((f,i)=>tone(f,0.12,'triangle',0.06,i*0.08)); },
  fanfare:()=>{ [392,523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,0.16,'triangle',0.06,i*0.09)); },
};
$('soundBtn').onclick = ()=>{ soundOn=!soundOn; $('soundBtn').textContent = soundOn?'🔊 サウンド':'🔇 ミュート'; };

/* ================= 描画ユーティリティ ================= */
function rng(seed){ let t = seed*9301+49297; return ()=>{ t = (t*9301+49297)%233280; return t/233280; }; }
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return `rgb(${r},${g},${b})`;
}
function circle(x,y,r,fill){ ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function drawPlate(){
  // テーブル
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#2b1a12'); bg.addColorStop(1,'#1c110b');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  // 鉄板
  const g = ctx.createRadialGradient(CX-60,CY-70,60, CX,CY,PLATE_R);
  g.addColorStop(0,'#4c4c55'); g.addColorStop(0.75,'#33333c'); g.addColorStop(1,'#232329');
  circle(CX,CY,PLATE_R, '#111');
  ctx.beginPath(); ctx.arc(CX,CY,PLATE_R,0,Math.PI*2); ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,.14)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CY,PLATE_R-14,0,Math.PI*2); ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=2; ctx.stroke();
}
function bakeColor(level){ // level 0..1 で焼き色を濃く
  const dark = Math.round(level*46);
  return { base: shade(batter.base, -dark), edge: shade(batter.edge, -dark-6), spot: batter.spot };
}
function drawCrepeBase(cx, cy, r, level, seedBase){
  const col = bakeColor(level);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle = col.edge; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r*0.965,0,Math.PI*2);
  const g = ctx.createRadialGradient(cx-r*0.3,cy-r*0.35,r*0.2, cx,cy,r);
  g.addColorStop(0, shade(batter.base, 14-Math.round(level*40))); g.addColorStop(1, col.base);
  ctx.fillStyle = g; ctx.fill();
  ctx.clip();
  // 焼きムラ（斑点）
  const rnd = rng(seedBase||7);
  const n = 26 + Math.floor(level*70);
  for(let i=0;i<n;i++){
    const a = rnd()*Math.PI*2, d = Math.sqrt(rnd())*r*0.94;
    const x = cx+Math.cos(a)*d, y = cy+Math.sin(a)*d, sr = 3+rnd()*13*(0.5+level);
    ctx.beginPath(); ctx.arc(x,y,sr,0,Math.PI*2);
    ctx.fillStyle = col.spot; ctx.globalAlpha = 0.05 + rnd()*0.13*level + 0.03;
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 焼き目（縁の焦げ）
  if(level > 0.55){
    ctx.beginPath(); ctx.arc(cx,cy,r*0.965,0,Math.PI*2);
    ctx.lineWidth = r*0.05; ctx.strokeStyle = `rgba(90,50,15,${(level-0.55)*0.9})`; ctx.stroke();
  }
  ctx.restore();
}
/* ---- 具材の描画（id別） ---- */
function drawItem(it){
  const def = FILLINGS.find(f=>f.id===it.id) || DECOS.find(f=>f.id===it.id);
  const r = (def?def.r:24) * (it.scale||1);
  const x = it.x, y = it.y, seed = it.seed||1;
  ctx.save(); ctx.translate(x,y); ctx.rotate(it.rot||0);
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.ellipse(2, r*0.55, r*0.85, r*0.3, 0, 0, Math.PI*2); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-r*0.1,-r*0.6); ctx.quadraticCurveTo(r*0.16,-r*0.95, r*0.3,-r*0.55); ctx.quadraticCurveTo(0,-r*0.42,-r*0.1,-r*0.6); ctx.fill();

      ctx.bezierCurveTo(r*0.8,-r*0.7,r*1.05,r*0.25,0,r*0.95); ctx.closePath();
      const g=ctx.createRadialGradient(-r*0.25,-r*0.3,r*0.2,0,0,r*1.05); g.addColorStop(0,'#ff7d92'); g.addColorStop(1,'#e0344f');
      ctx.fillStyle=g; ctx.fill();
      ctx.fillStyle='#ffe9a8'; const rnd=rng(seed);
      for(let i=0;i<9;i++){ const a=rnd()*Math.PI*2, d=rnd()*r*0.55; ctx.beginPath(); ctx.ellipse(Math.cos(a)*d, Math.sin(a)*d+r*0.1, r*0.07, r*0.12, a, 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle='#3f9e4d';
      for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.ellipse(i*r*0.3,-r*0.68, r*0.2, r*0.34, i*0.5, 0, Math.PI*2); ctx.fill(); }

    case 'banana': case 'chocobanana': {
      for(let i=-1;i<=1;i++){
        ctx.beginPath(); ctx.arc(i*r*0.52, (i%2? -r*0.12: r*0.08), r*0.42, 0, Math.PI*2);
        ctx.fillStyle = it.id==='chocobanana' ? '#5a3520' : '#f7e08b'; ctx.fill();
        ctx.beginPath(); ctx.arc(i*r*0.52, (i%2? -r*0.12: r*0.08), r*0.3, 0, Math.PI*2); ctx.fillStyle='#fdf3c0'; ctx.fill();
        ctx.beginPath(); ctx.arc(i*r*0.52, (i%2? -r*0.12: r*0.08), r*0.09, 0, Math.PI*2); ctx.fillStyle='#e8cf7e'; ctx.fill();
      }

    case 'kiwi': {
      circle(0,0,r*0.9,'#79b84a'); circle(0,0,r*0.78,'#a5d96e'); circle(0,0,r*0.34,'#f2f7d8');
      ctx.fillStyle='#39512a'; const rnd=rng(seed);
      for(let i=0;i<10;i++){ const a=i/10*Math.PI*2+rnd()*0.3; ctx.beginPath(); ctx.ellipse(Math.cos(a)*r*0.55, Math.sin(a)*r*0.55, r*0.05, r*0.1, a, 0, Math.PI*2); ctx.fill(); }
      break; }
    case 'berry': {
      const rnd=rng(seed);
      for(let i=0;i<6;i++){ const a=rnd()*Math.PI*2, d=rnd()*r*0.45;
        const bx=Math.cos(a)*d, by=Math.sin(a)*d;
        const g=ctx.createRadialGradient(bx-r*0.1,by-r*0.12,r*0.05,bx,by,r*0.34); g.addColorStop(0,'#8ea7e8'); g.addColorStop(1,'#3b4f9e');

    case 'ice_vanilla': case 'ice_choco': case 'ice_matcha': case 'ice_berry': {
      const cols = { ice_vanilla:['#fff6e6','#f0dcbb'], ice_choco:['#8a5a35','#5f3a1f'], ice_matcha:['#b9cc8a','#87a355'], ice_berry:['#ffc2d1','#f28bab'] };
      const [c1,c2] = cols[it.id];

      ctx.fillStyle='rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(-r*0.3,-r*0.38,r*0.28,r*0.14,-0.6,0,Math.PI*2); ctx.fill();

    case 'cheesecake': {
      ctx.beginPath(); ctx.moveTo(-r*0.9,r*0.6); ctx.lineTo(r*0.9,r*0.6); ctx.lineTo(0,-r*0.85); ctx.closePath();

      break; }
    case 'anko': {
      const rnd=rng(seed);
      for(let i=0;i<8;i++){ const a=rnd()*Math.PI*2, d=rnd()*r*0.5;
        const g=ctx.createRadialGradient(0,0,2,Math.cos(a)*d,Math.sin(a)*d,r*0.42); g.addColorStop(0,'#7d4453'); g.addColorStop(1,'#54262f');
        ctx.beginPath(); ctx.arc(Math.cos(a)*d,Math.sin(a)*d,r*0.4,0,Math.PI*2); ctx.fillStyle=g; ctx.fill(); }
      break; }
    case 'shiratama': {
      [[-r*0.45,r*0.15],[r*0.4,r*0.3],[0,-r*0.4]].forEach(([dx,dy])=>{
        const g=ctx.createRadialGradient(dx-r*0.12,dy-r*0.14,r*0.06,dx,dy,r*0.42); g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#e8e2d4');
        ctx.beginPath(); ctx.arc(dx,dy,r*0.4,0,Math.PI*2); ctx.fillStyle=g; ctx.fill(); });
      break; }
    case 'oreo': {
      circle(0,0,r*0.85,'#3a2c22'); circle(0,0,r*0.6,'#57453a'); circle(0,0,r*0.34,'#f5efe2');
      ctx.fillStyle='rgba(0,0,0,.25)';
      for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; ctx.beginPath(); ctx.arc(Math.cos(a)*r*0.72,Math.sin(a)*r*0.72,r*0.07,0,Math.PI*2); ctx.fill(); }
      break; }
    case 'nuts': {
      const rnd=rng(seed);
      for(let i=0;i<9;i++){ const a=rnd()*Math.PI*2, d=rnd()*r*0.62;
        ctx.save(); ctx.translate(Math.cos(a)*d, Math.sin(a)*d); ctx.rotate(rnd()*3);
        ctx.beginPath(); ctx.ellipse(0,0,r*0.2,r*0.13,0,0,Math.PI*2); ctx.fillStyle= i%2? '#c89b62':'#a97a44'; ctx.fill(); ctx.restore(); }
      break; }
    case 'marshmallow': {
      [[-r*0.35,0],[r*0.35,r*0.12],[0,-r*0.35]].forEach(([dx,dy])=>{
        ctx.beginPath(); ctx.roundRect(dx-r*0.3,dy-r*0.26,r*0.6,r*0.52,r*0.24);
        const g=ctx.createLinearGradient(dx,dy-r*0.26,dx,dy+r*0.26); g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#f3d9e2');
        ctx.fillStyle=g; ctx.fill(); });
      break; }
    case 'pudding': {
      ctx.beginPath(); ctx.moveTo(-r*0.55,-r*0.55); ctx.lineTo(r*0.55,-r*0.55); ctx.lineTo(r*0.78,r*0.55); ctx.lineTo(-r*0.78,r*0.55); ctx.closePath();
      const g=ctx.createLinearGradient(0,-r*0.55,0,r*0.55); g.addColorStop(0,'#ffd873'); g.addColorStop(1,'#f2a93b');
      ctx.fillStyle=g; ctx.fill();
      ctx.beginPath(); ctx.ellipse(0,-r*0.55,r*0.55,r*0.16,0,0,Math.PI*2); ctx.fillStyle='#8a4d16'; ctx.fill();
      break; }
    case 'mint': {
      ctx.fillStyle='#3da35d';
      for(let i=-1;i<=1;i++){ ctx.save(); ctx.rotate(i*0.55); ctx.beginPath(); ctx.ellipse(0,-r*0.3,r*0.26,r*0.55,0,0,Math.PI*2); ctx.fill(); ctx.restore(); }
      ctx.strokeStyle='rgba(255,255,255,.4)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(0,r*0.5); ctx.lineTo(0,-r*0.75); ctx.stroke();
      break; }
    case 'sugar': case 'cocoa_powder': {
      const rnd=rng(seed); ctx.fillStyle = it.id==='sugar' ? 'rgba(255,255,255,.85)' : 'rgba(74,36,16,.5)';
      for(let i=0;i<46;i++){ const a=rnd()*Math.PI*2, d=Math.sqrt(rnd())*r;
        ctx.beginPath(); ctx.arc(Math.cos(a)*d, Math.sin(a)*d, 1+rnd()*1.8, 0, Math.PI*2); ctx.fill(); }
      break; }
    default: { circle(0,0,r*0.8,'#ffb347'); }
  }
  ctx.restore();
}
function drawStrokes(stageName, clipFn){
  ctx.save();
  if(clipFn) clipFn();
  for(const s of strokes){
    if(s.stage!==stageName || s.pts.length<2) continue;
    ctx.beginPath(); ctx.moveTo(s.pts[0].x, s.pts[0].y);
    for(let i=1;i<s.pts.length;i++) ctx.lineTo(s.pts[i].x, s.pts[i].y);
    ctx.strokeStyle=s.color; ctx.lineWidth=s.w; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.globalAlpha=0.88; ctx.stroke(); ctx.globalAlpha=1;
  }
  ctx.restore();
}

}
const PHASE_IDX = { batter:0, spread:1, bake:2, fill:3, fold:4, deco:5, serve:6 };

  const cur = PHASE_IDX[phase] ?? -1;
  $('steps').innerHTML = STEP_NAMES.map((s,i)=>
    `<div class="step ${i===cur?'on':''} ${i<cur?'done':''}">${i+1}<br>${s}</div>`).join('');
}
function price(){
  let p = BASE_PRICE;
  for(const it of items){ const d = FILLINGS.find(f=>f.id===it.id) || DECOS.find(f=>f.id===it.id); if(d) p += d.price; }
  return p;
}

  $('price').textContent = price().toLocaleString();

  bindPanel();
}
let history = []; // {type:'item'|'stroke', obj}
function doAction(act){
  const [cmd, arg] = act.split(':');
  if(cmd==='batter'){ batter = BATTERS.find(b=>b.id===arg); sfx.pop(); buildPanel(); }
  else if(cmd==='pour'){ sfx.flip(); setPhase('spread'); toast('ドラッグで円くのばそう！'); }
  else if(cmd==='toBake'){ if(spreadDone){ setPhase('bake'); toast('焼き色をよく見て！'); } }
  else if(cmd==='finishBake'){ finishBake(); }
  else if(cmd==='toFold'){ setPhase('fold'); }
  else if(cmd==='fold'){ fold = FOLDS.find(f=>f.id===arg); sfx.pop(); buildPanel(); }
  else if(cmd==='doFold'){ startFold(); }
  else if(cmd==='serve'){ serve(); }
  else if(cmd==='again'){ resetAll(); }
  else if(cmd==='undo'){
    const h = history.pop();
    if(h){ if(h.type==='item') items = items.filter(i=>i!==h.obj); else strokes = strokes.filter(s=>s!==h.obj); updatePrice(); }
  }
  else if(cmd==='clearFill'){
    items = items.filter(i=>i.kind!=='fill'); strokes = strokes.filter(s=>s.stage!=='fill'); history = []; updatePrice();
  }
}

/* ================= のばす ================= */
const CELL = 16, GN = Math.ceil(W/CELL);
let spreadCanvas = document.createElement('canvas'); spreadCanvas.width = W; spreadCanvas.height = H;
let pourStart = 0;
function initSpread(){
  spreadGrid = new Uint16Array(GN*GN); spreadCount = 0; spreadDone = false; spreadScore = 0;
  const c = spreadCanvas.getContext('2d'); c.clearRect(0,0,W,H);
  pourStart = performance.now();
}
function targetCells(){
  let n = 0; for(let gy=0; gy<GN; gy++) for(let gx=0; gx<GN; gx++){
    const x = gx*CELL+CELL/2, y = gy*CELL+CELL/2;
    if(Math.hypot(x-CX, y-CY) <= CREPE_R) n++;
  } return n;
}
const TARGET_TOTAL = targetCells();
function paintSpread(x, y){
  if(performance.now() - pourStart < 750) return;
  const c = spreadCanvas.getContext('2d');
  const g = c.createRadialGradient(x,y,4, x,y,54);
  g.addColorStop(0, batter.base); g.addColorStop(0.8, batter.base); g.addColorStop(1, shade(batter.base,-14));
  c.fillStyle = g; c.beginPath(); c.arc(x,y,54,0,Math.PI*2); c.fill();
  for(let gy=0; gy<GN; gy++) for(let gx=0; gx<GN; gx++){
    const cxp = gx*CELL+CELL/2, cyp = gy*CELL+CELL/2;
    if(Math.hypot(cxp-x, cyp-y) <= 54 && Math.hypot(cxp-CX, cyp-CY) <= CREPE_R+8){
      const idx = gy*GN+gx;
      if(spreadGrid[idx]===0) spreadCount++;
      if(spreadGrid[idx]<9) spreadGrid[idx]++;
    }
  }
  const pct = Math.floor(spreadCount / TARGET_TOTAL * 100);
  const bar = $('spreadBar'), lbl = $('spreadPct'), btn = $('toBake');
  if(bar) bar.style.width = Math.min(100,pct)+'%';
  if(lbl) lbl.textContent = pct + '%';
  if(pct >= 92 && !spreadDone){
    spreadDone = true;
    // 均一さスコア: 塗られたセルの塗布回数のばらつき
    let sum=0, cnt=0; for(let i=0;i<spreadGrid.length;i++) if(spreadGrid[i]>0){ sum+=spreadGrid[i]; cnt++; }
    const mean = sum/Math.max(1,cnt);
    let varSum=0; for(let i=0;i<spreadGrid.length;i++) if(spreadGrid[i]>0) varSum += Math.pow(spreadGrid[i]-mean,2);
    const sd = Math.sqrt(varSum/Math.max(1,cnt));
    spreadScore = Math.round(Math.max(35, 100 - sd*16));
    if(btn) btn.disabled = false;
    sfx.good(); toast('きれいに広がった！ 焼こう 🔥');
  }
}

let bakeLevel = 0;
function finishBake(){
  if(phase!=='bake' || baked) return;
  baked = true; bakeLevel = bake;
  const ideal = 0.675;
  bakeScore = Math.round(Math.max(0, 100 - Math.abs(bake - ideal) * 250));
  if(bake < 0.4){ toast('ちょっと生焼け… でもこれはこれで', 2200); }
  else if(bake > 0.93){ toast('焦げちゃった！ 香ばしい（？）', 2200); sfx.flip(); }
  else if(bakeScore >= 85){ toast('完璧な焼き加減！ ✨', 2200); sfx.good(); }
  else { toast('いい焼き色！', 1800); sfx.pop(); }
  setTimeout(()=>setPhase('fill'), 650);
}

function judge(){
  const fills = items.filter(i=>i.kind==='fill');
  const decos = items.filter(i=>i.kind==='deco');
  const uniq = new Set(fills.map(i=>i.id)).size;
  const fillStrokes = strokes.filter(s=>s.stage==='fill').length;
  const decoStrokes = strokes.filter(s=>s.stage==='deco').length;
  let balance = 0;
  balance += Math.min(40, uniq*9);
  balance += (fills.length>=5 && fills.length<=16) ? 34 : (fills.length>0 ? Math.max(6, 34 - Math.abs(fills.length-10)*3) : 0);
  balance += Math.min(26, (fillStrokes>0?14:0) + Math.min(12, fills.length*1.2));
  balance = Math.round(Math.min(100, balance));
  let decoScore = Math.round(Math.min(100, decos.length*16 + decoStrokes*13 + (decos.length&&decoStrokes?10:0)));
  const lines = [
    { k:'生地の広げ方', v: spreadScore },
    { k:'焼き加減', v: bakeScore },
    { k:'具材バランス', v: balance },
    { k:'デコレーション', v: decoScore },
  ];
  let total, comment = '', matchInfo = null;
  if(mode==='order' && order){
    let m = 0;
    if(batter.id===order.batter) m += 25;
    if(fold.id===order.fold) m += 25;
    let needTotal = 0, needGot = 0;
    for(const [id, n] of Object.entries(order.needs)){ needTotal += n; needGot += Math.min(n, fills.filter(i=>i.id===id).length); }
    m += needTotal ? Math.round(35 * needGot/needTotal) : 35;
    if(strokes.some(s=>s.stage==='fill' && SAUCES.find(x=>x.id===s.sauceId)?.id===order.sauce) || strokes.some(s=>s.stage==='fill' && s.sauceId===order.sauce)) m += 15;
    matchInfo = Math.min(100, m);
    lines.push({ k:'🧾 注文一致度', v: matchInfo });
    total = Math.round(lines.reduce((a,l)=>a+l.v,0) / lines.length);
    comment = matchInfo>=90 ? '注文どおり完璧！ お客さん大喜びです。' : matchInfo>=65 ? 'だいたい注文どおり。あと一歩で完璧でした。' : '注文と少し違ったみたい… お客さんは首をかしげています。';
  } else {
    total = Math.round(lines.reduce((a,l)=>a+l.v,0) / lines.length);
    if(bakeLevel > 0.93) comment = '香ばしさ全開のワイルドな一枚。焦げも味のうち！';
    else if(bakeLevel < 0.4) comment = 'もちもち生焼け食感。これはこれで新しい。';
    else if(uniq >= 7) comment = '具材の宝石箱！ どこから食べても楽しい一枚。';
    else if(fills.length === 0) comment = '潔い、素クレープ。生地の味で勝負する通な一枚。';
    else if(total >= 85) comment = 'お店に出せるレベル！ 見た目も味も文句なし。';
    else comment = '素朴でおいしそうな一枚。次はもっと盛ってみよう。';
  }
  const stars = total>=90?5 : total>=75?4 : total>=58?3 : total>=40?2 : 1;
  const title = total>=90 ? '🏆 伝説のクレープ！' : total>=75 ? '🎉 大成功！' : total>=58 ? '😋 おいしく完成！' : '完成！';
  const top = [...new Set(fills.map(i=>i.id))].slice(0,2).map(id=>FILLINGS.find(f=>f.id===id).name);
  const sauceUsed = strokes.find(s=>s.stage==='fill');
  const autoName = (top.length? top.join('と') : '素') + (sauceUsed? 'の'+(SAUCES.find(s=>s.id===sauceUsed.sauceId)?.name.replace('ソース','')||'')+'ソース' : '') + 'クレープ';
  return { lines, total, stars, title, comment, autoName };
}

/* ================= 包んだクレープの描画 ================= */
function drawFolded(cx, cy, pop){
  const col = bakeColor(bakeLevel);
  const s = pop || 1;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  const fills = items.filter(i=>i.kind==='fill');
  if(fold.id==='cone'){
    // コーン本体
    const g = ctx.createLinearGradient(cx-110,0,cx+110,0);
    g.addColorStop(0, shade(batter.edge,-18)); g.addColorStop(0.5, batter.base); g.addColorStop(1, shade(batter.edge,-26));
    ctx.beginPath();
    ctx.moveTo(cx-108, cy-118); ctx.quadraticCurveTo(cx-40, cy+60, cx, cy+178);
    ctx.quadraticCurveTo(cx+40, cy+60, cx+108, cy-118); ctx.closePath();
    ctx.fillStyle = bakeLevel>0.6 ? shade(batter.base,-20) : g; ctx.fill();
    ctx.save(); ctx.clip();
    ctx.strokeStyle='rgba(120,70,20,.25)'; ctx.lineWidth=7;
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(cx+i*44-70, cy-130); ctx.lineTo(cx+i*44+46, cy+180); ctx.stroke(); }
    ctx.restore();
    // 口の部分
    ctx.beginPath(); ctx.ellipse(cx, cy-118, 108, 30, 0, 0, Math.PI*2);
    ctx.fillStyle = shade(batter.edge,-8); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx, cy-118, 92, 23, 0, 0, Math.PI*2);
    ctx.fillStyle = '#fff8ec'; ctx.fill();
    // 具材のはみ出し
    const peek = fills.slice(-4);
    peek.forEach((it,i)=>{ drawItem({ ...it, x: cx + (i-(peek.length-1)/2)*44, y: cy-128 + (i%2)*8, scale:(it.scale||1)*0.82 }); });
    if(!peek.length){ ctx.fillStyle='#f7e3bb'; ctx.beginPath(); ctx.ellipse(cx, cy-120, 70, 15, 0, 0, Math.PI*2); ctx.fill(); }
    // 紙巻き
    ctx.beginPath();
    ctx.moveTo(cx-56, cy+58); ctx.lineTo(cx+56, cy+58); ctx.lineTo(cx, cy+178); ctx.closePath();
    ctx.fillStyle = '#fdfdf8'; ctx.fill();
    ctx.fillStyle = '#e5484d';
    ctx.fillRect(cx-56, cy+58, 112, 10);
    ctx.save(); ctx.beginPath(); ctx.moveTo(cx-56,cy+58); ctx.lineTo(cx+56,cy+58); ctx.lineTo(cx,cy+178); ctx.closePath(); ctx.clip();
    ctx.fillStyle='rgba(229,72,77,.55)';
    for(let i=0;i<4;i++) ctx.fillRect(cx-56+i*30, cy+58, 13, 130);
    ctx.restore();
  }
  else if(fold.id==='half'){
    const g = ctx.createRadialGradient(cx-50,cy-40,40, cx,cy,210);
    g.addColorStop(0, shade(batter.base,10)); g.addColorStop(1, shade(batter.base,-24));
    ctx.beginPath(); ctx.arc(cx, cy-30, 196, 0.08*Math.PI, 0.92*Math.PI); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle='rgba(120,70,20,.3)'; ctx.lineWidth=3; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy-30, 168, 0.15*Math.PI, 0.85*Math.PI);
    ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=10; ctx.stroke();
    const peek = fills.slice(-3);
    peek.forEach((it,i)=>{ drawItem({ ...it, x: cx + (i-1)*62, y: cy-44, scale:(it.scale||1)*0.8 }); });
    // 焼き斑点
    const rnd = rng(31); ctx.fillStyle = batter.spot;
    for(let i=0;i<16;i++){ const a = 0.2+ rnd()*0.6, d = 60+rnd()*110;
      ctx.globalAlpha = 0.1+rnd()*0.12; ctx.beginPath();
      ctx.arc(cx+Math.cos(a*Math.PI)*d, cy-30+Math.sin(a*Math.PI)*d*0.8, 4+rnd()*10, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  else if(fold.id==='square'){
    const g = ctx.createLinearGradient(cx-150,cy-120,cx+150,cy+120);
    g.addColorStop(0, shade(batter.base,8)); g.addColorStop(1, shade(batter.base,-22));
    ctx.beginPath(); ctx.roundRect(cx-158, cy-118, 316, 236, 26);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle='rgba(120,70,20,.35)'; ctx.lineWidth=3; ctx.stroke();
    ctx.strokeStyle='rgba(120,70,20,.28)'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.moveTo(cx-158,cy-118); ctx.lineTo(cx,cy); ctx.lineTo(cx-158,cy+118); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+158,cy-118); ctx.lineTo(cx,cy); ctx.lineTo(cx+158,cy+118); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-158,cy); ctx.lineTo(cx+158,cy); ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=12; ctx.stroke();
    const rnd = rng(47); ctx.fillStyle = batter.spot;
    for(let i=0;i<14;i++){ ctx.globalAlpha=0.08+rnd()*0.12; ctx.beginPath();
      ctx.arc(cx-140+rnd()*280, cy-100+rnd()*200, 4+rnd()*11, 0, Math.PI*2); ctx.fill(); }
    ctx.globalAlpha = 1;
  }
  else { // roll
    const g = ctx.createLinearGradient(0,cy-70,0,cy+70);
    g.addColorStop(0, shade(batter.base,14)); g.addColorStop(0.55, batter.base); g.addColorStop(1, shade(batter.base,-26));
    ctx.beginPath(); ctx.roundRect(cx-196, cy-66, 330, 132, 60);
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle='rgba(120,70,20,.2)'; ctx.lineWidth=3;
    for(let i=0;i<3;i++){ ctx.beginPath(); ctx.moveTo(cx-150+i*90, cy-62); ctx.lineTo(cx-150+i*90, cy+62); ctx.stroke(); }
    // 断面（渦巻き）

    ctx.lineWidth=3; ctx.strokeStyle='rgba(120,70,20,.4)'; ctx.stroke();
    const peek = fills.slice(-2);
    ctx.save(); ctx.beginPath(); ctx.arc(cx+134, cy, 52, 0, Math.PI*2); ctx.clip();
    ctx.fillStyle='#fff6e2'; ctx.fillRect(cx+82, cy-52, 104, 104);
    peek.forEach((it,i)=>{ drawItem({ ...it, x: cx+134+(i? 16:-16), y: cy+(i? 12:-10), scale:0.62 }); });
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx+134, cy, 40, 0, Math.PI*2);
    ctx.strokeStyle = shade(batter.edge,-16); ctx.lineWidth=9; ctx.stroke();
  }
  ctx.restore();
}
function drawServing(){
  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,'#3a2317'); bg.addColorStop(1,'#241509');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
  // テーブルクロスの模様
  ctx.fillStyle='rgba(255,255,255,.03)';
  for(let x=0;x<W;x+=44) for(let y=0;y<H;y+=44) if(((x+y)/44)%2===0) ctx.fillRect(x,y,44,44);
  // お皿
  ctx.beginPath(); ctx.ellipse(CX, CY+128, 252, 56, 0, 0, Math.PI*2); ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(CX, CY+112, 252, 58, 0, 0, Math.PI*2);
  const pg = ctx.createRadialGradient(CX,CY+90,40, CX,CY+112,252);
  pg.addColorStop(0,'#ffffff'); pg.addColorStop(0.8,'#f1ead9'); pg.addColorStop(1,'#d9cfb6');
  ctx.fillStyle = pg; ctx.fill();
  ctx.beginPath(); ctx.ellipse(CX, CY+112, 205, 42, 0, 0, Math.PI*2); ctx.fillStyle='rgba(0,0,0,.05)'; ctx.fill();
  const pop = phase==='fold' ? foldPop() : 1;
  drawFolded(CX, CY-6, pop);
  drawStrokes('deco', null);
  const ds = items.filter(i=>i.kind==='deco').slice().sort((a,b)=>a.y-b.y);
  ds.forEach(drawItem);
}
function foldPop(){
  if(!foldAnim) return 1;
  const p = Math.min(1, (performance.now()-foldStart)/950);
  return 0.86 + 0.14 * (p<0.5 ? p*2 : 1);
}

/* ================= メイン描画 ================= */
let steam = [];
function render(now){
  if(phase==='batter' || phase==='start'){
    drawPlate();
    // おたまの生地ボール

  }
  if(phase==='spread'){

    if(el < 750){

  if(phase==='bake'){

      const bx = CX+Math.cos(a)*d, by = CY+Math.sin(a)*d;
      ctx.beginPath(); ctx.arc(bx,by, 2+rnd()*4.5, 0, Math.PI*2);

    for(const p of steam){ p.y += p.vy; p.life -= 0.012;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);

    const fs = items.filter(i=>i.kind==='fill').slice().sort((a,b)=>a.y-b.y);
    fs.forEach(drawItem);

      fs.forEach(drawItem);

      ctx.strokeStyle='rgba(255,120,120,.9)'; ctx.lineWidth=2; ctx.stroke();
    }
  }
}

/* ================= ループ ================= */
let lastT = performance.now(), sizzleAcc = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(50, now-lastT); lastT = now;
  if(phase==='bake' && !baked){
    bake = Math.min(1, bake + dt/7000);
    const bar = $('bakeBar'), lbl = $('bakeLabel');
    if(bar) bar.style.width = (bake*100)+'%';
    if(lbl) lbl.textContent = bake<0.4 ? 'まだ生焼け…' : bake<0.55 ? 'だんだん色づいてきた' : bake<=0.8 ? '✨ 今が取りどき！' : bake<0.95 ? 'ちょっと焼きすぎ…' : '🔥 焦げてる！';
    sizzleAcc += dt;
    if(sizzleAcc > 480){ sizzleAcc = 0; noiseBurst(0.07, 0.02); }
    if(bake>=1) finishBake();
  }
  render(now);
}

/* ================= 入力 ================= */
function getPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
let painting = false, curStroke = null;
cv.addEventListener('pointerdown', e=>{
  e.preventDefault();
  const p = getPos(e); pointer.x = p.x; pointer.y = p.y; pointer.down = true; pointer.inside = true;
  try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  if(phase==='spread'){ painting = true; paintSpread(p.x, p.y); return; }
  if(phase!=='fill' && phase!=='deco') return;
  if(!tool) { toast('右のパネルから具材やソースを選んでね'); return; }
  if(tool.type==='sauce'){
    const s = SAUCES.find(x=>x.id===tool.id);
    curStroke = { stage: phase, sauceId: s.id, color: s.color, w: s.w, pts:[{x:p.x, y:p.y}] };
    strokes.push(curStroke); history.push({ type:'stroke', obj: curStroke });
    sfx.sauce();
  }
  else if(tool.type==='eraser'){
    const kind = phase;
    let bestIt = null, bestD = 1e9;
    for(const it of items){ if(it.kind!==kind) continue;
      const d = FILLINGS.find(f=>f.id===it.id) || DECOS.find(f=>f.id===it.id);
      const dist = Math.hypot(it.x-p.x, it.y-p.y);
      if(dist < (d?d.r:24)+14 && dist < bestD){ bestD = dist; bestIt = it; } }
    if(bestIt){ items = items.filter(i=>i!==bestIt); sfx.pop(); updatePrice(); return; }
    const si = strokes.findIndex(s=> s.stage===kind && s.pts.some(pt=>Math.hypot(pt.x-p.x, pt.y-p.y) < 26));
    if(si>=0){ strokes.splice(si,1); sfx.pop(); }
  }
  else {
    let { x, y } = p;
    if(phase==='fill'){
      const d = Math.hypot(x-CX, y-CY);
      const maxD = CREPE_R - 12;
      if(d > maxD){ x = CX + (x-CX)/d*maxD; y = CY + (y-CY)/d*maxD; }
    }
    const it = { kind: phase, id: tool.id, x, y, rot:(Math.random()-0.5)*0.5, scale: 0.92+Math.random()*0.16, seed: Math.floor(Math.random()*9999) };
    items.push(it); history.push({ type:'item', obj: it });
    sfx.place(); updatePrice();
  }
});
cv.addEventListener('pointermove', e=>{
  const p = getPos(e); pointer.x = p.x; pointer.y = p.y; pointer.inside = true;
  if(painting && phase==='spread') paintSpread(p.x, p.y);
  if(curStroke){
    const last = curStroke.pts[curStroke.pts.length-1];
    if(Math.hypot(p.x-last.x, p.y-last.y) > 5) curStroke.pts.push({x:p.x, y:p.y});
  }
});
function endPointer(){ painting = false; curStroke = null; pointer.down = false; }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', ()=>{ pointer.inside = false; endPointer(); });

/* ================= 初期化 ================= */
phase = 'batter';
renderSteps(); buildPanel(); updatePrice(); renderGallery();
requestAnimationFrame(loop);
</script>
