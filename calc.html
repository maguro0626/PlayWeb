<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>けいさんダッシュ | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0a16;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#eef0ff;--sub:#9aa0c3;--acc:#facc15}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 32px;display:flex;flex-direction:column;gap:12px}
.ttl{font-size:24px;font-weight:900;text-align:center;padding:8px 0 2px}
.sub{text-align:center;color:var(--sub);font-size:13px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.hidden{display:none!important}
#modeSeg{display:flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px;gap:2px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
#modeSeg button.on{background:var(--acc);color:#2a2100}
.btn{background:var(--acc);color:#2a2100;border:none;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;width:100%}
.btn:active{transform:scale(.97)}
.btn.subBtn{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line)}
.netBtns{display:flex;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.row input{flex:1;min-width:0}
input[type=text]{background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:18px;padding:11px;text-align:center;font-family:inherit;text-transform:uppercase}
#onlineStatus{font-size:13px;color:var(--sub);text-align:center;min-height:20px;line-height:1.6;margin-top:10px}
#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}
#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.25em;color:var(--acc);display:block;margin-top:4px}
.best{text-align:center;color:var(--sub);font-size:13px}
.timer{text-align:center;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--acc)}
.qnum{text-align:center;color:var(--sub);font-size:13px;font-weight:700}
.question{text-align:center;font-size:38px;font-weight:900;letter-spacing:.05em;padding:10px 0}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:14px;padding:16px;font-size:22px;font-weight:900;color:var(--txt);cursor:pointer;font-family:inherit}
.choice:active{transform:scale(.96)}
.choice:disabled{opacity:.45}
.msg{text-align:center;font-size:16px;font-weight:800;min-height:24px;line-height:1.5}
.prog{height:12px;background:rgba(0,0,0,.4);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progFill{height:100%;width:0%;transition:width .25s}
.progLabel{font-size:12px;color:var(--sub);display:flex;justify-content:space-between;margin-top:4px}
.penalty{color:#f87171;font-weight:800;text-align:center;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
<div class="ttl">🧮 けいさんダッシュ</div>
<p class="sub">10問の計算レース！間違えると+3秒ペナルティ。<br>速く正確に答えよう。</p>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="soloPane"><div class="card"><p class="sub" style="margin-bottom:10px">10問完走タイムを競います。</p><button class="btn" id="soloStartBtn">スタート</button></div></div>
<div id="onlinePane" class="hidden"><div class="card">
<div class="netBtns"><button class="btn" id="hostBtn">部屋を作る</button></div>
<div class="row" style="margin-top:10px"><input type="text" id="joinCode" maxlength="6" placeholder="コード6文字"><button class="btn" id="joinBtn" style="width:auto;flex:none">参加する</button></div>
<div id="onlineCodeWrap" class="hidden">ルームコード<span id="roomCodeText">------</span></div>
<div id="onlineStatus"></div>
<button class="btn subBtn hidden" id="leaveBtn" style="margin-top:10px">退出する</button>
</div></div>
<div id="gameArea"><div class="card" style="display:flex;flex-direction:column;gap:10px">
<div class="timer" id="timerText">0.0秒</div>
<div class="qnum" id="qNumText">問題 ー / 10</div>
<div class="question" id="questionText">？</div>
<div class="penalty" id="penaltyText"></div>
<div class="choices" id="choices"></div>
<div class="msg" id="gameMsg">スタートを押してね</div>
<div><div class="prog"><div class="progFill" id="myProg" style="background:var(--acc)"></div></div><div class="progLabel"><span>あなた</span><span id="myProgText">0/10 ・ 正解0</span></div></div>
<div id="oppProgWrap" class="hidden"><div class="prog"><div class="progFill" id="oppProg" style="background:#38bdf8"></div></div><div class="progLabel"><span>相手</span><span id="oppProgText">0/10 ・ 正解0</span></div></div>
<button class="btn hidden" id="rematchBtn">もう一度</button>
</div></div>
<div class="best" id="bestLine">ベスト: ー</div>
</div>
<script>
let AC=null;function tone(f,d,type,v,delay){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.001,t+(d||.15));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||.15));}catch(e){}}
const $=id=>document.getElementById(id);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let mode='solo';
let save={bestTime:null,bestCorrect:0};try{const s=localStorage.getItem('mini_calc_v1');if(s)save=Object.assign(save,JSON.parse(s));}catch(e){}
function persist(){try{localStorage.setItem('mini_calc_v1',JSON.stringify(save));}catch(e){} renderBest();}
function renderBest(){$('bestLine').textContent='ベスト: '+(save.bestTime?('全問正解タイム '+(save.bestTime/1000).toFixed(1)+'秒'):'ー')+' / 最高正解数 '+save.bestCorrect;}
renderBest();
let questions=[],idx=0,correctCount=0,penaltyMs=0,startAt=0,timerId=null,playing=false,finished=false,myFinishTime=null,oppFinishTime=null,recorded=false,oppIdx=0,oppCorrect=0;
function genQuestions(seed){const rnd=mulberry32(seed);const qs=[];for(let i=0;i<10;i++){const range=10+i*5;const op=Math.floor(rnd()*4);let a,b,ans,text;if(op===0){a=1+Math.floor(rnd()*range);b=1+Math.floor(rnd()*range);ans=a+b;text=a+' + '+b;}else if(op===1){a=1+Math.floor(rnd()*range);b=1+Math.floor(rnd()*a);ans=a-b;text=a+' − '+b;}else if(op===2){a=2+Math.floor(rnd()*(3+i));b=2+Math.floor(rnd()*9);ans=a*b;text=a+' × '+b;}else{b=2+Math.floor(rnd()*9);ans=2+Math.floor(rnd()*9);a=b*ans;text=a+' ÷ '+b;}const opts=new Set([ans]);const deltas=[1,-1,2,-2,10,-10,3,-3];while(opts.size<4){const d=deltas[Math.floor(rnd()*deltas.length)];const v=ans+d;if(v>=0)opts.add(v);if(opts.size<4&&opts.size<3)opts.add(ans+opts.size+5);}const arr=Array.from(opts);for(let j=arr.length-1;j>0;j--){const k=Math.floor(rnd()*(j+1));const tmp=arr[j];arr[j]=arr[k];arr[k]=tmp;}qs.push({text:text,ans:ans,opts:arr});}return qs;}
function fmt(ms){return (ms/1000).toFixed(1)+'秒';}
function elapsed(){if(!startAt)return 0;return (finished&&myFinishTime!==null?myFinishTime:(Date.now()-startAt+penaltyMs));}
function updateTimer(){$('timerText').textContent=fmt(elapsed());}
function renderProg(){$('myProg').style.width=(idx*10)+'%';$('myProgText').textContent=idx+'/10 ・ 正解'+correctCount;$('oppProg').style.width=(oppIdx*10)+'%';$('oppProgText').textContent=oppIdx+'/10 ・ 正解'+oppCorrect;}
function showQuestion(){if(idx>=10){finishRace();return;}$('qNumText').textContent='問題 '+(idx+1)+' / 10';const q=questions[idx];$('questionText').textContent=q.text+' = ?';const c=$('choices');c.innerHTML='';q.opts.forEach(v=>{const btn=document.createElement('button');btn.className='choice';btn.textContent=v;btn.addEventListener('click',()=>answer(v));c.appendChild(btn);});renderProg();}
function answer(v){if(!playing||finished)return;const q=questions[idx];const ok=v===q.ans;if(ok){correctCount++;tone(880,.1,'sine',.11);$('penaltyText').textContent='';}else{penaltyMs+=3000;tone(200,.2,'square',.08);$('penaltyText').textContent='不正解！ +3秒（正解は '+q.ans+'）';}idx++;if(mode==='online')sendNet({t:'prog',idx:idx,correct:correctCount});if(idx>=10){finishRace();}else{showQuestion();}updateTimer();}
function startRace(seed){questions=genQuestions(seed);idx=0;correctCount=0;penaltyMs=0;oppIdx=0;oppCorrect=0;myFinishTime=null;oppFinishTime=null;finished=false;playing=true;recorded=false;$('rematchBtn').classList.add('hidden');$('penaltyText').textContent='';$('gameMsg').textContent='計算してね！';startAt=Date.now();clearInterval(timerId);timerId=setInterval(updateTimer,100);renderProg();showQuestion();tone(784,.12,'sine',.1);}
function finishRace(){finished=true;playing=false;clearInterval(timerId);myFinishTime=Date.now()-startAt+penaltyMs;updateTimer();renderProg();document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(mode==='solo'){$('gameMsg').textContent='完走！ '+fmt(myFinishTime)+' ・ 正解 '+correctCount+'/10';if(correctCount>save.bestCorrect)save.bestCorrect=correctCount;if(correctCount===10&&(!save.bestTime||myFinishTime<save.bestTime))save.bestTime=myFinishTime;persist();tone(523,.15,'sine',.12);tone(784,.25,'sine',.12,.15);}else{sendNet({t:'finish',time:myFinishTime});$('gameMsg').textContent='完走！ '+fmt(myFinishTime)+' ・ 正解 '+correctCount+'/10 相手を待っています…';checkOnlineResult();}}
function checkOnlineResult(){if(mode!=='online'||myFinishTime===null||oppFinishTime===null||recorded)return;let res,txt;if(myFinishTime<oppFinishTime){res='win';txt='🏆 あなたの勝ち！ あなた '+fmt(myFinishTime)+' / 相手 '+fmt(oppFinishTime);}else if(myFinishTime>oppFinishTime){res='lose';txt='相手の勝ち… あなた '+fmt(myFinishTime)+' / 相手 '+fmt(oppFinishTime);}else{res='draw';txt='引き分け！ 両者 '+fmt(myFinishTime);}$('gameMsg').textContent=txt;$('rematchBtn').classList.remove('hidden');recorded=true;if(window.PWFriends&&PWFriends.recordMatch)PWFriends.recordMatch(res);if(res==='win'){tone(523,.15,'sine',.12);tone(784,.25,'sine',.12,.15);}}
function resetOnlineGame(){clearInterval(timerId);playing=false;finished=false;idx=0;correctCount=0;oppIdx=0;oppCorrect=0;myFinishTime=null;oppFinishTime=null;recorded=false;$('timerText').textContent='0.0秒';$('qNumText').textContent='問題 ー / 10';$('questionText').textContent='？';$('choices').innerHTML='';$('gameMsg').textContent='接続を待っています…';$('rematchBtn').classList.add('hidden');$('oppProgWrap').classList.remove('hidden');renderProg();}
document.querySelectorAll('#modeSeg button').forEach(b=>{b.addEventListener('click',()=>{document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;const on=mode==='online';$('soloPane').classList.toggle('hidden',on);$('onlinePane').classList.toggle('hidden',!on);$('oppProgWrap').classList.toggle('hidden',!on);if(on)resetOnlineGame();tone(660,.08,'sine',.08);});});
$('soloStartBtn').addEventListener('click',()=>{startRace(Math.floor(Math.random()*1000000000));});
$('rematchBtn').addEventListener('click',()=>{if(isHost){const seed=Math.floor(Math.random()*1000000000);startRace(seed);sendNet({t:'start',seed:seed});}else{sendNet({t:'rematch'});$('gameMsg').textContent='再戦を申し込みました…';}});
function onNetData(m){if(!m||!m.t)return;if(m.t==='ping')return;
if(m.t==='hello'){const seed=Math.floor(Math.random()*1000000000);setOnlineStatus('接続しました！対戦開始');sendNet({t:'start',seed:seed});startRace(seed);return;}
if(m.t==='start'){startRace(m.seed);return;}
if(m.t==='prog'){oppIdx=m.idx;oppCorrect=m.correct;renderProg();return;}
if(m.t==='finish'){oppFinishTime=m.time;oppIdx=10;renderProg();checkOnlineResult();if(myFinishTime===null)$('gameMsg').textContent='相手が完走しました！急いで！';return;}
if(m.t==='rematch'){if(isHost){const seed=Math.floor(Math.random()*1000000000);startRace(seed);sendNet({t:'start',seed:seed});}return;}
}
function onNetDisconnected(){setOnlineStatus('<span class="err">相手との接続が切れました。</span>');clearInterval(timerId);playing=false;}
</script>
<script>
const PEER_PREFIX = 'playweb-cl-';
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
] } };
let peer=null, conn=null, isHost=false, roomCode='', heartbeatTimer=null, connTimer=null;
function genRoomCode(){ const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=C.charAt(Math.floor(Math.random()*C.length)); return s; }
function peerAvailable(){ return typeof window.Peer !== 'undefined'; }
function sendNet(o){ if (conn && conn.open){ try{ conn.send(o); }catch(e){} } }
function setOnlineStatus(html){ const el=document.getElementById('onlineStatus'); if(el) el.innerHTML=html; }
function startHeartbeat(){ stopHeartbeat(); heartbeatTimer=setInterval(()=>sendNet({t:'ping'}),8000); }
function stopHeartbeat(){ if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; } }
function armConnTimer(msg){ clearTimeout(connTimer); connTimer=setTimeout(()=>{ if(!conn||!conn.open) setOnlineStatus('<span class="err">'+msg+'</span>'); },25000); }
function disarmConnTimer(){ clearTimeout(connTimer); }
function gateOk(){ if (window.PWFriends && PWFriends.gateState){ const g=PWFriends.gateState(); if (g==='guest'||g==='sdk-down'){ setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>'); return false; } } return true; }
function setupConn(c){ conn=c; c.on('data', onNetData); c.on('open', ()=>{ disarmConnTimer(); startHeartbeat(); }); c.on('close', ()=>{ if(conn===c) onNetDisconnected(); }); c.on('error', ()=>{ if(conn===c) onNetDisconnected(); }); }
function teardownOnline(){ stopHeartbeat(); clearTimeout(connTimer); try{if(conn)conn.close();}catch(e){} try{if(peer)peer.destroy();}catch(e){} conn=null; peer=null; }
function hostRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; teardownOnline(); isHost=true; roomCode=genRoomCode(); window.PW_ROOM_CODE=roomCode; resetOnlineGame(); setOnlineStatus('部屋を作成中…');
  try{ peer=new Peer(PEER_PREFIX+roomCode, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ document.getElementById('roomCodeText').textContent=roomCode; document.getElementById('onlineCodeWrap').classList.remove('hidden'); document.getElementById('leaveBtn').classList.remove('hidden'); setOnlineStatus('フレンドの参加を待っています…'); });
  peer.on('connection', c=>{ setupConn(c); armConnTimer('相手との接続を確立できませんでした。'); });
  peer.on('error', err=>{ if(err&&err.type==='unavailable-id') setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>'); });
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
}
function joinRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; const code=(document.getElementById('joinCode').value||'').trim().toUpperCase(); if(code.length!==6){ setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; } teardownOnline(); isHost=false; roomCode=code; resetOnlineGame(); setOnlineStatus('接続中…');
  try{ peer=new Peer(undefined, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ armConnTimer('接続を確立できませんでした。'); const c=peer.connect(PEER_PREFIX+code,{reliable:true}); setupConn(c); c.on('open', ()=>{ document.getElementById('leaveBtn').classList.remove('hidden'); sendNet({t:'hello'}); setOnlineStatus('接続しました！対戦開始を待っています…'); }); });
  peer.on('error', err=>{ if(err&&err.type==='peer-unavailable') setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>'); });
}
function leaveOnline(){ teardownOnline(); window.PW_ROOM_CODE=''; document.getElementById('onlineCodeWrap').classList.add('hidden'); document.getElementById('leaveBtn').classList.add('hidden'); setOnlineStatus(''); resetOnlineGame(); }
document.getElementById('hostBtn').addEventListener('click',hostRoom);
document.getElementById('joinBtn').addEventListener('click',joinRoom);
document.getElementById('leaveBtn').addEventListener('click',leaveOnline);
</script>
<script>window.PW_GAME='calc';window.PW_JOIN_CFG={openers:[{click:'button[data-m="online"]'}],input:'#joinCode',joinBtn:'#joinBtn',hostBtn:'#hostBtn'};</script>
<script src="friends.js"></script>
</body>
</html>
