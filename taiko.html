<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>太鼓リズム | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#150a10;--accent:#e63946;--accent2:#3a86ff;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);--txt:#fff7ea;--sub:#cdb49b;--gold:#ffc93c;--don:#ff5a48;--katsu:#5ea0ff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;height:calc(100dvh - 46px);overflow:hidden}
.ttl{font-size:25px;font-weight:900;text-align:center;letter-spacing:.05em;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 18px rgba(230,57,70,.45),0 0 42px rgba(255,150,60,.28);position:relative;padding-bottom:5px}
.ttl span{color:#ff7a5c}
.ttl::after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--don),var(--gold),var(--katsu))}
#modeSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;min-height:40px}
#modeSeg button.on{background:linear-gradient(180deg,#f4525f,#d92c3c);color:#fff;box-shadow:0 2px 8px rgba(230,57,70,.45)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.hidden{display:none!important}
.btn{background:linear-gradient(180deg,#f4525f,#d92c3c);color:#fff;border:none;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;flex:1;min-height:48px;box-shadow:0 4px 0 #8f1d29,0 6px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -8px 14px rgba(0,0,0,.14);letter-spacing:.03em;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.btn.blue{background:linear-gradient(180deg,#5b9bff,#2f6fe4);box-shadow:0 4px 0 #1d4fa3,0 6px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -8px 14px rgba(0,0,0,.14)}
.btn.sub{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn:active{transform:translateY(2px) scale(.98);box-shadow:0 2px 0 #8f1d29}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.netBtns{display:flex;gap:8px;margin-bottom:10px}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-size:16px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit;min-height:48px}
#onlineStatus{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px;line-height:1.6;text-align:center}
#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}
#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.3em;color:var(--gold)}
.help{font-size:12px;color:var(--sub);line-height:1.8;text-align:center}
#songArea{flex:1;min-height:0;display:flex;flex-direction:column}
#genreTabs{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
#genreTabs::-webkit-scrollbar{display:none}
#genreTabs button{flex:none;border:2px solid var(--line);background:rgba(255,255,255,.06);color:var(--sub);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;min-height:36px;letter-spacing:.03em}
#genreTabs button:active{transform:scale(.95)}
#genreTabs button.on{background:linear-gradient(180deg,#f4525f,#d92c3c);border-color:rgba(255,255,255,.35);color:#fff;box-shadow:0 3px 9px rgba(230,57,70,.5)}
.songList{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow-y:auto;padding:1px}
.songCard{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.09);border-radius:12px;padding:8px 12px 8px 10px;color:var(--txt);cursor:pointer;font-family:inherit;min-height:64px;overflow:hidden;box-shadow:0 3px 9px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09);flex:none}
.songCard:active{transform:scale(.98)}
.songCard.on{border-color:rgba(255,201,60,.85);background:linear-gradient(180deg,rgba(255,201,60,.16),rgba(255,201,60,.06));box-shadow:0 0 0 1px rgba(255,201,60,.3),0 0 16px rgba(255,201,60,.22),inset 0 1px 0 rgba(255,255,255,.16);animation:cardPop .25s ease-out}
.songCard.on::before{content:'';position:absolute;top:0;bottom:0;width:56px;left:-70px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.20),transparent);animation:cardSheen 2.8s ease-in-out infinite;pointer-events:none}
@keyframes cardSheen{0%{left:-70px}45%,100%{left:110%}}
@keyframes cardPop{0%{transform:scale(.97)}60%{transform:scale(1.015)}100%{transform:scale(1)}}
.songCard .jk{position:relative;font-size:27px;width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(150deg,var(--sc,#555) 0%,var(--sc2,#333) 100%);background-size:cover;background-position:center;box-shadow:inset 0 2px 3px rgba(255,255,255,.45),inset 0 -5px 8px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.22);overflow:hidden;text-shadow:0 2px 7px rgba(0,0,0,.55)}
.songCard .jk::after{content:'';position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
.songCard .grow{flex:1;min-width:0}
.songCard .nm{font-size:16px;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songCard .meta{font-size:11px;color:var(--sub);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songCard .stars{font-size:10.5px;color:var(--gold);letter-spacing:.06em;margin-top:1px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.songCard .bst{font-size:11.5px;color:#231600;background:linear-gradient(180deg,#ffd964,#f5b921);font-weight:900;white-space:nowrap;padding:3px 8px;border-radius:999px;box-shadow:0 2px 5px rgba(0,0,0,.35)}
/* 選択中パネルは一覧カードと別物に見せる：曲色の全面グラデーション＋太い金枠＋強い発光＋「選択中」タグ */
#songDetail{position:relative;margin-top:9px;background:linear-gradient(115deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.17) 46%,rgba(255,255,255,0) 60%),linear-gradient(135deg,var(--sc,#e2543e),var(--sc2,#8f2318));background-size:260% 100%,100% 100%;animation:sdSheen 4.2s ease-in-out infinite;border:3px solid var(--gold);border-radius:18px;padding:10px;display:flex;gap:10px;box-shadow:0 10px 26px rgba(0,0,0,.6),0 0 22px rgba(255,201,60,.5),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -10px 18px rgba(0,0,0,.18);flex:none}
@keyframes sdSheen{0%{background-position:125% 0,0 0}55%,100%{background-position:-65% 0,0 0}}
#songDetail .sdTag{position:absolute;top:0;right:0;z-index:2;background:linear-gradient(180deg,#ffd964,#f5b921);color:#231600;font-size:11px;font-weight:900;letter-spacing:.1em;padding:3px 12px;border-radius:0 0 0 12px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#songDetail .sdJk{position:relative;font-size:40px;width:74px;height:74px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:13px;background:linear-gradient(150deg,var(--sc,#555) 0%,var(--sc2,#333) 100%);background-size:cover;background-position:center;box-shadow:inset 0 2px 4px rgba(255,255,255,.5),inset 0 -7px 10px rgba(0,0,0,.4),0 3px 8px rgba(0,0,0,.4),0 0 0 1.5px rgba(255,255,255,.3);overflow:hidden;text-shadow:0 3px 9px rgba(0,0,0,.55)}
#songDetail .sdJk::after{content:'';position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
#songDetail .sdMain{flex:1;min-width:0}
#songDetail .sdTtl{font-size:17.5px;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:76px;text-shadow:0 2px 3px rgba(0,0,0,.5)}
#songDetail .sdMeta{font-size:11.5px;color:rgba(255,255,255,.88);margin:1px 0 6px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#songDetail .dRow{display:flex;align-items:center;gap:7px;width:100%;text-align:left;background:rgba(0,0,0,.28);border:1.5px solid var(--line);border-radius:10px;padding:3px 9px;color:var(--txt);cursor:pointer;font-family:inherit;margin-top:3px;min-height:30px}
#songDetail .dRow:active{transform:scale(.98)}
#songDetail .dRow.on{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,201,60,.22),rgba(255,201,60,.06));box-shadow:0 0 8px rgba(255,201,60,.35)}
#songDetail .dLbl{font-size:12px;font-weight:900;width:66px;flex:none;white-space:nowrap}
#songDetail .stars{font-size:10px;color:var(--gold);letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden}
#songDetail .dBest{font-size:11px;font-weight:900;color:var(--sub);white-space:nowrap}
#songDetail .dBest .rk{display:inline-block;background:linear-gradient(180deg,#ffd964,#f5b921);color:#231600;border-radius:6px;padding:0 5px;margin-left:3px;font-size:11px}
#songDetail .sdCredit{font-size:9.5px;color:rgba(255,255,255,.78);margin-top:5px;line-height:1.55;text-shadow:0 1px 2px rgba(0,0,0,.5);overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:rgba(20,10,16,.93);color:var(--txt);border:1.5px solid var(--gold);border-radius:999px;padding:10px 20px;font-size:13.5px;font-weight:800;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-height:740px){
  .songCard{min-height:56px;padding:6px 10px 6px 8px}
  .songCard .jk{width:42px;height:42px;font-size:23px}
  #songDetail{padding:6px 8px;margin-top:6px}
  #songDetail .sdJk{width:46px;height:46px;font-size:25px}
  #songDetail .dRow{min-height:26px;padding:2px 8px;margin-top:2px}
  /* 低い画面では選曲まわりを全体に圧縮する。難易度4行＋対戦パネルでも
     #songDetail が #songArea からはみ出して下の招待ボタン等を覆わないため */
  .ttl{font-size:19px;padding-bottom:3px}
  #modeSeg button{min-height:34px;padding:6px}
  #genreTabs{padding-bottom:4px}
  #genreTabs button{min-height:32px;padding:5px 12px}
  #songDetail .sdTtl{font-size:15px}
  #songDetail .sdMeta{margin:0 0 3px}
  .card{padding:8px 10px}
  .netBtns{margin-bottom:6px}
  #onlinePane .pwf-gamebar{padding:8px;margin:5px 0}
  #onlinePane .pwf-gb-note{display:none}
  .footHelp{display:none}
}
#hud{display:flex;flex-direction:column;gap:5px}
.hudRow{display:flex;align-items:center;gap:10px;height:34px}
#hudScore{font-size:25px;font-weight:900;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#hudScore::before{content:'SCORE ';font-size:10px;color:var(--sub);letter-spacing:.18em;vertical-align:3px}
#hudCombo{font-size:14.5px;font-weight:900;color:#fff;background:linear-gradient(90deg,#f59e0b,#e63946);padding:3px 11px;border-radius:999px;box-shadow:0 2px 8px rgba(230,57,70,.45);white-space:nowrap;height:27px;min-width:108px;display:inline-flex;align-items:center;justify-content:center}
/* コンボが無い時は場所を確保したまま透明にするだけ（display切替で画面を上下させない） */
#hudCombo:empty{visibility:hidden}
#hudCombo.pop{animation:cpop .18s ease-out}
#hudCombo.hot{background:linear-gradient(90deg,#ff8a3c,#e63946);box-shadow:0 2px 13px rgba(255,120,50,.8),inset 0 1px 0 rgba(255,255,255,.5);animation:hotPulse .45s ease-in-out infinite alternate}
@keyframes hotPulse{from{filter:brightness(1)}to{filter:brightness(1.22)}}
@keyframes cpop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#hudSong{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gaugeWrap{position:relative;height:19px;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.6)}
#gaugeFill{height:100%;width:0%;background:repeating-linear-gradient(45deg,#f43f5e 0 14px,#fb7185 14px 28px);border-radius:999px;transition:width .15s;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 5px rgba(0,0,0,.25);animation:gaugeFlow .8s linear infinite}
@keyframes gaugeFlow{from{background-position:0 0}to{background-position:39.6px 0}}
#gaugeWrap.clear{box-shadow:0 0 14px rgba(74,222,128,.75),inset 0 2px 5px rgba(0,0,0,.5)}
#gaugeWrap.clear #gaugeFill{background:repeating-linear-gradient(45deg,#22c55e 0 14px,#4ade80 14px 28px)}
#gaugeMark{position:absolute;top:-1px;bottom:-1px;left:70%;width:3px;background:#fff;opacity:.9;box-shadow:0 0 6px rgba(255,255,255,.8)}
#gaugeLbl{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;font-weight:700}
#gaugePct{color:var(--gold);font-weight:900;font-size:12px}
#progWrap{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
#progFill{height:100%;width:0%;background:rgba(255,255,255,.45)}
#vsRow{display:flex;gap:8px}
.scoreBox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-align:center;font-size:12px;color:var(--sub)}
.scoreBox b{display:block;font-size:17px;color:var(--txt)}
.scoreBox .mini{height:6px;background:rgba(255,255,255,.1);border-radius:99px;margin-top:4px;overflow:hidden}
.scoreBox .mini i{display:block;height:100%;background:#4ade80;width:0%}
/* VSコンボも常時同じ高さを確保する（有無でスコア枠が伸縮して画面が上下しないように） */
.scoreBox .cb{display:block;height:18px;line-height:18px;font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
#stageWrap{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:2px solid rgba(255,220,160,.34);background:#1a0d14;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
/* タップ色分けは Canvas 上の大太鼓（中=ドン）とその外側エリア（=カツ）で描く。旧 #tapZones は廃止 */
#resultPanel{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(46,16,30,.92),rgba(10,4,8,.94) 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:16px;text-align:center;z-index:5;overflow:hidden}
#resultPanel .rays{position:absolute;inset:-48%;background:repeating-conic-gradient(from 0deg,rgba(255,201,60,.10) 0 10deg,transparent 10deg 24deg);animation:raysSpin 18s linear infinite;pointer-events:none;z-index:-1}
@keyframes raysSpin{to{transform:rotate(360deg)}}
#resultPanel .confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
#resultPanel .confetti i{position:absolute;top:-14px;width:7px;height:11px;border-radius:2px;opacity:0;animation:cfall linear forwards}
@keyframes cfall{0%{transform:translate3d(0,-14px,0) rotate(0deg);opacity:1}80%{opacity:1}100%{transform:translate3d(14px,540px,0) rotate(600deg);opacity:0}}
#resultPanel .rank{font-size:62px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff6cf 5%,#ffc93c 52%,#f59e0b 95%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.45)) drop-shadow(0 0 24px rgba(255,201,60,.5));animation:rankIn .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes rankIn{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#resultPanel .fcBadge{font-size:15px;font-weight:900;color:#231600;background:linear-gradient(90deg,#ffd964,#ffb03a);padding:4px 16px;border-radius:999px;box-shadow:0 3px 10px rgba(255,176,58,.5);animation:rankIn .5s .12s cubic-bezier(.2,1.6,.4,1) backwards}
#resultPanel .accLine{font-size:13px;color:var(--txt);font-weight:800}
@media (max-height:740px){
  #resultPanel{gap:4px;padding:10px}
  #resultPanel .rank{font-size:46px}
  #resultPanel .stamp{font-size:14px;padding:2px 12px}
  #resultPanel .rscore{font-size:20px}
  #resultPanel .rdetail{font-size:12.5px;line-height:1.55}
  #resultPanel .rbtns{margin-top:2px}
  #resultPanel .rbtns .btn{min-height:44px;padding:9px 10px}
}
#resultPanel .stamp{font-size:17px;font-weight:900;padding:3px 16px;border-radius:999px;border:2px solid}
#resultPanel .stamp.ok{color:#4ade80;border-color:#4ade80}
#resultPanel .stamp.ng{color:#f87171;border-color:#f87171}
#resultPanel .rscore{font-size:24px;font-weight:900}
#resultPanel .rdetail{font-size:13.5px;color:var(--sub);line-height:1.75}
#resultPanel .rbtns{display:flex;gap:8px;margin-top:6px;width:100%;max-width:320px}
#ctrlRow{display:flex;gap:8px;align-items:center}
.iconBtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:12px;min-width:48px;min-height:44px;font-size:19px;cursor:pointer;font-family:inherit}
#seSetSel{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:12px;min-height:44px;padding:0 6px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;max-width:132px}
#quitBtn{flex:1}
.wrap.playing #modeSeg,.wrap.playing #songArea,.wrap.playing #soloPane,.wrap.playing #onlinePane,.wrap.playing .footHelp{display:none!important}
.wrap:not(.ingame) #stageWrap,.wrap:not(.ingame) #hud{display:none}
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#onlinePane{overscroll-behavior:none;}
</style>
</head>
<body>
<div class="wrap" id="wrapEl">
<div class="ttl">🥁 太鼓<span>リズム</span></div>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="songArea">
<div id="genreTabs"></div>
<div class="songList" id="songList"></div>
<div id="songDetail"></div>
</div>
<div id="soloPane">
<button id="startBtn" class="btn" style="width:100%">▶ 演奏スタート</button>
<p class="help" style="margin-top:8px">音符が左端の金の枠に重なったら叩こう！<br>赤い音符＝<b style="color:#ff8a7a">ドン（下の大太鼓の中をタップ）</b>、青い音符＝<b style="color:#8ab6ff">カツ（大太鼓の外をタップ）</b>。キー F・J＝ドン / D・K＝カツ でも叩けます。</p>
</div>
<div id="onlinePane" class="hidden"><div class="card">
<div class="netBtns"><button id="hostBtn" class="btn">部屋を作る</button></div>
<div class="joinRow"><input id="joinCode" maxlength="6" placeholder="コード6文字"><button id="joinBtn" class="btn blue">参加する</button></div>
<div id="onlineCodeWrap" class="hidden">ルームコード<br><span id="roomCodeText">------</span></div>
<div id="onlineStatus"></div>
<button id="vsStartBtn" class="btn hidden" style="width:100%;margin-top:8px">🥁 対戦スタート（ホスト）</button>
<button id="leaveBtn" class="btn sub hidden" style="width:100%;margin-top:8px">退出する</button>
</div></div>
<div id="hud">
<div class="hudRow"><span id="hudScore">0</span><span id="hudCombo"></span><span id="hudSong"></span></div>
<div id="gaugeWrap"><div id="gaugeFill"></div><div id="gaugeMark"></div></div>

  ctx.fillStyle = bg; ctx.fill();
  /* 木目と立体感（胴の内側にクリップして描く） */
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, R, 0, 6.29); ctx.clip();
  ctx.strokeStyle = 'rgba(60,10,4,.20)'; ctx.lineWidth = 2.2;
  for (var wi = 0; wi < 5; wi++) {
    var wy = y - R * 0.72 + wi * R * 0.36;
    ctx.beginPath();
    ctx.moveTo(x - R, wy);
    ctx.bezierCurveTo(x - R * 0.4, wy + R * 0.07, x + R * 0.35, wy - R * 0.06, x + R, wy + R * 0.03);
    ctx.stroke();
  }
  var side = ctx.createLinearGradient(x - R, 0, x + R, 0);
  side.addColorStop(0, 'rgba(255,190,140,.14)'); side.addColorStop(0.35, 'rgba(255,190,140,0)'); side.addColorStop(0.8, 'rgba(0,0,0,.16)'); side.addColorStop(1, 'rgba(0,0,0,.30)');
  ctx.fillStyle = side; ctx.fillRect(x - R, y - R, R * 2, R * 2);
  ctx.restore();
  ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.stroke();
  /* 縄（締め太鼓の縄掛けを破線リングで表現） */
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, R * 0.905, 0, 6.29);
  ctx.strokeStyle = 'rgba(216,178,116,.85)'; ctx.lineWidth = 4.6; ctx.setLineDash([7, 5]); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, R * 0.905, 0, 6.29);
  ctx.strokeStyle = 'rgba(120,84,40,.7)'; ctx.lineWidth = 4.6; ctx.setLineDash([7, 5]); ctx.lineDashOffset = 6; ctx.stroke();
  ctx.restore();
  /* 鋲（胴の飾り：16個＋ハイライト） */
  for (var i = 0; i < 16; i++) {
    var a = i / 16 * 6.283 + 0.20;
    var sx = x + Math.cos(a) * R * 0.965, sy = y + Math.sin(a) * R * 0.965;
    ctx.beginPath(); ctx.arc(sx, sy, 2.1, 0, 6.29);
    ctx.fillStyle = 'rgba(255,215,130,.9)'; ctx.fill();
    ctx.beginPath(); ctx.arc(sx - 0.7, sy - 0.7, 0.8, 0, 6.29);
    ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fill();
  }
  /* 縁（カツの判定部：叩くと青く光る） */
  ctx.beginPath(); ctx.arc(x, y, R * 0.80, 0, 6.29);
  ctx.fillStyle = pk > 0.2 ? '#8ab6ff' : '#7a4a35';
  ctx.fill();
  ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.stroke();
  if (pk > 0.2) {
    ctx.beginPath(); ctx.arc(x, y, R * 0.80, 0, 6.29);
    ctx.strokeStyle = 'rgba(190,220,255,.95)'; ctx.lineWidth = 3; ctx.stroke();
  }
  /* 面（ドンの判定部：叩くと沈んで温かく光る） */
  var sink = pd * 2.2;
  var fg = ctx.createRadialGradient(x - R * 0.2, y - R * 0.25 + sink, R * 0.1, x, y + sink, R * 0.66);
  if (pd > 0.2) { fg.addColorStop(0, '#fff3d0'); fg.addColorStop(1, '#ffc98a'); }
  else { fg.addColorStop(0, '#fffaf0'); fg.addColorStop(1, '#f3e2c2'); }
  ctx.beginPath(); ctx.arc(x, y + sink, R * 0.62, 0, 6.29);
  ctx.fillStyle = fg; ctx.fill();
  ctx.strokeStyle = 'rgba(120,60,30,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  /* 面の張り感：同心のうっすらした輪と、縁に落ちる影 */
  ctx.strokeStyle = 'rgba(150,95,45,.13)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y + sink, R * 0.44, 0, 6.29); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y + sink, R * 0.27, 0, 6.29); ctx.stroke();
  var fshade = ctx.createRadialGradient(x, y + sink, R * 0.40, x, y + sink, R * 0.63);
  fshade.addColorStop(0, 'rgba(120,60,20,0)'); fshade.addColorStop(1, 'rgba(120,60,20,.20)');
  ctx.beginPath(); ctx.arc(x, y + sink, R * 0.62, 0, 6.29);
  ctx.fillStyle = fshade; ctx.fill();
  /* 面のラベル（大太鼓のみ） */
  if (label) {
    ctx.font = '900 ' + Math.round(R * 0.38) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(154,52,24,.88)';
    ctx.fillText(label, x, y + sink + R * 0.02);
    ctx.textBaseline = 'alphabetic';
  }
  /* 判定リング（判定太鼓のみ） */
  if (goldRing) {
    ctx.beginPath(); ctx.arc(x, y, R + 6 + Math.sin(performance.now() / 280) * 1.2, 0, 6.29);
    ctx.strokeStyle = 'rgba(255,201,60,.75)'; ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}
/* 下部の大太鼓と、その外側＝カツの色分けエリア */
function drawBigDrum(t) {
  var bd = bigDrumGeom();
  /* 外側エリア（カツ）：青く色分けし、叩くと一面が光る */
  var ag = ctx.createLinearGradient(0, bd.top, 0, CH);
  ag.addColorStop(0, 'rgba(58,134,255,.05)');
  ag.addColorStop(1, 'rgba(58,134,255,.17)');
  ctx.fillStyle = ag;
  ctx.fillRect(0, bd.top, CW, CH - bd.top);
  if (zoneFlash.katsu > 0.01) {
    ctx.fillStyle = 'rgba(96,165,255,' + (zoneFlash.katsu * 0.30).toFixed(3) + ')';
    ctx.fillRect(0, bd.top, CW, CH - bd.top);
  }
  /* 太鼓本体（面=ドン。カウントダウン中は数字を優先してラベルを隠す） */
  drawDrumBody(bd.x, bd.y, bd.R, (playing && songTime < 0) ? null : 'ドン', false);
  /* 叩いた時の波紋（面から広がる輪＋外周の衝撃波） */
  var wNow = performance.now();
  drumWaves = drumWaves.filter(function (w) { return wNow - w.t0 < 520; });
  drumWaves.forEach(function (w) {
    var k = (wNow - w.t0) / 520;
    ctx.save();
    ctx.globalAlpha = (1 - k) * 0.55;
    ctx.beginPath(); ctx.arc(bd.x, bd.y, bd.R * (0.30 + 0.62 * k), 0, 6.29);
    ctx.strokeStyle = 'rgba(' + w.col + ',1)'; ctx.lineWidth = 2.4 * (1 - k) + 0.6; ctx.stroke();
    ctx.globalAlpha = (1 - k) * 0.30;
    ctx.beginPath(); ctx.arc(bd.x, bd.y, bd.R * (1.0 + 0.30 * k), 0, 6.29);
    ctx.strokeStyle = 'rgba(' + w.col + ',1)'; ctx.lineWidth = 3 * (1 - k) + 0.6; ctx.stroke();
    ctx.restore();
  });
  /* 内/外の境界リング（この円の外がカツ） */
  ctx.save();
  ctx.beginPath(); ctx.arc(bd.x, bd.y, bd.R + 4, 0, 6.29);
  ctx.strokeStyle = 'rgba(150,195,255,.55)'; ctx.lineWidth = 2; ctx.setLineDash([7, 6]); ctx.stroke();
  ctx.restore();
  /* ドンを叩いた瞬間の発光 */
  if (zoneFlash.don > 0.01) {
    var dg = ctx.createRadialGradient(bd.x, bd.y, 4, bd.x, bd.y, bd.R);
    dg.addColorStop(0, 'rgba(255,150,110,' + (zoneFlash.don * 0.5).toFixed(3) + ')');
    dg.addColorStop(1, 'rgba(255,90,60,0)');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(bd.x, bd.y, bd.R, 0, 6.29); ctx.fill();
  }
  /* カツのラベル（左右下のコーナー） */
  ctx.save();
  ctx.font = '900 19px sans-serif';
  ctx.fillStyle = 'rgba(169,200,255,.92)';
  ctx.textAlign = 'left';
  ctx.fillText('◎ カツ', 12, CH - 14);
  ctx.textAlign = 'right';
  ctx.fillText('カツ ◎', CW - 12, CH - 14);
  ctx.font = '700 10px sans-serif';
  ctx.fillStyle = 'rgba(200,220,255,.62)';
  ctx.textAlign = 'left';
  ctx.fillText('外側タップ', 12, CH - 31);
  ctx.textAlign = 'right';
  ctx.fillText('外側タップ', CW - 12, CH - 31);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------- オンライン対戦（PeerJS・フレンド招待制は friends.js が担う） ---------------- */
var PEER_PREFIX = 'playweb-tk-';
var PEER_OPTS = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }] } };
var peer = null, conn = null, isHost = false, roomCode = '', heartbeatTimer = null, connTimer = null;
var opp = { score: 0, combo: 0, gauge: 0, fin: null };
var oppLeft = false, recorded = false, progTimer = null;
function genRoomCode() { var C = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; var s = ''; for (var i = 0; i < 6; i++) s += C.charAt(Math.floor(Math.random() * C.length)); return s; }
function peerAvailable() { return typeof window.Peer !== 'undefined'; }
function sendNet(o) { if (conn && conn.open) { try { conn.send(o); } catch (e) {} } }
function setOnlineStatus(html) { var el = $('onlineStatus'); if (el) el.innerHTML = html; }
function startHeartbeat() { stopHeartbeat(); heartbeatTimer = setInterval(function () { sendNet({ t: 'ping' }); }, 8000); }
function stopHeartbeat() { if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; } }
function armConnTimer(msg) { clearTimeout(connTimer); connTimer = setTimeout(function () { if (!conn || !conn.open) setOnlineStatus('<span class="err">' + msg + '</span>'); }, 25000); }
function disarmConnTimer() { clearTimeout(connTimer); }
function gateOk() {
  if (window.PWFriends && PWFriends.gateState) {
    var g = PWFriends.gateState();
    if (g === 'guest' || g === 'sdk-down') { setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>'); return false; }
  }
  return true;
}
function setupConn(c) {
  conn = c;
  c.on('data', onNetData);
  c.on('open', function () { disarmConnTimer(); startHeartbeat(); });
  c.on('close', function () { if (conn === c) onNetDisconnected(); });
  c.on('error', function () { if (conn === c) onNetDisconnected(); });
}
function teardownOnline() {
  stopHeartbeat(); clearTimeout(connTimer);
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  try { if (conn) conn.close(); } catch (e) {}
  try { if (peer) peer.destroy(); } catch (e) {}
  conn = null; peer = null;
}
function resetVs() {
  opp = { score: 0, combo: 0, gauge: 0, fin: null };
  oppLeft = false; recorded = false;
  $('vsOppScore').textContent = '0'; $('vsOppCombo').textContent = ''; $('vsOppGauge').style.width = '0%';
  $('vsMeScore').textContent = '0'; $('vsMeCombo').textContent = ''; $('vsMeGauge').style.width = '0%';
}
function hostRoom() {
  if (!peerAvailable()) { setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  if (!gateOk()) return;
  teardownOnline(); isHost = true; roomCode = genRoomCode();
  window.PW_ROOM_CODE = roomCode;
  setOnlineStatus('部屋を作成中…');
  try { peer = new Peer(PEER_PREFIX + roomCode, PEER_OPTS); } catch (e) { setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', function () {
    $('roomCodeText').textContent = roomCode;
    $('onlineCodeWrap').classList.remove('hidden');
    $('leaveBtn').classList.remove('hidden');
    setOnlineStatus('フレンドの参加を待っています…');
  });
  peer.on('connection', function (c) { setupConn(c); armConnTimer('相手との接続を確立できませんでした。'); });
  peer.on('error', function (err) { if (err && err.type === 'unavailable-id') setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>'); });
  peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) {} });
}
function joinRoom() {
  if (!peerAvailable()) { setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  if (!gateOk()) return;
  var code = ($('joinCode').value || '').trim().toUpperCase();
  if (code.length !== 6) { setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; }
  teardownOnline(); isHost = false; roomCode = code;
  setOnlineStatus('接続中…');
  try { peer = new Peer(undefined, PEER_OPTS); } catch (e) { setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', function () {
    armConnTimer('接続を確立できませんでした。');
    var c = peer.connect(PEER_PREFIX + code, { reliable: true });
    setupConn(c);
    c.on('open', function () {
      $('leaveBtn').classList.remove('hidden');
      sendNet({ t: 'hello' });
      setOnlineStatus('接続しました。ホストの開始を待っています…');
    });
  });
  peer.on('error', function (err) { if (err && err.type === 'peer-unavailable') setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>'); });
}
function leaveOnline() {
  sendNet({ t: 'leave' });
  teardownOnline();
  window.PW_ROOM_CODE = '';
  $('onlineCodeWrap').classList.add('hidden');
  $('leaveBtn').classList.add('hidden');
  $('vsStartBtn').classList.add('hidden');
  setOnlineStatus('');
  if (playing) stopSong(true);
  resetStage();
}
function hostStartMatch() {
  resetVs();
  sendNet({ t: 'start', song: selSong, diff: selDiff });
  setOnlineStatus('対戦開始！');
  beginOnlineSong();
}
function beginOnlineSong() {
  startSong();
  if (progTimer) clearInterval(progTimer);
  progTimer = setInterval(sendProg, 600);
}
function sendProg() {
  if (mode !== 'online' || !conn) return;
  sendNet({ t: 'prog', score: score, combo: combo, gauge: Math.round(gauge), done: playing ? 0 : 1 });
}
function finishOnline(res, totalScore, isBest) {
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  var myFin = { score: totalScore, good: counts.good, ok: counts.ok, bad: counts.bad, maxCombo: maxCombo, gauge: Math.round(gauge) };
  sendNet({ t: 'fin', fin: myFin });
  if (opp.fin || oppLeft) showVsResult(res, myFin, isBest);
  else {
    var p = $('resultPanel');
    p.innerHTML = '<div class="rdetail" style="font-size:16px">あなたのスコア <b style="color:var(--txt)">' + totalScore.toLocaleString() + '</b><br>相手の終了を待っています…</div>';
    p.classList.remove('hidden');
    pendingVs = { res: res, myFin: myFin, isBest: isBest };
  }
}
var pendingVs = null;
function showVsResult(res, myFin, isBest) {
  pendingVs = null;
  var o = opp.fin;
  var verdict, result;
  if (oppLeft || !o) { verdict = '🏆 あなたの勝ち！（相手が退出）'; result = 'win'; }
  else if (myFin.score > o.score) { verdict = '🏆 あなたの勝ち！'; result = 'win'; }
  else if (myFin.score < o.score) { verdict = '相手の勝ち…'; result = 'lose'; }
  else if (maxCombo > o.maxCombo) { verdict = '🏆 あなたの勝ち！（コンボ差）'; result = 'win'; }
  else if (maxCombo < o.maxCombo) { verdict = '相手の勝ち…（コンボ差）'; result = 'lose'; }
  else { verdict = '引き分け'; result = 'draw'; }
  var vsInfo = verdict + '<br>あなた ' + myFin.score.toLocaleString() + ' 点 vs 相手 ' + (o ? o.score.toLocaleString() : '-') + ' 点';
  showResult(res, myFin.score, !!isBest, vsInfo);
  if (!recorded) {
    recorded = true;
    if (window.PWFriends && PWFriends.recordMatch) PWFriends.recordMatch(result);
  }
}
function requestRematch() {
  if (isHost) { hostStartMatch(); }
  else { sendNet({ t: 'rematch' }); setOnlineStatus('再戦をリクエストしました…'); }
}
function onNetData(m) {
  if (!m || m.t === 'ping') return;
  if (m.t === 'hello') {
    if (isHost) {
      $('vsStartBtn').classList.remove('hidden');
      setOnlineStatus('フレンドが参加しました！「対戦スタート」を押してください。');
    }
    return;
  }
  if (m.t === 'start') {
    selSong = songById(m.song).id; selDiff = DIFFS[m.diff] ? m.diff : 'normal';
    var sgs = songById(selSong);
    if (sgs.real) ensureRealAudio(sgs); /* 実音源は先に読み込み始め、完了後に startSong が自動開始する */
    renderSongList();
    setOnlineStatus('対戦開始！');
    beginOnlineSong();
    return;
  }
  if (m.t === 'prog') {
    opp.score = m.score; opp.combo = m.combo; opp.gauge = m.gauge;
    $('vsOppScore').textContent = Number(m.score).toLocaleString();
    $('vsOppCombo').textContent = m.combo >= 2 ? m.combo + 'コンボ' : '';
    $('vsOppGauge').style.width = m.gauge + '%';
    return;
  }
  if (m.t === 'fin') {
    opp.fin = m.fin;
    if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
    return;
  }
  if (m.t === 'rematch') { if (isHost) hostStartMatch(); return; }
  if (m.t === 'leave') { onOppLeft(); return; }
}
function onOppLeft() {
  oppLeft = true;
  setOnlineStatus('<span class="err">相手が退出しました。</span>');
  if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
}
function onNetDisconnected() {
  setOnlineStatus('<span class="err">接続が切れました。</span>');
  if (playing || pendingVs) onOppLeft();
}
$('hostBtn').addEventListener('click', hostRoom);
$('joinBtn').addEventListener('click', joinRoom);
$('leaveBtn').addEventListener('click', leaveOnline);
$('vsStartBtn').addEventListener('click', function () { $('vsStartBtn').classList.add('hidden'); hostStartMatch(); });

/* テスト用フック */
window.__taiko = {
  SONGS: SONGS, DIFFS: DIFFS, buildSongData: buildSongData, buildChart: buildChart,
  judgeFor: judgeFor, scoreFor: scoreFor, gaugeDelta: gaugeDelta, makeResult: makeResult,
  mulberry32: mulberry32, melodyVoice: melodyVoice, FORMANTS: FORMANTS, VOWELS: VOWELS,
  diffLevel: diffLevel, starStr: starStr, getRank: getRank, genreList: genreList,
  inChorus: inChorus, onsetStr: onsetStr, chorusMix: function () { return chorusMix; },
  judgeGeom: function () { var lg = laneGeom(); return { r: JUDGE_R, noteR: NOTE_R, noteRBig: NOTE_R_BIG, x: lg.judgeX, y: lg.y, laneH: lg.h }; },
  state: function () { return { playing: playing, songTime: songTime, score: score, combo: combo, maxCombo: maxCombo, gauge: gauge, counts: counts, chartLen: chart.length, lastHit: lastHitType, vocal: vocalHits, song: curSong ? curSong.id : selSong, diff: selDiff, genre: selGenre, real: curSong ? !!curSong.real : !!songById(selSong).real, chorus: (playing && curSong) ? inChorus(curSong, songTime) : false }; },
  bigDrum: function () { var bd = bigDrumGeom(); return { x: bd.x, y: bd.y, R: bd.R, top: bd.top }; },
  tapTypeAt: tapTypeAt,
  realInfo: function (songId) { var s = songById(songId || selSong); if (!s.real) return null; var r = realAudio[s.id]; return { state: r ? r.state : 'none', duration: r && r.el ? r.el.duration : null, currentTime: r && r.el ? r.el.currentTime : null, muted: r && r.el ? !!r.el.muted : null }; },
  seekReal: function (sec) { var r = curSong && realAudio[curSong.id]; if (r && r.el) { try { r.el.currentTime = sec; } catch (e) {} } },
  selectSong: function (songId) { selSong = songById(songId).id; var sg = songById(selSong); if (sg.real) ensureRealAudio(sg); renderSongList(); },
  SE_SETS: SE_SETS,
  seSet: function () { return seSet; },
  setSeSet: setSeSet,
  previewSeSet: previewSeSet,
  startSolo: function (songId, diff) { mode = 'solo'; selSong = songId; selDiff = diff; startSong(); },
  hit: hit,
  finishNow: function () { if (playing) { songTime = curData.duration + 1; finishSong(); } }
};
})();
