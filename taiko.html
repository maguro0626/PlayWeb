<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>太鼓リズム | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#150a10;--accent:#e63946;--accent2:#3a86ff;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.13);--txt:#fff7ea;--sub:#cdb49b;--gold:#ffc93c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;height:calc(100dvh - 46px);overflow:hidden}
.ttl{font-size:23px;font-weight:900;text-align:center;letter-spacing:.04em}
.ttl span{color:var(--accent)}
#modeSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;min-height:40px}
#modeSeg button.on{background:var(--accent);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.hidden{display:none!important}
.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;flex:1;min-height:48px}
.btn.blue{background:var(--accent2)}
.btn.sub{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.netBtns{display:flex;gap:8px;margin-bottom:10px}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-size:16px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit;min-height:48px}
#onlineStatus{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px;line-height:1.6;text-align:center}
#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}
#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.3em;color:var(--gold)}
.help{font-size:12px;color:var(--sub);line-height:1.8;text-align:center}
.songList{display:flex;flex-direction:column;gap:7px}
.songCard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;color:var(--txt);cursor:pointer;font-family:inherit;min-height:58px}
.songCard.on{border-color:var(--gold);background:rgba(255,201,60,.1)}
.songCard .emo{font-size:26px}
.songCard .grow{flex:1;min-width:0}
.songCard .nm{font-size:16px;font-weight:900}
.songCard .meta{font-size:11.5px;color:var(--sub);margin-top:1px}
.songCard .bst{font-size:11.5px;color:var(--gold);font-weight:800;white-space:nowrap}
#diffSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;margin-top:8px}
#diffSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:8px 4px;border-radius:999px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;min-height:40px}
#diffSeg button.on{background:var(--gold);color:#231600}
#hud{display:flex;flex-direction:column;gap:5px}
.hudRow{display:flex;align-items:baseline;gap:12px}
#hudScore{font-size:21px;font-weight:900;letter-spacing:.02em}
#hudCombo{font-size:15px;font-weight:900;color:var(--gold);min-width:86px}
#hudCombo.pop{animation:cpop .18s ease-out}
@keyframes cpop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#hudSong{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gaugeWrap{position:relative;height:14px;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:999px;overflow:hidden}
#gaugeFill{height:100%;width:0%;background:linear-gradient(90deg,#f43f5e,#f59e0b);border-radius:999px;transition:width .15s}
#gaugeWrap.clear #gaugeFill{background:linear-gradient(90deg,#22c55e,#4ade80)}
#gaugeMark{position:absolute;top:-1px;bottom:-1px;left:70%;width:2px;background:#fff;opacity:.85}
#gaugeLbl{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
#progWrap{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
#progFill{height:100%;width:0%;background:rgba(255,255,255,.45)}
#vsRow{display:flex;gap:8px}
.scoreBox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-align:center;font-size:12px;color:var(--sub)}
.scoreBox b{display:block;font-size:17px;color:var(--txt)}
.scoreBox .mini{height:6px;background:rgba(255,255,255,.1);border-radius:99px;margin-top:4px;overflow:hidden}
.scoreBox .mini i{display:block;height:100%;background:#4ade80;width:0%}
#stageWrap{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#1a0d14;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#resultPanel{position:absolute;inset:0;background:rgba(10,4,8,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:16px;text-align:center;z-index:5}
#resultPanel .rank{font-size:56px;font-weight:900;line-height:1;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.45)}
#resultPanel .stamp{font-size:17px;font-weight:900;padding:3px 16px;border-radius:999px;border:2px solid}
#resultPanel .stamp.ok{color:#4ade80;border-color:#4ade80}
#resultPanel .stamp.ng{color:#f87171;border-color:#f87171}
#resultPanel .rscore{font-size:24px;font-weight:900}
#resultPanel .rdetail{font-size:13.5px;color:var(--sub);line-height:1.75}
#resultPanel .rbtns{display:flex;gap:8px;margin-top:6px;width:100%;max-width:320px}
#ctrlRow{display:flex;gap:8px;align-items:center}
.iconBtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:12px;min-width:48px;min-height:44px;font-size:19px;cursor:pointer;font-family:inherit}
#quitBtn{flex:1}
.wrap.playing #modeSeg,.wrap.playing #songArea,.wrap.playing #soloPane,.wrap.playing #onlinePane{display:none!important}
.wrap:not(.ingame) #stageWrap,.wrap:not(.ingame) #hud{display:none}
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#onlinePane{overscroll-behavior:none;}
</style>
</head>
<body>
<div class="wrap" id="wrapEl">
<div class="ttl">🥁 太鼓<span>リズム</span></div>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="songArea">
<div class="songList" id="songList"></div>
<div id="diffSeg"><button data-d="easy">かんたん</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div>
</div>
<div id="soloPane">
<button id="startBtn" class="btn" style="width:100%">▶ 演奏スタート</button>
<p class="help" style="margin-top:8px">流れてくる音符が ○ に重なったら叩こう。画面の左半分タップ＝<b style="color:#ff8a7a">ドン</b>、右半分タップ＝<b style="color:#8ab6ff">カツ</b>。キー F・J＝ドン / D・K＝カツ でも叩けます。</p>
</div>
<div id="onlinePane" class="hidden"><div class="card">
<div class="netBtns"><button id="hostBtn" class="btn">部屋を作る</button></div>
<div class="joinRow"><input id="joinCode" maxlength="6" placeholder="コード6文字"><button id="joinBtn" class="btn blue">参加する</button></div>
<div id="onlineCodeWrap" class="hidden">ルームコード<br><span id="roomCodeText">------</span></div>
<div id="onlineStatus"></div>
<button id="vsStartBtn" class="btn hidden" style="width:100%;margin-top:8px">🥁 対戦スタート（ホスト）</button>
<button id="leaveBtn" class="btn sub hidden" style="width:100%;margin-top:8px">退出する</button>
</div></div>
<div id="hud">
<div class="hudRow"><span id="hudScore">0</span><span id="hudCombo"></span><span id="hudSong"></span></div>
<div id="gaugeWrap"><div id="gaugeFill"></div><div id="gaugeMark"></div></div>
<div id="gaugeLbl"><span>魂ゲージ</span><span id="gaugePct">0%</span></div>
<div id="progWrap"><div id="progFill"></div></div>
<div id="vsRow" class="hidden"><div class="scoreBox">あなた<b id="vsMeScore">0</b><span id="vsMeCombo"></span><div class="mini"><i id="vsMeGauge"></i></div></div><div class="scoreBox">相手<b id="vsOppScore">-</b><span id="vsOppCombo"></span><div class="mini"><i id="vsOppGauge"></i></div></div></div>
</div>
<div id="stageWrap"><canvas id="cv"></canvas><div id="resultPanel" class="hidden"></div></div>
<div id="ctrlRow"><button id="muteBtn" class="iconBtn" title="サウンド ON/OFF">🔊</button><button id="quitBtn" class="btn sub hidden">やめる</button></div>
<p class="help">曲はすべて WebAudio 合成のオリジナル曲です。魂ゲージ70%以上でクリア！</p>
</div>
<script>
/*__TAIKO_MAIN__*/
(function () {
'use strict';
/* ================================================================
   太鼓リズム — 太鼓リズムゲーム（WebAudio合成のオリジナル曲）
   譜面は曲データから決定的に生成する（同じ曲・同じ難易度＝同じ譜面）。
   ================================================================ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ---------------- 曲データ ----------------
   mel は 1フレーズ=4小節×16ステップ=64文字。'.'=休符、'1'〜'9'=スケールの度数。
   bassRoots は小節ごとのベース度数（4つ）。seq はフレーズの並び。 */
var SONGS = [
  {
    id: 'matsuri', title: 'まつり太鼓', emo: '🏮', genre: '和風・まつり', bpm: 112, wave: 'triangle', theme: 'wafu',
    scale: [57, 60, 62, 64, 67, 69, 72, 74, 76],
    phrases: {
      A: { mel: '6...6...5.4.5...' + '3...3...2.1.2...' + '4...4...5.6.5.4.' + '3..2.3..1.......', bass: [1, 3, 2, 1] },
      B: { mel: '6...7.6.5...4...' + '5...6.5.4...3...' + '4.4.5.5.6...5...' + '6.......6.......', bass: [1, 4, 5, 1] }
    },
    seq: ['A', 'A', 'B', 'A', 'B', 'B', 'A', 'B']
  },
  {
    id: 'chip', title: 'チップチューン・ダッシュ', emo: '👾', genre: 'チップチューン', bpm: 140, wave: 'square', theme: 'chip', dens: 0.82,
    scale: [60, 62, 64, 65, 67, 69, 71, 72, 74],
    phrases: {
      A: { mel: '5.5.6.5.3.3.2.2.' + '3.3.4.3.2.1.2...' + '5.5.6.5.8.8.7.6.' + '5.3.2.1.2.......', bass: [1, 6, 4, 5] },
      B: { mel: '8.7.6.5.6.7.8...' + '9.8.7.6.5.6.7...' + '8.7.6.5.4.3.2.3.' + '1...5...1.......', bass: [1, 4, 5, 1] }
    },
    seq: ['A', 'A', 'B', 'A', 'B', 'A', 'B', 'B', 'A', 'B']
  },
  {
    id: 'rock', title: 'ロックン太鼓', emo: '🎸', genre: 'ロック', bpm: 128, wave: 'sawtooth', theme: 'rock',
    scale: [64, 66, 67, 69, 71, 72, 74, 76, 78],
    phrases: {
      A: { mel: '1.1...1.1.1...1.' + '1.1...1.3.2.1...' + '4.4...4.4.4...4.' + '5.4.3.2.1.......', bass: [1, 1, 6, 7] },
      B: { mel: '8...7.6.5...4...' + '3.4.5...6...5...' + '4.5.6.6.7...6...' + '8.......8.......', bass: [6, 4, 1, 5] }
    },
    seq: ['A', 'A', 'B', 'A', 'B', 'A', 'B', 'B', 'A']
  }
];
function songById(id) { for (var i = 0; i < SONGS.length; i++) if (SONGS[i].id === id) return SONGS[i]; return SONGS[0]; }

/* 曲の全ステップを展開し、メロディイベントと小節ごとのベース根音を求める */
function buildSongData(song) {
  var stepDur = 60 / song.bpm / 4;
  var melStr = '';
  var bassByBar = [];
  song.seq.forEach(function (pk) {
    var ph = song.phrases[pk];
    melStr += ph.mel;
    for (var b = 0; b < 4; b++) bassByBar.push(song.scale[ph.bass[b] - 1] - 12);
  });
  var totalSteps = melStr.length;
  var melEvents = {}; /* step -> {midi, len} */
  var melSteps = {};
  var cur = -1, curStart = -1;
  for (var s = 0; s <= totalSteps; s++) {
    var ch = s < totalSteps ? melStr.charAt(s) : '.';
    var deg = (ch >= '1' && ch <= '9') ? (ch.charCodeAt(0) - 48) : 0;
    if (deg > 0) {
      if (cur > 0) melEvents[curStart] = { midi: song.scale[cur - 1], len: s - curStart };
      cur = deg; curStart = s; melSteps[s] = true;
    }
  }
  return { stepDur: stepDur, totalSteps: totalSteps, duration: totalSteps * stepDur, melEvents: melEvents, melSteps: melSteps, bassByBar: bassByBar, bars: totalSteps / 16 };
}

/* ---------------- 難易度と譜面生成（決定的） ---------------- */
var DIFFS = {
  easy:   { label: 'かんたん',   grid: 4, pAccent: 0.85, pOff: 0.55, minGap: 4, bigProb: 0,    good: 0.095, bad: 0.190 },
  normal: { label: 'ふつう',     grid: 2, pAccent: 0.80, pOff: 0.22, minGap: 2, bigProb: 0.16, good: 0.075, bad: 0.160 },
  hard:   { label: 'むずかしい', grid: 1, pAccent: 0.85, pOff: 0.30, minGap: 1, bigProb: 0.22, good: 0.058, bad: 0.130 }
};
function buildChart(song, diffKey) {
  var P = DIFFS[diffKey];
  var data = buildSongData(song);
  var rng = mulberry32(hashStr('taiko:' + song.id + ':' + diffKey));
  var notes = [];
  var lastStep = -9999;
  for (var step = 16; step < data.totalSteps - 8; step++) {
    if (step % P.grid !== 0) continue;
    if (step - lastStep < P.minGap) continue;
    var accent = !!data.melSteps[step];
    var barStart = step % 16 === 0;
    var p = accent ? P.pAccent : P.pOff;
    if (barStart) p = Math.max(p, 0.85);
    p *= (song.dens || 1); /* 曲ごとの密度調整（メロディが密な曲を均す） */
    if (rng() >= p) continue;
    var r = rng();
    var type = (step % 4 === 0) ? (r < 0.68 ? 'don' : 'katsu') : (r < 0.42 ? 'don' : 'katsu');
    var n = notes.length;
    if (n >= 3 && notes[n - 1].type === type && notes[n - 2].type === type && notes[n - 3].type === type) type = (type === 'don') ? 'katsu' : 'don';
    var big = P.bigProb > 0 && barStart && rng() < P.bigProb;
    notes.push({ step: step, t: step * data.stepDur, type: type, big: big, judged: 0, res: null });
    lastStep = step;
  }
  return notes;
}
/* 判定：dt秒ずれ → 'good'|'ok'|null(不可窓の外) */
function judgeFor(dt, diffKey) {
  var P = DIFFS[diffKey];
  var a = Math.abs(dt);
  if (a <= P.good) return 'good';
  if (a <= P.bad) return 'ok';
  return null;
}
function scoreFor(res, big) {
  var base = res === 'good' ? 300 : (res === 'ok' ? 100 : 0);
  return base * (big ? 2 : 1);
}
var CLEAR_LINE = 70;
function gaugeDelta(res, totalNotes) {
  if (res === 'good') return 125 / Math.max(1, totalNotes);
  if (res === 'ok') return 55 / Math.max(1, totalNotes);
  return -4.5;
}
function makeResult(counts, gauge, totalNotes) {
  var total = Math.max(1, totalNotes);
  var acc = (counts.good + counts.ok * 0.5) / total;
  var clear = gauge >= CLEAR_LINE;
  var rank = acc >= 0.95 ? 'S' : (acc >= 0.88 ? 'A' : (acc >= 0.75 ? 'B' : (acc >= 0.60 ? 'C' : 'D')));
  if (!clear && (rank === 'S' || rank === 'A')) rank = 'B';
  return { acc: acc, clear: clear, rank: rank };
}

/* ---------------- セーブ（ベスト記録） ----------------
   account.js のクラウドマージが読み込み後に localStorage へ書き戻すため、
   読み込み時に1回だけ読む方式では後着した良い記録を取りこぼす。
   reaction.html と同じく、メモリ保持＋union（大きい方）＋再描画フックで対策する。 */
var SAVE_KEY = 'taiko_best_v1';
var saveCache = null;
function loadSave() {
  var s = {};
  try { s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; } catch (e) {}
  if (!s.best || typeof s.best !== 'object') s.best = {};
  if (saveCache && saveCache.best) {
    Object.keys(saveCache.best).forEach(function (k) {
      if (typeof saveCache.best[k] === 'number' && (typeof s.best[k] !== 'number' || saveCache.best[k] > s.best[k])) s.best[k] = saveCache.best[k];
    });
  }
  saveCache = { best: Object.assign({}, s.best) };
  return s;
}
function storeSave(o) {
  var cur = loadSave();
  Object.keys(cur.best).forEach(function (k) { if (typeof cur.best[k] === 'number' && (typeof o.best[k] !== 'number' || cur.best[k] > o.best[k])) o.best[k] = cur.best[k]; });
  saveCache = { best: Object.assign({}, o.best) };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (e) {}
}
function bestKey(songId, diff) { return songId + ':' + diff; }
function getBest(songId, diff) { var s = loadSave(); var v = s.best[bestKey(songId, diff)]; return typeof v === 'number' ? v : null; }

/* ---------------- オーディオ（全て合成） ---------------- */
var AC = null, master = null, noiseBuf = null;
var muted = false;
try { muted = localStorage.getItem('taiko_mute') === '1'; } catch (e) {}
function ensureAudio() {
  try {
    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (AC.state === 'suspended') AC.resume();
  } catch (e) {}
}
function setMuted(m) {
  muted = m;
  try { localStorage.setItem('taiko_mute', m ? '1' : '0'); } catch (e) {}
  if (master) master.gain.value = m ? 0 : 0.9;
  var b = document.getElementById('muteBtn');
  if (b) b.textContent = m ? '🔇' : '🔊';
}
function toneAt(freq, t, dur, type, vol, slideTo) {
  if (!AC) return;
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function noiseAt(t, dur, fType, freq, q, vol) {
  if (!AC || !noiseBuf) return;
  var src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  src.playbackRate.value = 0.7 + Math.random() * 0.6;
  var f = AC.createBiquadFilter(); f.type = fType; f.frequency.value = freq; f.Q.value = q;
  var g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.05);
}
function kickAt(t, vol) { toneAt(150, t, 0.13, 'sine', vol, 44); }
function snareAt(t, vol) { noiseAt(t, 0.11, 'bandpass', 1800, 0.9, vol); toneAt(190, t, 0.07, 'triangle', vol * 0.5, 120); }
function hatAt(t, vol, open) { noiseAt(t, open ? 0.14 : 0.035, 'highpass', 8200, 0.7, vol); }
/* 太鼓の音（プレイヤーの打撃＆和風曲のドラム）: ドン=面（低く太く）/ カツ=縁（高く締まる） */
function donAt(t, vol, big) { toneAt(big ? 128 : 168, t, big ? 0.34 : 0.24, 'sine', vol, big ? 46 : 57); noiseAt(t, 0.03, 'lowpass', 900, 0.6, vol * 0.35); }

function playHit(type, big) { if (!AC) return; var t = AC.currentTime; if (type === 'don') donAt(t, big ? 0.95 : 0.8, big); else katsuAt(t, big ? 0.8 : 0.65, big); }

/* 曲の1ステップ分をスケジュールする */
function scheduleStep(song, data, step, t) {
  var ev = data.melEvents[step];
  if (ev) toneAt(midiHz(ev.midi), t, Math.min(ev.len * data.stepDur * 0.92, 1.6), song.wave, song.theme === 'rock' ? 0.16 : 0.20);
  var bar = Math.floor(step / 16), bs = step % 16;
  var root = data.bassByBar[bar];
  if (root) {

    else if (bs % 4 === 0) toneAt(midiHz(root), t, data.stepDur * 3.4, song.theme === 'rock' ? 'triangle' : 'square', song.theme === 'rock' ? 0.26 : 0.13);
  }
  var fill = (bs >= 12) && ((bar + 1) % 4 === 0);

    if (bs === 4 || bs === 12) katsuAt(t, 0.30, false);
    if (bs % 4 === 2) hatAt(t, 0.05, false);
  } else if (song.theme === 'chip') {
    if (bs % 4 === 0) kickAt(t, 0.5);
    if (bs === 4 || bs === 12) snareAt(t, 0.32);
    if (bs % 2 === 0) hatAt(t, 0.10, false);
    if (fill && bs >= 12) snareAt(t, 0.22);
  } else { /* rock */
    if (bs === 0 || bs === 8 || bs === 10) kickAt(t, 0.62);
    if (bs === 4 || bs === 12) snareAt(t, 0.42);
    if (bs % 2 === 0) hatAt(t, 0.13, bs === 14);
    if (bs === 0 && bar % 4 === 0) noiseAt(t, 0.35, 'bandpass', 5200, 0.5, 0.10);
    if (fill && bs >= 12) snareAt(t, 0.26);

}

/* ---------------- 演奏の開始・終了 ---------------- */

/* ---------------- 入力と判定 ---------------- */
function hit(type) {
  if (!playing) return;
  ensureAudio();
  playHit(type, false);
  drumPulse[type] = 1;
  if (songTime < 0) return;
  var P = DIFFS[selDiff];
  var best = null, bestAbs = Infinity;
  for (var i = notePtr; i < chart.length; i++) {
    var nt = chart[i];
    if (nt.t - songTime > P.bad) break;
    if (nt.judged) continue;
    if (nt.type !== type) continue;
    var a = Math.abs(nt.t - songTime);
    if (a <= P.bad && a < bestAbs) { best = nt; bestAbs = a; }
  }
  if (!best) return;
  var res = judgeFor(best.t - songTime, selDiff);
  if (!res) return;
  best.judged = 1; best.res = res;
  applyJudge(best, res);
  if (best.big) playHit(type, true);
}
function applyJudge(nt, res) {
  if (res === 'good' || res === 'ok') {
    combo++; if (combo > maxCombo) maxCombo = combo;
    score += scoreFor(res, nt.big);
    counts[res]++;
    gauge = clamp(gauge + gaugeDelta(res, chart.length), 0, 100);
    spawnPopup(nt, res);
  } else {
    combo = 0; counts.bad++;
    gauge = clamp(gauge + gaugeDelta('bad', chart.length), 0, 100);
    spawnPopup(nt, 'bad');
  }
  updateHUD(false);
  sendProg();
}
function sweepMiss() {
  if (!playing || songTime < 0) return;
  var P = DIFFS[selDiff];
  while (notePtr < chart.length) {
    var nt = chart[notePtr];
    if (nt.judged) { notePtr++; continue; }
    if (songTime - nt.t > P.bad) { nt.judged = 2; nt.res = 'bad'; applyJudge(nt, 'bad'); notePtr++; continue; }
    break;
  }
}
function spawnPopup(nt, res) {
  var laneY = CH * 0.52;
  popups.push({ y: laneY - 58, txt: res === 'good' ? '良' : (res === 'ok' ? '可' : '不可'), col: res === 'good' ? '#ffc93c' : (res === 'ok' ? '#ffffff' : '#9aa0c3'), t0: performance.now(), big: nt.big });
  if (popups.length > 8) popups.shift();
}
var stageWrap = $('stageWrap');
stageWrap.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  var r = stageWrap.getBoundingClientRect();
  var x = (e.clientX - r.left) / r.width;
  hit(x < 0.5 ? 'don' : 'katsu');
});
document.addEventListener('keydown', function (e) {
  if (e.repeat) return;
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  var k = (e.key || '').toLowerCase();
  if (k === 'f' || k === 'j') hit('don');
  else if (k === 'd' || k === 'k') hit('katsu');
});
$('startBtn').addEventListener('click', function () { startSong(); });

  if (mode === 'online') { opp.fin = null; oppLeft = true; }
});
$('muteBtn').addEventListener('click', function () { ensureAudio(); setMuted(!muted); });
setMuted(muted);

/* ---------------- HUD ---------------- */
var lastHud = {};
function updateHUD(force) {
  var sc = String(score), cb = combo >= 2 ? combo + ' コンボ' : '', gp = Math.round(gauge) + '%';
  if (force || lastHud.sc !== sc) { $('hudScore').textContent = sc.replace(/\B(?=(\d{3})+(?!\d))/g, ','); lastHud.sc = sc; }
  if (force || lastHud.cb !== cb) {

  }

    $('vsMeGauge').style.width = gauge + '%';

}

/* ---------------- 描画（Canvas） ---------------- */
function initParticles(theme) {
  var arr = [];
  for (var i = 0; i < 34; i++) arr.push({ x: Math.random(), y: Math.random(), s: 0.4 + Math.random() * 0.9, ph: Math.random() * 6.28, sp: 0.02 + Math.random() * 0.05 });
  return arr;
}
var lastFrame = performance.now();
function draw() {
  requestAnimationFrame(draw);
  var now = performance.now();
  var dt = Math.min(0.05, (now - lastFrame) / 1000); lastFrame = now;
  if (!CW) fitCanvas();
  if (playing && AC) {
    songTime = AC.currentTime - startCtx;
    sweepMiss();
    $('progFill').style.width = clamp(songTime / curData.duration * 100, 0, 100) + '%';
    if (songTime > curData.duration + 0.9) { finishSong(); }
  }
  drumPulse.don = Math.max(0, drumPulse.don - dt * 5);
  drumPulse.katsu = Math.max(0, drumPulse.katsu - dt * 5);
  drawScene(now / 1000, dt);
}
function drawScene(t, dt) {
  var theme = curSong ? curSong.theme : 'wafu';
  var g = ctx.createLinearGradient(0, 0, 0, CH);
  if (theme === 'chip') { g.addColorStop(0, '#0b1030'); g.addColorStop(1, '#131a4d'); }
  else if (theme === 'rock') { g.addColorStop(0, '#170d12'); g.addColorStop(1, '#2b0f16'); }
  else { g.addColorStop(0, '#1c0b18'); g.addColorStop(1, '#33101c'); }
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  drawBackdrop(theme, t, dt);
  var laneY = CH * 0.52, laneH = Math.min(86, CH * 0.34);
  /* レーン */
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  roundRect(6, laneY - laneH / 2, CW - 12, laneH, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.16)'; ctx.lineWidth = 1.5;
  roundRect(6, laneY - laneH / 2, CW - 12, laneH, 14); ctx.stroke();
  var judgeX = CW * 0.22;
  /* 流れる音符 */
  if (playing || chart.length) {
    for (var i = 0; i < chart.length; i++) {
      var nt = chart[i];
      if (nt.judged) continue;
      var remain = nt.t - songTime;
      if (remain < -0.25) continue;
      if (remain > APPROACH) break;
      var x = judgeX + (remain / APPROACH) * (CW - judgeX + 40);
      drawNote(x, laneY, nt);
    }
  }
  drawDrum(judgeX, laneY);
  /* 入力ヒント */
  ctx.font = '700 13px sans-serif'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,138,122,.75)'; ctx.fillText('◀ ドン（面）', 12, CH - 10);
  ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(138,182,255,.8)'; ctx.fillText('カツ（縁） ▶', CW - 12, CH - 10);
  /* 判定ポップ */
  popups = popups.filter(function (p) { return now2() - p.t0 < 620; });
  popups.forEach(function (p) {
    var k = (now2() - p.t0) / 620;
    ctx.save();
    ctx.globalAlpha = 1 - k;
    ctx.font = '900 ' + (p.big ? 34 : 27) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.55)';
    var y = p.y - k * 34;
    ctx.strokeText(p.txt, judgeX, y); ctx.fillStyle = p.col; ctx.fillText(p.txt, judgeX, y);
    ctx.restore();
  });
  /* カウントダウン */
  if (playing && songTime < 0) {
    var n = Math.ceil(-songTime);
    ctx.save();
    ctx.font = '900 74px sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 10; ctx.strokeStyle = 'rgba(0,0,0,.6)';
    ctx.strokeText(String(n), CW / 2, CH / 2 + 24);
    ctx.fillStyle = '#ffc93c'; ctx.fillText(String(n), CW / 2, CH / 2 + 24);
    ctx.restore();
  }
  if (!playing && !chart.length) {
    ctx.save();
    ctx.font = '900 21px sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,247,234,.85)';
    ctx.fillText('曲を選んで演奏スタート！', CW / 2, laneY - 6);
    ctx.font = '600 13.5px sans-serif'; ctx.fillStyle = 'rgba(255,247,234,.55)';
    ctx.fillText('音符が太鼓に重なる瞬間に叩こう', CW / 2, laneY + 20);
    ctx.restore();
  }
}
function now2() { return performance.now(); }
function drawBackdrop(theme, t, dt) {
  if (!particles.length) particles = initParticles(theme);
  var i, p;
  if (theme === 'wafu') {
    /* 提灯 */
    for (i = 0; i < 5; i++) {
      var lx = CW * (0.12 + i * 0.19), ly = 26 + Math.sin(t * 0.9 + i * 1.7) * 4;
      ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, ly - 14); ctx.stroke();
      ctx.fillStyle = i % 2 ? 'rgba(255,120,90,.85)' : 'rgba(255,190,90,.9)';
      ctx.beginPath(); ctx.ellipse(lx, ly, 13, 16, 0, 0, 6.29); ctx.fill();
      ctx.fillStyle = 'rgba(60,20,10,.8)'; ctx.fillRect(lx - 6, ly - 19, 12, 4); ctx.fillRect(lx - 6, ly + 15, 12, 4);
    }
    /* 桜の花びら */

    particles.forEach(function (q) {
      q.y += q.sp * dt * 2.2; q.x += Math.sin(t + q.ph) * 0.00022;
      if (q.y > 1.05) { q.y = -0.05; q.x = Math.random(); }
      ctx.beginPath(); ctx.ellipse(q.x * CW, q.y * CH, 4.5 * q.s, 3 * q.s, q.ph + t * 0.7, 0, 6.29); ctx.fill();
    });
  } else if (theme === 'chip') {

    var off = (t * 30) % 34;
    for (i = -1; i < CW / 34 + 1; i++) { ctx.beginPath(); ctx.moveTo(i * 34 + off, 0); ctx.lineTo(i * 34 + off - 20, CH); ctx.stroke(); }
    for (i = 0; i < CH / 34 + 1; i++) { ctx.beginPath(); ctx.moveTo(0, i * 34); ctx.lineTo(CW, i * 34); ctx.stroke(); }
    ctx.fillStyle = 'rgba(190,210,255,.8)';

    for (i = 0; i < 3; i++) {
      var bx = CW * (0.22 + i * 0.28), sway = Math.sin(t * 0.6 + i * 2.1) * 0.35;
      var grad = ctx.createLinearGradient(bx, 0, bx + sway * 120, CH);
      grad.addColorStop(0, 'rgba(255,120,80,.20)'); grad.addColorStop(1, 'rgba(255,120,80,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.moveTo(bx - 7, 0); ctx.lineTo(bx + 7, 0); ctx.lineTo(bx + sway * 120 + 44, CH); ctx.lineTo(bx + sway * 120 - 44, CH); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,170,80,.8)';
    particles.forEach(function (q) {
      q.y -= q.sp * dt * 1.4; q.x += Math.sin(t * 2 + q.ph) * 0.0003;
      if (q.y < -0.05) { q.y = 1.05; q.x = Math.random(); }
      ctx.beginPath(); ctx.arc(q.x * CW, q.y * CH, 2 * q.s, 0, 6.29); ctx.fill();

}
function drawNote(x, y, nt) {

  ctx.fillStyle = nt.type === 'don' ? '#e63946' : '#3a86ff';

  ctx.lineWidth = nt.big ? 4.5 : 3.5; ctx.strokeStyle = '#fff7ea'; ctx.stroke();

}

  ctx.fillStyle = drumPulse.don > 0.25 ? '#ffd9c2' : '#fdf3e3';
  ctx.fill();
  ctx.strokeStyle = 'rgba(120,60,30,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  /* 判定リング */
  ctx.beginPath(); ctx.arc(x, y, R + 6, 0, 6.29);
  ctx.strokeStyle = 'rgba(255,201,60,.65)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
fitCanvas();
renderSongList();
requestAnimationFrame(draw);

/* ---------------- オンライン対戦（PeerJS・フレンド招待制は friends.js が担う） ---------------- */
var PEER_PREFIX = 'playweb-tk-';
var PEER_OPTS = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }] } };
var peer = null, conn = null, isHost = false, roomCode = '', heartbeatTimer = null, connTimer = null;
var opp = { score: 0, combo: 0, gauge: 0, fin: null };
var oppLeft = false, recorded = false, progTimer = null;
function genRoomCode() { var C = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; var s = ''; for (var i = 0; i < 6; i++) s += C.charAt(Math.floor(Math.random() * C.length)); return s; }
function peerAvailable() { return typeof window.Peer !== 'undefined'; }
function sendNet(o) { if (conn && conn.open) { try { conn.send(o); } catch (e) {} } }
function setOnlineStatus(html) { var el = $('onlineStatus'); if (el) el.innerHTML = html; }
function startHeartbeat() { stopHeartbeat(); heartbeatTimer = setInterval(function () { sendNet({ t: 'ping' }); }, 8000); }
function stopHeartbeat() { if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; } }
function armConnTimer(msg) { clearTimeout(connTimer); connTimer = setTimeout(function () { if (!conn || !conn.open) setOnlineStatus('<span class="err">' + msg + '</span>'); }, 25000); }
function disarmConnTimer() { clearTimeout(connTimer); }
function gateOk() {
  if (window.PWFriends && PWFriends.gateState) {
    var g = PWFriends.gateState();
    if (g === 'guest' || g === 'sdk-down') { setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>'); return false; }
  }
  return true;
}
function setupConn(c) {
  conn = c;
  c.on('data', onNetData);
  c.on('open', function () { disarmConnTimer(); startHeartbeat(); });
  c.on('close', function () { if (conn === c) onNetDisconnected(); });
  c.on('error', function () { if (conn === c) onNetDisconnected(); });
}
function teardownOnline() {
  stopHeartbeat(); clearTimeout(connTimer);
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  try { if (conn) conn.close(); } catch (e) {}
  try { if (peer) peer.destroy(); } catch (e) {}
  conn = null; peer = null;
}
function resetVs() {
  opp = { score: 0, combo: 0, gauge: 0, fin: null };
  oppLeft = false; recorded = false;
  $('vsOppScore').textContent = '0'; $('vsOppCombo').textContent = ''; $('vsOppGauge').style.width = '0%';
  $('vsMeScore').textContent = '0'; $('vsMeCombo').textContent = ''; $('vsMeGauge').style.width = '0%';
}
function hostRoom() {
  if (!peerAvailable()) { setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  if (!gateOk()) return;
  teardownOnline(); isHost = true; roomCode = genRoomCode();
  window.PW_ROOM_CODE = roomCode;
  setOnlineStatus('部屋を作成中…');
  try { peer = new Peer(PEER_PREFIX + roomCode, PEER_OPTS); } catch (e) { setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', function () {
    $('roomCodeText').textContent = roomCode;
    $('onlineCodeWrap').classList.remove('hidden');
    $('leaveBtn').classList.remove('hidden');
    setOnlineStatus('フレンドの参加を待っています…');
  });
  peer.on('connection', function (c) { setupConn(c); armConnTimer('相手との接続を確立できませんでした。'); });
  peer.on('error', function (err) { if (err && err.type === 'unavailable-id') setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>'); });
  peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) {} });
}
function joinRoom() {
  if (!peerAvailable()) { setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  if (!gateOk()) return;
  var code = ($('joinCode').value || '').trim().toUpperCase();
  if (code.length !== 6) { setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; }
  teardownOnline(); isHost = false; roomCode = code;
  setOnlineStatus('接続中…');
  try { peer = new Peer(undefined, PEER_OPTS); } catch (e) { setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', function () {
    armConnTimer('接続を確立できませんでした。');
    var c = peer.connect(PEER_PREFIX + code, { reliable: true });
    setupConn(c);
    c.on('open', function () {
      $('leaveBtn').classList.remove('hidden');
      sendNet({ t: 'hello' });
      setOnlineStatus('接続しました。ホストの開始を待っています…');
    });
  });
  peer.on('error', function (err) { if (err && err.type === 'peer-unavailable') setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>'); });
}
function leaveOnline() {
  sendNet({ t: 'leave' });
  teardownOnline();
  window.PW_ROOM_CODE = '';
  $('onlineCodeWrap').classList.add('hidden');
  $('leaveBtn').classList.add('hidden');
  $('vsStartBtn').classList.add('hidden');
  setOnlineStatus('');
  if (playing) stopSong(true);
  resetStage();
}
function hostStartMatch() {
  resetVs();
  sendNet({ t: 'start', song: selSong, diff: selDiff });
  setOnlineStatus('対戦開始！');
  beginOnlineSong();
}
function beginOnlineSong() {
  startSong();
  if (progTimer) clearInterval(progTimer);
  progTimer = setInterval(sendProg, 600);
}
function sendProg() {
  if (mode !== 'online' || !conn) return;
  sendNet({ t: 'prog', score: score, combo: combo, gauge: Math.round(gauge), done: playing ? 0 : 1 });
}
function finishOnline(res, totalScore, isBest) {
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  var myFin = { score: totalScore, good: counts.good, ok: counts.ok, bad: counts.bad, maxCombo: maxCombo, gauge: Math.round(gauge) };
  sendNet({ t: 'fin', fin: myFin });
  if (opp.fin || oppLeft) showVsResult(res, myFin, isBest);
  else {
    var p = $('resultPanel');
    p.innerHTML = '<div class="rdetail" style="font-size:16px">あなたのスコア <b style="color:var(--txt)">' + totalScore.toLocaleString() + '</b><br>相手の終了を待っています…</div>';
    p.classList.remove('hidden');
    pendingVs = { res: res, myFin: myFin, isBest: isBest };
  }
}
var pendingVs = null;
function showVsResult(res, myFin, isBest) {
  pendingVs = null;
  var o = opp.fin;
  var verdict, result;
  if (oppLeft || !o) { verdict = '🏆 あなたの勝ち！（相手が退出）'; result = 'win'; }
  else if (myFin.score > o.score) { verdict = '🏆 あなたの勝ち！'; result = 'win'; }
  else if (myFin.score < o.score) { verdict = '相手の勝ち…'; result = 'lose'; }
  else if (maxCombo > o.maxCombo) { verdict = '🏆 あなたの勝ち！（コンボ差）'; result = 'win'; }
  else if (maxCombo < o.maxCombo) { verdict = '相手の勝ち…（コンボ差）'; result = 'lose'; }
  else { verdict = '引き分け'; result = 'draw'; }
  var vsInfo = verdict + '<br>あなた ' + myFin.score.toLocaleString() + ' 点 vs 相手 ' + (o ? o.score.toLocaleString() : '-') + ' 点';
  showResult(res, myFin.score, !!isBest, vsInfo);
  if (!recorded) {
    recorded = true;
    if (window.PWFriends && PWFriends.recordMatch) PWFriends.recordMatch(result);
  }
}
function requestRematch() {
  if (isHost) { hostStartMatch(); }
  else { sendNet({ t: 'rematch' }); setOnlineStatus('再戦をリクエストしました…'); }
}
function onNetData(m) {
  if (!m || m.t === 'ping') return;
  if (m.t === 'hello') {
    if (isHost) {
      $('vsStartBtn').classList.remove('hidden');
      setOnlineStatus('フレンドが参加しました！「対戦スタート」を押してください。');
    }
    return;
  }
  if (m.t === 'start') {
    selSong = songById(m.song).id; selDiff = DIFFS[m.diff] ? m.diff : 'normal';
    document.querySelectorAll('#diffSeg button').forEach(function (x) { x.classList.toggle('on', x.dataset.d === selDiff); });
    renderSongList();
    setOnlineStatus('対戦開始！');
    beginOnlineSong();
    return;
  }
  if (m.t === 'prog') {
    opp.score = m.score; opp.combo = m.combo; opp.gauge = m.gauge;
    $('vsOppScore').textContent = Number(m.score).toLocaleString();
    $('vsOppCombo').textContent = m.combo >= 2 ? m.combo + 'コンボ' : '';
    $('vsOppGauge').style.width = m.gauge + '%';
    return;
  }
  if (m.t === 'fin') {
    opp.fin = m.fin;
    if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
    return;
  }
  if (m.t === 'rematch') { if (isHost) hostStartMatch(); return; }
  if (m.t === 'leave') { onOppLeft(); return; }
}
function onOppLeft() {
  oppLeft = true;
  setOnlineStatus('<span class="err">相手が退出しました。</span>');
  if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
}
function onNetDisconnected() {
  setOnlineStatus('<span class="err">接続が切れました。</span>');
  if (playing || pendingVs) onOppLeft();
}
$('hostBtn').addEventListener('click', hostRoom);
$('joinBtn').addEventListener('click', joinRoom);
$('leaveBtn').addEventListener('click', leaveOnline);
$('vsStartBtn').addEventListener('click', function () { $('vsStartBtn').classList.add('hidden'); hostStartMatch(); });

/* テスト用フック */
window.__taiko = {
  SONGS: SONGS, DIFFS: DIFFS, buildSongData: buildSongData, buildChart: buildChart,
  judgeFor: judgeFor, scoreFor: scoreFor, gaugeDelta: gaugeDelta, makeResult: makeResult,
  mulberry32: mulberry32,
  state: function () { return { playing: playing, songTime: songTime, score: score, combo: combo, maxCombo: maxCombo, gauge: gauge, counts: counts, chartLen: chart.length }; },
  startSolo: function (songId, diff) { mode = 'solo'; selSong = songId; selDiff = diff; startSong(); },
  hit: hit,
  finishNow: function () { if (playing) { songTime = curData.duration + 1; finishSong(); } }
};
})();
</script>
