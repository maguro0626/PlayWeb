<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>はんしゃテスト | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0a16;--accent:#84cc16;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#f2f4ff;--sub:#9aa0c3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:12px}
.ttl{font-size:24px;font-weight:900;text-align:center;letter-spacing:.04em}
.ttl span{color:var(--accent)}
#modeSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
#modeSeg button.on{background:var(--accent);color:#111}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.hidden{display:none!important}
.netBtns{display:flex;gap:8px;margin-bottom:10px}
.btn{background:var(--accent);color:#111;border:none;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;flex:1}
.btn.sub{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line)}
.btn:active{transform:scale(.97)}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-size:16px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit}
#onlineStatus{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px;line-height:1.6;text-align:center}
#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}
#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.3em;color:var(--accent)}
.best{text-align:center;color:var(--sub);font-size:13px}
#tapPad{height:300px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;border:2px solid var(--line);background:rgba(255,255,255,.06);padding:16px;transition:background .12s}
#tapPad .big{font-size:30px;font-weight:900;line-height:1.3}
#tapPad .small{font-size:14px;color:inherit;opacity:.85;line-height:1.6}
#tapPad.wait{background:#b91c1c;color:#fff}
#tapPad.go{background:#16a34a;color:#fff}
#tapPad.idle{background:rgba(132,204,22,.16)}
.info{text-align:center;font-size:15px;line-height:1.7;min-height:52px}
.list{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:700}
.scoreRow{display:flex;gap:8px}
.scoreBox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.scoreBox b{font-size:22px;display:block}
.help{font-size:12px;color:var(--sub);line-height:1.8;text-align:center}
/* 1画面フィット（共通ヘッダー46pxを除く高さに収め、タップパッドが伸縮） */
.wrap{height:calc(100dvh - 46px);overflow:hidden;padding:10px 14px 12px;gap:9px}
#gameArea{flex:1;min-height:0;display:flex;flex-direction:column}
#tapPad{flex:1;min-height:0;height:auto}
#onlinePane{flex:0 1 auto;min-height:0;overflow-y:auto}
</style>
</head>
<body>
<div class="wrap">
<div class="ttl">⚡ はんしゃ<span>テスト</span></div>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="soloPane"><div class="card"><p class="help">緑になったらすぐタップ！ 5回の平均で勝負。赤の間に押すとフライングでその回はやり直しです。</p></div></div>
<div id="onlinePane" class="hidden"><div class="card">
<div class="netBtns"><button id="hostBtn" class="btn">部屋を作る</button></div>
<div class="joinRow"><input id="joinCode" maxlength="6" placeholder="コード6文字"><button id="joinBtn" class="btn">参加する</button></div>
<div id="onlineCodeWrap" class="hidden">ルームコード<br><span id="roomCodeText">------</span></div>
<div id="onlineStatus"></div>
<button id="leaveBtn" class="btn sub hidden" style="width:100%;margin-top:8px">退出する</button>
</div></div>
<div id="gameArea">
<div id="tapPad" class="idle"><div class="big">タップでスタート</div><div class="small">押すと「待て…」が始まります</div></div>
<div class="info" id="reactInfo" style="margin-top:12px">5回計って平均を出します</div>
<div class="list" id="reactList"></div>
<div class="scoreRow hidden" id="vsRow" style="margin-top:10px"><div class="scoreBox">あなた<b id="myWins">0勝</b><span id="myAvg">平均 -</span></div><div class="scoreBox">相手<b id="oppWins">0勝</b><span id="oppAvg">平均 -</span></div></div>
<div class="best" id="bestText" style="margin-top:10px"></div>
<button id="rematchBtn" class="btn hidden" style="width:100%;margin-top:10px">もう一度</button>
</div>
<p class="help">オンラインは5ラウンド制。速い方がラウンド勝利、フライングは負けです。</p>
</div>
<script>
let AC=null;
function tone(f,d,type,v,delay){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+(d||0.12));o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(d||0.12)+0.02);}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem('mini_reaction_v1')||'{}');}catch(e){return{};}}
function storeSave(o){try{localStorage.setItem('mini_reaction_v1',JSON.stringify(o));}catch(e){}}
function showBest(){const s=loadSave();document.getElementById('bestText').textContent='ベスト: '+(s.bestAvg?('平均 '+s.bestAvg+'ms'):'平均 -')+' / '+(s.bestSingle?('単発 '+s.bestSingle+'ms'):'単発 -');}
let mode='solo';
document.querySelectorAll('#modeSeg button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.m;document.getElementById('soloPane').classList.toggle('hidden',mode!=='solo');document.getElementById('onlinePane').classList.toggle('hidden',mode!=='online');resetSolo();resetOnlineGame();}));
showBest();
const PEER_PREFIX='playweb-rc-';
const PEER_OPTS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}]}};
let peer=null,conn=null,isHost=false,roomCode='',heartbeatTimer=null,connTimer=null;
function genRoomCode(){const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=C.charAt(Math.floor(Math.random()*C.length));return s;}
function peerAvailable(){return typeof window.Peer!=='undefined';}
function sendNet(o){if(conn&&conn.open){try{conn.send(o);}catch(e){}}}
function setOnlineStatus(html){const el=document.getElementById('onlineStatus');if(el)el.innerHTML=html;}
function startHeartbeat(){stopHeartbeat();heartbeatTimer=setInterval(()=>sendNet({t:'ping'}),8000);}
function stopHeartbeat(){if(heartbeatTimer){clearInterval(heartbeatTimer);heartbeatTimer=null;}}
function armConnTimer(msg){clearTimeout(connTimer);connTimer=setTimeout(()=>{if(!conn||!conn.open)setOnlineStatus('<span class="err">'+msg+'</span>');},25000);}
function disarmConnTimer(){clearTimeout(connTimer);}
function gateOk(){if(window.PWFriends&&PWFriends.gateState){const g=PWFriends.gateState();if(g==='guest'||g==='sdk-down'){setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>');return false;}}return true;}
function setupConn(c){conn=c;c.on('data',onNetData);c.on('open',()=>{disarmConnTimer();startHeartbeat();});c.on('close',()=>{if(conn===c)onNetDisconnected();});c.on('error',()=>{if(conn===c)onNetDisconnected();});}
function teardownOnline(){stopHeartbeat();clearTimeout(connTimer);try{if(conn)conn.close();}catch(e){}try{if(peer)peer.destroy();}catch(e){}conn=null;peer=null;}
function hostRoom(){if(!peerAvailable()){setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>');return;}if(!gateOk())return;teardownOnline();isHost=true;roomCode=genRoomCode();window.PW_ROOM_CODE=roomCode;resetOnlineGame();setOnlineStatus('部屋を作成中…');try{peer=new Peer(PEER_PREFIX+roomCode,PEER_OPTS);}catch(e){setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>');return;}peer.on('open',()=>{document.getElementById('roomCodeText').textContent=roomCode;document.getElementById('onlineCodeWrap').classList.remove('hidden');document.getElementById('leaveBtn').classList.remove('hidden');setOnlineStatus('フレンドの参加を待っています…');});peer.on('connection',c=>{setupConn(c);armConnTimer('相手との接続を確立できませんでした。');});peer.on('error',err=>{if(err&&err.type==='unavailable-id')setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>');});peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});}
function joinRoom(){if(!peerAvailable()){setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>');return;}if(!gateOk())return;const code=(document.getElementById('joinCode').value||'').trim().toUpperCase();if(code.length!==6){setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>');return;}teardownOnline();isHost=false;roomCode=code;resetOnlineGame();setOnlineStatus('接続中…');try{peer=new Peer(undefined,PEER_OPTS);}catch(e){setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>');return;}peer.on('open',()=>{armConnTimer('接続を確立できませんでした。');const c=peer.connect(PEER_PREFIX+code,{reliable:true});setupConn(c);c.on('open',()=>{document.getElementById('leaveBtn').classList.remove('hidden');sendNet({t:'hello'});setOnlineStatus('接続しました！対戦開始を待っています…');});});peer.on('error',err=>{if(err&&err.type==='peer-unavailable')setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>');});}
function leaveOnline(){teardownOnline();window.PW_ROOM_CODE='';document.getElementById('onlineCodeWrap').classList.add('hidden');document.getElementById('leaveBtn').classList.add('hidden');setOnlineStatus('');resetOnlineGame();}
document.getElementById('hostBtn').addEventListener('click',hostRoom);
document.getElementById('joinBtn').addEventListener('click',joinRoom);
document.getElementById('leaveBtn').addEventListener('click',leaveOnline);
// ---- solo ----
const pad=document.getElementById('tapPad'),infoEl=document.getElementById('reactInfo'),listEl=document.getElementById('reactList');
let soloState='idle',soloTimes=[],soloTimer=null,goAt=0;
function setPad(cls,big,small){pad.className=cls;pad.innerHTML='<div class="big">'+big+'</div><div class="small">'+small+'</div>';}
function resetSolo(){clearTimeout(soloTimer);soloState='idle';soloTimes=[];listEl.innerHTML='';if(mode==='solo'){setPad('idle','タップでスタート','押すと「待て…」が始まります');infoEl.textContent='5回計って平均を出します';}}
function renderList(){listEl.innerHTML=soloTimes.map((v,i)=>'<span class="chip">'+(i+1)+'回目: '+v+'ms</span>').join('');}
function soloStartRound(){soloState='wait';setPad('wait','待て…','緑になるまで待って！');infoEl.textContent=(soloTimes.length+1)+'回目 / 5回';const delay=1200+Math.random()*3300;soloTimer=setTimeout(()=>{soloState='go';goAt=performance.now();setPad('go','タップ！','今だ！');tone(880,0.15,'sine',0.15);},delay);}
function soloTap(){if(soloState==='flying'){soloStartRound();return;}if(soloState==='idle'||soloState==='done'){soloTimes=[];renderList();soloStartRound();return;}if(soloState==='wait'){clearTimeout(soloTimer);soloState='flying';setPad('idle','フライング！','その回は無効です。タップでやり直し');infoEl.textContent='フライングは無効。タップでもう一度この回に挑戦';tone(160,0.2,'sawtooth',0.12);return;}if(soloState==='go'){const ms=Math.max(1,Math.round(performance.now()-goAt));soloTimes.push(ms);renderList();tone(660,0.1,'sine',0.12);if(soloTimes.length>=5){soloState='done';const avg=Math.round(soloTimes.reduce((a,b)=>a+b,0)/soloTimes.length);const single=Math.min.apply(null,soloTimes);setPad('idle','完了！ 平均 '+avg+'ms','タップで再挑戦');infoEl.textContent='平均 '+avg+'ms / ベスト単発 '+single+'ms';const s=loadSave();if(!s.bestAvg||avg<s.bestAvg)s.bestAvg=avg;if(!s.bestSingle||single<s.bestSingle)s.bestSingle=single;storeSave(s);showBest();}else{soloState='between';setPad('idle',ms+'ms','次へ…');infoEl.textContent='記録 '+ms+'ms';soloTimer=setTimeout(soloStartRound,800);}return;}if(soloState==='between')return;if(soloState==='idle'){soloStartRound();}}
// ---- online ----
let oRound=0,oState='idle',oTimer=null,oGoAt=0,myTap=null,oppTap=null,myWinsN=0,oppWinsN=0,myTimes=[],oppTimes=[],recorded=false;
function resetOnlineGame(){clearTimeout(oTimer);oRound=0;oState='idle';myTap=null;oppTap=null;myWinsN=0;oppWinsN=0;myTimes=[];oppTimes=[];recorded=false;document.getElementById('rematchBtn').classList.add('hidden');if(mode==='online'){document.getElementById('vsRow').classList.remove('hidden');updateVs();setPad('idle','オンライン対戦','部屋を作るか参加してください');infoEl.textContent='接続すると自動で始まります';listEl.innerHTML='';}else{document.getElementById('vsRow').classList.add('hidden');}}
function avgOf(a){const v=a.filter(x=>x>=0);return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null;}
function updateVs(){document.getElementById('myWins').textContent=myWinsN+'勝';document.getElementById('oppWins').textContent=oppWinsN+'勝';const a=avgOf(myTimes),b=avgOf(oppTimes);document.getElementById('myAvg').textContent='平均 '+(a===null?'-':a+'ms');document.getElementById('oppAvg').textContent='平均 '+(b===null?'-':b+'ms');}
function hostStartMatch(){myWinsN=0;oppWinsN=0;myTimes=[];oppTimes=[];recorded=false;oRound=1;updateVs();hostSendRound();}
function hostSendRound(){const delay=Math.round(1200+Math.random()*3300);sendNet({t:'round',n:oRound,delay:delay});startOnlineRound(oRound,delay);}
function startOnlineRound(n,delay){oRound=n;myTap=null;oppTap=null;oState='wait';document.getElementById('rematchBtn').classList.add('hidden');setPad('wait','待て… ラウンド'+n,'緑になったらタップ！');infoEl.textContent='ラウンド '+n+' / 5';clearTimeout(oTimer);oTimer=setTimeout(()=>{oState='go';oGoAt=performance.now();setPad('go','タップ！','今だ！');tone(880,0.15,'sine',0.15);},delay);}
function onlineTap(){if(oState==='wait'){clearTimeout(oTimer);oState='tapped';myTap=-1;sendNet({t:'tap',n:oRound,ms:-1});setPad('idle','フライング！','相手の結果を待っています');tone(160,0.2,'sawtooth',0.12);checkRoundEnd();return;}if(oState==='go'){const ms=Math.max(1,Math.round(performance.now()-oGoAt));oState='tapped';myTap=ms;sendNet({t:'tap',n:oRound,ms:ms});setPad('idle',ms+'ms','相手の結果を待っています');tone(660,0.1,'sine',0.12);checkRoundEnd();}}
function checkRoundEnd(){if(myTap===null||oppTap===null||oState==='judged')return;if(oState!=='tapped'&&oState!=='go'&&oState!=='wait')return;oState='judged';myTimes.push(myTap);oppTimes.push(oppTap);let msg='';if(myTap===-1&&oppTap===-1){msg='両者フライングで引き分け';}else if(myTap===-1){oppWinsN++;msg='フライングで相手の勝ち';}else if(oppTap===-1){myWinsN++;msg='相手フライングであなたの勝ち！';}else if(myTap<oppTap){myWinsN++;msg='あなたの勝ち！ '+myTap+'ms vs '+oppTap+'ms';}else if(oppTap<myTap){oppWinsN++;msg='相手の勝ち '+myTap+'ms vs '+oppTap+'ms';}else{msg='同タイムで引き分け';}updateVs();infoEl.textContent='ラウンド'+oRound+': '+msg;setPad('idle','ラウンド'+oRound+' 結果',msg);tone(myWinsN>=oppWinsN?720:300,0.12,'sine',0.1);if(oRound>=5){setTimeout(finishOnline,900);}else if(isHost){oTimer=setTimeout(()=>{oRound++;hostSendRound();},1600);}}
function finishOnline(){const a=avgOf(myTimes),b=avgOf(oppTimes);let res='';if(myWinsN>oppWinsN)res='win';else if(myWinsN<oppWinsN)res='lose';else{if(a!==null&&b!==null){if(a<b)res='win';else if(b<a)res='lose';else res='draw';}else if(a!==null&&b===null)res='win';else if(a===null&&b!==null)res='lose';else res='draw';}const label=res==='win'?'🏆 あなたの勝ち！':res==='lose'?'相手の勝ち':'引き分け';setPad('idle',label,'勝ち数 '+myWinsN+' - '+oppWinsN);infoEl.textContent=label+' 平均 あなた '+(a===null?'-':a+'ms')+' / 相手 '+(b===null?'-':b+'ms');document.getElementById('rematchBtn').classList.remove('hidden');if(!recorded){recorded=true;if(window.PWFriends&&PWFriends.recordMatch)PWFriends.recordMatch(res);}}
function onNetData(m){if(!m||m.t==='ping')return;if(m.t==='hello'){if(isHost)hostStartMatch();return;}if(m.t==='round'){if(!isHost)startOnlineRound(m.n,m.delay);return;}if(m.t==='tap'){if(m.n===oRound){oppTap=m.ms;checkRoundEnd();}return;}if(m.t==='rematch'){if(isHost)hostStartMatch();return;}}
function onNetDisconnected(){setOnlineStatus('<span class="err">接続が切れました。</span>');clearTimeout(oTimer);oState='idle';setPad('idle','接続が切れました','もう一度接続してください');}
document.getElementById('rematchBtn').addEventListener('click',()=>{if(isHost){hostStartMatch();}else{sendNet({t:'rematch'});infoEl.textContent='再戦をリクエストしました…';document.getElementById('rematchBtn').classList.add('hidden');}});
pad.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='solo')soloTap();else onlineTap();});
resetOnlineGame();
</script>
<script>window.PW_GAME='reaction';window.PW_JOIN_CFG={openers:[{click:'button[data-m="online"]'}],input:'#joinCode',joinBtn:'#joinBtn',hostBtn:'#hostBtn'};</script>
<script src="friends.js"></script>
</body>
</html>
