<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ブロックブラスト - PlayWeb</title>
<style>
  :root{ --bg:#0d1021; --panel:rgba(255,255,255,.06); --line:rgba(255,255,255,.1); --txt:#f4f6ff; --sub:#9aa3c7; --acc:#fbbf24; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(900px 600px at 15% -10%, #2b1a5e 0%, transparent 55%), radial-gradient(900px 700px at 100% 110%, #0e3a5c 0%, transparent 55%), var(--bg);
    color:var(--txt); font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; min-height:100%; display:flex; flex-direction:column; align-items:center; user-select:none; -webkit-user-select:none; overflow-x:hidden;}
  header{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;padding:14px 16px 2px}
  .logo{font-weight:900;letter-spacing:.1em;font-size:20px;background:linear-gradient(90deg,#fbbf24,#f472b6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit}
  .hbtn:active{transform:scale(.96)}
  #scoreRow{width:100%;max-width:560px;display:flex;gap:10px;justify-content:center;align-items:stretch;padding:8px 16px 2px}
  .scoreBox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:7px 10px;text-align:center;backdrop-filter:blur(6px)}
  .scoreBox .lb{font-size:10px;letter-spacing:.25em;color:var(--sub);font-weight:800}
  .scoreBox .vl{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
  #comboBox{flex:0 0 96px;background:linear-gradient(160deg,rgba(251,146,60,.22),rgba(219,39,119,.16));border:1px solid rgba(251,146,60,.4);border-radius:14px;padding:7px 6px;text-align:center;opacity:.35;transition:opacity .2s}
  #comboBox.hot{opacity:1}
  #comboBox .lb{font-size:10px;letter-spacing:.2em;color:#fdba74;font-weight:800}
  #comboBox .vl{font-size:26px;font-weight:900;color:#fbbf24;line-height:1.15}
  main{width:100%;display:flex;flex-direction:column;align-items:center;padding:6px 10px 4px}
  #stage{position:relative;width:min(94vw,520px)}
  canvas{display:block;width:100%;touch-action:none;cursor:grab;border-radius:18px}
  canvas.dragging{cursor:grabbing}
  .overlay{position:absolute;inset:0;border-radius:18px;background:rgba(8,6,20,.78);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:5}
  .overlay.hidden{display:none}
  .overlay h2{font-size:32px;font-weight:900;letter-spacing:.05em}
  .overlay .big{font-size:52px;font-weight:900;background:linear-gradient(90deg,#fbbf24,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
  .overlay p{color:var(--sub);font-size:13.5px;line-height:1.8}
  .bigbtn{background:linear-gradient(90deg,#f59e0b,#db2777);border:none;color:#fff;font-weight:800;font-size:16px;padding:14px 34px;border-radius:999px;cursor:pointer;box-shadow:0 12px 30px rgba(219,39,119,.4);letter-spacing:.05em;font-family:inherit}
  .bigbtn:active{transform:scale(.96)}
  .newbest{color:#fbbf24;font-weight:900;font-size:15px;animation:blink .6s ease-in-out infinite alternate}
  @keyframes blink{from{opacity:1}to{opacity:.45}}
  footer{max-width:560px;padding:2px 18px 20px;color:var(--sub);font-size:12px;line-height:1.8;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">🧩 ブロックブラスト</div>
  <div style="display:flex;gap:8px">
    <button class="hbtn" id="soundBtn">🔊 サウンド</button>
    <button class="hbtn" id="restartBtn">↻ 最初から</button>
    <a class="hbtn" href="index.html">← もどる</a>
  </div>
</header>

<div id="scoreRow">
  <div class="scoreBox"><div class="lb">SCORE</div><div class="vl" id="scoreVal">0</div></div>
  <div id="comboBox"><div class="lb">COMBO</div><div class="vl" id="comboVal">×1</div></div>
  <div class="scoreBox"><div class="lb">BEST</div><div class="vl" id="bestVal">0</div></div>
</div>

<main>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="overlay hidden" id="overOv">
      <h2>ゲームオーバー</h2>
      <div class="big" id="finalScore">0</div>
      <div class="newbest hidden" id="newBest">🎉 ベストスコア更新！</div>
      <p id="overStats"></p>
      <button class="bigbtn" id="againBtn">もう一度あそぶ</button>
    </div>
  </div>
</main>

<footer>
  遊び方：下のピースをドラッグして 8×8 の盤面に置こう。タテ・ヨコ一列そろえると消えるよ。<br>
  連続で消すとコンボ倍率アップ！ 同時に何列も消すとボーナス大量点。
</footer>

<script>
'use strict';
/* ================================================================
   ブロックブラスト — 8x8ブロックパズル
   ドラッグ＆ドロップ / ライン消去 / コンボ / 派手エフェクト
================================================================ */
const N = 8;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

/* ---------- カラー ---------- */
const COLORS = [
  null,
  { base:'#ef4444', light:'#fca5a5', dark:'#991b1b' }, // 1 赤
  { base:'#f97316', light:'#fdba74', dark:'#9a3412' }, // 2 橙
  { base:'#facc15', light:'#fef08a', dark:'#a16207' }, // 3 黄
  { base:'#22c55e', light:'#86efac', dark:'#166534' }, // 4 緑
  { base:'#06b6d4', light:'#67e8f9', dark:'#155e75' }, // 5 水
  { base:'#3b82f6', light:'#93c5fd', dark:'#1e40af' }, // 6 青
  { base:'#a855f7', light:'#d8b4fe', dark:'#6b21a8' }, // 7 紫
  { base:'#ec4899', light:'#f9a8d4', dark:'#9d174d' }, // 8 桃
];

/* ---------- ピース定義（cellsは [x,y]、w/hは外形） ---------- */
function shape(cells){
  const w = Math.max(...cells.map(c=>c[0]))+1, h = Math.max(...cells.map(c=>c[1]))+1;
  return { cells, w, h, n: cells.length };
}
const SHAPES = [
  { s: shape([[0,0]]), w: 4 },                                                      // 1マス
  { s: shape([[0,0],[1,0]]), w: 8 }, { s: shape([[0,0],[0,1]]), w: 8 },              // 2連
  { s: shape([[0,0],[1,0],[2,0]]), w: 10 }, { s: shape([[0,0],[0,1],[0,2]]), w: 10 },// 3連
  { s: shape([[0,0],[1,0],[2,0],[3,0]]), w: 8 }, { s: shape([[0,0],[0,1],[0,2],[0,3]]), w: 8 }, // 4連
  { s: shape([[0,0],[1,0],[2,0],[3,0],[4,0]]), w: 5 }, { s: shape([[0,0],[0,1],[0,2],[0,3],[0,4]]), w: 5 }, // 5連
  { s: shape([[0,0],[1,0],[0,1],[1,1]]), w: 12 },                                    // 2x2
  { s: shape([[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]]), w: 5 },       // 3x3
  { s: shape([[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]]), w: 7 },                         // 3x2
  { s: shape([[0,0],[1,0],[0,1],[1,1],[0,2],[1,2]]), w: 7 },                         // 2x3
  { s: shape([[0,0],[0,1],[1,1]]), w: 9 }, { s: shape([[0,0],[1,0],[1,1]]), w: 9 },   // 小L
  { s: shape([[0,0],[1,0],[0,1]]), w: 9 }, { s: shape([[0,1],[1,0],[1,1]]), w: 9 },   // 小L
  { s: shape([[0,0],[0,1],[0,2],[1,2],[2,2]]), w: 7 },                               // 大L
  { s: shape([[0,0],[1,0],[2,0],[2,1],[2,2]]), w: 7 },
  { s: shape([[0,2],[1,2],[2,2],[2,1],[2,0]]), w: 4 },
  { s: shape([[0,0],[1,0],[2,0],[0,1],[0,2]]), w: 7 },
  { s: shape([[0,0],[1,0],[1,1]]), w: 6 },
  { s: shape([[0,0],[1,0],[2,0],[1,1]]), w: 7 },                                     // T
  { s: shape([[1,0],[0,1],[1,1],[2,1]]), w: 7 },
  { s: shape([[0,0],[0,1],[1,1],[0,2]]), w: 5 }, { s: shape([[1,0],[0,1],[1,1],[1,2]]), w: 5 },
  { s: shape([[1,0],[2,0],[0,1],[1,1]]), w: 5 },                                     // S
  { s: shape([[0,0],[1,0],[1,1],[2,1]]), w: 5 },                                     // Z
  { s: shape([[0,0],[0,1],[1,1],[1,2]]), w: 4 }, { s: shape([[1,0],[0,1],[1,1],[0,2]]), w: 4 },
  { s: shape([[0,0],[2,0],[1,1],[0,2],[2,2]]), w: 2 },                               // X風（四隅+中央）
  { s: shape([[0,0],[1,0],[2,0],[0,1],[2,1],[0,2],[1,2],[2,2]]), w: 2 },             // 枠
];
const SHAPE_TOTAL_W = SHAPES.reduce((a,b)=>a+b.w,0);
function pickShape(){
  let r = Math.random()*SHAPE_TOTAL_W;
  for(const e of SHAPES){ r -= e.w; if(r <= 0) return e.s; }
  return SHAPES[0].s;
}

/* ---------- 状態 ---------- */
let board, tray, score, best, combo, maxCombo, linesTotal, piecesPlaced, gameOver;
let particles = [], floaters = [], cellAnims = {}, banner = null, shake = 0, flashLines = null;
let drag = null;             // {piece, slot, px, py, grabDX, grabDY, over}
let inputLockUntil = 0;
let dispScore = 0;           // スコア表示のカウントアップ用
best = +(localStorage.getItem('blockblast_best') || 0);

function emptyBoard(){ return Array.from({length:N}, ()=>Array(N).fill(0)); }
function newPiece(){ return { shape: pickShape(), color: 1 + Math.floor(Math.random()*8), used:false, bornAt: performance.now() }; }

function canPlaceAt(bd, sh, bx, by){
  for(const [cx,cy] of sh.cells){
    const x = bx+cx, y = by+cy;
    if(x < 0 || y < 0 || x >= N || y >= N || bd[y][x] !== 0) return false;
  }
  return true;
}
function anyPlacement(bd, sh){
  for(let y=0; y<N; y++) for(let x=0; x<N; x++) if(canPlaceAt(bd, sh, x, y)) return true;
  return false;
}
function genTray(){
  for(let attempt=0; attempt<30; attempt++){
    const t = [newPiece(), newPiece(), newPiece()];
    if(t.some(p=>anyPlacement(board, p.shape))) return t;
  }
  // どうしてもダメなら1マスを含める
  const t = [newPiece(), newPiece(), newPiece()];
  t[0] = { shape: SHAPES[0].s, color: 4, used:false, bornAt: performance.now() };
  return t;
}
function findClears(bd){
  const rows = [], cols = [];
  for(let y=0; y<N; y++) if(bd[y].every(v=>v!==0)) rows.push(y);
  for(let x=0; x<N; x++){ let full = true; for(let y=0; y<N; y++) if(bd[y][x]===0){ full=false; break; } if(full) cols.push(x); }
  return { rows, cols };
}

/* ---------- サウンド（WebAudio合成） ---------- */
let AC = null, soundOn = true;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function tone(freq, dur, type, vol, when=0, slideTo=null){
  if(!soundOn) return;
  try{
    const a = ac(), t = a.currentTime + when;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
function noiseBurst(dur=0.12, vol=0.05){
  if(!soundOn) return;
  try{
    const a = ac(), len = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * (1 - i/len);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }catch(e){}
}
const sfx = {
  pickup(){ tone(520, 0.07, 'sine', 0.10, 0, 760); },
  place(){ tone(210, 0.1, 'sine', 0.22, 0, 130); tone(392, 0.06, 'triangle', 0.08); noiseBurst(0.05, 0.03); },
  invalid(){ tone(140, 0.12, 'square', 0.05, 0, 90); },
  clear(lines, comboLv){
    const base = 523 * Math.pow(1.059, Math.min(comboLv-1, 6));
    const notes = [1, 1.25, 1.5, 2, 2.5];
    for(let i=0; i<Math.min(3+lines, 5); i++) tone(base*notes[i], 0.16, 'triangle', 0.14, i*0.055);
    noiseBurst(0.18, 0.06);
  },
  refill(){ tone(440, 0.08, 'sine', 0.08, 0, 660); tone(660, 0.08, 'sine', 0.07, 0.07, 880); },
  over(){ [392, 330, 262, 196].forEach((f,i)=>tone(f, 0.24, 'triangle', 0.13, i*0.15)); },
  click(){ tone(700, 0.05, 'sine', 0.06); },
};
/* ================================================================
   レイアウト＆描画
================================================================ */
let VW = 0, VH = 0, DPR = 1;
let boardX = 0, boardY = 0, cell = 0, gap = 0, boardPx = 0;
let trayY = 0, trayH = 0;
function resize(){
  const stage = document.getElementById('stage');
  const w = stage.clientWidth;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = w; VH = Math.round(w * 1.30);
  cv.width = VW * DPR; cv.height = VH * DPR;
  cv.style.height = VH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const pad = Math.round(w * 0.035);
  boardPx = w - pad * 2;
  cell = boardPx / N;
  gap = Math.max(2, cell * 0.07);
  boardX = pad; boardY = pad;
  trayY = boardY + boardPx + Math.round(w * 0.045);
  trayH = VH - trayY - Math.round(w * 0.02);
}
window.addEventListener('resize', resize);

function rr(x, y, w, h, r){
  if(w <= 0 || h <= 0) return;
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
function drawBlock(x, y, size, colorIdx, alpha=1, scale=1){
  const c = COLORS[colorIdx]; if(!c) return;
  const inset = gap * 0.5;
  const s = size - inset * 2;
  const cx = x + size/2, cy = y + size/2;
  const w = s * scale, h = s * scale;
  const bx = cx - w/2, by = cy - h/2;
  ctx.save();
  ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(bx, by, bx, by + h);
  g.addColorStop(0, c.light); g.addColorStop(0.45, c.base); g.addColorStop(1, c.dark);
  ctx.fillStyle = g;
  rr(bx, by, w, h, w * 0.18); ctx.fill();
  // 上部のツヤ
  const g2 = ctx.createLinearGradient(bx, by, bx, by + h * 0.5);
  g2.addColorStop(0, 'rgba(255,255,255,0.5)'); g2.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g2;
  rr(bx + w*0.08, by + h*0.06, w*0.84, h*0.42, w*0.13); ctx.fill();
  // 下部の影
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  rr(bx + w*0.08, by + h*0.78, w*0.84, h*0.16, w*0.08); ctx.fill();
  ctx.restore();
}
function cellXY(bx, by){ return { x: boardX + bx * cell, y: boardY + by * cell }; }

/* ドラッグ中ピースの盤面ターゲット */
function dragTarget(){
  if(!drag) return null;
  const gx = Math.round((drag.px - drag.grabDX * cell - boardX) / cell);
  const gy = Math.round((drag.py - drag.grabDY * cell - boardY) / cell);
  return { gx, gy, ok: canPlaceAt(board, drag.piece.shape, gx, gy) };
}

function render(now){
  ctx.clearRect(0, 0, VW, VH);
  ctx.save();
  if(shake > 0.2){ ctx.translate((Math.random()-0.5) * shake, (Math.random()-0.5) * shake); }

  /* 盤面の土台 */
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  rr(boardX - 8, boardY - 8, boardPx + 16, boardPx + 16, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.09)'; ctx.lineWidth = 1.5;
  rr(boardX - 8, boardY - 8, boardPx + 16, boardPx + 16, 18); ctx.stroke();
  for(let y=0; y<N; y++) for(let x=0; x<N; x++){
    const { x: px, y: py } = cellXY(x, y);
    ctx.fillStyle = (x + y) % 2 ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.028)';
    rr(px + gap*0.5, py + gap*0.5, cell - gap, cell - gap, cell * 0.16); ctx.fill();
  }

  /* ドラッグ中のゴースト＆消去プレビュー */
  const tgt = dragTarget();
  if(drag && tgt && tgt.gx > -4 && tgt.gy > -4 && tgt.gx < N && tgt.gy < N){
    // 置いた場合に消えるラインを先読み
    let preview = null;
    if(tgt.ok){
      const bd2 = board.map(r=>r.slice());
      for(const [cx,cy] of drag.piece.shape.cells) bd2[tgt.gy+cy][tgt.gx+cx] = drag.piece.color;
      preview = findClears(bd2);
    }
    if(preview && (preview.rows.length || preview.cols.length)){
      ctx.save();
      ctx.fillStyle = `rgba(255,255,255,${0.10 + 0.07 * Math.sin(now/90)})`;
      for(const y of preview.rows) ctx.fillRect(boardX, boardY + y*cell, boardPx, cell);
      for(const x of preview.cols) ctx.fillRect(boardX + x*cell, boardY, cell, boardPx);
      ctx.restore();
    }
    for(const [cx,cy] of drag.piece.shape.cells){
      const bx = tgt.gx + cx, by = tgt.gy + cy;
      if(bx < 0 || by < 0 || bx >= N || by >= N) continue;
      const { x: px, y: py } = cellXY(bx, by);
      drawBlock(px, py, cell, drag.piece.color, tgt.ok ? 0.45 : 0.18);
    }
  }

  /* 盤面のブロック */
  for(let y=0; y<N; y++) for(let x=0; x<N; x++){
    const v = board[y][x]; if(!v) continue;
    const { x: px, y: py } = cellXY(x, y);
    const key = x + ',' + y, an = cellAnims[key];
    let scale = 1, alpha = 1;
    if(an){
      const t = Math.max(0, (now - an.t0) / an.dur);
      if(t >= 1) delete cellAnims[key];
      else if(an.kind === 'pop'){ const k = Math.min(1, t); scale = 0.4 + 0.6 * (1 - Math.pow(1-k, 3)) + Math.sin(k * Math.PI) * 0.12; }
      else if(an.kind === 'clear'){ alpha = 1 - t; scale = 1 + t * 0.25; }
    }
    if(flashLines){
      const inRow = flashLines.rows.includes(y), inCol = flashLines.cols.includes(x);
      if(inRow || inCol){
        const ft = (now - flashLines.t0) / 170;
        if(ft < 1){ ctx.save(); ctx.globalAlpha = (1 - ft) * 0.85; ctx.fillStyle = '#fff';
          rr(px + gap*0.5, py + gap*0.5, cell - gap, cell - gap, cell*0.16); ctx.fill(); ctx.restore(); }
      }
    }
    drawBlock(px, py, cell, v, alpha, scale);
  }

  /* トレイの土台 */
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  rr(boardX - 8, trayY - 6, boardPx + 16, trayH + 4, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.07)';
  rr(boardX - 8, trayY - 6, boardPx + 16, trayH + 4, 18); ctx.stroke();

  /* トレイのピース */
  const slotW = boardPx / 3;
  for(let i=0; i<3; i++){
    const p = tray[i];
    const slotCx = boardX + slotW * i + slotW / 2;
    const slotCy = trayY + trayH / 2;
    if(!p || p.used) continue;
    if(drag && drag.slot === i) continue;
    const tcs = Math.min(cell * 0.92, (slotW * 0.8) / p.shape.w, (trayH * 0.78) / p.shape.h);
    const born = Math.max(0, Math.min(1, (now - p.bornAt) / 260));
    const pop = 0.6 + 0.4 * (1 - Math.pow(1 - born, 3));
    const ox = slotCx - (p.shape.w * tcs) / 2, oy = slotCy - (p.shape.h * tcs) / 2;
    // 置けないピースは少し暗く
    const placeable = anyPlacement(board, p.shape);
    for(const [cx,cy] of p.shape.cells){
      drawBlock(ox + cx * tcs, oy + cy * tcs, tcs, p.color, placeable ? pop : pop * 0.45, pop);
    }
  }

  /* ドラッグ中のピース（指の少し上に表示） */
  if(drag){
    const sh = drag.piece.shape;
    const dx = drag.px - drag.grabDX * cell, dy = drag.py - drag.grabDY * cell;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 10;
    for(const [cx,cy] of sh.cells) drawBlock(dx + cx * cell, dy + cy * cell, cell, drag.piece.color, 0.96, 1.04);
    ctx.restore();
  }

  /* パーティクル */
  particles = particles.filter(pt => now - pt.t0 < pt.life);
  for(const pt of particles){
    const t = (now - pt.t0) / pt.life;
    const x = pt.x + pt.vx * t * 60, y = pt.y + pt.vy * t * 60 + t * t * 130;
    ctx.save();
    ctx.globalAlpha = 1 - t;
    ctx.fillStyle = pt.color;
    const s = pt.size * (1 - t * 0.6);
    rr(x - s/2, y - s/2, s, s, s * 0.3); ctx.fill();
    ctx.restore();
  }

  /* フローティングスコア */
  floaters = floaters.filter(f => now - f.t0 < 950);
  for(const f of floaters){
    const t = (now - f.t0) / 950;
    ctx.save();
    ctx.globalAlpha = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
    ctx.font = `900 ${f.size}px "Hiragino Maru Gothic ProN", sans-serif`;
    ctx.textAlign = 'center';
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    const yy = f.y - t * 54;
    ctx.strokeText(f.text, f.x, yy);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, yy);
    ctx.restore();
  }

  /* コンボバナー */
  if(banner){
    const t = (now - banner.t0) / 900;
    if(t >= 1) banner = null;
    else{
      const popIn = t < 0.18 ? (0.5 + (t / 0.18) * 0.62) : 1.12 - Math.min(1, (t - 0.18) / 0.2) * 0.12;
      ctx.save();
      ctx.globalAlpha = t > 0.75 ? 1 - (t - 0.75) / 0.25 : 1;
      ctx.translate(VW / 2, boardY + boardPx * 0.42);
      ctx.scale(popIn, popIn);
      ctx.rotate(Math.sin(now / 60) * 0.02);
      ctx.font = '900 44px "Hiragino Maru Gothic ProN", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(80,10,40,0.65)';
      ctx.strokeText(banner.text, 0, 0);
      const g = ctx.createLinearGradient(0, -34, 0, 10);
      g.addColorStop(0, '#fde68a'); g.addColorStop(0.55, '#fbbf24'); g.addColorStop(1, '#f472b6');
      ctx.fillStyle = g;
      ctx.fillText(banner.text, 0, 0);
      ctx.restore();
    }
  }

  ctx.restore();
  if(shake > 0) shake *= 0.86;

  /* スコアのカウントアップ表示 */
  if(dispScore !== score){
    const diff = score - dispScore;
    dispScore += Math.abs(diff) < 2 ? diff : Math.round(diff * 0.22);
    document.getElementById('scoreVal').textContent = dispScore.toLocaleString();
  }
}

function spawnParticles(bx, by, colorIdx, n=7){
  const { x, y } = cellXY(bx, by);
  const c = COLORS[colorIdx];
  for(let i=0; i<n; i++){
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * 3.4;
    particles.push({
      x: x + cell/2, y: y + cell/2,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.6,
      size: 6 + Math.random() * (cell * 0.3),
      color: [c.base, c.light, '#ffffff'][i % 3],
      t0: performance.now(), life: 420 + Math.random() * 320,
    });
  }
}
function addFloater(text, x, y, size=26, color='#fde68a'){
  floaters.push({ text, x, y, size, color, t0: performance.now() });
}

/* ================================================================
   ゲームフロー
================================================================ */
function updateComboUI(){
  const box = document.getElementById('comboBox');
  document.getElementById('comboVal').textContent = '×' + Math.max(1, combo);
  box.classList.toggle('hot', combo >= 2);
}
function linePoints(lines){ return lines * lines * 100; } // 1→100, 2→400, 3→900…

function doPlace(piece, slot, gx, gy){
  const now = performance.now();
  piece.used = true;
  piecesPlaced++;
  piece.shape.cells.forEach(([cx,cy], i)=>{
    board[gy+cy][gx+cx] = piece.color;
    cellAnims[(gx+cx) + ',' + (gy+cy)] = { kind:'pop', t0: now + i * 28, dur: 240 };
  });
  score += piece.shape.n; // 置いたマス数ぶん
  sfx.place();

  const clears = findClears(board);
  const nLines = clears.rows.length + clears.cols.length;
  if(nLines > 0){
    combo++;
    maxCombo = Math.max(maxCombo, combo);
    const pts = linePoints(nLines) * Math.max(1, combo);
    flashLines = { rows: clears.rows, cols: clears.cols, t0: now };
    inputLockUntil = now + 200;
    setTimeout(()=>{
      const cells = new Set();
      for(const y of clears.rows) for(let x=0; x<N; x++) cells.add(x + ',' + y);
      for(const x of clears.cols) for(let y=0; y<N; y++) cells.add(x + ',' + y);
      let sx = 0, sy = 0;
      for(const key of cells){
        const [x, y] = key.split(',').map(Number);
        spawnParticles(x, y, board[y][x], 9);
        board[y][x] = 0; sx += x; sy += y;
      }
      flashLines = null;
      score += pts;
      linesTotal += nLines;
      document.getElementById('bestVal').textContent = Math.max(best, score).toLocaleString();
      const cxp = boardX + (sx / cells.size + 0.5) * cell, cyp = boardY + (sy / cells.size + 0.5) * cell;
      addFloater('+' + pts.toLocaleString(), cxp, cyp, nLines >= 2 ? 34 : 27, combo >= 2 ? '#fbbf24' : '#fde68a');
      if(combo >= 2) banner = { text: `コンボ ×${combo}！`, t0: performance.now() };
      else if(nLines >= 3) banner = { text: `${nLines}ライン消し！`, t0: performance.now() };
      if(nLines >= 2 || combo >= 3) shake = 6;
      sfx.clear(nLines, combo);
      updateComboUI();
      afterMove();
    }, 185);
  } else {
    combo = 0;
    updateComboUI();
    afterMove();
  }
  document.getElementById('bestVal').textContent = Math.max(best, score).toLocaleString();
}

function afterMove(){
  if(tray.every(p=>p.used)){
    tray = genTray();
    tray.forEach((p,i)=> p.bornAt = performance.now() + i * 95);
    sfx.refill();
  }
  saveState();
  const remaining = tray.filter(p=>!p.used);
  if(remaining.length && !remaining.some(p=>anyPlacement(board, p.shape))){
    gameOver = true;
    saveState();
    setTimeout(showGameOver, 700);
  }
}

function showGameOver(){
  sfx.over();
  const isBest = score > best;
  if(isBest){ best = score; localStorage.setItem('blockblast_best', String(best)); }
  document.getElementById('finalScore').textContent = score.toLocaleString();
  document.getElementById('newBest').classList.toggle('hidden', !isBest);
  document.getElementById('overStats').innerHTML =
    `消したライン： ${linesTotal} 本　／　最大コンボ： ×${Math.max(1, maxCombo)}　／　置いたピース： ${piecesPlaced} 個`;
  document.getElementById('bestVal').textContent = best.toLocaleString();
  document.getElementById('overOv').classList.remove('hidden');
}

function saveState(){
  try{
    localStorage.setItem('blockblast_state', JSON.stringify({
      board, score, combo, maxCombo, linesTotal, piecesPlaced, gameOver,
      tray: tray.map(p=>({ cells: p.shape.cells, color: p.color, used: p.used })),
    }));
  }catch(e){}
}
function loadState(){
  try{
    const s = JSON.parse(localStorage.getItem('blockblast_state') || 'null');
    if(!s || s.gameOver || !Array.isArray(s.board)) return false;
    board = s.board; score = s.score || 0; combo = 0; maxCombo = s.maxCombo || 0;
    linesTotal = s.linesTotal || 0; piecesPlaced = s.piecesPlaced || 0; gameOver = false;
    tray = s.tray.map(t=>({ shape: shape(t.cells), color: t.color, used: t.used, bornAt: 0 }));
    return true;
  }catch(e){ return false; }
}
function resetGame(){
  board = emptyBoard();
  score = 0; combo = 0; maxCombo = 0; linesTotal = 0; piecesPlaced = 0; gameOver = false;
  particles = []; floaters = []; cellAnims = {}; banner = null; flashLines = null; drag = null;
  tray = genTray();
  tray.forEach((p,i)=> p.bornAt = performance.now() + i * 95);
  dispScore = 0;
  document.getElementById('scoreVal').textContent = '0';
  document.getElementById('bestVal').textContent = best.toLocaleString();
  document.getElementById('overOv').classList.add('hidden');
  updateComboUI();
  saveState();
}

/* ================================================================
   入力（ドラッグ＆ドロップ）
================================================================ */
function canvasPos(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (VW / r.width), y: (e.clientY - r.top) * (VH / r.height) };
}
function trayPieceRect(p){
  const slotW = boardPx / 3;
  const i = tray.indexOf(p);
  const slotCx = boardX + slotW * i + slotW / 2, slotCy = trayY + trayH / 2;
  const tcs = Math.min(cell * 0.92, (slotW * 0.8) / p.shape.w, (trayH * 0.78) / p.shape.h);
  return { ox: slotCx - (p.shape.w * tcs) / 2, oy: slotCy - (p.shape.h * tcs) / 2, tcs };
}
cv.addEventListener('pointerdown', e=>{
  if(gameOver || performance.now() < inputLockUntil) return;
  const pos = canvasPos(e);
  for(let i=0; i<3; i++){
    const p = tray[i];
    if(!p || p.used) continue;
    const { ox, oy, tcs } = trayPieceRect(p);
    const w = p.shape.w * tcs, h = p.shape.h * tcs;
    if(pos.x >= ox - 12 && pos.x <= ox + w + 12 && pos.y >= oy - 14 && pos.y <= oy + h + 14){
      const lift = e.pointerType === 'touch' ? 1.15 : 0.55;
      drag = {
        piece: p, slot: i, px: pos.x, py: pos.y,
        // つかみ位置をピース内セル座標で保持（トレイ表示セル→盤面セルへ1:1対応）
        grabDX: (pos.x - ox) / tcs,
        grabDY: (pos.y - oy) / tcs + lift,
      };
      cv.setPointerCapture(e.pointerId);
      cv.classList.add('dragging');
      sfx.pickup();
      e.preventDefault();
      break;
    }
  }
});
cv.addEventListener('pointermove', e=>{
  if(!drag) return;
  const pos = canvasPos(e);
  drag.px = pos.x; drag.py = pos.y;
  e.preventDefault();
});
function endDrag(e, commit){
  if(!drag) return;
  const d = drag; drag = null;
  cv.classList.remove('dragging');
  if(!commit) return;
  const tgt = dragTargetFor(d);
  if(tgt && tgt.ok){ doPlace(d.piece, d.slot, tgt.gx, tgt.gy); }
  else {
    // 盤面の上で外したときだけ「置けない」音
    const pos = canvasPos(e);
    if(pos.y < trayY - 10) sfx.invalid();
  }
}
function dragTargetFor(d){
  const gx = Math.round((d.px - d.grabDX * cell - boardX) / cell);
  const gy = Math.round((d.py - d.grabDY * cell - boardY) / cell);
  return { gx, gy, ok: canPlaceAt(board, d.piece.shape, gx, gy) };
}
cv.addEventListener('pointerup', e=> endDrag(e, true));
cv.addEventListener('pointercancel', e=> endDrag(e, false));
cv.addEventListener('contextmenu', e=> e.preventDefault());

/* ================================================================
   UI＆初期化
================================================================ */
document.getElementById('soundBtn').onclick = (e)=>{
  soundOn = !soundOn;
  e.target.textContent = soundOn ? '🔊 サウンド' : '🔇 サウンド';
  if(soundOn) sfx.click();
};
document.getElementById('restartBtn').onclick = ()=>{ sfx.click(); resetGame(); };
document.getElementById('againBtn').onclick = ()=>{ sfx.click(); resetGame(); };

resize();
if(!loadState()){
  board = emptyBoard();
  score = 0; combo = 0; maxCombo = 0; linesTotal = 0; piecesPlaced = 0; gameOver = false;
  tray = genTray();
  tray.forEach((p,i)=> p.bornAt = performance.now() + i * 95);
}
dispScore = score;
document.getElementById('scoreVal').textContent = score.toLocaleString();
document.getElementById('bestVal').textContent = Math.max(best, score).toLocaleString();
updateComboUI();
requestAnimationFrame(function loop(now){ render(now); requestAnimationFrame(loop); });
</script>
