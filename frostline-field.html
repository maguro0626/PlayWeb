<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frostline: Emberfront | PlayWeb</title>
<link rel="stylesheet" href="pw-ui.css"><script src="pw-ui.js" defer></script>
<style>
:root{--ice:#9feeff;--warm:#ffb357;--good:#86e0a4;--danger:#ff7687}
body{margin:0;min-height:100vh;background:#081018;color:#f5fbff;overflow:hidden;user-select:none;-webkit-user-select:none}
#game{width:min(100%,980px);height:100dvh;min-height:590px;margin:auto;display:flex;flex-direction:column;position:relative;z-index:1;padding:67px 14px 14px;gap:10px}
.topline{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex:0 0 auto}.brandline{font:800 9px ui-monospace,monospace;letter-spacing:.2em;color:var(--ice)}h1{font-size:clamp(24px,5vw,44px);line-height:.94;margin:5px 0 0;letter-spacing:-.05em}h1 span{color:var(--warm)}.objective{color:#91aab6;font-size:11px;text-align:right;line-height:1.6}.objective b{color:var(--warm);font:900 16px ui-monospace,monospace;display:block}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;flex:0 0 auto}.stat{background:rgba(9,20,29,.88);border:1px solid rgba(159,238,255,.2);padding:7px 9px}.stat small{display:block;color:#78909c;font:800 8px ui-monospace,monospace;letter-spacing:.12em}.stat strong{display:block;margin-top:2px;font:900 17px ui-monospace,monospace;color:var(--ice)}.stat:nth-child(2) strong{color:var(--warm)}.stat:nth-child(3) strong{color:var(--good)}.stat:nth-child(4) strong{color:#d5c1ff}
.stage-wrap{position:relative;flex:1;min-height:0;border:1px solid rgba(159,238,255,.28);background:#d5edf3;box-shadow:0 20px 60px rgba(0,0,0,.45);overflow:hidden}.stage-wrap::before{content:"雪原作業区域  /  エリア 01";position:absolute;z-index:2;left:12px;top:10px;color:#0e3a4b;font:900 9px ui-monospace,monospace;letter-spacing:.15em;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.5)}canvas{display:block;width:100%;height:100%;touch-action:none}
.quest{position:absolute;right:10px;top:10px;width:min(220px,45%);padding:10px;background:rgba(5,16,23,.82);border:1px solid rgba(159,238,255,.36);backdrop-filter:blur(8px);pointer-events:none}.quest h2{font:900 9px ui-monospace,monospace;color:var(--ice);margin:0 0 7px;letter-spacing:.15em}.task{display:flex;align-items:center;gap:7px;color:#dceaf0;font-size:10px;line-height:1.45;margin:5px 0}.task i{width:14px;height:14px;border:1px solid #6f8c9a;display:grid;place-items:center;font-style:normal;color:transparent;font-size:10px}.task.done{color:#7da38c;text-decoration:line-through}.task.done i{background:var(--good);border-color:var(--good);color:#092018}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:7px 11px;color:#093040;background:rgba(227,250,255,.82);font:900 10px ui-monospace,monospace;letter-spacing:.04em;white-space:nowrap;pointer-events:none;opacity:0;transition:.2s}.hint.show{opacity:1}
.controls{position:absolute;inset:auto 0 10px;display:flex;justify-content:space-between;align-items:end;padding:0 12px;pointer-events:none}.joy{width:118px;height:118px;border-radius:50%;background:rgba(7,25,35,.25);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 0 25px rgba(0,0,0,.15);position:relative;pointer-events:auto;touch-action:none}.joy::after{content:"";position:absolute;left:50%;top:50%;width:50px;height:50px;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.62);border:2px solid rgba(8,48,63,.55);box-shadow:0 4px 12px rgba(0,0,0,.24);transition:transform .05s}.joy.active::after{transform:translate(calc(-50% + var(--jx,0px)),calc(-50% + var(--jy,0px)))}.act{width:86px;height:86px;border-radius:50%;border:2px solid rgba(255,218,148,.9);background:radial-gradient(circle at 35% 28%,#ffc875,#c05e36 72%);color:#fff8e5;box-shadow:0 6px 18px rgba(79,31,23,.4),0 0 22px rgba(255,179,87,.28);font:900 12px ui-monospace,monospace;pointer-events:auto;touch-action:none}.act:active{transform:scale(.94)}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:26px;color:#718995;font:9px ui-monospace,monospace}.bottom button{padding:6px 9px;cursor:pointer;font-size:9px}
.toast{position:fixed;z-index:20;left:50%;bottom:32px;transform:translate(-50%,20px);opacity:0;padding:11px 15px;background:#102834;border:1px solid var(--ice);color:#ecfbff;font:900 11px ui-monospace,monospace;transition:.22s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}
@media(max-width:620px){#game{padding:58px 8px 8px;gap:7px}.topline{align-items:flex-start}.objective{font-size:9px}.objective b{font-size:13px}.hud{gap:3px}.stat{padding:6px 6px}.stat small{font-size:7px}.stat strong{font-size:14px}.quest{width:47%;padding:8px 7px}.quest h2{font-size:8px}.task{font-size:9px}.joy{width:104px;height:104px}.act{width:76px;height:76px;font-size:10px}.hint{font-size:9px;bottom:9px}}
</style>
</head>
<body>
<div id="game">
  <div class="topline"><div><div class="brandline">FROSTLINE / FIELDWORK PROTOCOL</div><h1>EMBER<span>FRONT</span></h1></div><div class="objective">今日の救出作業<strong id="day">01</strong><span id="weather">吹雪まで 03:00</span></div></div>
  <div class="hud"><div class="stat"><small>木材</small><strong id="wood">0 / 8</strong></div><div class="stat"><small>食料</small><strong id="food">0 / 5</strong></div><div class="stat"><small>救出</small><strong id="rescued">0 / 2</strong></div><div class="stat"><small>炉心熱</small><strong id="heat">72°</strong></div></div>
  <div class="stage-wrap"><canvas id="field"></canvas><div class="quest"><h2>作業指令 / LIVE</h2><div class="task" id="qWood"><i>✓</i>薪を3束集める</div><div class="task" id="qFood"><i>✓</i>食料を2箱運ぶ</div><div class="task" id="qRescue"><i>✓</i>住民を2人救出する</div><div class="task" id="qFire"><i>✓</i>炉へ燃料を投入</div></div><div class="hint" id="hint"></div><div class="controls"><div class="joy" id="joy" aria-label="移動スティック"></div><button class="act" id="action">作業<br>ACT</button></div></div>
  <div class="bottom"><span id="message">青い矢印の場所へ向かおう</span><div><button id="save">保存</button><button id="reset">最初から</button></div></div>
</div><div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const KEY='frostline_field_v2',canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
const initial={wood:0,food:0,rescued:0,heat:72,day:1,started:Date.now(),done:false};let s=load();let W=900,H=560,scale=1,keys={},input={x:0,y:0},last=performance.now(),saveTimer=0;
const player={x:420,y:315,r:17,speed:145,carry:null,anim:0};
const objects=[
 {id:'wood1',type:'wood',x:145,y:152,amount:3,active:true,icon:'薪'}, {id:'wood2',type:'wood',x:270,y:104,amount:3,active:true,icon:'薪'}, {id:'wood3',type:'wood',x:720,y:160,amount:3,active:true,icon:'薪'},
 {id:'food1',type:'food',x:735,y:374,amount:2,active:true,icon:'食'}, {id:'food2',type:'food',x:198,y:410,amount:2,active:true,icon:'食'},
 {id:'surv1',type:'survivor',x:600,y:232,active:true,name:'レン'}, {id:'surv2',type:'survivor',x:735,y:470,active:true,name:'ミナ'},
 {id:'furnace',type:'furnace',x:448,y:278,active:true,icon:'炉'}, {id:'gate',type:'gate',x:838,y:282,active:true,icon:'出口'}
];
function load(){try{return Object.assign({},initial,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return {...initial}}}
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function $(id){return document.getElementById(id)}
function resize(){const r=canvas.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);W=r.width;H=r.height;canvas.width=W*d;canvas.height=H*d;scale=d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function say(t){$('message').textContent=t}
function setTask(id,on){$(id).classList.toggle('done',on)}
function renderHud(){ $('wood').textContent=s.wood+' / 8';$('food').textContent=s.food+' / 5';$('rescued').textContent=s.rescued+' / 2';$('heat').textContent=Math.round(s.heat)+'°';$('day').textContent=String(s.day).padStart(2,'0');setTask('qWood',s.wood>=3);setTask('qFood',s.food>=2);setTask('qRescue',s.rescued>=2);setTask('qFire',s.heat>72||s.wood>=8||s.done);}
function near(){let best=null,bd=68;for(const o of objects)if(o.active&&dist(player,o)<bd){best=o;bd=dist(player,o)}return best}
function act(){const o=near();if(!o){say('近くに作業できる場所がありません');return}if(o.type==='wood'){s.wood+=o.amount;o.active=false;toast('薪を'+o.amount+'束集めた');say('薪を炉へ運ぼう')}else if(o.type==='food'){s.food+=o.amount;o.active=false;toast('食料を'+o.amount+'箱拾った');say('食料を避難所へ届けよう')}else if(o.type==='survivor'){s.rescued++;o.active=false;toast(o.name+'を救出した');say('まだ救出を待つ人がいる')}else if(o.type==='furnace'){if(s.wood>=3){s.wood-=3;s.heat=Math.min(100,s.heat+18);toast('炉に薪をくべた / 熱 +18');say('いい火だ。次の作業へ')}else say('炉に入れる薪が足りない')}else if(o.type==='gate'){if(s.wood>=3&&s.food>=2&&s.rescued>=2&&s.heat>72){s.done=true;toast('作業区域を確保した！');say('区域確保。新しい雪原が開く');}else say('指令をすべて完了してから出口へ')}renderHud();save()}
$('action').addEventListener('pointerdown',e=>{e.preventDefault();act()});$('save').addEventListener('click',()=>{save();toast('作業記録を保存しました')});$('reset').addEventListener('click',()=>{if(confirm('この作業記録をリセットしますか？')){localStorage.removeItem(KEY);location.reload()}});
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='e')act()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let joyId=null;function joyMove(e){const r=$('joy').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.min(38,Math.hypot(dx,dy));const a=Math.atan2(dy,dx);input.x=Math.cos(a)*(m/38);input.y=Math.sin(a)*(m/38);$('joy').style.setProperty('--jx',(input.x*38)+'px');$('joy').style.setProperty('--jy',(input.y*38)+'px');$('joy').classList.add('active')}
$('joy').addEventListener('pointerdown',e=>{joyId=e.pointerId;$('joy').setPointerCapture(joyId);joyMove(e)});$('joy').addEventListener('pointermove',e=>{if(e.pointerId===joyId)joyMove(e)});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('joy').addEventListener(ev,e=>{if(e.pointerId===joyId){joyId=null;input.x=input.y=0;$('joy').classList.remove('active');$('joy').style.setProperty('--jx','0px');$('joy').style.setProperty('--jy','0px')}}));
function update(dt){let x=input.x,y=input.y;if(keys.w||keys.arrowup)y-=1;if(keys.s||keys.arrowdown)y+=1;if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}player.x=clamp(player.x+x*player.speed*dt,28,W-28);player.y=clamp(player.y+y*player.speed*dt,30,H-30);player.anim+=dt*8;s.heat=Math.max(0,s.heat-dt*.38);if(s.heat<25){say('炉心熱が危険。薪を炉へ！');$('weather').textContent='炉心が冷えています'}const o=near();const h=$('hint');if(o){h.textContent=o.type==='wood'?'薪を集める':o.type==='food'?'食料を拾う':o.type==='survivor'?'救出する':o.type==='furnace'?'薪を投入する':'出口を開く';h.classList.add('show')}else h.classList.remove('show');saveTimer+=dt;if(saveTimer>5){saveTimer=0;save()}}
function snow(){for(let i=0;i<36;i++){const x=(i*83+performance.now()*.018)%W,y=(i*47+performance.now()*.035)%H;ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(x,y,2,2)}}
function tree(x,y,sc=1){ctx.save();ctx.translate(x,y);ctx.fillStyle='#6f9aa0';ctx.fillRect(-3,12*sc,6,18*sc);for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,-34*sc+i*14*sc);ctx.lineTo(-24*sc+i*5*sc,18*sc+i*5*sc);ctx.lineTo(24*sc-i*5*sc,18*sc+i*5*sc);ctx.closePath();ctx.fillStyle=i===0?'#dff7f8':'#a9d9df';ctx.fill()}ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cceef4');g.addColorStop(1,'#8dc8d3');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.3)';for(let i=0;i<18;i++)ctx.fillRect(i*67%W,(i*91+40)%H,70,1);[[55,80],[110,280],[350,88],[520,80],[820,100],[90,520],[340,520],[805,520],[875,350]].forEach(p=>tree(p[0],p[1],.75));
ctx.fillStyle='rgba(255,255,255,.34)';ctx.fillRect(28,35,W-56,H-70);ctx.strokeStyle='rgba(13,74,91,.16)';ctx.strokeRect(28,35,W-56,H-70);
// camp and paths
ctx.fillStyle='#bd8f62';ctx.fillRect(350,228,196,126);ctx.fillStyle='#e2ba82';ctx.fillRect(350,228,196,10);ctx.fillStyle='#6b4e3a';ctx.fillRect(365,250,74,59);ctx.fillStyle='#ff9e4c';ctx.beginPath();ctx.arc(475,278,28,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe09b';ctx.beginPath();ctx.arc(475,273,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c39868';ctx.fillRect(562,225,4,135);for(let y=228;y<360;y+=18){ctx.fillRect(552,y,24,5)}
for(const o of objects){if(!o.active)continue;ctx.save();ctx.translate(o.x,o.y);ctx.fillStyle='rgba(6,45,57,.2)';ctx.beginPath();ctx.ellipse(0,15,28,9,0,0,Math.PI*2);ctx.fill();if(o.type==='wood'){ctx.fillStyle='#814b32';ctx.fillRect(-15,-10,30,19);ctx.fillStyle='#d59859';ctx.fillRect(-15,-10,30,5);ctx.fillStyle='#fff';ctx.font='bold 11px ui-monospace';ctx.fillText('薪',-7,4)}if(o.type==='food'){ctx.fillStyle='#df7b4b';ctx.fillRect(-17,-12,34,25);ctx.fillStyle='#ffcf7a';ctx.fillRect(-11,-8,22,16);ctx.fillStyle='#263c45';ctx.font='bold 11px ui-monospace';ctx.fillText('食',-7,4)}if(o.type==='survivor'){ctx.fillStyle='#b65f55';ctx.beginPath();ctx.arc(0,-9,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3b6370';ctx.fillRect(-9,0,18,25);ctx.strokeStyle='#e9fbff';ctx.lineWidth=2;ctx.strokeRect(-13,-18,26,48)}if(o.type==='furnace'){ctx.fillStyle='#493a35';ctx.fillRect(-17,-21,34,42);ctx.fillStyle='#ffb15d';ctx.beginPath();ctx.arc(0,-5,12,0,Math.PI*2);ctx.fill()}if(o.type==='gate'){ctx.strokeStyle='#a06e47';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-22,18);ctx.lineTo(-22,-22);ctx.lineTo(22,-22);ctx.lineTo(22,18);ctx.stroke()}ctx.restore()}
// player
ctx.save();ctx.translate(player.x,player.y+Math.sin(player.anim)*2);ctx.fillStyle='rgba(0,30,42,.3)';ctx.beginPath();ctx.ellipse(0,18,18,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9b5b48';ctx.beginPath();ctx.arc(0,-11,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eafaff';ctx.fillRect(-12,-3,24,24);ctx.fillStyle='#3f7283';ctx.fillRect(-13,2,26,6);ctx.fillStyle='#e7a65e';ctx.fillRect(8,3,15,4);ctx.restore();snow();}
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(frame)}
renderHud();requestAnimationFrame(frame);
})();
</script>
<script>window.PW_GAME='frostline';</script><script src="friends.js"></script>
</body></html>
