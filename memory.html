<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>しんけいすいじゃく | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0a16;--accent:#8b5cf6;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#f2f0ff;--sub:#a7a3c7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px 10px 28px}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.ttl{font-size:22px;font-weight:900;text-align:center;padding:6px 0 2px}
.ttl span{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
#modeSeg{display:flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px;gap:2px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
#modeSeg button.on{background:var(--accent);color:#fff}
.hidden{display:none!important}
.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;width:100%}
.btn:active{transform:scale(.97)}
.btn.sub{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--txt)}
.netBtns{display:flex;margin-bottom:10px}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:16px;padding:10px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit}
.joinRow .btn{width:auto;flex:none}
#onlineCodeWrap{text-align:center;margin:10px 0;font-size:14px;color:var(--sub)}
#roomCodeText{display:block;font-size:30px;font-weight:900;letter-spacing:.3em;color:var(--accent);margin-top:4px}
#onlineStatus{text-align:center;font-size:13px;color:var(--sub);min-height:20px;line-height:1.6;margin-top:8px}
#onlineStatus .err{color:#f87171;font-weight:700}
#leaveBtn{margin-top:8px}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud .box{flex:1;min-width:100px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--sub)}
.hud .box b{display:block;font-size:18px;color:var(--txt);margin-top:2px}
.hud .box.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#msg{text-align:center;font-weight:800;font-size:15px;min-height:22px;line-height:1.5}
#board{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mcard{aspect-ratio:3/4;border:none;border-radius:10px;cursor:pointer;font-family:inherit;position:relative;perspective:400px;background:transparent;padding:0}
.mcard .inner{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{background:linear-gradient(145deg,#7c3aed,#4c1d95);color:#fff;font-size:20px;border:1px solid rgba(255,255,255,.25)}
.face.front{background:#1e1b3a;border:1px solid var(--line);font-size:clamp(20px,7vw,30px);transform:rotateY(180deg)}
.mcard.matched .face.front{background:rgba(139,92,246,.35);border-color:var(--accent)}
.mcard.matched{cursor:default}
.mcard:disabled{cursor:default}
#result{text-align:center}
#result .big{font-size:20px;font-weight:900;margin-bottom:6px}
#result p{color:var(--sub);font-size:14px;line-height:1.7;margin-bottom:10px}
.best{text-align:center;color:var(--sub);font-size:12px}
/* 1画面フィット（ビューポート高さに収め、カード盤だけが伸縮） */
body{height:100dvh;overflow:hidden;padding:6px 10px 10px}
.wrap{flex:1;min-height:0}
#gameArea{flex:1;min-height:0;display:flex;flex-direction:column}
#board{flex:1;min-height:0;max-height:340px;grid-template-rows:repeat(4,1fr)}
.mcard{aspect-ratio:auto;height:100%}
#onlinePane{flex:0 1 auto;min-height:0;overflow-y:auto}
#soloPane .card{padding:10px}
.hud .box{padding:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ttl">🃏 しんけい<span>すいじゃく</span></div>
  <div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
  <div id="soloPane">
    <div class="card">
      <button class="btn" id="soloStartBtn">シャッフルして始める</button>
      <div class="best" id="soloBest" style="margin-top:8px"></div>
    </div>
  </div>
  <div id="onlinePane" class="hidden">
    <div class="card">
      <div class="netBtns"><button class="btn" id="hostBtn">部屋を作る</button></div>
      <div class="joinRow"><input id="joinCode" maxlength="6" placeholder="コード6文字"><button class="btn" id="joinBtn">参加する</button></div>
      <div id="onlineCodeWrap" class="hidden">ルームコード<span id="roomCodeText">------</span></div>
      <div id="onlineStatus"></div>
      <button class="btn sub hidden" id="leaveBtn">退出する</button>
    </div>
  </div>
  <div id="gameArea">
    <div class="hud">
      <div class="box" id="p0Box">あなた<b id="score0">0 ペア</b></div>
      <div class="box" id="p1Box">相手 / －<b id="score1">0 ペア</b></div>
      <div class="box">手数・時間<b id="movesTime">0 手 ・ 0:00</b></div>
    </div>
    <div id="msg" style="margin:8px 0">カードをめくってペアをそろえよう！</div>
    <div id="board"></div>
    <div class="card hidden" id="result" style="margin-top:10px"></div>
    <div class="best" id="bestLine" style="margin-top:8px"></div>
  </div>
</div>
<script>
let AC=null;
function tone(f,d,type,v,delay){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+(delay||0); const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(v||0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+(d||0.15)); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+(d||0.15)+0.02);}catch(e){} }
function mulberry32(a){ return function(){ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
const EMOJIS=['🍎','🍌','🍇','🍓','🍑','🍉','🍋','🍒','🥝','🍍','🍐','🍈'];
const SAVE_KEY='mini_memory_v1';
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); }catch(e){ return {}; } }
function storeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
function renderBest(){ const s=loadSave(); const txt=(s.bestMoves!=null)?('ベスト: '+s.bestMoves+' 手 / '+fmtTime(s.bestTime||0)):''; document.getElementById('soloBest').textContent=txt; document.getElementById('bestLine').textContent=txt?('🏆 '+txt):''; }
function fmtTime(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
let mode='solo';
let deck=[], matched=[], firstPick=-1, lock=false, playing=false, finished=false;
let scores=[0,0], current=0, moves=0, startAt=0, timerId=null, elapsed=0;
function myIdx(){ return isHost?0:1; }
function buildDeck(seed){ const rnd=mulberry32(seed); const arr=[]; EMOJIS.forEach(e=>{arr.push(e);arr.push(e);}); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp; } return arr; }
function renderBoard(){ const b=document.getElementById('board'); b.innerHTML=''; deck.forEach((e,i)=>{ const btn=document.createElement('button'); btn.className='mcard'+(matched[i]?' open matched':(i===firstPick||openSecond===i?' open':'')); btn.dataset.i=i; btn.innerHTML='<span class="inner"><span class="face back">🃏</span><span class="face front">'+e+'</span></span>'; btn.addEventListener('click',()=>onCardTap(i)); b.appendChild(btn); }); }
let openSecond=-1;
function updateHud(){ document.getElementById('score0').textContent=scores[0]+' ペア'; document.getElementById('score1').textContent=scores[1]+' ペア'; document.getElementById('movesTime').textContent=moves+' 手 ・ '+fmtTime(elapsed); document.getElementById('p0Box').classList.toggle('turn', playing&&!finished&&mode==='online'&&current===0); document.getElementById('p1Box').classList.toggle('turn', playing&&!finished&&mode==='online'&&current===1); }
function setMsg(t){ document.getElementById('msg').textContent=t; }
function startTimer(){ stopTimer(); startAt=Date.now()-elapsed*1000; timerId=setInterval(()=>{ elapsed=Math.floor((Date.now()-startAt)/1000); updateHud(); },500); }
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function startGame(seed){ deck=buildDeck(seed); matched=new Array(24).fill(false); firstPick=-1; openSecond=-1; lock=false; scores=[0,0]; current=0; moves=0; elapsed=0; playing=true; finished=false; document.getElementById('result').classList.add('hidden'); renderBoard(); updateHud(); if(mode==='solo'){ startTimer(); setMsg('あなたの番です。カードを2枚めくろう！'); } else { setMsg(current===myIdx()?'あなたの番です！':'相手の番です…'); } }
function onCardTap(i){ if(!playing||finished||lock) return; if(matched[i]||i===firstPick||i===openSecond) return; if(mode==='online'&&current!==myIdx()){ setMsg('相手の番です…'); return; } doFlip(i); if(mode==='online') sendNet({t:'flip', i:i}); }
function doFlip(i){ tone(520,0.08,'triangle',0.1); if(firstPick===-1){ firstPick=i; renderBoard(); return; } openSecond=i; moves++; renderBoard(); updateHud(); const a=firstPick, b=openSecond; if(deck[a]===deck[b]){ setTimeout(()=>{ matched[a]=true; matched[b]=true; scores[current]++; firstPick=-1; openSecond=-1; tone(880,0.15,'sine',0.14); tone(1320,0.2,'sine',0.1,0.08); renderBoard(); updateHud(); if(matched.every(x=>x)) finishGame(); else if(mode==='online') setMsg(current===myIdx()?'ペア成立！続けてめくれます':'相手がペア成立！続けてめくります'); else setMsg('ペア成立！'); },350); } else { lock=true; setTimeout(()=>{ firstPick=-1; openSecond=-1; lock=false; tone(220,0.12,'sawtooth',0.06); if(mode==='online'){ current=1-current; setMsg(current===myIdx()?'あなたの番です！':'相手の番です…'); } renderBoard(); updateHud(); },900); } }
function finishGame(){ finished=true; playing=false; stopTimer(); if(mode==='solo'){ const s=loadSave(); if(s.bestMoves==null||moves<s.bestMoves||(moves===s.bestMoves&&elapsed<(s.bestTime||99999))){ s.bestMoves=moves; s.bestTime=elapsed; storeSave(s); } renderBest(); showResult('🎉 コンプリート！', moves+' 手 / '+fmtTime(elapsed)+' で全ペアそろいました！', false); tone(660,0.15,'sine',0.13); tone(880,0.15,'sine',0.13,0.12); tone(1100,0.25,'sine',0.13,0.24); } else { const me=myIdx(); let res, txt; if(scores[me]>scores[1-me]){ res='win'; txt='🏆 あなたの勝ち！ '+scores[me]+' 対 '+scores[1-me]; } else if(scores[me]<scores[1-me]){ res='lose'; txt='😢 相手の勝ち… '+scores[me]+' 対 '+scores[1-me]; } else { res='draw'; txt='🤝 引き分け '+scores[me]+' 対 '+scores[1-me]; } showResult(txt, '全ペアがそろいました。', true); if(window.PWFriends&&PWFriends.recordMatch) PWFriends.recordMatch(res); if(res==='win'){ tone(880,0.2,'sine',0.14); tone(1320,0.3,'sine',0.12,0.1); } } updateHud(); }
function showResult(big, sub, isOnline){ const r=document.getElementById('result'); r.innerHTML='<div class="big">'+big+'</div><p>'+sub+'</p>'; const btn=document.createElement('button'); btn.className='btn'; btn.textContent='もう一度'; btn.addEventListener('click',()=>{ if(!isOnline){ startGame(Math.floor(Math.random()*1e9)); } else if(isHost){ const seed=Math.floor(Math.random()*1e9); startGame(seed); sendNet({t:'start', seed:seed}); } else { sendNet({t:'rematch'}); setMsg('ホストの開始を待っています…'); } }); r.appendChild(btn); r.classList.remove('hidden'); }
document.getElementById('soloStartBtn').addEventListener('click',()=>startGame(Math.floor(Math.random()*1e9)));
document.querySelectorAll('#modeSeg button').forEach(b=>{ b.addEventListener('click',()=>{ document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b)); mode=b.dataset.m; document.getElementById('soloPane').classList.toggle('hidden',mode!=='solo'); document.getElementById('onlinePane').classList.toggle('hidden',mode!=='online'); stopTimer(); playing=false; finished=false; if(mode==='solo') startGame(Math.floor(Math.random()*1e9)); else resetOnlineGame(); }); });
</script>
<script>
const PEER_PREFIX = 'playweb-mm-';
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
] } };
let peer=null, conn=null, isHost=false, roomCode='', heartbeatTimer=null, connTimer=null;
function genRoomCode(){ const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=C.charAt(Math.floor(Math.random()*C.length)); return s; }
function peerAvailable(){ return typeof window.Peer !== 'undefined'; }
function sendNet(o){ if (conn && conn.open){ try{ conn.send(o); }catch(e){} } }
function setOnlineStatus(html){ const el=document.getElementById('onlineStatus'); if(el) el.innerHTML=html; }
function startHeartbeat(){ stopHeartbeat(); heartbeatTimer=setInterval(()=>sendNet({t:'ping'}),8000); }
function stopHeartbeat(){ if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; } }
function armConnTimer(msg){ clearTimeout(connTimer); connTimer=setTimeout(()=>{ if(!conn||!conn.open) setOnlineStatus('<span class="err">'+msg+'</span>'); },25000); }
function disarmConnTimer(){ clearTimeout(connTimer); }
function gateOk(){ if (window.PWFriends && PWFriends.gateState){ const g=PWFriends.gateState(); if (g==='guest'||g==='sdk-down'){ setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>'); return false; } } return true; }
function setupConn(c){ conn=c; c.on('data', onNetData); c.on('open', ()=>{ disarmConnTimer(); startHeartbeat(); }); c.on('close', ()=>{ if(conn===c) onNetDisconnected(); }); c.on('error', ()=>{ if(conn===c) onNetDisconnected(); }); }
function teardownOnline(){ stopHeartbeat(); clearTimeout(connTimer); try{if(conn)conn.close();}catch(e){} try{if(peer)peer.destroy();}catch(e){} conn=null; peer=null; }
function hostRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; teardownOnline(); isHost=true; roomCode=genRoomCode(); window.PW_ROOM_CODE=roomCode; resetOnlineGame(); setOnlineStatus('部屋を作成中…');
  try{ peer=new Peer(PEER_PREFIX+roomCode, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ document.getElementById('roomCodeText').textContent=roomCode; document.getElementById('onlineCodeWrap').classList.remove('hidden'); document.getElementById('leaveBtn').classList.remove('hidden'); setOnlineStatus('フレンドの参加を待っています…'); });
  peer.on('connection', c=>{ setupConn(c); armConnTimer('相手との接続を確立できませんでした。'); });
  peer.on('error', err=>{ if(err&&err.type==='unavailable-id') setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>'); });
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
}
function joinRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; const code=(document.getElementById('joinCode').value||'').trim().toUpperCase(); if(code.length!==6){ setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; } teardownOnline(); isHost=false; roomCode=code; resetOnlineGame(); setOnlineStatus('接続中…');
  try{ peer=new Peer(undefined, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ armConnTimer('接続を確立できませんでした。'); const c=peer.connect(PEER_PREFIX+code,{reliable:true}); setupConn(c); c.on('open', ()=>{ document.getElementById('leaveBtn').classList.remove('hidden'); sendNet({t:'hello'}); setOnlineStatus('接続しました！対戦開始を待っています…'); }); });
  peer.on('error', err=>{ if(err&&err.type==='peer-unavailable') setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>'); });
}
function leaveOnline(){ teardownOnline(); window.PW_ROOM_CODE=''; document.getElementById('onlineCodeWrap').classList.add('hidden'); document.getElementById('leaveBtn').classList.add('hidden'); setOnlineStatus(''); resetOnlineGame(); }
function resetOnlineGame(){ stopTimer(); playing=false; finished=false; deck=buildDeck(12345); matched=new Array(24).fill(false); firstPick=-1; openSecond=-1; lock=false; scores=[0,0]; current=0; moves=0; elapsed=0; document.getElementById('result').classList.add('hidden'); renderBoard(); updateHud(); if(mode==='online') setMsg('部屋を作るか、コードで参加してください'); }
function onNetData(msg){ if(!msg||!msg.t) return; if(msg.t==='ping') return; if(msg.t==='hello'){ if(isHost){ const seed=Math.floor(Math.random()*1e9); startGame(seed); sendNet({t:'start', seed:seed}); setOnlineStatus('対戦中！'); } return; } if(msg.t==='start'){ startGame(msg.seed); setOnlineStatus('対戦中！'); return; } if(msg.t==='flip'){ doFlip(msg.i); return; } if(msg.t==='rematch'){ if(isHost){ const seed=Math.floor(Math.random()*1e9); startGame(seed); sendNet({t:'start', seed:seed}); } return; } }
function onNetDisconnected(){ setOnlineStatus('<span class="err">相手との接続が切れました。</span>'); playing=false; stopTimer(); setMsg('接続が切れました'); }
document.getElementById('hostBtn').addEventListener('click', hostRoom);
document.getElementById('joinBtn').addEventListener('click', joinRoom);
document.getElementById('leaveBtn').addEventListener('click', leaveOnline);
renderBest();
startGame(Math.floor(Math.random()*1e9));
</script>
<script>window.PW_GAME='memory';window.PW_JOIN_CFG={openers:[{click:'button[data-m="online"]'}],input:'#joinCode',joinBtn:'#joinBtn',hostBtn:'#hostBtn'};</script>
<script src="friends.js"></script>
</body>
</html>
