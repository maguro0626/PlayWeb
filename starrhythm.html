<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スターリズム | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0618;--accent:#ff5d8f;--accent2:#7c5cff;--cyan:#3fd6ff;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--txt:#fdfaff;--sub:#b9aede;--gold:#ffc93c;--perfect:#ffd94d;--great:#ff7ac1;--good:#4ade80;--miss:#8f8fa8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{background:radial-gradient(120% 90% at 50% 0%,#1d1140 0%,#0a0618 55%,#05030f 100%);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:480px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;height:calc(100dvh - 46px);overflow:hidden}
.ttl{font-size:25px;font-weight:900;text-align:center;letter-spacing:.06em;background:linear-gradient(92deg,#ffd94d 0%,#ff5d8f 38%,#7c5cff 72%,#3fd6ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 10px rgba(255,93,143,.45))}
.ttl small{display:block;font-size:10.5px;letter-spacing:.34em;-webkit-text-fill-color:var(--sub);font-weight:800;margin-top:1px}
#modeSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;min-height:40px}
#modeSeg button.on{background:linear-gradient(92deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 12px rgba(255,93,143,.5)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.hidden{display:none!important}
.btn{background:linear-gradient(92deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;flex:1;min-height:48px;box-shadow:0 4px 16px rgba(255,93,143,.35)}
.btn.blue{background:linear-gradient(92deg,#2563eb,#06b6d4);box-shadow:0 4px 16px rgba(59,130,246,.35)}
.btn.sub{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.netBtns{display:flex;gap:8px;margin-bottom:10px}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-size:16px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit;min-height:48px}
#onlineStatus{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px;line-height:1.6;text-align:center}
#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}
#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.3em;color:var(--gold)}
.help{font-size:11.5px;color:var(--sub);line-height:1.75;text-align:center}
.songList{display:flex;flex-direction:column;gap:8px}
.songCard{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:2px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;color:var(--txt);cursor:pointer;font-family:inherit;min-height:72px;position:relative;overflow:hidden;transition:border-color .15s, box-shadow .15s}
.songCard.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,201,60,.5),0 6px 22px rgba(255,201,60,.22)}
.songCard .jacket{width:56px;height:56px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:31px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.4)}
.songCard .jacket::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 62%);transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(130%)}}
.jk-pop{background:radial-gradient(circle at 78% 78%,rgba(255,217,77,.65) 0 12%,transparent 46%),radial-gradient(circle at 22% 16%,rgba(255,255,255,.9) 0 7%,transparent 30%),radial-gradient(circle,rgba(255,255,255,.38) 1.3px,transparent 1.8px) 0 0/13px 13px,linear-gradient(135deg,#ff5d8f,#ffb3d9 45%,#7dd3fc)}
.jk-rock{background:radial-gradient(circle at 24% 18%,rgba(255,255,255,.55) 0 6%,transparent 28%),repeating-linear-gradient(115deg,rgba(255,255,255,.13) 0 5px,transparent 5px 13px),radial-gradient(circle at 82% 84%,rgba(245,158,11,.5) 0 10%,transparent 44%),linear-gradient(135deg,#f43f5e,#f59e0b 55%,#1f2937)}
.jk-electro{background:radial-gradient(circle at 76% 20%,rgba(34,211,238,.65) 0 12%,transparent 46%),radial-gradient(circle,rgba(165,243,252,.4) 1.2px,transparent 1.7px) 0 0/11px 11px,radial-gradient(circle at 20% 82%,rgba(168,85,247,.55) 0 12%,transparent 48%),linear-gradient(135deg,#6366f1,#a855f7 50%,#22d3ee)}
.jk-idol{background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.95) 0 16%,transparent 52%),radial-gradient(circle,rgba(255,255,255,.5) 1.3px,transparent 1.8px) 0 0/12px 12px,radial-gradient(circle at 84% 86%,rgba(103,232,249,.6) 0 12%,transparent 46%),linear-gradient(135deg,#ff8ac2,#fff0f6 48%,#67e8f9)}
.jk-wa{background:radial-gradient(circle at 80% 16%,rgba(255,240,246,.85) 0 9%,transparent 36%),radial-gradient(circle,rgba(255,255,255,.45) 1.4px,transparent 1.9px) 0 0/14px 14px,radial-gradient(circle at 16% 84%,rgba(244,114,182,.55) 0 12%,transparent 48%),linear-gradient(135deg,#fbcfe8,#f472b6 42%,#4338ca)}
#songDetail .jacketBig.jk-pop{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 24px rgba(255,93,143,.55),0 6px 14px rgba(0,0,0,.45)}
#songDetail .jacketBig.jk-rock{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 24px rgba(244,63,94,.55),0 6px 14px rgba(0,0,0,.45)}
#songDetail .jacketBig.jk-electro{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 24px rgba(99,102,241,.6),0 6px 14px rgba(0,0,0,.45)}
#songDetail .jacketBig.jk-idol{box-shadow:inset 0 0 0 1px rgba(255,255,255,.45),0 0 24px rgba(255,138,194,.6),0 6px 14px rgba(0,0,0,.45)}
#songDetail .jacketBig.jk-wa{box-shadow:inset 0 0 0 1px rgba(255,255,255,.4),0 0 24px rgba(244,114,182,.55),0 6px 14px rgba(0,0,0,.45)}
.songTile .jacket{box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -10px 16px rgba(0,0,0,.18),0 3px 8px rgba(0,0,0,.35);text-shadow:0 2px 8px rgba(0,0,0,.35)}
.songTile.on .jacket{box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 0 14px rgba(255,201,60,.45),0 3px 8px rgba(0,0,0,.35)}
.songCard .grow{flex:1;min-width:0}
.songCard .nm{font-size:16.5px;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songCard .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.songCard .bst{text-align:right;flex:none}
.songCard .bst .sc{font-size:13px;color:var(--gold);font-weight:900;white-space:nowrap}
.songCard .bst .rk{display:inline-block;margin-top:2px;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;background:rgba(255,201,60,.16);border:1px solid rgba(255,201,60,.55);color:var(--gold)}
.songCard .bst .none{font-size:11px;color:var(--sub)}
#diffSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;margin-top:8px}
#diffSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:8px 4px;border-radius:999px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;min-height:40px}
#diffSeg button.on{background:linear-gradient(92deg,var(--gold),#ff9d5c);color:#2a1500;box-shadow:0 2px 10px rgba(255,201,60,.4)}
#diffSeg button .lv{display:inline-block;margin-left:3px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.28);color:#ffd94d;font-size:10.5px;font-weight:900;vertical-align:1px}
#diffSeg button.on .lv{background:rgba(42,21,0,.3);color:#2a1500}
#songDetail{display:flex;flex-direction:column;gap:7px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:2px solid rgba(255,201,60,.45);border-radius:16px;padding:10px 12px;box-shadow:0 6px 22px rgba(0,0,0,.35),0 0 28px rgba(255,93,143,.16),inset 0 1px 0 rgba(255,255,255,.14)}
#songDetail .dRow{display:flex;gap:11px;align-items:center;width:100%}
#songDetail .dCredit{font-size:9.5px;color:var(--sub);line-height:1.55;opacity:.9;border-top:1px solid rgba(255,255,255,.10);padding-top:6px;word-break:break-all}
#audioToast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:rgba(10,6,28,.92);border:1px solid rgba(255,201,60,.6);color:var(--txt);font-size:13px;font-weight:800;padding:10px 18px;border-radius:999px;box-shadow:0 8px 26px rgba(0,0,0,.5);pointer-events:none;white-space:nowrap;max-width:92vw;text-overflow:ellipsis;overflow:hidden}
#songDetail .jacketBig{width:74px;height:74px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:38px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 4px 12px rgba(0,0,0,.45)}
#songDetail .jacketBig::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 62%);transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
#songDetail .dInfo{flex:1;min-width:0}
#songDetail .dTitle{font-size:18px;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songDetail .dArtist{font-size:12px;color:var(--gold);font-weight:800;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songDetail .dMeta{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#songDetail .dDesc{font-size:11px;color:var(--sub);margin-top:3px;line-height:1.5}
#songDetail .bst{text-align:right;flex:none}
#songDetail .bst .sc{font-size:15px;color:var(--gold);font-weight:900;white-space:nowrap}
#songDetail .bst .rk{display:inline-block;margin-top:2px;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;background:rgba(255,201,60,.16);border:1px solid rgba(255,201,60,.55);color:var(--gold)}
#songDetail .bst .rk.fc{background:rgba(74,222,128,.14);border-color:rgba(74,222,128,.6);color:#4ade80}
#songDetail .bst .rk.ap{background:rgba(255,93,143,.18);border-color:rgba(255,255,255,.7);color:#fff}
#songDetail .bst .none{font-size:11px;color:var(--sub)}
.songGrid{display:flex;gap:7px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.songGrid::-webkit-scrollbar{display:none}
.songTile{flex:0 0 74px;min-width:0;background:rgba(255,255,255,.05);border:2px solid var(--line);border-radius:13px;padding:5px 4px 6px;color:var(--txt);cursor:pointer;font-family:inherit;transition:border-color .15s, box-shadow .15s}
.songTile.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,201,60,.5),0 4px 16px rgba(255,201,60,.2)}
.songTile .jacket{display:flex;height:52px;border-radius:9px;align-items:center;justify-content:center;font-size:27px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.songTile .tNm{display:block;font-size:9.5px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songTile .tRk{display:block;font-size:9.5px;color:var(--gold);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px}
#speedSeg,#seSeg{display:flex;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;margin-top:8px}
#speedSeg .segLbl,#seSeg .segLbl{font-size:11px;color:var(--sub);font-weight:800;padding:0 4px 0 9px;white-space:nowrap}
#speedSeg button,#seSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:6px 2px;border-radius:999px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;min-height:34px}
#speedSeg button.on{background:linear-gradient(92deg,var(--cyan),#2563eb);color:#fff;box-shadow:0 2px 10px rgba(63,214,255,.4)}
#seSeg button.on{background:linear-gradient(92deg,#ff9d5c,var(--accent));color:#fff;box-shadow:0 2px 10px rgba(255,93,143,.4)}
#seSeg button{font-size:11px;padding:6px 0;white-space:nowrap}
#seSeg .segLbl{padding:0 2px 0 7px}
#hud{display:flex;flex-direction:column;gap:5px}
.hudRow{display:flex;align-items:baseline;gap:12px}
#hudScore{font-size:22px;font-weight:900;letter-spacing:.03em;text-shadow:0 2px 12px rgba(124,92,255,.55)}
#hudCombo{font-size:15px;font-weight:900;color:var(--gold);min-width:92px}
#hudCombo.pop{animation:cpop .18s ease-out}
@keyframes cpop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#hudSong{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gaugeWrap{position:relative;height:14px;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:999px;overflow:hidden}
#gaugeFill{height:100%;width:20%;background:linear-gradient(90deg,#3fd6ff,#7c5cff,#ff5d8f);border-radius:999px;transition:width .15s}
#gaugeWrap.fever #gaugeFill{background:linear-gradient(90deg,#ff5d5d,#ffb84d,#f9ff4d,#4dff88,#4dd2ff,#b84dff,#ff5d5d);background-size:200% 100%;animation:feverSlide 1.1s linear infinite}
@keyframes feverSlide{0%{background-position:0% 0}100%{background-position:200% 0}}
#gaugeMark{position:absolute;top:-1px;bottom:-1px;left:70%;width:2px;background:#fff;opacity:.85}
#gaugeLbl{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
#gaugeLbl .fv{color:var(--gold);font-weight:900;letter-spacing:.14em}
#progWrap{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
#progFill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--accent))}
#vsRow{display:flex;gap:8px}
.scoreBox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-align:center;font-size:12px;color:var(--sub)}
.scoreBox b{display:block;font-size:17px;color:var(--txt)}
.scoreBox .mini{height:6px;background:rgba(255,255,255,.1);border-radius:99px;margin-top:4px;overflow:hidden}
.scoreBox .mini i{display:block;height:100%;background:#4ade80;width:0%}
#stageWrap{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:2px solid rgba(160,140,255,.35);box-shadow:0 0 34px rgba(124,92,255,.28),inset 0 0 60px rgba(60,30,140,.35);background:#0a0618;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#resultPanel{position:absolute;inset:0;background:rgba(6,3,18,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;z-index:5;overflow:hidden}
#resultPanel .rank{font-size:60px;font-weight:900;line-height:1;background:linear-gradient(92deg,#ffd94d,#ff5d8f,#7c5cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 14px rgba(255,93,143,.5));animation:rankPop .55s cubic-bezier(.2,1.5,.35,1) both}
@keyframes rankPop{0%{transform:scale(.25) rotate(-6deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
#resultPanel .stamp{animation:stampPop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampPop{0%{transform:scale(1.7);opacity:0}100%{transform:scale(1);opacity:1}}
#resultPanel .rfx{position:absolute;top:-26px;pointer-events:none;line-height:1;animation-name:rfxFall;animation-timing-function:linear;animation-fill-mode:forwards;text-shadow:0 0 9px currentColor;z-index:1}
@keyframes rfxFall{0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0}10%{opacity:1}88%{opacity:1}100%{transform:translate3d(var(--sway,20px),52vh,0) rotate(320deg);opacity:0}}
#resultPanel .rank.ss{background:linear-gradient(92deg,#ff5d5d,#ffb84d,#f9ff4d,#4dff88,#4dd2ff,#b84dff,#ff5d5d);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:feverSlide 1.6s linear infinite}
#resultPanel .stamp{font-size:15px;font-weight:900;padding:3px 15px;border-radius:999px;border:2px solid}
#resultPanel .stamp.ok{color:#4ade80;border-color:#4ade80}
#resultPanel .stamp.ng{color:#f87171;border-color:#f87171}
#resultPanel .stamp.fc{color:var(--gold);border-color:var(--gold)}
#resultPanel .stamp.ap{color:#fff;border-color:#fff;background:linear-gradient(92deg,rgba(255,93,143,.5),rgba(124,92,255,.5))}
#resultPanel .rscore{font-size:25px;font-weight:900}
#resultPanel .rdetail{font-size:13.5px;color:var(--sub);line-height:1.8}
#resultPanel .rdetail .pj{color:var(--perfect);font-weight:900}
#resultPanel .rdetail .gj{color:var(--great);font-weight:900}
#resultPanel .rdetail .oj{color:var(--good);font-weight:900}
#resultPanel .rdetail .mj{color:var(--miss);font-weight:900}
#resultPanel .rbtns{display:flex;gap:8px;margin-top:6px;width:100%;max-width:320px}
#ctrlRow{display:flex;gap:8px;align-items:center}
.iconBtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:12px;min-width:48px;min-height:44px;font-size:19px;cursor:pointer;font-family:inherit}
#quitBtn{flex:1}
.wrap.playing #modeSeg,.wrap.playing #songArea,.wrap.playing #soloPane,.wrap.playing #onlinePane{display:none!important}
.wrap.playing #footHelp{display:none} /* 演奏中はフッター説明を隠してステージを広く使う（特に低丈画面） */
.wrap:not(.ingame) #stageWrap,.wrap:not(.ingame) #hud{display:none}
/* 低丈画面（〜740px）では選曲まわりを圧縮し、クレジット表示のある実音源曲でも
   スタートボタンが画面内に収まるようにする */
@media (max-height:740px){
  .ttl{font-size:20px}
  #modeSeg button{min-height:34px;padding:6px 6px}
  #songDetail{padding:8px 10px;gap:5px}
  #songDetail .jacketBig{width:54px;height:54px;font-size:28px}
  #songDetail .dTitle{font-size:16px}
  #songDetail .dDesc{display:none}
  #songDetail .dCredit{font-size:9px;line-height:1.45;padding-top:5px}
  .songGrid{margin-top:5px}
  .songTile{padding:4px 3px 5px}
  .songTile .jacket{height:36px;font-size:20px}
  #diffSeg{margin-top:5px}
  #diffSeg button{min-height:34px;padding:5px 4px}
  #speedSeg,#seSeg{margin-top:5px}
  #speedSeg button,#seSeg button{min-height:30px}
}
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#onlinePane{overscroll-behavior:none;}
</style>
</head>
<body>
<div class="wrap" id="wrapEl">
<div class="ttl">✦ スターリズム ✦<small>STAR RHYTHM</small></div>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="songArea">
<div id="songDetail"></div>
<div class="songGrid" id="songList"></div>
<div id="diffSeg"><button data-d="easy">かんたん</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div>

/* 遠近感のある落下：本格的な透視投影（1/Z）で落とす。
   ノーツはワールド空間を等速で手前へ進み、画面上の位置と大きさは
   どちらも 1/Z（奥行きの逆数）に比例する。奥では小さく・ゆっくり、
   手前では大きく・速く見える。x座標はレーン中心線（台形の斜め）に沿う。
   判定は時刻ベースのままなので、タイミング自体は変わらない。 */

function scaleFromY(y) { return lerp(0.34, 1.05, depthFromY(y)); }

/* ---------------- 判定の適用 ---------------- */
function applyJudge(nt, res) {
  nt.res = res;
  var key = res === 'PERFECT' ? 'perfect' : (res === 'GREAT' ? 'great' : (res === 'GOOD' ? 'good' : 'miss'));
  counts[key]++;
  accSum += nt.weight * JUDGE_FACTOR[res];
  if (res === 'MISS') {
    combo = 0;
  } else {
    combo++; if (combo > maxCombo) maxCombo = combo;
    comboT0 = performance.now();
    var feverMult = fever ? 1.1 : 1;
    scoreF += (1000000 / totalWeight) * nt.weight * JUDGE_FACTOR[res] * feverMult;
    if (combo > 0 && combo % 50 === 0) milestone = { n: combo, t0: performance.now() };
    hitSound(res);
  }
  gauge = clamp(gauge + gaugeDelta(res, chart.length), 0, 100);
  judgePop = { res: res, t0: performance.now(), lane: nt.lane };
  laneFlash[nt.lane] = 1;
  if (res !== 'MISS') spawnSparks(nt.lane, res);
  updateHUD(false);
  sendProg();
}
function spawnSparks(lane, res) {
  var x = laneCenterX(lane, judgeY()), y = judgeY();
  var n = res === 'PERFECT' ? 18 : 9;
  for (var i = 0; i < n; i++) {
    var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2;
    var sp = 90 + Math.random() * 260;
    /* PERFECT は金色を混ぜて特別感を出す */
    var col = (res === 'PERFECT' && i % 3 === 0) ? '#ffd94d' : LANE_COLORS[lane];
    sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 0.45 + Math.random() * 0.3, col: col, size: 1.6 + Math.random() * 2.2 });
  }
  if (sparks.length > 240) sparks.splice(0, sparks.length - 240);
  rings.push({ x: x, y: y, r: 8, life: 0, col: LANE_COLORS[lane] });
  if (res === 'PERFECT') rings.push({ x: x, y: y, r: 4, life: -0.07, col: '#ffffff' }); /* 二重の衝撃波 */
  if (rings.length > 12) rings.shift();
  if (res !== 'MISS') {
    pillars.push({ lane: lane, life: 0, col: LANE_COLORS[lane] });
    if (pillars.length > 6) pillars.shift();
  }
  if (res === 'PERFECT') { /* 星屑バースト */
    for (var j = 0; j < 5; j++) {
      var a2 = Math.random() * 6.28, sp2 = 60 + Math.random() * 190;
      starFx.push({ x: x, y: y - 6, vx: Math.cos(a2) * sp2, vy: Math.sin(a2) * sp2 - 90, life: 0, max: 0.55 + Math.random() * 0.3, rot: Math.random() * 3.14, vr: (Math.random() - 0.5) * 9, size: 5 + Math.random() * 6, col: j % 2 ? '#ffd94d' : '#ffffff' });
    }
    if (starFx.length > 90) starFx.splice(0, starFx.length - 90);
  }
}

/* ---------------- 入力と判定 ---------------- */
function nearestInLane(lane, types) {
  var J = DIFFS[selDiff].judge;
  var best = null, bestAbs = Infinity;
  for (var i = 0; i < chart.length; i++) {
    var nt = chart[i];
    if (nt.t - songTime > J.good) break;
    if (nt.state !== 'wait' || nt.lane !== lane) continue;
    if (types.indexOf(nt.type) < 0) continue;
    var a = Math.abs(nt.t - songTime);
    if (a <= J.good && a < bestAbs) { best = nt; bestAbs = a; }
  }
  return best;
}
function pressLane(lane) {
  laneFlash[lane] = Math.max(laneFlash[lane], 0.55);
  if (!playing) return;
  ensureAudio();
  laneTapSound(lane);
  if (songTime < 0) return;
  var nt = nearestInLane(lane, ['tap', 'long']);
  if (!nt) return;
  var res = judgeFor(nt.t - songTime, selDiff);
  if (!res) return;
  if (nt.type === 'tap') { nt.state = 'done'; applyJudge(nt, res); }
  else { nt.state = 'holding'; nt.headRes = res; nt.unheld = 0; spawnSparks(lane, res); }
}
function worseJudge(a, b) { return JUDGE_FACTOR[a] <= JUDGE_FACTOR[b] ? a : b; }
/* ロング終端のリリース判定：終端のタイミングで離すのが正解。
   窓（タップ判定窓と同じ幅）の中で離せば、頭の判定と離し判定の悪い方で確定。
   窓より前なら何もしない（猶予内の再押下で継続、超えたら updateLongs が切断）。
   窓を過ぎていれば終端MISS。 */
function releaseLane(lane) {
  if (!playing) return;
  if (heldLane[lane] > 0) return; /* まだ他の指/キーがそのレーンを押している */
  var J = DIFFS[selDiff].judge;
  for (var i = 0; i < chart.length; i++) {
    var nt = chart[i];
    if (nt.type !== 'long' || nt.state !== 'holding' || nt.lane !== lane) continue;
    var tailT = nt.t + nt.lenSec;
    if (songTime >= tailT - J.good && songTime <= tailT + J.good) {
      var rel = judgeFor(songTime - tailT, selDiff) || 'GOOD';
      nt.state = 'done';
      applyJudge(nt, worseJudge(nt.headRes || 'GOOD', rel));

      nt.state = 'broken';
      applyJudge(nt, 'MISS');
    }
  }
}
function flickAttempt(dir, prefLane) {
  if (!playing || songTime < 0) return;
  var J = DIFFS[selDiff].judge;
  var best = null, bestAbs = Infinity;
  for (var i = 0; i < chart.length; i++) {
    var nt = chart[i];
    if (nt.t - songTime > J.good) break;
    if (nt.state !== 'wait' || nt.type !== 'flick' || nt.dir !== dir) continue;
    var a = Math.abs(nt.t - songTime);
    if (prefLane !== null && prefLane !== undefined && nt.lane !== prefLane) a += 0.001; /* 同方向なら自レーン優先 */
    if (Math.abs(nt.t - songTime) <= J.good && a < bestAbs) { best = nt; bestAbs = a; }
  }
  if (!best) return;
  var res = judgeFor(best.t - songTime, selDiff);
  if (!res) return;
  best.state = 'done';
  flickSound();
  applyJudge(best, res);
}
function sweepMiss() {
  if (!playing || songTime < 0) return;
  var J = DIFFS[selDiff].judge;
  for (var i = 0; i < chart.length; i++) {
    var nt = chart[i];
    if (nt.t - songTime > J.good) break;
    if (nt.state === 'wait' && songTime - nt.t > J.good) { nt.state = 'missed'; applyJudge(nt, 'MISS'); }
  }
}
function updateLongs(dtF) {
  if (!playing) return;
  var J = DIFFS[selDiff].judge;
  for (var i = 0; i < chart.length; i++) {
    var nt = chart[i];
    if (nt.type !== 'long') continue;
    if (nt.state === 'holding') {
      var tailT = nt.t + nt.lenSec;
      /* 終端を過ぎても押し続けていると終端MISS（離すタイミングも判定する） */
      if (songTime >= tailT + J.good) { nt.state = 'broken'; applyJudge(nt, 'MISS'); continue; }
      if (heldLane[nt.lane] > 0) {
        nt.unheld = 0;
        if (Math.random() < 0.5) { /* 保持中は判定ラインから火花 */
          var x = laneCenterX(nt.lane, judgeY());
          sparks.push({ x: x + (Math.random() - 0.5) * 16, y: judgeY(), vx: (Math.random() - 0.5) * 60, vy: -120 - Math.random() * 120, life: 0, max: 0.35, col: LANE_COLORS[nt.lane], size: 1.8 });
          if (sparks.length > 240) sparks.splice(0, sparks.length - 240);
        }
      } else {
        nt.unheld += dtF;
        if (nt.unheld > 0.12) { nt.state = 'broken'; applyJudge(nt, 'MISS'); }
      }
    }
  }
}
function updateFever() {
  if (!fever && gauge >= FEVER_ON) { fever = true; milestone = { n: 'FEVER', t0: performance.now() }; }
  else if (fever && gauge < FEVER_OFF) fever = false;
}

/* ポインター入力（タッチ／マウス共通） */
/* 長押しコールアウト／コンテキストメニューを抑止する（iOS でロングノーツ保持中に
   「コピー」等のポップアップが出て演奏の邪魔にならないように。CSS の
   -webkit-touch-callout:none / user-select:none と対で効かせる） */
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
var pointers = {};
var stageWrap = $('stageWrap');
stageWrap.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  var r = stageWrap.getBoundingClientRect();
  var x = e.clientX - r.left, y = e.clientY - r.top;
  var lane = laneFromX(x); /* レーンはパッド（判定ゾーン）の並びで決める */
  pointers[e.pointerId] = { lane: lane, x0: x, y0: y, flickDone: false };
  heldLane[lane]++;
  pressLane(lane);
});
stageWrap.addEventListener('pointermove', function (e) {
  var pt = pointers[e.pointerId];
  if (!pt || pt.flickDone) return;
  var r = stageWrap.getBoundingClientRect();
  var dx = (e.clientX - r.left) - pt.x0, dy = (e.clientY - r.top) - pt.y0;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return;
  var dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  pt.flickDone = true;
  flickAttempt(dir, pt.lane);
});
function pointerEnd(e) {
  var pt = pointers[e.pointerId];
  if (!pt) return;
  heldLane[pt.lane] = Math.max(0, heldLane[pt.lane] - 1);
  releaseLane(pt.lane);
  delete pointers[e.pointerId];
}
stageWrap.addEventListener('pointerup', pointerEnd);
stageWrap.addEventListener('pointercancel', pointerEnd);
document.addEventListener('keydown', function (e) {
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  var k = (e.key || '').toLowerCase();
  var li = LANE_KEYS.indexOf(k);
  if (li >= 0) {
    if (!e.repeat && !keyHeld[k]) { keyHeld[k] = true; heldLane[li]++; pressLane(li); }
    return;
  }
  if (k.indexOf('arrow') === 0) {
    e.preventDefault();
    if (!e.repeat) flickAttempt(k.replace('arrow', ''), null);
  }

    ctx.restore();
  }
  /* 判定ライン：パッドの上端を横切る光の線（ここに重なった瞬間が判定） */
  drawJudgeLine(t, cx, hwB, jy, jg, pulse);
}
function drawJudgeLine(t, cx, hwB, jy, jg, pulse) {
  /* 判定ラインの強調描画：太く明るいライン＋グロー＋白い芯＋流れる輝き＋
     レーン境界マーカーで、背景や FEVER 演出の中でも一目で分かるようにする。
     位置は従来どおりパッド上端（jy）そのもの＝判定タイミングは不変 */
  ctx.save();
  /* グロー（ぼかした太い光の下地） */
  ctx.globalAlpha = 0.45 + 0.20 * pulse;
  ctx.fillStyle = jg;
  ctx.fillRect(cx - hwB - 3, jy - 5, hwB * 2 + 6, 10);
  /* 本体ライン（太さ JUDGE_LINE_H px） */
  ctx.globalAlpha = 1;
  ctx.fillStyle = jg;
  ctx.fillRect(cx - hwB - 2, jy - JUDGE_LINE_H / 2, hwB * 2 + 4, JUDGE_LINE_H);
  /* 中心の白い芯 */
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.fillRect(cx - hwB - 2, jy - 0.8, hwB * 2 + 4, 1.6);
  /* 流れる輝き（ライン上を光が走る） */
  var shimX = cx - hwB - 60 + ((t * 300) % (hwB * 2 + 120));
  var shimG = ctx.createLinearGradient(shimX - 60, 0, shimX + 60, 0);
  shimG.addColorStop(0, 'rgba(255,255,255,0)');
  shimG.addColorStop(0.5, 'rgba(255,255,255,.8)');
  shimG.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = shimG;
  ctx.fillRect(shimX - 60, jy - JUDGE_LINE_H / 2, 120, JUDGE_LINE_H);
  /* レーン境界マーカー（区切り位置を示す白い三角） */
  ctx.fillStyle = '#ffffff';
  for (var b = 0; b <= 4; b++) {
    var bx = cx + (b - 2) * (hwB * 2 / 4);
    ctx.beginPath();
    ctx.moveTo(bx, jy - 10);
    ctx.lineTo(bx - 4.5, jy - JUDGE_LINE_H / 2 - 0.5);
    ctx.lineTo(bx + 4.5, jy - JUDGE_LINE_H / 2 - 0.5);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawFx(t, dt) {
  /* レーンの光の柱（ヒットした瞬間、判定ラインから上へ立ちのぼる） */
  pillars = pillars.filter(function (p) { return p.life < 0.3; });
  pillars.forEach(function (p) {
    p.life += dt;
    var a = (1 - p.life / 0.3) * 0.34;
    var pcx = laneCenterX(p.lane, judgeY()), pw = laneWidthAt(judgeY()) * 0.82;
    var pg = ctx.createLinearGradient(0, judgeY() - CH * 0.46, 0, judgeY());
    pg.addColorStop(0, hexA(p.col, 0));
    pg.addColorStop(1, hexA(p.col, a));
    ctx.fillStyle = pg;
    ctx.fillRect(pcx - pw / 2, judgeY() - CH * 0.46, pw, CH * 0.46);
  });
  /* リング */
  rings = rings.filter(function (r) { return r.life < 0.32; });
  rings.forEach(function (r) {
    r.life += dt; r.r += dt * 190;
    ctx.save();
    ctx.globalAlpha = 1 - r.life / 0.32;
    ctx.strokeStyle = r.col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * 0.42, 0, 0, 6.29); ctx.stroke();
    ctx.restore();
  });
  /* 火花 */
  sparks = sparks.filter(function (s) { return s.life < s.max; });
  sparks.forEach(function (s) {
    s.life += dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 340 * dt;
    ctx.save();
    ctx.globalAlpha = 1 - s.life / s.max;
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, 6.29); ctx.fill();
    ctx.restore();
  });
  /* 星屑（PERFECT バースト） */
  starFx = starFx.filter(function (s) { return s.life < s.max; });
  starFx.forEach(function (s) {
    s.life += dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 300 * dt; s.rot += s.vr * dt;
    ctx.save();
    ctx.globalAlpha = 1 - s.life / s.max;
    ctx.fillStyle = s.col;
    starPath(s.x, s.y, s.size * (1 - s.life / s.max * 0.4), s.rot); ctx.fill();
    ctx.restore();
  });
  /* FEVER の枠グロー */
  if (fever) {
    ctx.save();
    ctx.strokeStyle = 'hsla(' + ((t * 160) % 360) + ',100%,65%,.8)';
    ctx.lineWidth = 3;
    roundRectPath(2, 2, CW - 4, CH - 4, 16); ctx.stroke();
    ctx.restore();
  }
}
function drawJudgePop(t) {
  /* コンボ（右上に大きく。増えた瞬間に弾む） */
  if (playing && combo >= 2) {
    var cAge = (performance.now() - comboT0) / 1000;
    var cScale = 1 + 0.30 * Math.exp(-cAge * 11);
    ctx.save();
    ctx.translate(CW - 16, 46); ctx.scale(cScale, cScale);
    ctx.textAlign = 'right';
    ctx.font = '900 30px sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,4,30,.65)';
    ctx.strokeText(String(combo), 0, 0);
    if (fever) { ctx.shadowColor = 'rgba(255,180,60,.9)'; ctx.shadowBlur = 13; }
    ctx.fillStyle = fever ? '#ffd94d' : '#fff';
    ctx.fillText(String(combo), 0, 0);
    ctx.shadowBlur = 0;
    ctx.font = '800 11px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.fillText('COMBO', 0, 15);
    ctx.restore();
  }
  /* 節目・FEVER のセンターフラッシュ */
  if (milestone) {
    var mk = (performance.now() - milestone.t0) / 780;
    if (mk >= 1) milestone = null;
    else {
      ctx.save();
      ctx.globalAlpha = mk < 0.15 ? mk / 0.15 : (1 - (mk - 0.15) / 0.85);
      var ms = 1 + 0.5 * (1 - mk);
      ctx.translate(CW / 2, CH * 0.34); ctx.scale(ms, ms);
      ctx.font = '900 34px sans-serif'; ctx.textAlign = 'center';
      ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(10,4,30,.7)';
      var txt = milestone.n === 'FEVER' ? '🔥 FEVER!!' : milestone.n + ' COMBO!';
      ctx.strokeText(txt, 0, 0);
      ctx.fillStyle = milestone.n === 'FEVER' ? '#ffb84d' : '#ffd94d';
      ctx.fillText(txt, 0, 0);
      ctx.restore();
    }
  }
  /* 判定ポップ：ノーツの視認を妨げないよう小さく・短く・装飾控えめに。
     種類の判別は色＋太字で保つ（PERFECT=金 / GREAT=桃 / GOOD=緑 / MISS=灰） */
  if (!judgePop) return;
  var k = (performance.now() - judgePop.t0) / JUDGE_POP_MS;
  if (k >= 1) { judgePop = null; return; }
  var res = judgePop.res;
  var scale = 1 + 0.22 * Math.exp(-k * 9);
  ctx.save();
  ctx.globalAlpha = k < 0.65 ? 0.92 : 0.92 * (1 - (k - 0.65) / 0.35);
  ctx.translate(CW / 2, judgeY() - 96); ctx.scale(scale, scale);
  ctx.font = '900 ' + JUDGE_FONT_PX + 'px sans-serif'; ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(10,4,30,.7)';
  ctx.strokeText(res, 0, 0);
  if (res === 'PERFECT') {
    ctx.shadowColor = 'rgba(255,205,60,.8)'; ctx.shadowBlur = 5;
    ctx.fillStyle = '#ffd94d';
    ctx.fillText(res, 0, 0);
    ctx.shadowBlur = 0;
  } else if (res === 'GREAT') { ctx.shadowColor = 'rgba(255,122,193,.6)'; ctx.shadowBlur = 3; ctx.fillStyle = '#ff7ac1'; ctx.fillText(res, 0, 0); ctx.shadowBlur = 0; }
  else if (res === 'GOOD') { ctx.fillStyle = '#4ade80'; ctx.fillText(res, 0, 0); }
  else { ctx.fillStyle = '#8f8fa8'; ctx.fillText(res, 0, 0); }
  ctx.restore();
}
fitCanvas();
renderSongList();
requestAnimationFrame(draw);

/* ---------------- オンライン対戦（PeerJS・フレンド招待制は friends.js が担う） ---------------- */
var PEER_PREFIX = 'playweb-sr-';
var PEER_OPTS = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }, { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }, { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }] } };
var peer = null, conn = null, isHost = false, roomCode = '', heartbeatTimer = null, connTimer = null;
var opp = { score: 0, combo: 0, gauge: 0, fin: null };
var oppLeft = false, recorded = false, progTimer = null;
function genRoomCode() { var C = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; var s = ''; for (var i = 0; i < 6; i++) s += C.charAt(Math.floor(Math.random() * C.length)); return s; }
function peerAvailable() { return typeof window.Peer !== 'undefined'; }
function sendNet(o) { if (conn && conn.open) { try { conn.send(o); } catch (e) {} } }
function setOnlineStatus(html) { var el = $('onlineStatus'); if (el) el.innerHTML = html; }
function startHeartbeat() { stopHeartbeat(); heartbeatTimer = setInterval(function () { sendNet({ t: 'ping' }); }, 8000); }
function stopHeartbeat() { if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; } }
function armConnTimer(msg) { clearTimeout(connTimer); connTimer = setTimeout(function () { if (!conn || !conn.open) setOnlineStatus('<span class="err">' + msg + '</span>'); }, 25000); }
function disarmConnTimer() { clearTimeout(connTimer); }
function gateOk() {
  if (window.PWFriends && PWFriends.gateState) {
    var g = PWFriends.gateState();
    if (g === 'guest' || g === 'sdk-down') { setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>'); return false; }
  }
  return true;
}
function setupConn(c) {
  conn = c;
  c.on('data', onNetData);
  c.on('open', function () { disarmConnTimer(); startHeartbeat(); });
  c.on('close', function () { if (conn === c) onNetDisconnected(); });
  c.on('error', function () { if (conn === c) onNetDisconnected(); });
}
function teardownOnline() {
  stopHeartbeat(); clearTimeout(connTimer);
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  try { if (conn) conn.close(); } catch (e) {}
  try { if (peer) peer.destroy(); } catch (e) {}
  conn = null; peer = null;
}
function resetVs() {
  opp = { score: 0, combo: 0, gauge: 0, fin: null };
  oppLeft = false; recorded = false;
  $('vsOppScore').textContent = '0'; $('vsOppCombo').textContent = ''; $('vsOppGauge').style.width = '0%';
  $('vsMeScore').textContent = '0'; $('vsMeCombo').textContent = ''; $('vsMeGauge').style.width = '0%';
}
function hostRoom() {
  if (!peerAvailable()) { setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  if (!gateOk()) return;
  teardownOnline(); isHost = true; roomCode = genRoomCode();
  window.PW_ROOM_CODE = roomCode;
  setOnlineStatus('部屋を作成中…');
  try { peer = new Peer(PEER_PREFIX + roomCode, PEER_OPTS); } catch (e) { setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', function () {
    $('roomCodeText').textContent = roomCode;
    $('onlineCodeWrap').classList.remove('hidden');
    $('leaveBtn').classList.remove('hidden');
    setOnlineStatus('フレンドの参加を待っています…');
  });
  peer.on('connection', function (c) { setupConn(c); armConnTimer('相手との接続を確立できませんでした。'); });
  peer.on('error', function (err) { if (err && err.type === 'unavailable-id') setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>'); });
  peer.on('disconnected', function () { try { peer.reconnect(); } catch (e) {} });
}
function joinRoom() {
  if (!peerAvailable()) { setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; }
  if (!gateOk()) return;
  var code = ($('joinCode').value || '').trim().toUpperCase();
  if (code.length !== 6) { setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; }
  teardownOnline(); isHost = false; roomCode = code;
  setOnlineStatus('接続中…');
  try { peer = new Peer(undefined, PEER_OPTS); } catch (e) { setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', function () {
    armConnTimer('接続を確立できませんでした。');
    var c = peer.connect(PEER_PREFIX + code, { reliable: true });
    setupConn(c);
    c.on('open', function () {
      $('leaveBtn').classList.remove('hidden');
      sendNet({ t: 'hello' });
      setOnlineStatus('接続しました。ホストの開始を待っています…');
    });
  });
  peer.on('error', function (err) { if (err && err.type === 'peer-unavailable') setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>'); });
}
function leaveOnline() {
  sendNet({ t: 'leave' });
  teardownOnline();
  window.PW_ROOM_CODE = '';
  $('onlineCodeWrap').classList.add('hidden');
  $('leaveBtn').classList.add('hidden');
  $('vsStartBtn').classList.add('hidden');
  setOnlineStatus('');
  if (playing) stopSong(true);
  resetStage();
}
function hostStartMatch() {
  resetVs();
  sendNet({ t: 'start', song: selSong, diff: selDiff });
  setOnlineStatus('対戦開始！');
  beginOnlineSong();
}
function beginOnlineSong() {
  startSong();
  if (progTimer) clearInterval(progTimer);
  progTimer = setInterval(sendProg, 600);
}
function sendProg() {
  if (mode !== 'online' || !conn) return;
  sendNet({ t: 'prog', score: Math.floor(scoreF), combo: combo, gauge: Math.round(gauge), done: playing ? 0 : 1 });
}
function finishOnline(res, totalScore, isBest) {
  if (progTimer) { clearInterval(progTimer); progTimer = null; }
  var myFin = { score: totalScore, perfect: counts.perfect, great: counts.great, good: counts.good, miss: counts.miss, maxCombo: maxCombo, gauge: Math.round(gauge) };
  sendNet({ t: 'fin', fin: myFin });
  if (opp.fin || oppLeft) showVsResult(res, myFin, isBest);
  else {
    var p = $('resultPanel');
    p.innerHTML = '<div class="rdetail" style="font-size:16px">あなたのスコア <b style="color:var(--txt)">' + totalScore.toLocaleString() + '</b><br>相手の終了を待っています…</div>';
    p.classList.remove('hidden');
    pendingVs = { res: res, myFin: myFin, isBest: isBest };
  }
}
var pendingVs = null;
function showVsResult(res, myFin, isBest) {
  pendingVs = null;
  var o = opp.fin;
  var verdict, result;
  if (oppLeft || !o) { verdict = '🏆 あなたの勝ち！（相手が退出）'; result = 'win'; }
  else if (myFin.score > o.score) { verdict = '🏆 あなたの勝ち！'; result = 'win'; }
  else if (myFin.score < o.score) { verdict = '相手の勝ち…'; result = 'lose'; }
  else if (maxCombo > o.maxCombo) { verdict = '🏆 あなたの勝ち！（コンボ差）'; result = 'win'; }
  else if (maxCombo < o.maxCombo) { verdict = '相手の勝ち…（コンボ差）'; result = 'lose'; }
  else { verdict = '引き分け'; result = 'draw'; }
  var vsInfo = verdict + '<br>あなた ' + myFin.score.toLocaleString() + ' 点 vs 相手 ' + (o ? o.score.toLocaleString() : '-') + ' 点';
  showResult(res, myFin.score, !!isBest, vsInfo);
  if (!recorded) {
    recorded = true;
    if (window.PWFriends && PWFriends.recordMatch) PWFriends.recordMatch(result);
  }
}
function requestRematch() {
  if (isHost) { hostStartMatch(); }
  else { sendNet({ t: 'rematch' }); setOnlineStatus('再戦をリクエストしました…'); }
}
function onNetData(m) {
  if (!m || m.t === 'ping') return;
  if (m.t === 'hello') {
    if (isHost) {
      $('vsStartBtn').classList.remove('hidden');
      setOnlineStatus('フレンドが参加しました！「対戦スタート」を押してください。');
    }
    return;
  }
  if (m.t === 'start') {
    selSong = songById(m.song).id; selDiff = DIFFS[m.diff] ? m.diff : 'normal';
    document.querySelectorAll('#diffSeg button').forEach(function (x) { x.classList.toggle('on', x.dataset.d === selDiff); });
    renderSongList();
    setOnlineStatus('対戦開始！');
    beginOnlineSong();
    return;
  }
  if (m.t === 'prog') {
    opp.score = m.score; opp.combo = m.combo; opp.gauge = m.gauge;
    $('vsOppScore').textContent = Number(m.score).toLocaleString();
    $('vsOppCombo').textContent = m.combo >= 2 ? m.combo + 'コンボ' : '';
    $('vsOppGauge').style.width = m.gauge + '%';
    return;
  }
  if (m.t === 'fin') {
    opp.fin = m.fin;
    if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
    return;
  }
  if (m.t === 'rematch') { if (isHost) hostStartMatch(); return; }
  if (m.t === 'leave') { onOppLeft(); return; }
}
function onOppLeft() {
  oppLeft = true;
  setOnlineStatus('<span class="err">相手が退出しました。</span>');
  if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
}
function onNetDisconnected() {
  setOnlineStatus('<span class="err">接続が切れました。</span>');
  if (playing || pendingVs) onOppLeft();
}
$('hostBtn').addEventListener('click', hostRoom);
$('joinBtn').addEventListener('click', joinRoom);
$('leaveBtn').addEventListener('click', leaveOnline);
$('vsStartBtn').addEventListener('click', function () { $('vsStartBtn').classList.add('hidden'); hostStartMatch(); });

window.__sr = {
  SONGS: SONGS, DIFFS: DIFFS, buildSongData: buildSongData, buildChart: buildChart,
  judgeFor: judgeFor, gaugeDelta: gaugeDelta, makeResult: makeResult, JUDGE_FACTOR: JUDGE_FACTOR,
  mulberry32: mulberry32,
  state: function () { return { playing: playing, songTime: songTime, score: Math.floor(scoreF), combo: combo, maxCombo: maxCombo, gauge: gauge, fever: fever, counts: counts, chartLen: chart.length, held: heldLane.slice() }; },
  startSolo: function (songId, diff) { mode = 'solo'; selSong = songId; selDiff = diff; startSong(); },
  pressLane: function (lane) { heldLane[lane]++; pressLane(lane); },
  releaseLane: function (lane) { heldLane[lane] = Math.max(0, heldLane[lane] - 1); releaseLane(lane); },
  flick: function (dir) { flickAttempt(dir, null); },
  setTime: function (t) { timeOverride = t; },
  clearTime: function () { timeOverride = null; },
  step: function (dtF) { stepGame(dtF || 1 / 60); },
  upcoming: function (within) {
    var out = [];
    for (var i = 0; i < chart.length; i++) {

    }
    return out;
  },
  finishNow: function () { if (playing) { finishSong(); } },
  flickColor: FLICK_COL,
  scheduleStep: scheduleStep,
  vocalCalls: function () { return vocalCalls; },
  judgeBar: function () { return judgeBarSegs(); },
  perspU: perspU,
  noteVisual: function (nt) { return noteVisual(nt, noteY(nt.t)); },
  noteYAt: function (t) { return noteY(t); },
  judgeYAt: function () { return judgeY(); },
  padRect: function (lane) { return padRect(lane); },

  getSpeed: function () { return speedMul; },
  setSpeed: function (v) { setSpeed(v); },
  getTapSe: function () { return tapSe; },
  tapSound: function (lane) { laneTapSound(lane); },
  setTapSe: function (id) { setTapSe(id); },
  tapSes: function () { return TAP_SES.map(function (s) { return s.id; }); },
  judgeFontPx: function () { return JUDGE_FONT_PX; },
  judgePopMs: function () { return JUDGE_POP_MS; },
  chorusOf: function (id) { var s = songById(id); return chorusRangesSec(s, buildSongData(s)); },
  onsetAt: function (id, step) { return onsetAt(songById(id), step); },
  chorusMul: function () { return CHORUS_MUL; },
  chorusMixNow: function () { return chorusMix; },
  approachSec: function () { return approachSec(); },
  audioInfo: function () { return { active: curAudioActive, started: audioStartedFlag, ended: audioEndedFlag, duration: (audioEl && isFinite(audioEl.duration)) ? audioEl.duration : null, currentTime: audioEl ? audioEl.currentTime : null, paused: audioEl ? audioEl.paused : null }; },
  audioReady: function (id) { var s = songById(id); return s.audio ? audioDataReady(s) : null; },
  audioEl: function () { return audioEl; },
  padInfo: function (lane) { var p = padRect(lane), s = judgeBarSegs()[lane]; return { pad: p, seg: s, same: p.x === s.x && p.y === s.y && p.w === s.w && p.h === s.h, judgeY: judgeY() }; },
  toastVisible: function () { var el = $('audioToast'); return !!el && !el.classList.contains('hidden'); }
};
})();
