<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>スターリズム | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0618;--accent:#ff5d8f;--accent2:#7c5cff;--cyan:#3fd6ff;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.14);--txt:#fdfaff;--sub:#b9aede;--gold:#ffc93c;--perfect:#ffd94d;--great:#ff7ac1;--good:#4ade80;--miss:#8f8fa8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 90% at 50% 0%,#1d1140 0%,#0a0618 55%,#05030f 100%);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:10px 14px 12px;display:flex;flex-direction:column;gap:9px;height:calc(100dvh - 46px);overflow:hidden}
.ttl{font-size:25px;font-weight:900;text-align:center;letter-spacing:.06em;background:linear-gradient(92deg,#ffd94d 0%,#ff5d8f 38%,#7c5cff 72%,#3fd6ff 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 10px rgba(255,93,143,.45))}
.ttl small{display:block;font-size:10.5px;letter-spacing:.34em;-webkit-text-fill-color:var(--sub);font-weight:800;margin-top:1px}
#modeSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;min-height:40px}
#modeSeg button.on{background:linear-gradient(92deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 12px rgba(255,93,143,.5)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.hidden{display:none!important}
.btn{background:linear-gradient(92deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;flex:1;min-height:48px;box-shadow:0 4px 16px rgba(255,93,143,.35)}
.btn.blue{background:linear-gradient(92deg,#2563eb,#06b6d4);box-shadow:0 4px 16px rgba(59,130,246,.35)}
.btn.sub{background:rgba(255,255,255,.1);color:var(--txt);border:1px solid var(--line);box-shadow:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.netBtns{display:flex;gap:8px;margin-bottom:10px}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:11px;font-size:16px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit;min-height:48px}
#onlineStatus{font-size:13px;color:var(--sub);min-height:20px;margin-top:10px;line-height:1.6;text-align:center}
#onlineStatus .err{color:#f87171;font-weight:700}
#onlineCodeWrap{text-align:center;margin-top:10px;font-size:14px}
#roomCodeText{font-size:26px;font-weight:900;letter-spacing:.3em;color:var(--gold)}
.help{font-size:11.5px;color:var(--sub);line-height:1.75;text-align:center}
.songList{display:flex;flex-direction:column;gap:8px}
.songCard{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:2px solid var(--line);border-radius:16px;padding:8px 12px 8px 8px;color:var(--txt);cursor:pointer;font-family:inherit;min-height:72px;position:relative;overflow:hidden;transition:border-color .15s, box-shadow .15s}
.songCard.on{border-color:var(--gold);box-shadow:0 0 0 1px rgba(255,201,60,.5),0 6px 22px rgba(255,201,60,.22)}
.songCard .jacket{width:56px;height:56px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:31px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.4)}
.songCard .jacket::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 62%);transform:translateX(-120%);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(130%)}}
.jk-pop{background:linear-gradient(135deg,#ff5d8f,#ffb3d9 45%,#7dd3fc)}
.jk-rock{background:linear-gradient(135deg,#f43f5e,#f59e0b 55%,#1f2937)}
.jk-electro{background:linear-gradient(135deg,#6366f1,#a855f7 50%,#22d3ee)}
.songCard .grow{flex:1;min-width:0}
.songCard .nm{font-size:16.5px;font-weight:900;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songCard .meta{font-size:11.5px;color:var(--sub);margin-top:2px}
.songCard .bst{text-align:right;flex:none}
.songCard .bst .sc{font-size:13px;color:var(--gold);font-weight:900;white-space:nowrap}
.songCard .bst .rk{display:inline-block;margin-top:2px;font-size:11px;font-weight:900;padding:1px 8px;border-radius:999px;background:rgba(255,201,60,.16);border:1px solid rgba(255,201,60,.55);color:var(--gold)}
.songCard .bst .none{font-size:11px;color:var(--sub)}
#diffSeg{display:flex;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;margin-top:8px}
#diffSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:8px 4px;border-radius:999px;font-size:13.5px;font-weight:800;cursor:pointer;font-family:inherit;min-height:40px}
#diffSeg button.on{background:linear-gradient(92deg,var(--gold),#ff9d5c);color:#2a1500;box-shadow:0 2px 10px rgba(255,201,60,.4)}
#speedSeg{display:flex;align-items:center;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;margin-top:8px}
#speedSeg .segLbl{font-size:11px;color:var(--sub);font-weight:800;padding:0 4px 0 9px;white-space:nowrap}
#speedSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:6px 2px;border-radius:999px;font-size:12.5px;font-weight:800;cursor:pointer;font-family:inherit;min-height:34px}
#speedSeg button.on{background:linear-gradient(92deg,var(--cyan),#2563eb);color:#fff;box-shadow:0 2px 10px rgba(63,214,255,.4)}
#hud{display:flex;flex-direction:column;gap:5px}
.hudRow{display:flex;align-items:baseline;gap:12px}
#hudScore{font-size:22px;font-weight:900;letter-spacing:.03em;text-shadow:0 2px 12px rgba(124,92,255,.55)}
#hudCombo{font-size:15px;font-weight:900;color:var(--gold);min-width:92px}
#hudCombo.pop{animation:cpop .18s ease-out}
@keyframes cpop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
#hudSong{margin-left:auto;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gaugeWrap{position:relative;height:14px;background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:999px;overflow:hidden}
#gaugeFill{height:100%;width:20%;background:linear-gradient(90deg,#3fd6ff,#7c5cff,#ff5d8f);border-radius:999px;transition:width .15s}
#gaugeWrap.fever #gaugeFill{background:linear-gradient(90deg,#ff5d5d,#ffb84d,#f9ff4d,#4dff88,#4dd2ff,#b84dff,#ff5d5d);background-size:200% 100%;animation:feverSlide 1.1s linear infinite}
@keyframes feverSlide{0%{background-position:0% 0}100%{background-position:200% 0}}
#gaugeMark{position:absolute;top:-1px;bottom:-1px;left:70%;width:2px;background:#fff;opacity:.85}
#gaugeLbl{font-size:11px;color:var(--sub);display:flex;justify-content:space-between}
#gaugeLbl .fv{color:var(--gold);font-weight:900;letter-spacing:.14em}
#progWrap{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
#progFill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--accent))}
#vsRow{display:flex;gap:8px}
.scoreBox{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;text-align:center;font-size:12px;color:var(--sub)}
.scoreBox b{display:block;font-size:17px;color:var(--txt)}
.scoreBox .mini{height:6px;background:rgba(255,255,255,.1);border-radius:99px;margin-top:4px;overflow:hidden}
.scoreBox .mini i{display:block;height:100%;background:#4ade80;width:0%}
#stageWrap{position:relative;flex:1;min-height:0;border-radius:18px;overflow:hidden;border:2px solid rgba(160,140,255,.35);box-shadow:0 0 34px rgba(124,92,255,.28),inset 0 0 60px rgba(60,30,140,.35);background:#0a0618;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#resultPanel{position:absolute;inset:0;background:rgba(6,3,18,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;text-align:center;z-index:5;overflow:hidden}
#resultPanel .rank{font-size:60px;font-weight:900;line-height:1;background:linear-gradient(92deg,#ffd94d,#ff5d8f,#7c5cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 3px 14px rgba(255,93,143,.5))}
#resultPanel .rank.ss{background:linear-gradient(92deg,#ff5d5d,#ffb84d,#f9ff4d,#4dff88,#4dd2ff,#b84dff,#ff5d5d);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;animation:feverSlide 1.6s linear infinite}
#resultPanel .stamp{font-size:15px;font-weight:900;padding:3px 15px;border-radius:999px;border:2px solid}
#resultPanel .stamp.ok{color:#4ade80;border-color:#4ade80}
#resultPanel .stamp.ng{color:#f87171;border-color:#f87171}
#resultPanel .stamp.fc{color:var(--gold);border-color:var(--gold)}
#resultPanel .stamp.ap{color:#fff;border-color:#fff;background:linear-gradient(92deg,rgba(255,93,143,.5),rgba(124,92,255,.5))}
#resultPanel .rscore{font-size:25px;font-weight:900}
#resultPanel .rdetail{font-size:13.5px;color:var(--sub);line-height:1.8}
#resultPanel .rdetail .pj{color:var(--perfect);font-weight:900}
#resultPanel .rdetail .gj{color:var(--great);font-weight:900}
#resultPanel .rdetail .oj{color:var(--good);font-weight:900}
#resultPanel .rdetail .mj{color:var(--miss);font-weight:900}
#resultPanel .rbtns{display:flex;gap:8px;margin-top:6px;width:100%;max-width:320px}
#ctrlRow{display:flex;gap:8px;align-items:center}
.iconBtn{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--txt);border-radius:12px;min-width:48px;min-height:44px;font-size:19px;cursor:pointer;font-family:inherit}
#quitBtn{flex:1}
.wrap.playing #modeSeg,.wrap.playing #songArea,.wrap.playing #soloPane,.wrap.playing #onlinePane{display:none!important}
.wrap.playing #footHelp{display:none} /* 演奏中はフッター説明を隠してステージを広く使う（特に低丈画面） */
.wrap:not(.ingame) #stageWrap,.wrap:not(.ingame) #hud{display:none}
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#onlinePane{overscroll-behavior:none;}
</style>
</head>
<body>
<div class="wrap" id="wrapEl">
<div class="ttl">✦ スターリズム ✦<small>STAR RHYTHM</small></div>
<div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
<div id="songArea">
<div class="songList" id="songList"></div>
<div id="diffSeg"><button data-d="easy">かんたん</button><button data-d="normal" class="on">ふつう</button><button data-d="hard">むずかしい</button></div>
<div id="speedSeg"><span class="segLbl">落下速度</span><button data-s="0.8">×0.8</button><button data-s="1" class="on">×1.0</button><button data-s="1.25">×1.25</button><button data-s="1.5">×1.5</button><button data-s="2">×2.0</button></div>
</div>
<div id="soloPane">
<button id="startBtn" class="btn" style="width:100%">▶ 演奏スタート</button>
<p class="help" style="margin-top:8px">ノーツが下の<b style="color:#fff">パッド（判定ゾーン）</b>に届く瞬間にパッドをタップ！<b style="color:#ffd94d">ロング</b>は最後の瞬間にピタッと離す、<b style="color:#ffb300">フリック</b>は矢印の向きにシュッと弾こう。落下速度は上のボタンで変えられるよ。キーは D F J K（レーン）／ 矢印キー（フリック）。</p>
</div>
<div id="onlinePane" class="hidden"><div class="card">
<div class="netBtns"><button id="hostBtn" class="btn">部屋を作る</button></div>
<div class="joinRow"><input id="joinCode" maxlength="6" placeholder="コード6文字"><button id="joinBtn" class="btn blue">参加する</button></div>
<div id="onlineCodeWrap" class="hidden">ルームコード<br><span id="roomCodeText">------</span></div>
<div id="onlineStatus"></div>
<button id="vsStartBtn" class="btn hidden" style="width:100%;margin-top:8px">🎤 対戦スタート（ホスト）</button>
<button id="leaveBtn" class="btn sub hidden" style="width:100%;margin-top:8px">退出する</button>
</div></div>
<div id="hud">
<div class="hudRow"><span id="hudScore">0</span><span id="hudCombo"></span><span id="hudSong"></span></div>
<div id="gaugeWrap"><div id="gaugeFill"></div><div id="gaugeMark"></div></div>
<div id="gaugeLbl"><span>クリアゲージ（70%でクリア）</span><span class="fv hidden" id="feverLbl">🔥 FEVER!</span><span id="gaugePct">20%</span></div>
<div id="progWrap"><div id="progFill"></div></div>
<div id="vsRow" class="hidden"><div class="scoreBox">あなた<b id="vsMeScore">0</b><span id="vsMeCombo"></span><div class="mini"><i id="vsMeGauge"></i></div></div><div class="scoreBox">相手<b id="vsOppScore">-</b><span id="vsOppCombo"></span><div class="mini"><i id="vsOppGauge"></i></div></div></div>
</div>
<div id="stageWrap"><canvas id="cv"></canvas><div id="resultPanel" class="hidden"></div></div>
<div id="ctrlRow"><button id="muteBtn" class="iconBtn" title="サウンド ON/OFF">🔊</button><button id="quitBtn" class="btn sub hidden">やめる</button></div>
<p class="help" id="footHelp">曲はすべて WebAudio 合成のオリジナル曲です。ゲージ80%以上で FEVER 突入（スコア1.1倍）！</p>
</div>
<script>
/*__SR_MAIN__*/
(function () {
'use strict';
/* ================================================================
   スターリズム — 4レーン落下式リズムゲーム（WebAudio合成のオリジナル曲）
   譜面は曲データから決定的に生成する（同じ曲・同じ難易度＝同じ譜面）。
   ================================================================ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function midiHz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, k) { return a + (b - a) * k; }

var LANE_COLORS = ['#ff5d8f', '#3fd6ff', '#ffd94d', '#9d6bff'];
var LANE_KEYS = ['d', 'f', 'j', 'k'];
var FLICK_COL = '#ffb300'; /* フリック専用色（鮮やかな黄〜オレンジ系。レーン色と明確に区別する） */

/* ---------------- 曲データ ----------------
   mel は 1フレーズ=4小節×16ステップ=64文字。'.'=休符、'1'〜'9'=スケールの度数。
   bass は小節ごとのベース度数（4つ）。seq はフレーズの並び。 */
var SONGS = [
  {
    id: 'starlight', title: 'キラキラ☆スターライト', emo: '🌟', genre: 'キラキラポップ', bpm: 132, wave: 'square', theme: 'pop', jk: 'jk-pop',
    scale: [60, 62, 64, 65, 67, 69, 71, 72, 74],
    phrases: {
      A: { mel: '5...5...6...5...' + '8...7.6.5...3...' + '5.5.6.5.3.3.2.2.' + '3.3.4.3.2.1.2...', bass: [1, 6, 4, 5] },
      B: { mel: '8.8.9.8.6...5...' + '6.6.7.6.5...4...' + '5...6...7...8...' + '7.6.5.4.3...2...', bass: [1, 4, 5, 1] }
    },
    seq: ['A', 'A', 'B', 'A', 'B', 'A', 'B', 'B', 'A']
  },
  {
    id: 'runline', title: '疾走ライン', emo: '🎸', genre: '疾走ロック', bpm: 156, wave: 'sawtooth', theme: 'rock', jk: 'jk-rock', dens: 0.9,
    scale: [64, 66, 67, 69, 71, 72, 74, 76, 78],
    phrases: {
      A: { mel: '1.1.1.1.3.2.1.1.' + '1.1...1.4.3.2...' + '4.4.4.4.6.5.4.4.' + '5.4.3.2.1...2...', bass: [1, 1, 6, 7] },
      B: { mel: '8.7.6.5.6.7.8.7.' + '6.5.4.3.4.5.6...' + '8...8...7.6.5...' + '4.3.2.1.2...3...', bass: [6, 4, 1, 5] }
    },
    seq: ['A', 'A', 'B', 'A', 'B', 'A', 'B', 'B', 'A', 'B']
  },
  {
    id: 'electrica', title: '夢幻エレクトリカ', emo: '🔮', genre: '幻想エレクトロ', bpm: 118, wave: 'sine', theme: 'electro', jk: 'jk-electro', dens: 1.35,
    scale: [57, 59, 60, 62, 64, 65, 67, 69, 71],
    phrases: {
      A: { mel: '5...3...1...3...' + '4...3...2...1...' + '5...6...8...6...' + '5...3...2.......', bass: [1, 6, 4, 5] },
      B: { mel: '8.7.6.5.6.7.8...' + '9.8.7.6.5.6.7...' + '6...5...4...3...' + '2...1...2.......', bass: [1, 4, 5, 1] }
    },
    seq: ['A', 'B', 'A', 'B', 'A', 'B', 'B', 'A', 'B']
  }
];
function songById(id) { for (var i = 0; i < SONGS.length; i++) if (SONGS[i].id === id) return SONGS[i]; return SONGS[0]; }

/* 曲の全ステップを展開し、メロディイベントと小節ごとのベース根音を求める */
function buildSongData(song) {
  var stepDur = 60 / song.bpm / 4;
  var melStr = '';
  var bassByBar = [];
  song.seq.forEach(function (pk) {
    var ph = song.phrases[pk];
    melStr += ph.mel;
    for (var b = 0; b < 4; b++) bassByBar.push(song.scale[ph.bass[b] - 1] - 12);
  });
  var totalSteps = melStr.length;
  var melEvents = {}; /* step -> {midi, len} */
  var melSteps = {};
  var cur = -1, curStart = -1;
  for (var s = 0; s <= totalSteps; s++) {
    var ch = s < totalSteps ? melStr.charAt(s) : '.';
    var deg = (ch >= '1' && ch <= '9') ? (ch.charCodeAt(0) - 48) : 0;
    if (deg > 0) {
      if (cur > 0) melEvents[curStart] = { midi: song.scale[cur - 1], len: s - curStart };
      cur = deg; curStart = s; melSteps[s] = true;
    }
  }
  return { stepDur: stepDur, totalSteps: totalSteps, duration: totalSteps * stepDur, melEvents: melEvents, melSteps: melSteps, bassByBar: bassByBar, bars: totalSteps / 16 };
}

/* ---------------- 難易度と譜面生成（決定的） ---------------- */
var DIFFS = {
  easy:   { label: 'かんたん',   grid: 4, pAccent: 0.90, pOff: 0.50, minGap: 4, pLong: 0.14, pFlick: 0,    pChord: 0,    judge: { p: 0.055, g: 0.105, good: 0.165 }, approach: 1.9 },
  normal: { label: 'ふつう',     grid: 2, pAccent: 0.85, pOff: 0.22, minGap: 2, pLong: 0.20, pFlick: 0.10, pChord: 0.28, judge: { p: 0.045, g: 0.090, good: 0.145 }, approach: 1.6 },
  hard:   { label: 'むずかしい', grid: 1, pAccent: 0.88, pOff: 0.30, minGap: 1, pLong: 0.26, pFlick: 0.18, pChord: 0.42, judge: { p: 0.038, g: 0.078, good: 0.125 }, approach: 1.35 }
};
var FLICK_DIRS = ['left', 'right', 'up', 'down'];
function buildChart(song, diffKey) {
  var P = DIFFS[diffKey];
  var data = buildSongData(song);
  var rng = mulberry32(hashStr('sr:' + song.id + ':' + diffKey));
  var notes = [];
  var lastStep = -9999, prevLane = 1, sameLaneRun = 0;
  function pickLane(step, accent) {
    var lane;
    var ev = data.melEvents[step];
    if (accent && ev) {
      var deg = song.scale.indexOf(ev.midi) + 1; /* 1..9 */
      lane = Math.round((deg - 1) / 8 * 3 + (rng() * 1.1 - 0.55));
    } else {
      var mv = rng() < 0.32 ? 2 : 1;
      lane = prevLane + (rng() < 0.5 ? -mv : mv);
      if (lane < 0 || lane > 3) lane = prevLane - (lane - prevLane);
    }

    if (lane === prevLane) { sameLaneRun++; if (sameLaneRun >= 2 && rng() < 0.75) { lane = clamp(lane + (lane >= 2 ? -1 : 1), 0, 3); sameLaneRun = 0; } }

/* ---------------- セーブ（ベスト記録） ----------------
   account.js のクラウドマージが読み込み後に localStorage へ書き戻すため、

var SAVE_KEY = 'starrhythm_best_v1';

  if (saveCache && saveCache.best) {
    Object.keys(saveCache.best).forEach(function (k) {
      var a = saveCache.best[k], b = s.best[k];
      if (a && typeof a.s === 'number' && (!b || typeof b.s !== 'number' || a.s > b.s)) s.best[k] = a;

}

}
function bestKey(songId, diff) { return songId + ':' + diff; }
function getBest(songId, diff) { var s = loadSave(); var v = s.best[bestKey(songId, diff)]; return (v && typeof v.s === 'number') ? v : null; }

/* ---------------- オーディオ（全て合成） ---------------- */
var AC = null, master = null, noiseBuf = null;
var muted = false;

      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      var d = noiseBuf.getChannelData(0);

    }

}
function setMuted(m) {

  try { localStorage.setItem('starrhythm_mute', m ? '1' : '0'); } catch (e) {}

  var b = document.getElementById('muteBtn');

function toneAt(freq, t, dur, type, vol, slideTo) {
  if (!AC) return;

function snareAt(t, vol) { noiseAt(t, 0.11, 'bandpass', 1800, 0.9, vol); toneAt(190, t, 0.07, 'triangle', vol * 0.5, 120); }
function hatAt(t, vol, open) { noiseAt(t, open ? 0.14 : 0.035, 'highpass', 8200, 0.7, vol); }
function clapAt(t, vol) { noiseAt(t, 0.09, 'bandpass', 1200, 1.4, vol); noiseAt(t + 0.02, 0.12, 'bandpass', 1500, 1.2, vol * 0.7); }
/* レーンタップ音（レーンごとに音程が上がる） */
function laneTapSound(lane) { if (!AC) return; var t = AC.currentTime; toneAt(540 + lane * 110, t, 0.09, 'sine', 0.10); noiseAt(t, 0.03, 'highpass', 5000, 0.7, 0.05); }
function hitSound(res) { if (!AC) return; var t = AC.currentTime; if (res === 'PERFECT') { toneAt(1320, t, 0.1, 'sine', 0.10); toneAt(1980, t, 0.12, 'sine', 0.06); } else if (res === 'GREAT') toneAt(990, t, 0.09, 'sine', 0.08); else if (res === 'GOOD') toneAt(660, t, 0.08, 'sine', 0.06); }

/* 曲の1ステップ分をスケジュールする */
function scheduleStep(song, data, step, t) {
  var ev = data.melEvents[step];
  var bar = Math.floor(step / 16), bs = step % 16;
  var root = data.bassByBar[bar];
  if (song.theme === 'pop') {
    if (ev) toneAt(midiHz(ev.midi), t, Math.min(ev.len * data.stepDur * 0.9, 1.4), 'square', 0.11);
    if (bs % 2 === 0) toneAt(midiHz(song.scale[4] + 12 + [0, 4, 7, 12][(step >> 1) % 4]), t, data.stepDur * 1.4, 'sine', 0.045);
    if (root && bs % 4 === 0) toneAt(midiHz(root), t, data.stepDur * 3.2, 'triangle', 0.24);
    if (bs === 0 || bs === 8) kickAt(t, 0.42);
    if (bs === 4 || bs === 12) clapAt(t, 0.20);
    if (bs % 2 === 0) hatAt(t, 0.07, false);
  } else if (song.theme === 'rock') {
    if (ev) toneAt(midiHz(ev.midi), t, Math.min(ev.len * data.stepDur * 0.92, 1.4), 'sawtooth', 0.13);
    if (root && bs % 2 === 0) toneAt(midiHz(root), t, data.stepDur * 1.8, 'triangle', 0.26);
    if (bs === 0 || bs === 8 || bs === 10) kickAt(t, 0.6);
    if (bs === 4 || bs === 12) snareAt(t, 0.4);
    if (bs % 2 === 0) hatAt(t, 0.12, bs === 14);
    if (bs === 0 && bar % 4 === 0) noiseAt(t, 0.35, 'bandpass', 5200, 0.5, 0.09);
  } else { /* electro */
    if (ev) toneAt(midiHz(ev.midi), t, Math.min(ev.len * data.stepDur * 1.5, 2.2), 'sine', 0.16);
    if (bs === 0 && root) { /* パッド：根音＋3度＋5度を長く */
      var base = song.scale.indexOf(root + 12);
      [0, 2, 4].forEach(function (off) { var idx = clamp((base < 0 ? 0 : base) + off, 0, song.scale.length - 1); toneAt(midiHz(song.scale[idx] + 12), t, data.stepDur * 15, 'triangle', 0.035); });
      toneAt(midiHz(root), t, data.stepDur * 8, 'sine', 0.20);
    }
    var arpSeq = [0, 2, 4, 7, 4, 2];
    toneAt(midiHz(song.scale[2] + 24 + arpSeq[step % 6]), t, data.stepDur * 0.9, 'sine', 0.028);
    if (bs === 0 || bs === 8) kickAt(t, 0.34);
    if (bs % 4 === 2) hatAt(t, 0.05, false);
  }
}

/* ---------------- 判定の適用 ---------------- */
function applyJudge(nt, res) {
  nt.res = res;
  var key = res === 'PERFECT' ? 'perfect' : (res === 'GREAT' ? 'great' : (res === 'GOOD' ? 'good' : 'miss'));
  counts[key]++;

    if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
    return;
  }
  if (m.t === 'rematch') { if (isHost) hostStartMatch(); return; }
  if (m.t === 'leave') { onOppLeft(); return; }
}
function onOppLeft() {
  oppLeft = true;
  setOnlineStatus('<span class="err">相手が退出しました。</span>');
  if (pendingVs) showVsResult(pendingVs.res, pendingVs.myFin, pendingVs.isBest);
}
function onNetDisconnected() {
  setOnlineStatus('<span class="err">接続が切れました。</span>');
  if (playing || pendingVs) onOppLeft();
}
$('hostBtn').addEventListener('click', hostRoom);
$('joinBtn').addEventListener('click', joinRoom);
$('leaveBtn').addEventListener('click', leaveOnline);
$('vsStartBtn').addEventListener('click', function () { $('vsStartBtn').classList.add('hidden'); hostStartMatch(); });

/* テスト用フック */
window.__sr = {
  SONGS: SONGS, DIFFS: DIFFS, buildSongData: buildSongData, buildChart: buildChart,
  judgeFor: judgeFor, gaugeDelta: gaugeDelta, makeResult: makeResult, JUDGE_FACTOR: JUDGE_FACTOR,
  mulberry32: mulberry32,
  state: function () { return { playing: playing, songTime: songTime, score: Math.floor(scoreF), combo: combo, maxCombo: maxCombo, gauge: gauge, fever: fever, counts: counts, chartLen: chart.length, held: heldLane.slice() }; },
  startSolo: function (songId, diff) { mode = 'solo'; selSong = songId; selDiff = diff; startSong(); },
  pressLane: function (lane) { heldLane[lane]++; pressLane(lane); },
  releaseLane: function (lane) { heldLane[lane] = Math.max(0, heldLane[lane] - 1); releaseLane(lane); },
  flick: function (dir) { flickAttempt(dir, null); },
  setTime: function (t) { timeOverride = t; },
  clearTime: function () { timeOverride = null; },
  step: function (dtF) { stepGame(dtF || 1 / 60); },
  upcoming: function (within) {
    var out = [];
    for (var i = 0; i < chart.length; i++) {
      var nt = chart[i];
      if (nt.state !== 'wait') continue;
      if (nt.t - songTime > within) break;
      out.push({ i: i, t: nt.t, lane: nt.lane, type: nt.type, dir: nt.dir, lenSec: nt.lenSec });
    }
    return out;
  },
  finishNow: function () { if (playing) { finishSong(); } },
  flickColor: FLICK_COL,
  noteVisual: function (nt) { return noteVisual(nt, noteY(nt.t)); },
  noteYAt: function (t) { return noteY(t); },
  judgeYAt: function () { return judgeY(); },
  padRect: function (lane) { return padRect(lane); },
  laneFromX: function (x) { return laneFromX(x); },
  noteState: function (i) { return chart[i] ? chart[i].state : null; },
  getSpeed: function () { return speedMul; },
  setSpeed: function (v) { setSpeed(v); },
  approachSec: function () { return approachSec(); }
};
})();
</script>
