<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ダイスレース | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#0a0a16;--accent:#ef4444;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--txt:#fff1f1;--sub:#c7a3a3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:12px 10px 28px}
.wrap{width:100%;max-width:480px;display:flex;flex-direction:column;gap:10px}
.ttl{font-size:22px;font-weight:900;text-align:center;padding:6px 0 2px}
.ttl span{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
#modeSeg{display:flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px;gap:2px}
#modeSeg button{flex:1;border:none;background:transparent;color:var(--sub);padding:9px 6px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
#modeSeg button.on{background:var(--accent);color:#fff}
.hidden{display:none!important}
.btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45}
.btn.sub{background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--txt)}
.netBtns{display:flex;margin-bottom:10px}
.joinRow{display:flex;gap:8px}
.joinRow input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;color:var(--txt);font-size:16px;padding:10px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit}
.joinRow .btn{width:auto;flex:none}
#onlineCodeWrap{text-align:center;margin:10px 0;font-size:14px;color:var(--sub)}
#roomCodeText{display:block;font-size:30px;font-weight:900;letter-spacing:.3em;color:var(--accent);margin-top:4px}
#onlineStatus{text-align:center;font-size:13px;color:var(--sub);min-height:20px;line-height:1.6;margin-top:8px}
#onlineStatus .err{color:#f87171;font-weight:700}
#leaveBtn{margin-top:8px}
.hud{display:flex;gap:8px}
.hud .box{flex:1;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--sub)}
.hud .box b{display:block;font-size:16px;color:var(--txt);margin-top:2px}
.hud .box.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
#msg{text-align:center;font-weight:800;font-size:15px;min-height:22px;line-height:1.5}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1/1.05;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;overflow:hidden}
.cell .num{font-size:11px;font-weight:900;color:var(--sub)}
.cell .ev{font-size:9px;line-height:1.25;text-align:center;color:#fbbf24;min-height:22px}
.cell.goal{background:rgba(239,68,68,.25);border-color:var(--accent)}
.cell .tokens{margin-top:auto;display:flex;gap:3px;min-height:18px}
.tok{width:18px;height:18px;border-radius:50%;border:2px solid #fff;font-size:10px;display:flex;align-items:center;justify-content:center}
.tok.me{background:#3b82f6}.tok.opp{background:#ef4444}
#startBar{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--sub);margin-bottom:6px}
#startBar .tokens{display:flex;gap:3px;min-height:18px}
.diceRow{display:flex;gap:12px;align-items:center;justify-content:center}
#diceFace{font-size:56px;line-height:1;width:76px;height:76px;display:flex;align-items:center;justify-content:center;background:#fff;color:#111;border-radius:16px;font-weight:900}
#diceFace.rolling{animation:shk .12s infinite}
@keyframes shk{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}100%{transform:rotate(-4deg)}}
#rollBtn{flex:1;max-width:220px}
#result{text-align:center}
#result .big{font-size:20px;font-weight:900;margin-bottom:6px}
#result p{color:var(--sub);font-size:14px;line-height:1.7;margin-bottom:10px}
.best{text-align:center;color:var(--sub);font-size:12px}
/* 1画面フィット（ビューポート高さに収め、すごろく盤だけが伸縮） */
body{height:100dvh;overflow:hidden;padding:6px 10px 10px}
.wrap{flex:1;min-height:0}
#gameArea{flex:1;min-height:0;display:flex;flex-direction:column}
#board{flex:1;min-height:0;max-height:330px;grid-template-rows:repeat(4,1fr);gap:5px}
.cell{aspect-ratio:auto;height:100%;padding:2px}
.cell .ev{min-height:18px;font-size:8.5px;line-height:1.2}
.cell .tokens{min-height:14px}
#onlinePane{flex:0 1 auto;min-height:0;overflow-y:auto}
#soloPane .card{padding:10px}
.hud .box{padding:6px}
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#onlinePane{overscroll-behavior:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="ttl">🎲 ダイス<span>レース</span></div>
  <div id="modeSeg"><button data-m="solo" class="on">1人用</button><button data-m="online">オンライン対戦</button></div>
  <div id="soloPane">
    <div class="card">
      <button class="btn" id="soloStartBtn">最初から（CPU戦）</button>
      <div class="best" id="soloBest" style="margin-top:8px"></div>
    </div>
  </div>
  <div id="onlinePane" class="hidden">
    <div class="card">
      <div class="netBtns"><button class="btn" id="hostBtn">部屋を作る</button></div>
      <div class="joinRow"><input id="joinCode" maxlength="6" placeholder="コード6文字"><button class="btn" id="joinBtn">参加する</button></div>
      <div id="onlineCodeWrap" class="hidden">ルームコード<span id="roomCodeText">------</span></div>
      <div id="onlineStatus"></div>
      <button class="btn sub hidden" id="leaveBtn">退出する</button>
    </div>
  </div>
  <div id="gameArea">
    <div class="hud">
      <div class="box" id="p0Box">🔵 あなた<b id="pos0">スタート</b></div>
      <div class="box" id="p1Box">🔴 相手<b id="pos1">スタート</b></div>
    </div>
    <div id="msg" style="margin:8px 0">サイコロを振って20マス目のゴールを目指そう！</div>
    <div id="startBar">スタート地点 <span class="tokens" id="startTokens"></span></div>
    <div id="board"></div>
    <div class="card" style="margin-top:10px">
      <div class="diceRow"><div id="diceFace">🎲</div><button class="btn" id="rollBtn">🎲 サイコロを振る</button></div>
    </div>
    <div class="card hidden" id="result" style="margin-top:10px"></div>
    <div class="best" id="bestLine" style="margin-top:8px"></div>
  </div>
</div>
<script>
let AC=null;
function tone(f,d,type,v,delay){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const t=AC.currentTime+(delay||0); const o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; g.gain.setValueAtTime(v||0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+(d||0.15)); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+(d||0.15)+0.02);}catch(e){} }
const SAVE_KEY='mini_dice_v1';
const EVENTS={3:{d:2,label:'+2 すすむ'},7:{d:-2,label:'-2 もどる'},10:{d:0,label:'もう1回ふれる',extra:true},13:{d:3,label:'+3 すすむ'},16:{d:-3,label:'-3 もどる'},18:{d:0,label:'1回休み',rest:true}};
const FACES=['⚀','⚁','⚂','⚃','⚄','⚅'];
function loadSave(){ try{ return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); }catch(e){ return {}; } }
function storeSave(s){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(s)); }catch(e){} }
function renderBest(){ const s=loadSave(); const parts=[]; if(s.wins!=null) parts.push('CPU戦 勝利数: '+s.wins); if(s.bestTurns!=null) parts.push('最少ターン勝利: '+s.bestTurns+' ターン'); const txt=parts.length?('ベスト: '+parts.join(' / ')):''; document.getElementById('soloBest').textContent=txt; document.getElementById('bestLine').textContent=txt?('🏆 '+txt):''; }
let mode='solo';
let pos=[0,0], rest=[false,false], current=0, playing=false, finished=false, rolling=false, myTurns=0;
function myIdx(){ return mode==='online' ? (isHost?0:1) : 0; }
function setMsg(t){ document.getElementById('msg').textContent=t; }
function boardOrder(){ const order=[]; for(let r=0;r<4;r++){ const row=[]; for(let c=0;c<5;c++) row.push(r*5+c+1); if(r%2===1) row.reverse(); order.push.apply(order,row); } return order; }
function renderBoard(){ const b=document.getElementById('board'); b.innerHTML=''; boardOrder().forEach(n=>{ const cell=document.createElement('div'); cell.className='cell'+(n===20?' goal':''); const ev=EVENTS[n]; let toks=''; if(pos[0]===n) toks+='<span class="tok me"></span>'; if(pos[1]===n) toks+='<span class="tok opp"></span>'; cell.innerHTML='<span class="num">'+n+(n===20?' 🏁':'')+'</span><span class="ev">'+(ev?ev.label:'')+'</span><span class="tokens">'+toks+'</span>'; b.appendChild(cell); }); let st=''; if(pos[0]===0) st+='<span class="tok me"></span>'; if(pos[1]===0) st+='<span class="tok opp"></span>'; document.getElementById('startTokens').innerHTML=st; document.getElementById('pos0').textContent=pos[0]===0?'スタート':(pos[0]+' マス目'); document.getElementById('pos1').textContent=pos[1]===0?'スタート':(pos[1]+' マス目'); document.getElementById('p0Box').classList.toggle('turn', playing&&!finished&&current===0); document.getElementById('p1Box').classList.toggle('turn', playing&&!finished&&current===1); updateRollBtn(); }
function updateRollBtn(){ const btn=document.getElementById('rollBtn'); const mine=playing&&!finished&&!rolling&&current===myIdx(); btn.disabled=!mine; btn.textContent=(!playing)?'🎲 サイコロを振る':(current===myIdx()?'🎲 サイコロを振る':'相手の番です…'); }
function resetGameState(){ pos=[0,0]; rest=[false,false]; current=0; finished=false; rolling=false; myTurns=0; document.getElementById('result').classList.add('hidden'); document.getElementById('diceFace').textContent='🎲'; renderBoard(); }
function startSolo(){ resetGameState(); playing=true; setMsg('あなたの番です。サイコロを振ろう！'); renderBoard(); }
function animateDice(v, cb){ rolling=true; updateRollBtn(); const face=document.getElementById('diceFace'); face.classList.add('rolling'); let n=0; const iv=setInterval(()=>{ face.textContent=FACES[Math.floor(Math.random()*6)]; tone(300+Math.random()*200,0.05,'square',0.05); if(++n>=7){ clearInterval(iv); face.classList.remove('rolling'); face.textContent=FACES[v-1]; rolling=false; cb(); } },70); }
function onRollTap(){ if(!playing||finished||rolling) return; if(current!==myIdx()) return; const v=1+Math.floor(Math.random()*6); if(mode==='online') sendNet({t:'roll', v:v}); animateDice(v, ()=>applyRoll(v)); }
function applyRoll(v){ const p=current; if(p===myIdx()&&mode==='solo') myTurns++; if(p===0&&mode!=='solo'){} if(mode==='online'&&p===myIdx()) myTurns++; tone(660,0.12,'sine',0.12); let np=pos[p]+v; let note=''; if(np>=20){ pos[p]=20; renderBoard(); finishRace(p); return; } pos[p]=np; const ev=EVENTS[np]; let again=false; if(ev){ if(ev.extra){ again=true; note=' もう1回ふれます！'; } else if(ev.rest){ rest[p]=true; note=' 次の自分のターンは1回休み！'; } else if(ev.d){ pos[p]=Math.max(0, Math.min(19, pos[p]+ev.d)); note=' イベント: '+ev.label+' → '+pos[p]+'マス目'; } } renderBoard(); if(again){ setMsg((p===myIdx()?'あなた':'相手')+' は '+v+' を出して '+np+'マス目。'+note); scheduleNext(); return; } current=1-current; handleRestAndNext(); }
function handleRestAndNext(){ if(finished) return; if(rest[current]){ rest[current]=false; setMsg((current===myIdx()?'あなた':'相手')+' は1回休み… ターンをスキップ'); tone(220,0.15,'sawtooth',0.07); current=1-current; if(rest[current]){ rest[current]=false; current=1-current; } } renderBoard(); scheduleNext(); }
function scheduleNext(){ if(finished||!playing) return; renderBoard(); if(mode==='solo'&&current===1){ setMsg('CPUの番です…'); setTimeout(()=>{ if(!playing||finished) return; const v=1+Math.floor(Math.random()*6); animateDice(v, ()=>applyRoll(v)); },800); } else if(current===myIdx()){ setMsg('あなたの番です。サイコロを振ろう！'); } else { setMsg('相手の番です…'); } }
function finishRace(winner){ finished=true; playing=false; renderBoard(); const me=myIdx(); if(mode==='solo'){ const isWin=winner===0; if(isWin){ const s=loadSave(); s.wins=(s.wins||0)+1; if(s.bestTurns==null||myTurns<s.bestTurns) s.bestTurns=myTurns; storeSave(s); renderBest(); } showResult(isWin?'🏆 ゴール！あなたの勝ち！':'😢 CPUの勝ち…', (isWin?('あなたのターン数: '+myTurns):'もう一度挑戦しよう！'), false); if(isWin){ tone(880,0.2,'sine',0.14); tone(1320,0.3,'sine',0.12,0.1); } } else { const isWin=winner===me; if(window.PWFriends&&PWFriends.recordMatch) PWFriends.recordMatch(isWin?'win':'lose'); showResult(isWin?'🏆 ゴール！あなたの勝ち！':'😢 相手がゴール…', '20マス目に到達しました。', true); if(isWin){ tone(880,0.2,'sine',0.14); tone(1320,0.3,'sine',0.12,0.1); } } }
function showResult(big, sub, isOnline){ const r=document.getElementById('result'); r.innerHTML='<div class="big">'+big+'</div><p>'+sub+'</p>'; const btn=document.createElement('button'); btn.className='btn'; btn.textContent='もう一度'; btn.addEventListener('click',()=>{ if(!isOnline){ startSolo(); } else if(isHost){ resetGameState(); playing=true; sendNet({t:'start'}); setMsg('あなたの番です（先攻）。サイコロを振ろう！'); renderBoard(); } else { sendNet({t:'rematch'}); setMsg('ホストの開始を待っています…'); } }); r.appendChild(btn); r.classList.remove('hidden'); }
document.getElementById('rollBtn').addEventListener('click', onRollTap);
document.getElementById('soloStartBtn').addEventListener('click', startSolo);
document.querySelectorAll('#modeSeg button').forEach(b=>{ b.addEventListener('click',()=>{ document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on',x===b)); mode=b.dataset.m; document.getElementById('soloPane').classList.toggle('hidden',mode!=='solo'); document.getElementById('onlinePane').classList.toggle('hidden',mode!=='online'); playing=false; if(mode==='solo') startSolo(); else resetOnlineGame(); }); });
</script>
<script>
const PEER_PREFIX = 'playweb-dc-';
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
] } };
let peer=null, conn=null, isHost=false, roomCode='', heartbeatTimer=null, connTimer=null;
function genRoomCode(){ const C='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=C.charAt(Math.floor(Math.random()*C.length)); return s; }
function peerAvailable(){ return typeof window.Peer !== 'undefined'; }
function sendNet(o){ if (conn && conn.open){ try{ conn.send(o); }catch(e){} } }
function setOnlineStatus(html){ const el=document.getElementById('onlineStatus'); if(el) el.innerHTML=html; }
function startHeartbeat(){ stopHeartbeat(); heartbeatTimer=setInterval(()=>sendNet({t:'ping'}),8000); }
function stopHeartbeat(){ if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer=null; } }
function armConnTimer(msg){ clearTimeout(connTimer); connTimer=setTimeout(()=>{ if(!conn||!conn.open) setOnlineStatus('<span class="err">'+msg+'</span>'); },25000); }
function disarmConnTimer(){ clearTimeout(connTimer); }
function gateOk(){ if (window.PWFriends && PWFriends.gateState){ const g=PWFriends.gateState(); if (g==='guest'||g==='sdk-down'){ setOnlineStatus('<span class="err">オンライン対戦にはログインが必要です。</span>'); return false; } } return true; }
function setupConn(c){ conn=c; c.on('data', onNetData); c.on('open', ()=>{ disarmConnTimer(); startHeartbeat(); }); c.on('close', ()=>{ if(conn===c) onNetDisconnected(); }); c.on('error', ()=>{ if(conn===c) onNetDisconnected(); }); }
function teardownOnline(){ stopHeartbeat(); clearTimeout(connTimer); try{if(conn)conn.close();}catch(e){} try{if(peer)peer.destroy();}catch(e){} conn=null; peer=null; }
function hostRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; teardownOnline(); isHost=true; roomCode=genRoomCode(); window.PW_ROOM_CODE=roomCode; resetOnlineGame(); setOnlineStatus('部屋を作成中…');
  try{ peer=new Peer(PEER_PREFIX+roomCode, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ document.getElementById('roomCodeText').textContent=roomCode; document.getElementById('onlineCodeWrap').classList.remove('hidden'); document.getElementById('leaveBtn').classList.remove('hidden'); setOnlineStatus('フレンドの参加を待っています…'); });
  peer.on('connection', c=>{ setupConn(c); armConnTimer('相手との接続を確立できませんでした。'); });
  peer.on('error', err=>{ if(err&&err.type==='unavailable-id') setOnlineStatus('<span class="err">コードが重複しました。もう一度押してください。</span>'); });
  peer.on('disconnected', ()=>{ try{peer.reconnect();}catch(e){} });
}
function joinRoom(){ if(!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。</span>'); return; } if(!gateOk()) return; const code=(document.getElementById('joinCode').value||'').trim().toUpperCase(); if(code.length!==6){ setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; } teardownOnline(); isHost=false; roomCode=code; resetOnlineGame(); setOnlineStatus('接続中…');
  try{ peer=new Peer(undefined, PEER_OPTS); }catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{ armConnTimer('接続を確立できませんでした。'); const c=peer.connect(PEER_PREFIX+code,{reliable:true}); setupConn(c); c.on('open', ()=>{ document.getElementById('leaveBtn').classList.remove('hidden'); sendNet({t:'hello'}); setOnlineStatus('接続しました！対戦開始を待っています…'); }); });
  peer.on('error', err=>{ if(err&&err.type==='peer-unavailable') setOnlineStatus('<span class="err">部屋が見つかりませんでした。</span>'); });
}
function leaveOnline(){ teardownOnline(); window.PW_ROOM_CODE=''; document.getElementById('onlineCodeWrap').classList.add('hidden'); document.getElementById('leaveBtn').classList.add('hidden'); setOnlineStatus(''); resetOnlineGame(); }
function resetOnlineGame(){ resetGameState(); playing=false; renderBoard(); if(mode==='online') setMsg('部屋を作るか、コードで参加してください'); }
function startOnlineRace(){ resetGameState(); playing=true; renderBoard(); setMsg(current===myIdx()?'あなたの番です（先攻）。サイコロを振ろう！':'相手の番です（先攻）…'); }
function onNetData(msg){ if(!msg||!msg.t) return; if(msg.t==='ping') return; if(msg.t==='hello'){ if(isHost){ startOnlineRace(); sendNet({t:'start'}); setOnlineStatus('対戦中！'); } return; } if(msg.t==='start'){ startOnlineRace(); setOnlineStatus('対戦中！'); return; } if(msg.t==='roll'){ animateDice(msg.v, ()=>applyRoll(msg.v)); return; } if(msg.t==='rematch'){ if(isHost){ startOnlineRace(); sendNet({t:'start'}); } return; } }
function onNetDisconnected(){ setOnlineStatus('<span class="err">相手との接続が切れました。</span>'); playing=false; setMsg('接続が切れました'); renderBoard(); }
document.getElementById('hostBtn').addEventListener('click', hostRoom);
document.getElementById('joinBtn').addEventListener('click', joinRoom);
document.getElementById('leaveBtn').addEventListener('click', leaveOnline);
renderBest();
startSolo();
</script>
<script>window.PW_GAME='dice';window.PW_JOIN_CFG={openers:[{click:'button[data-m="online"]'}],input:'#joinCode',joinBtn:'#joinBtn',hostBtn:'#hostBtn'};</script>
<script src="friends.js"></script>
</body>
</html>
