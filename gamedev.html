<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ゲーム工房物語 | PlayWeb</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --ink:#3a2e2a; --paper:#fff8ec; --card:#fffdf7; --line:#e8d9bd;
    --accent:#ff7847; --accent2:#ffb347; --teal:#2bb3a3; --blue:#4a90d9;
    --pink:#ef6aa5; --red:#e5484d; --green:#43a95c; --gold:#e9a13b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI","Yu Gothic",sans-serif;
    background:linear-gradient(180deg,#ffe9c9 0%,#ffd9a0 45%,#ffc98a 100%);
    color:var(--ink); overflow-x:hidden;
  }
  #app{max-width:1060px;margin:0 auto;padding:8px 10px 96px}
  /* ===== HUD ===== */
  header{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    background:var(--card);border:3px solid var(--ink);border-radius:16px;
    padding:8px 12px;box-shadow:0 4px 0 rgba(58,46,42,.25);position:sticky;top:6px;z-index:40;
  }
  .home-link{ text-decoration:none;font-weight:900;color:var(--ink);background:#ffe9bd;border:2px solid var(--ink);border-radius:10px;padding:5px 10px;font-size:14px;white-space:nowrap}
  .hud-date{font-weight:900;font-size:17px;white-space:nowrap}
  .hud-item{display:flex;align-items:center;gap:4px;background:#fff3d6;border:2px solid var(--line);border-radius:999px;padding:4px 11px;font-weight:800;font-size:14px;white-space:nowrap}
  .hud-item b{font-size:15px}
  .hud-item.money b{color:#b97a0e}.hud-item.fans b{color:#d6336c}.hud-item.res b{color:#2470b8}
  .rank-badge{background:linear-gradient(135deg,#ffd76e,#ffb347);border:2px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:900;font-size:13px;white-space:nowrap}
  .speed-ctl{margin-left:auto;display:flex;gap:4px}
  .speed-ctl button{border:2px solid var(--ink);background:#fff;border-radius:10px;font-size:15px;padding:4px 10px;cursor:pointer;font-weight:900}
  .speed-ctl button.on{background:var(--accent);color:#fff}
  .icon-btn{border:2px solid var(--ink);background:#fff;border-radius:10px;font-size:15px;padding:4px 9px;cursor:pointer}
  /* ===== layout ===== */
  #main{display:grid;grid-template-columns:1fr 320px;gap:10px;margin-top:10px}
  @media(max-width:820px){#main{grid-template-columns:1fr}}
  .card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 rgba(58,46,42,.18);padding:10px}
  .card h3{font-size:15px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  #office-wrap{position:relative;padding:6px}
  canvas#office{width:100%;height:auto;display:block;border-radius:10px;background:#bfe3ff}
  #ticker{background:#3a2e2a;color:#ffe9bd;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:700;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* project card */
  .proj-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .proj-title{font-weight:900;font-size:16px}
  .badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:900;border:2px solid var(--ink)}
  .badge.dev{background:#cdeffd}.badge.debug{background:#ffe1a8}.badge.contract{background:#d9f2d0}
  .bar{height:16px;background:#f0e3c8;border:2px solid var(--ink);border-radius:999px;overflow:hidden;position:relative}
  .bar>i{display:block;height:100%;transition:width .5s ease;border-radius:999px}
  .bar-label{font-size:11px;font-weight:800;display:flex;justify-content:space-between;margin:6px 2px 2px}
  .param-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:6px}
  .pbar{height:12px;background:#f0e3c8;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
  .pbar>i{display:block;height:100%;transition:width .4s ease}
  .p-row{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800}
  .p-row .nm{width:58px;flex:none}
  .p-row .vl{width:34px;text-align:right;flex:none}
  .big-btn{
    display:block;width:100%;margin-top:10px;border:3px solid var(--ink);border-radius:14px;
    background:linear-gradient(180deg,#ffb347,#ff7847);color:#fff;font-weight:900;font-size:17px;
    padding:12px;cursor:pointer;box-shadow:0 4px 0 rgba(58,46,42,.35);letter-spacing:.05em;
  }
  .big-btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(58,46,42,.35)}
  .big-btn:disabled{filter:grayscale(.7);opacity:.55;cursor:not-allowed}
  .sub-btn{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:7px 12px;font-weight:800;font-size:13px;cursor:pointer}
  .sub-btn:active{transform:translateY(1px)}
  .sub-btn.danger{background:#ffe3e3}
  .empty-note{color:#9b8a76;font-size:13px;font-weight:700;text-align:center;padding:14px 4px;line-height:1.7}
  /* selling list */
  .sell-item{border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:#fff}
  .sell-item .t{font-weight:900;font-size:14px}
  .sell-item .meta{font-size:11px;color:#8a7663;font-weight:700}
  .spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:5px}
  .spark i{flex:1;background:linear-gradient(180deg,#ffb347,#ff7847);border-radius:2px 2px 0 0;min-height:2px}
  .mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .mini-stats .ms{background:#fff3d6;border:2px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:800}
  .mini-stats .ms b{display:block;font-size:16px}
  /* action bar */
  #actions{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:rgba(255,253,247,.96);border-top:3px solid var(--ink);
    display:flex;justify-content:center;gap:8px;padding:10px 8px calc(10px + env(safe-area-inset-bottom));
  }
  #actions button{
    border:3px solid var(--ink);border-radius:14px;background:#fff;font-weight:900;font-size:15px;
    padding:11px 14px;cursor:pointer;box-shadow:0 3px 0 rgba(58,46,42,.3);flex:1;max-width:190px;
  }
  #actions button.primary{background:linear-gradient(180deg,#ffb347,#ff7847);color:#fff}
  #actions button:disabled{filter:grayscale(.8);opacity:.5;cursor:not-allowed}
  #actions button:active{transform:translateY(2px)}
  @media(max-width:560px){#actions button{font-size:13px;padding:10px 4px}}
  /* modal */
  #overlay{position:fixed;inset:0;background:rgba(43,32,24,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 10px}
  #overlay.show{display:flex}
  .modal{background:var(--paper);border:3px solid var(--ink);border-radius:18px;max-width:640px;width:100%;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.25);animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
  .modal h2{font-size:20px;font-weight:900;margin-bottom:6px}
  .modal .desc{font-size:13px;color:#7a6552;font-weight:700;line-height:1.6;margin-bottom:12px}
  .modal .close-row{display:flex;gap:8px;margin-top:14px}
  .opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .opt{border:3px solid var(--line);background:#fff;border-radius:14px;padding:10px;cursor:pointer;text-align:left;font-family:inherit}
  .opt:hover{border-color:var(--accent2)}
  .opt.sel{border-color:var(--accent);background:#fff1e2;box-shadow:0 3px 0 rgba(255,120,71,.4)}
  .opt .ot{font-weight:900;font-size:15px}
  .opt .od{font-size:11px;color:#8a7663;font-weight:700;line-height:1.5;margin-top:2px}
  .opt .combo{font-size:12px;font-weight:900;margin-top:3px}
  .staff-row{display:flex;gap:10px;align-items:center;border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 11px;margin-bottom:8px}
  .avatar{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid var(--ink)}
  .staff-row .info{flex:1;min-width:0}
  .staff-row .nm{font-weight:900;font-size:15px}
  .staff-row .stats{font-size:11px;font-weight:800;color:#7a6552;display:flex;gap:7px;flex-wrap:wrap}
  .energy{height:9px;background:#f0e3c8;border:2px solid var(--ink);border-radius:99px;overflow:hidden;width:110px}
  .energy>i{display:block;height:100%;background:linear-gradient(90deg,#ffd76e,#43a95c)}
  .review-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
  @media(max-width:560px){.review-cards{grid-template-columns:repeat(2,1fr)}}
  .review{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px;text-align:center}
  .review .who{font-size:11px;font-weight:900;color:#8a7663}
  .review .score{font-size:34px;font-weight:900;line-height:1.1}
  .review .cmt{font-size:11px;font-weight:700;line-height:1.5;color:#5d4c3e}
  .history-item{display:flex;gap:9px;border-bottom:2px dashed var(--line);padding:7px 2px;font-size:13px;font-weight:700;align-items:center}
  .history-item .hof{color:var(--gold);font-weight:900}
  input[type=text]{width:100%;border:3px solid var(--ink);border-radius:12px;padding:11px;font-size:16px;font-weight:800;font-family:inherit;background:#fff}
  /* toast */
  #toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
  .toast{background:#3a2e2a;color:#ffe9bd;font-weight:900;font-size:14px;border-radius:999px;padding:8px 18px;box-shadow:0 4px 10px rgba(0,0,0,.3);animation:tin .25s ease;text-align:center}
  @keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
  .confetti{position:fixed;top:-12px;z-index:300;pointer-events:none;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
  .kbd-hint{font-size:11px;color:#9b8a76;font-weight:700;text-align:center;margin-top:8px}
  /* ===== オンライン対戦（ライバル対決） ===== */
  #vs-panel .vs-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  #vs-panel .vs-side{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
  #vs-panel .vs-side.me{border-color:var(--accent);background:#fff6ec}
  #vs-panel .vs-name{font-weight:900;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #vs-panel .vs-nums{font-size:12px;font-weight:800;color:#7a6552;line-height:1.75;margin-top:2px}
  #vs-panel .vs-nums b{color:var(--ink);font-size:13px}
  .vs-seg{display:flex;gap:6px}
  .vs-seg .sub-btn{flex:1}
  .vs-seg .sub-btn.sel{background:var(--accent);color:#fff}
  @media(max-width:560px){#vs-panel .vs-nums{font-size:11px;line-height:1.65}}
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="home-link" href="index.html">🏠 ホーム</a>
    <span class="hud-date" id="hud-date">1年目 1月 第1週</span>
    <span class="hud-item money">💰 <b id="hud-money">¥0</b></span>
    <span class="hud-item fans">👥 ファン <b id="hud-fans">0</b></span>
    <span class="hud-item res">🔬 研究 <b id="hud-res">0</b>pt</span>
    <span class="rank-badge" id="hud-rank">🏠 町の小さな工房</span>
    <span class="speed-ctl">
      <button id="spd-0" title="一時停止">⏸</button>
      <button id="spd-1" class="on" title="通常速度">▶</button>
      <button id="spd-2" title="2倍速">⏩</button>
      <button id="spd-4" title="4倍速">⏭</button>
    </span>
    <button class="icon-btn" id="btn-sound" title="サウンド ON/OFF">🔊</button>
    <button class="icon-btn" id="btn-save" title="セーブ">💾</button>
    <button class="icon-btn" id="btn-versus" title="オンライン対戦（ライバル対決）">⚔️</button>
  </header>

  <div id="ticker">📰 ニュースを読み込み中…</div>

  <div class="card" id="vs-panel" style="display:none;margin-top:10px"></div>

  <div id="main">
    <div>
      <div class="card" id="office-wrap">
        <h3>🏢 <span id="company-name">ほしぞら工房</span> <span style="margin-left:auto;font-size:12px;color:#9b8a76" id="office-lv-label">オフィス Lv.1（定員4人）</span></h3>
        <canvas id="office" width="720" height="500"></canvas>
      </div>
      <div class="card" style="margin-top:10px" id="project-card"></div>
    </div>
    <div>
      <div class="card">
        <h3>📊 会社の状況</h3>
        <div class="mini-stats">
          <div class="ms">発売したゲーム<b id="st-games">0本</b></div>
          <div class="ms">殿堂入り<b id="st-hof">0本</b></div>
          <div class="ms">総売上<b id="st-sales">¥0</b></div>
          <div class="ms">トロフィー<b id="st-trophy">🏆 0</b></div>
        </div>
        <div style="margin-top:8px;font-size:12px;font-weight:800;color:#7a6552" id="st-trend"></div>
      </div>
      <div class="card" style="margin-top:10px">
        <h3>🛒 販売中のゲーム</h3>
        <div id="selling-list"><div class="empty-note">まだ販売中のゲームはありません。<br>ゲームを作って発売しよう！</div></div>
      </div>
      <div class="card" style="margin-top:10px">
        <h3>📜 会社の歩み</h3>
        <div id="log-list" style="font-size:12px;font-weight:700;line-height:1.9;color:#5d4c3e"></div>
      </div>
    </div>
  </div>
</div>

<div id="actions">
  <button class="primary" id="act-dev">🎮 ゲームを作る</button>
  <button id="act-contract">📄 受託開発</button>
  <button id="act-staff">👥 社員</button>
  <button id="act-research">🔬 研究・拡張</button>
  <button id="act-data">🏆 実績・図鑑</button>
</div>

<div id="overlay"><div class="modal" id="modal-box"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* ================= ユーティリティ ================= */
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const fmtYen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const fmtNum = n => Math.round(n).toLocaleString('ja-JP');

/* ================= サウンド ================= */
let soundOn = true, AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function beep(freq, dur, type, vol, when){
  if(!soundOn) return; const c = ac(); if(!c) return;
  const t = c.currentTime + (when||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol||0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+0.02);
}
const sfx = {
  click(){ beep(660,.06,'square',.04); },
  ok(){ beep(523,.09,'square',.05); beep(784,.12,'square',.05,.08); },
  coin(){ beep(988,.08,'square',.05); beep(1319,.16,'square',.05,.07); },
  fanfare(){ [523,659,784,1047].forEach((f,i)=>beep(f,.22,'square',.06,i*.11)); },
  bad(){ beep(220,.2,'sawtooth',.05); beep(185,.3,'sawtooth',.05,.12); },
  pop(){ beep(880,.05,'triangle',.06); },
};

/* ================= データ ================= */
const PLATFORMS = [
  { id:'pc',   name:'PC',           icon:'💻', license:0,       price:2400, devSize:1.0,  shareBase:26, desc:'開発費が安くて手堅い。まずここから。' },
  { id:'poke', name:'ポケッピ',     icon:'🎮', license:200000,  price:2980, devSize:1.1,  shareBase:34, desc:'携帯ゲーム機。シェアが大きく若者に人気。' },
  { id:'fami', name:'ファミボックス', icon:'🕹️', license:500000, price:4800, devSize:1.35, shareBase:30, launch:6,  desc:'家庭用ゲーム機。発売は1年目6月。単価が高い。' },
  { id:'play', name:'プレイボックス', icon:'▶️', license:1200000, price:5800, devSize:1.6, shareBase:0,  launch:19, desc:'2年目7月に登場する次世代機。大きな市場。' },
  { id:'swi',  name:'スイッチャン',   icon:'🔀', license:1500000, price:6800, devSize:1.7, shareBase:0,  launch:43, desc:'4年目に登場。据置と携帯のいいとこ取り。' },
];
const GENRES = [
  { id:'rpg',    name:'RPG',           icon:'⚔️', cost:1.15, sales:1.15, unlock:0 },
  { id:'action', name:'アクション',     icon:'💥', cost:1.0,  sales:1.1,  unlock:0 },
  { id:'puzzle', name:'パズル',         icon:'🧩', cost:0.7,  sales:0.85, unlock:0 },
  { id:'sim',    name:'シミュレーション', icon:'🏙️', cost:1.05, sales:1.0, unlock:0 },
  { id:'music',  name:'音ゲー',         icon:'🎵', cost:0.9,  sales:0.95, unlock:30 },
  { id:'love',   name:'恋愛',           icon:'💕', cost:0.85, sales:0.9,  unlock:30 },
  { id:'race',   name:'レース',         icon:'🏎️', cost:1.1,  sales:1.05, unlock:45 },
  { id:'horror', name:'ホラー',         icon:'👻', cost:0.9,  sales:0.9,  unlock:45 },
  { id:'sport',  name:'スポーツ',       icon:'⚽', cost:1.0,  sales:1.0,  unlock:60 },
  { id:'rogue',  name:'ローグライク',   icon:'🗺️', cost:0.95, sales:1.0,  unlock:80 },
];
const THEMES = [
  { id:'fantasy', name:'ファンタジー', icon:'🐉', unlock:0 },
  { id:'school',  name:'学園',         icon:'🏫', unlock:0 },
  { id:'space',   name:'宇宙',         icon:'🚀', unlock:0 },
  { id:'cat',     name:'猫',           icon:'🐱', unlock:0 },
  { id:'sengoku', name:'戦国',         icon:'🏯', unlock:0 },
  { id:'ninja',   name:'忍者',         icon:'🥷', unlock:25 },
  { id:'robot',   name:'ロボット',     icon:'🤖', unlock:25 },
  { id:'magic',   name:'魔法少女',     icon:'🪄', unlock:40 },
  { id:'zombie',  name:'ゾンビ',       icon:'🧟', unlock:40 },
  { id:'pirate',  name:'海賊',         icon:'🏴‍☠️', unlock:55 },
  { id:'daily',   name:'日常',         icon:'🍞', unlock:55 },
  { id:'cyber',   name:'サイバー',     icon:'🌐', unlock:70 },
];
/* 相性: best ◎ / good ○ / bad △ （未登録は ふつう） */
const COMBO = {
  rpg:    { best:['fantasy','sengoku'], good:['space','ninja','magic'], bad:['daily'] },
  action: { best:['ninja','sengoku'],   good:['robot','space','pirate'], bad:['cat'] },
  puzzle: { best:['cat','daily'],       good:['school','magic'], bad:['zombie'] },
  sim:    { best:['daily','school'],    good:['sengoku','pirate','cyber'], bad:['zombie'] },
  music:  { best:['school','magic'],    good:['cat','cyber'], bad:['sengoku'] },
  love:   { best:['school','daily'],    good:['magic','fantasy'], bad:['robot','zombie'] },
  race:   { best:['cyber','space'],     good:['robot','pirate'], bad:['fantasy'] },
  horror: { best:['zombie','school'],   good:['daily','fantasy'], bad:['cat','magic'] },
  sport:  { best:['school','daily'],    good:['cyber','pirate'], bad:['fantasy'] },
  rogue:  { best:['fantasy','zombie'],  good:['cyber','space'], bad:['daily'] },
};
function comboOf(g,t){
  const c = COMBO[g]; if(!c) return 'normal';
  if(c.best.includes(t)) return 'best';
  if(c.good.includes(t)) return 'good';
  if(c.bad.includes(t)) return 'bad';

function platformShare(p, absMonth){
  if(p.launch && absMonth < p.launch) return 0;
  const age = absMonth - (p.launch||0);
  let s = p.shareBase;
  if(p.id==='poke') s = 34 + Math.min(10, age*0.4) - Math.max(0,(age-40)*0.5);
  if(p.id==='fami') s = 30 + Math.min(12, age*0.5) - Math.max(0,(age-48)*0.6);
  if(p.id==='play') s = 8 + Math.min(38, age*1.6) - Math.max(0,(age-55)*0.5);
  if(p.id==='swi')  s = 10 + Math.min(32, age*1.5);
  if(p.id==='pc')   s = 26 - Math.min(8, absMonth*0.05);
  return clamp(s, 4, 48);
}

function startProject(cfg){
  const pf = PLATFORMS.find(p=>p.id===cfg.platform);
  const gn = GENRES.find(g=>g.id===cfg.genre);
  const dir = DIRECTIONS.find(d=>d.id===cfg.direction);
  const devCost = Math.round(380000 * pf.devSize * gn.cost * dir.cost);
  const total = pf.license + devCost;
  if(S.money < total){ toast('💸 資金が足りません'); sfx.bad(); return false; }
  S.money -= total;
  const combo = comboOf(cfg.genre, cfg.theme);
  if(!S.comboFound[cfg.genre+'|'+cfg.theme]){
    S.comboFound[cfg.genre+'|'+cfg.theme] = combo;
    if(combo==='best') { toast('💡 相性バツグンの組み合わせを発見！'); sfx.fanfare(); }
    else if(combo==='bad') toast('💡 相性の悪い組み合わせだと分かった…');
    else if(combo==='good') toast('💡 相性のいい組み合わせを発見！');
  }
  S.project = {
    platform: cfg.platform, genre: cfg.genre, theme: cfg.theme, direction: cfg.direction,
    sequelOf: cfg.sequelOf || null,
    progress: 0, fun:0, crea:0, graph:0, sound:0, bugs:0,
    phase:'dev', m40:false, m80:false, hype: S.adsHype, devCost: total, weeks:0,
  };
  S.adsHype = 0;
  addLog(`🎮 新作の開発スタート！（${gn.name}×${THEMES.find(t=>t.id===cfg.theme).name}）`);
  sfx.ok();
  return true;
}
function devTick(){
  const P = S.project, dir = DIRECTIONS.find(d=>d.id===P.direction);
  const pf = PLATFORMS.find(p=>p.id===P.platform);
  const t = teamTotals();
  P.weeks++;
  // 社員の疲労
  for(const st of S.staff){
    if(st.resting){ st.energy = clamp(st.energy+25,0,100); if(st.energy>65){ st.resting=false; st.bubble='✨'; st.bubbleT=3; } continue; }
    st.energy = clamp(st.energy - 7*dir.fatigue, 0, 100);
    if(st.energy <= 0){ st.resting = true; st.bubble = '💤'; st.bubbleT = 4; toast(`💤 ${st.name}が疲れて休憩に入った`); }
  }
  if(P.phase === 'debug'){
    const fixed = Math.min(P.bugs, 4 + t.pg*0.13);
    P.bugs -= fixed;
    S.research += fixed * 0.35;
    if(Math.random() < 0.3 && S.staff.length){ const st = pick(S.staff); st.bubble='🔍'; st.bubbleT=2; }
    return;
  }
  const combo = COMBO_MULT[comboOf(P.genre, P.theme)];
  const gLv = 1 + (S.genreLv[P.genre]||0)*0.03 + (S.themeLv[P.theme]||0)*0.02;
  const k = 0.16 * dir.quality * combo.grow * gLv;
  const before = P.progress;
  P.progress += (10 + t.pg*0.16) * dir.speed / pf.devSize * (S.project.sequelOf ? 1.05 : 1);
  let w;
  if(P.progress < 40){ w = { fun:(t.sc*.5+t.pg*.3), crea:t.sc*.55, graph:t.gr*.30, sound:t.sd*.18 }; }
  else if(P.progress < 80){ w = { fun:(t.pg*.35+t.sc*.25), crea:t.sc*.3, graph:t.gr*.62, sound:t.sd*.35 }; }
  else { w = { fun:t.pg*.3, crea:t.sc*.25, graph:t.gr*.3, sound:t.sd*.62 }; }
  P.fun += w.fun*k; P.crea += w.crea*k; P.graph += w.graph*k; P.sound += w.sound*k;
  if(P.sequelOf){ P.fun += 0.4; P.crea += 0.3; }
  P.bugs += Math.max(0, rand(0,7) - t.pg*0.05);
  // ランダムイベント
  if(Math.random() < 0.13 && S.staff.length){
    const st = pick(S.staff); const ev = randi(0,2);
    if(ev===0){ const key = pick(['fun','crea','graph','sound']); P[key] += rand(4,9); st.bubble='💡'; st.bubbleT=3; floatText(st, '+ひらめき', '#e9a13b'); }
    else if(ev===1){ P.bugs += randi(3,7); st.bubble='💦'; st.bubbleT=3; toast('🐛 バグが多発している…！'); }
    else { S.fans += 25; st.bubble='💌'; st.bubbleT=3; toast('💌 ファンレターが届いた！ファン+25'); }
  }
  if(Math.random() < 0.4 && S.staff.length){ const st = pick(S.staff.filter(s=>!s.resting)); if(st){ st.bubble='♪'; st.bubbleT=1.5; } }
  // マイルストーン
  if(before < 40 && P.progress >= 40 && !P.m40){ P.m40 = true; S.paused = true; showLeadPick('graph'); return; }
  if(before < 80 && P.progress >= 80 && !P.m80){ P.m80 = true; S.paused = true; showLeadPick('sound'); return; }
  if(P.progress >= 100){
    P.progress = 100; P.phase = 'debug';
    toast('🛠️ 開発完了！デバッグ中…バグを直して発売しよう'); sfx.ok();
    addLog('🛠️ 開発が完了し、デバッグに入った');
  }
}
function releaseGame(title){
  const P = S.project; if(!P) return;
  const pf = PLATFORMS.find(p=>p.id===P.platform);
  const gn = GENRES.find(g=>g.id===P.genre);
  const th = THEMES.find(t=>t.id===P.theme);
  const combo = COMBO_MULT[comboOf(P.genre, P.theme)];
  const avg = { fun:P.fun, crea:P.crea, graph:P.graph, sound:P.sound };
  const reviews = CRITICS.map(c => {
    const wa = (avg.fun*c.w.fun + avg.crea*c.w.crea + avg.graph*c.w.graph + avg.sound*c.w.sound) / (c.w.fun+c.w.crea+c.w.graph+c.w.sound);
    let sc = wa/3.9 + combo.score + rand(-0.9,0.9) - Math.min(2.5, P.bugs*0.06);
    sc = clamp(Math.round(sc), 1, 10);
    return { who:c.name, score:sc, cmt: sc>=8 ? c.comments.hi : sc>=5 ? c.comments.mid : c.comments.lo };
  });
  const total = reviews.reduce((a,r)=>a+r.score,0);
  const hof = total >= 32;
  const share = platformShare(pf, absMonth());
  const trendMult = S.trendGenre === P.genre ? 1.3 : 1.0;
  const units = Math.round(Math.pow(total, 2.2) * (share/35) * (10 + S.fans*0.05) * combo.sales * gn.sales * trendMult * (1 + P.hype/100) / 16);
  const game = {
    title, genre:P.genre, theme:P.theme, platform:P.platform,
    fun:Math.round(P.fun), crea:Math.round(P.crea), graph:Math.round(P.graph), sound:Math.round(P.sound),
    bugs:Math.round(P.bugs), reviewTotal: total, reviews,
    price: pf.price, totalUnits: units, soldUnits:0, totalRevenue:0,
    age:0, weekly:[], hof, year:S.year, month:S.month, devCost:P.devCost,
  };
  S.selling.push(game); S.released.unshift(game);
  S.stats.gamesMade++;
  if(hof){ S.hofCount++; }
  S.genreLv[P.genre] = Math.min(10, (S.genreLv[P.genre]||0)+1);
  S.themeLv[P.theme] = Math.min(10, (S.themeLv[P.theme]||0)+1);
  S.fans = Math.max(0, S.fans + Math.round((total-20)*6 + units*0.004) - (total<12 ? 60 : 0));
  S.project = null;
  addLog(`🚀 「${title}」発売！レビュー合計 ${total}点${hof ? '・殿堂入り！' : ''}`);
  if(VS.active && !VS.finished){ vsSend({ t:'release', title, review: total }); vsSendProg(); }
  save(true);
  showReviews(game);
}
function salesTick(){
  for(const g of S.selling){
    g.age++;

    if(g.age > 14 || (g.age > 3 && wUnits < g.totalUnits*0.008)){
      g.done = true; continue;

function refreshContracts(){
  S.contractOffers = [];
  const t = teamTotals();
  const rate = {
    fun: (t.sc*.4 + t.pg*.35) * 0.2, crea: t.sc*.45*0.2,
    graph: t.gr*.45*0.2, sound: t.sd*.4*0.2,
  };
  for(let i=0;i<3;i++){
    const params = ['fun','crea','graph','sound'];
    const p1 = pick(params); let p2 = pick(params);
    const tier = randi(0,2);
    const weeks = randi(6,9);
    const mk = p => Math.max(8, Math.round(rate[p] * weeks * rand(0.5, 0.62 + tier*0.09)));
    const req = [{ param:p1, target: mk(p1) }];
    if(tier >= 1 && p2 !== p1) req.push({ param:p2, target: mk(p2) });
    const targetSum = req.reduce((a,r)=>a+r.target, 0);
    S.contractOffers.push({
      id: 'c'+Date.now()+i, title: pick(CONTRACT_TITLES),
      req, weeks,
      reward: Math.round(targetSum*4500 + rand(80000,160000)), research: randi(6,12),
    });
  }
}
function contractTick(){
  const C = S.contract, t = teamTotals();
  C.weeksLeft--;
  for(const st of S.staff){
    if(st.resting){ st.energy = clamp(st.energy+25,0,100); if(st.energy>65) st.resting=false; continue; }
    st.energy = clamp(st.energy - 6, 0, 100);
    if(st.energy <= 0){ st.resting = true; st.bubble='💤'; st.bubbleT=3; }
  }
  const k = 0.2;
  C.prog.fun += (t.sc*.4+t.pg*.35)*k; C.prog.crea += t.sc*.45*k; C.prog.graph += t.gr*.45*k; C.prog.sound += t.sd*.4*k;
  const doneAll = C.req.every(r => C.prog[r.param] >= r.target);
  if(doneAll){
    S.money += C.reward; S.research += C.research; S.fans += 15;
    toast(`📄 受託開発が完了！報酬${fmtYen(C.reward)}＋研究${C.research}pt`);
    addLog(`📄 受託「${C.title}」を納品した`);
    sfx.coin(); S.contract = null; refreshContracts(); save(true);
  } else if(C.weeksLeft <= 0){
    S.research += 3;
    toast('📄 受託開発は期限切れ…研究3ptだけ得た'); sfx.bad();
    addLog(`📄 受託「${C.title}」は期限切れになった`);
    S.contract = null; refreshContracts();
  }
}

  ctx.fillStyle = '#8a6a44'; ctx.fillRect(620,128,86,64);

    else {
      st.mode = 'idle';
      if(!st.tx || Math.hypot(st.x-st.tx, st.y-st.ty) < 6){
        if(Math.random() < 0.01 || !st.tx){ st.tx = rand(70,650); st.ty = rand(360,450); }

      target = { x: st.tx || seat.x, y: st.ty || seat.y+40 };
      if(st.resting) target = { x: seat.x, y: seat.y - 30 };

function drawStaff(st, t, walking){
  const x = st.x, y = st.y;
  const bob = st.mode==='work' ? Math.sin(t*9 + st.phase)*1.6 : walking ? Math.abs(Math.sin(st.walk))*3 : Math.sin(t*2 + st.phase)*1;
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x, y+34, 17, 5, 0, 0, 7); ctx.fill();
  // 脚
  ctx.fillStyle = '#4a4a55';
  if(walking){ const s = Math.sin(st.walk)*6; ctx.fillRect(x-9+s, y+22, 7, 12); ctx.fillRect(x+2-s, y+22, 7, 12); }
  else { ctx.fillRect(x-9, y+22, 7, 11); ctx.fillRect(x+2, y+22, 7, 11); }
  // 体
  ctx.fillStyle = JOBS[st.job].color;
  roundRect(x-14, y+2-bob*0.3, 28, 23, 8); ctx.fill();
  // 腕（タイピング）
  ctx.fillStyle = '#ffd9b3';
  if(st.mode==='work'){ const a = Math.sin(t*11 + st.phase)*3; ctx.fillRect(x-17, y+12+a*0.4, 6, 5); ctx.fillRect(x+11, y+12-a*0.4, 6, 5); }
  else { ctx.fillRect(x-17, y+10, 6, 9); ctx.fillRect(x+11, y+10, 6, 9); }
  // 頭
  ctx.fillStyle = '#ffd9b3'; ctx.beginPath(); ctx.arc(x, y-10-bob*0.3, 13, 0, 7); ctx.fill();
  // 髪
  ctx.fillStyle = st.hair;
  ctx.beginPath(); ctx.arc(x, y-13-bob*0.3, 13, Math.PI*1.02, Math.PI*1.98); ctx.fill();
  if(st.hairStyle===1){ ctx.fillRect(x-13, y-14-bob*0.3, 5, 14); ctx.fillRect(x+8, y-14-bob*0.3, 5, 14); }
  if(st.hairStyle===2){ ctx.beginPath(); ctx.arc(x, y-24-bob*0.3, 6, 0, 7); ctx.fill(); }
  // 目（まばたき）
  const blink = (t + st.phase) % 3.4 < 0.12;
  ctx.fillStyle = '#3a2e2a';
  if(st.resting || blink){ ctx.fillRect(x-7, y-9-bob*0.3, 5, 1.6); ctx.fillRect(x+2, y-9-bob*0.3, 5, 1.6); }
  else { ctx.beginPath(); ctx.arc(x-4.5, y-9-bob*0.3, 1.8, 0, 7); ctx.arc(x+4.5, y-9-bob*0.3, 1.8, 0, 7); ctx.fill(); }
  // 名前
  ctx.font = '800 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,.85)'; const wdt = ctx.measureText(st.name).width + 8;
  roundRect(x - wdt/2, y+40, wdt, 13, 6); ctx.fill();
  ctx.fillStyle = '#3a2e2a'; ctx.fillText(st.name, x, y+50);
}
function drawBubble(st){
  ctx.font = '15px sans-serif'; ctx.textAlign = 'center';
  const wdt = 30;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  roundRect(st.x - wdt/2, st.y - 58, wdt, 24, 9); ctx.fill();
  ctx.fillText(st.bubble, st.x, st.y - 40);
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* ================= 社員モーダル ================= */
function refreshCandidates(force){
  const key = S.year + '-' + S.month;
  if(!force && S.candKey === key) return;
  S.candKey = key;
  const rankIdx = RANKS.indexOf(rankOf(S.fans));
  const tier = rankIdx >= 3 ? 2 : rankIdx >= 1 ? 1 : 0;
  S.candidates = [genStaff(tier), genStaff(tier), genStaff(Math.random()<0.25 ? Math.min(2,tier+1) : tier)];
}
function statSpans(st){
  return `<span>PG <b>${st.pg}</b></span><span>SC <b>${st.sc}</b></span><span>GR <b>${st.gr}</b></span><span>SD <b>${st.sd}</b></span>`;
}
function openStaff(){
  refreshCandidates(false);
  showModal(`
    <h2>👥 社員（${S.staff.length}/${officeCap()}人）</h2>
    <div class="desc">月給は毎月末に支払われます。研修すると能力が上がりますが、繰り返すと伸びが鈍ります。疲れた社員は待機中に回復します。</div>
    ${S.staff.map(st => `

          <div class="stats">${statSpans(st)}<span>月給 ${fmtYen(st.salary)}</span><span>研修 ${st.train}回</span></div>

        <button class="sub-btn" data-train="${st.id}">🔬 研修<br><span style="font-size:10px">研究8pt+¥30,000</span></button>
        <button class="sub-btn danger" data-fire="${st.id}">解雇</button></div>`).join('')}
    <h3 style="margin:14px 0 8px">📋 採用候補（毎月更新）</h3>
    ${S.staff.length >= officeCap() ? '<div class="desc">定員いっぱいです。オフィスを拡張すると増やせます。</div>' : S.candidates.map((c,i) => `
      <div class="staff-row"><div class="avatar" style="background:${JOBS[c.job].color}33">🙋</div>
        <div class="info"><div class="nm">${c.name}（${JOBS[c.job].name}）</div>
          <div class="stats">${statSpans(c)}<span>月給 ${fmtYen(c.salary)}</span><span>採用費 ${fmtYen(c.salary*2)}</span></div></div>
        <button class="sub-btn" data-hire="${i}" ${S.money < c.salary*2 ? 'disabled' : ''}>採用する</button></div>`).join('')}
    <div class="close-row"><button class="sub-btn" id="st-close">閉じる</button></div>`);
  $('#st-close').onclick = closeModal;
  document.querySelectorAll('[data-train]').forEach(b => b.onclick = () => {
    const st = S.staff.find(s=>s.id == b.dataset.train);
    if(S.research < 8 || S.money < 30000){ toast('研究ptか資金が足りません'); sfx.bad(); return; }
    S.research -= 8; S.money -= 30000;
    const dim = 1/(1 + st.train*0.18);
    const main = JOBS[st.job].main;
    for(const k of ['pg','sc','gr','sd']){
      const gain = Math.round(rand(0,3) * dim) + (k === main ? Math.round(rand(4,9)*dim) : 0);
      st[k] += gain;
    }
    st.train++; st.energy = clamp(st.energy - 22, 0, 100); st.salary = staffSalary(st);
    toast(`🔬 ${st.name}が研修を受けた！`); sfx.ok(); openStaff(); renderAll();
  });
  document.querySelectorAll('[data-fire]').forEach(b => b.onclick = () => {
    const st = S.staff.find(s=>s.id == b.dataset.fire);
    if(S.staff.length <= 1){ toast('最後の1人は解雇できません'); return; }
    if(!confirm(`${st.name}を解雇しますか？（退職金 ${fmtYen(st.salary)}）`)) return;
    S.money -= st.salary;
    S.staff = S.staff.filter(s=>s.id !== st.id);
    addLog(`👋 ${st.name}が退職した`); openStaff(); renderAll();
  });
  document.querySelectorAll('[data-hire]').forEach(b => b.onclick = () => {
    const c = S.candidates[Number(b.dataset.hire)];
    S.money -= c.salary*2;
    c.energy = 100; S.staff.push(c);
    S.candidates.splice(Number(b.dataset.hire), 1);
    toast(`🙋 ${c.name}が入社した！`); addLog(`🙋 ${c.name}（${JOBS[c.job].name}）が入社`); sfx.ok(); openStaff(); renderAll();
  });
}

function showAwards(best, worst){
  if(modalOpen){ pendingAward = [best, worst]; return; }
  if(S.lastAwardYear === best.year) return;

/* ================= オンライン対戦（ライバル対決） ================= */
const VS_PEER_PREFIX = 'playweb-gd-';
const VS_PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
] } };
const VS_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; /* I,O,0,1 を除外 */
let vsHeartbeat = null, vsRetryTimer = null, vsConnTimer = null;
function vsPeerAvailable(){ return typeof window.Peer !== 'undefined'; }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
/* シードだけから決まる月別の流行スケジュール。両クライアントで完全一致する */
function buildTrendSchedule(seed, months){
  const rng = mulberry32((seed >>> 0) || 1);
  const ids = GENRES.map(g => g.id);
  const sched = ['rpg'];
  for(let m = 1; m < months; m++){
    if(rng() < 0.45) sched.push(ids[Math.floor(rng() * ids.length)]);
    else sched.push(sched[m - 1]);
  }
  return sched;
}
function vsGenCode(){ let c = ''; for(let i = 0; i < 6; i++) c += VS_CODE_CHARS[(Math.random() * VS_CODE_CHARS.length) | 0]; return c; }
function vsSend(obj){ if(VS.conn && VS.conn.open){ try{ VS.conn.send(obj); }catch(e){} } }
function vsMyProg(){
  return {
    name: S.companyName, fans: Math.round(S.fans), funds: Math.round(S.money),
    releases: S.stats.gamesMade,
    bestReview: S.released.reduce((a, g) => Math.max(a, g.reviewTotal), 0),
    hof: S.hofCount,
  };
}
function vsSendProg(){ vsSend({ t:'prog', prog: vsMyProg() }); }
function vsSetStatus(html){ const el = $('#vs-status'); if(el) el.innerHTML = html; }
function vsArmTimer(){
  clearTimeout(vsConnTimer);
  vsConnTimer = setTimeout(() => {
    if(!VS.started) vsSetStatus('<span style="color:#e5484d">接続を確立できませんでした。コードが正しいか確認し、ネットワーク環境を変えて（Wi-Fi／モバイル回線の切替など）もう一度お試しください。</span>');
  }, 25000);
}
function vsDisarmTimer(){ clearTimeout(vsConnTimer); }
function startHeartbeatVs(){
  stopHeartbeatVs();
  vsHeartbeat = setInterval(() => { vsSend({ t:'ping' }); }, 8000);
}
function stopHeartbeatVs(){ if(vsHeartbeat) clearInterval(vsHeartbeat); vsHeartbeat = null; }
function vsTeardown(){
  VS.active = false; VS.started = false; VS.finished = false; VS.reconnecting = false;
  stopHeartbeatVs();
  clearTimeout(vsRetryTimer); vsDisarmTimer();
  try{ if(VS.conn) VS.conn.close(); }catch(e){}
  try{ if(VS.peer) VS.peer.destroy(); }catch(e){}
  VS.conn = null; VS.peer = null;
}

function vsHostRoom(){

}
function vsJoinRoom(code){
  if(!vsPeerAvailable()){ vsSetStatus('<span style="color:#e5484d">オンライン機能を読み込めませんでした。通信環境を確認してください。</span>'); return; }
  if(code.length !== 6){ vsSetStatus('<span style="color:#e5484d">6文字のルームコードを入力してください。</span>'); return; }

  catch(e){ vsSetStatus('<span style="color:#e5484d">接続の作成に失敗しました。</span>'); return; }
  VS.peer.on('open', () => {
    vsArmTimer();
    const c = VS.peer.connect(VS_PEER_PREFIX + code, { reliable: true });
    vsSetupConn(c);
    c.on('open', () => {
      vsSend({ t:'hello', name: VS.pendingName });
      vsSetStatus('接続しました！ホストからの対戦開始を待っています…');
    });
  });
  VS.peer.on('error', err => {
    if(err && err.type === 'peer-unavailable') vsSetStatus('<span style="color:#e5484d">部屋が見つかりませんでした。コードを確認してください。</span>');
    else if(!VS.started) vsSetStatus('<span style="color:#e5484d">接続エラーが発生しました。</span>');
  });
}
function vsSetupConn(c){
  VS.conn = c;
  c.on('data', handleVsData);
  c.on('close', () => { if(VS.conn === c) onVsDisconnected(); });
  c.on('error', () => { if(VS.conn === c) onVsDisconnected(); });
  c.on('open', () => { if(VS.started) vsDisarmTimer(); });
  c.on('iceStateChanged', st => {
    if(VS.conn !== c) return;
    if((st === 'failed' || st === 'disconnected') && !VS.started){
      vsDisarmTimer();
      vsSetStatus('<span style="color:#e5484d">接続を確立できませんでした。ネットワーク環境を変えてもう一度お試しください。</span>');
    }
  });
}

/* ---------- 対戦開始 ---------- */
function startVersus(seed, years, oppName){
  vsDisarmTimer();
  const myName = VS.pendingName || S.companyName || 'ほしぞら工房';

  S.staff = [a, b];
  VS.active = true; VS.started = true; VS.finished = false; VS.reconnecting = false;
  VS.seed = seed; VS.years = years; VS.totalWeeks = years * 48;

/* ---------- 受信処理（テストから直接呼べるよう関数として公開） ---------- */
function handleVsData(msg){
  if(!msg || typeof msg !== 'object') return;
  if(msg.t === 'ping') return;
  if(msg.t === 'hello'){
    if(!VS.isHost) return;
    VS.oppName = msg.name || 'ライバル会社';
    if(VS.started){
      /* 再接続: 対戦はリセットせず、現在の状況を送って同期し直す */
      VS.reconnecting = false;
      vsSend({ t:'resync', prog: vsMyProg() });
      if(VS.finished && VS.myFinal) vsSend({ t:'final', prog: VS.myFinal });
      startHeartbeatVs();
      renderVsPanel();
      toast('⚔️ ライバルが再接続しました');
      return;
    }
    const seed = (Math.random() * 2147483647) | 0;
    vsSend({ t:'start', seed, years: VS.pendingYears, name: VS.pendingName });
    startVersus(seed, VS.pendingYears, VS.oppName);
    return;
  }
  if(msg.t === 'start'){
    if(VS.isHost) return;
    if(VS.started){ VS.reconnecting = false; vsSendProg(); return; }
    VS.oppName = msg.name || 'ライバル会社';
    startVersus(msg.seed, msg.years, VS.oppName);
    return;
  }
  if(msg.t === 'resync'){
    VS.reconnecting = false;
    clearTimeout(vsRetryTimer);
    if(msg.prog){ VS.oppProg = msg.prog; if(msg.prog.name) VS.oppName = msg.prog.name; }
    startHeartbeatVs();
    vsSendProg();
    renderVsPanel();
    toast('⚔️ 再接続しました！対戦を続けます');
    return;
  }
  if(msg.t === 'prog'){
    VS.oppProg = msg.prog;
    if(msg.prog && msg.prog.name) VS.oppName = msg.prog.name;
    renderVsPanel();
    return;
  }
  if(msg.t === 'release'){
    toast(`⚔️ ライバルが「${msg.title}」を発売！レビュー${msg.review}点`);
    addLog(`⚔️ ライバルが「${msg.title}」を発売（レビュー${msg.review}点）`);
    sfx.pop();
    return;
  }
  if(msg.t === 'final'){
    VS.oppFinal = msg.prog;
    if(msg.prog && msg.prog.name) VS.oppName = msg.prog.name;
    renderVsPanel();
    if(VS.finished) showVsResult();
    else toast('⚔️ ライバルが対戦期間を終えました。あなたの結果が確定するまでもう少し！');
    return;
  }
  if(msg.t === 'bankrupt'){
    VS.oppBankrupt = true;
    VS.oppFinal = msg.prog || VS.oppFinal;
    if(!VS.finished) vsFinish('oppBankrupt');
    return;
  }
}

/* ---------- 進行・終了 ---------- */
function vsElapsedWeeks(){ return (S.year - 1) * 48 + (S.month - 1) * 4 + (S.week - 1); }
function vsWeekHook(){
  if(!VS.active || VS.finished) return;
  const key = S.year + '-' + S.month;
  if(key !== VS.lastProgKey){ VS.lastProgKey = key; vsSendProg(); }
  if(vsElapsedWeeks() >= VS.totalWeeks) vsFinish('period');
}
function vsJudge(mine, opp){
  if(mine.fans !== opp.fans) return mine.fans > opp.fans ? 1 : -1;
  if(mine.funds !== opp.funds) return mine.funds > opp.funds ? 1 : -1;
  return 0;
}
function vsFinish(reason){
  if(VS.finished) return;
  VS.finished = true;
  VS.finishReason = reason;
  VS.myFinal = vsMyProg();
  S.paused = true;
  stopHeartbeatVs();
  if(reason === 'bankrupt') vsSend({ t:'bankrupt', prog: VS.myFinal });
  else vsSend({ t:'final', prog: VS.myFinal });
  save(true);
  renderVsPanel();
  showVsResult();
}
function vsOnBankrupt(){ vsFinish('bankrupt'); }
function showVsResult(){
  if(!VS.finished) return;
  const mine = VS.myFinal || vsMyProg();
  const opp = VS.oppFinal || VS.oppProg;
  let title, reasonTxt, verdict = 0;
  if(VS.finishReason === 'bankrupt'){ verdict = -1; title = '💸 倒産してしまった…'; reasonTxt = '資金が尽きたため、ライバル対決は敗北になりました。'; }
  else if(VS.oppBankrupt){ verdict = 1; title = '🏆 勝利！'; reasonTxt = 'ライバル会社が倒産しました！'; }
  else if(VS.finishReason === 'period' && !VS.oppFinal){
    /* 相手の最終結果待ち */
    showModal(`
      <div id="vs-result-box">
      <h2>⏰ 対戦期間が終了！</h2>
      <div class="desc">あなたの結果は確定しました。ライバルの最終結果を待っています…（届き次第、勝敗が表示されます）</div>
      <div style="background:#fff3d6;border:2px solid var(--line);border-radius:12px;padding:12px;font-weight:800;line-height:1.9">
        🏢 ${mine.name}<br>👥 ファン ${fmtNum(mine.fans)}人 ／ 💰 資金 ${fmtYen(mine.funds)}<br>🎮 発売 ${mine.releases}本 ／ ⭐ 最高レビュー ${mine.bestReview}点
      </div>
      <div class="close-row"><button class="sub-btn" id="vs-wait-close">閉じて待つ</button></div>
      </div>`);
    $('#vs-wait-close').onclick = () => closeModal();
    return;
  }
  else { verdict = vsJudge(mine, opp); title = verdict > 0 ? '🏆 勝利！' : verdict < 0 ? '💦 敗北…' : '🤝 引き分け'; reasonTxt = `${VS.years}年間のライバル対決が終了しました！`; }
  const row = (label, mv, ov) => `<div class="history-item"><span style="flex:1">${label}</span><span style="width:104px;text-align:right"><b>${mv}</b></span><span style="width:104px;text-align:right"><b>${ov}</b></span></div>`;
  showModal(`
    <div id="vs-result-box">
    <h2>${title}</h2>
    <div class="desc">${reasonTxt} 勝敗は ファン数 → 資金 の順で判定しています。</div>
    <div class="history-item" style="font-weight:900;border-bottom:3px solid var(--ink)"><span style="flex:1"></span><span style="width:104px;text-align:right">${mine.name}</span><span style="width:104px;text-align:right">${opp ? opp.name : VS.oppName}</span></div>
    ${row('👥 ファン数', fmtNum(mine.fans) + '人', opp ? fmtNum(opp.fans) + '人' : '―')}
    ${row('💰 資金', fmtYen(mine.funds), opp ? fmtYen(opp.funds) : '―')}
    ${row('🎮 発売本数', mine.releases + '本', opp ? opp.releases + '本' : '―')}
    ${row('⭐ 最高レビュー', mine.bestReview + '点', opp ? opp.bestReview + '点' : '―')}
    ${row('🏆 殿堂入り', mine.hof + '本', opp ? opp.hof + '本' : '―')}
    <div class="close-row"><button class="big-btn" id="vs-result-close" style="margin-top:0">${VS.finishReason === 'bankrupt' ? 'タイトルに戻る' : '閉じて経営を続ける'}</button></div>
    </div>`);
  $('#modal-box').dataset.locked = '1';
  VS.resultShown = true;
  if(verdict > 0){ confetti(70); sfx.fanfare(); } else if(verdict < 0){ sfx.bad(); }
  $('#vs-result-close').onclick = () => {
    delete $('#modal-box').dataset.locked;
    closeModal();
    if(VS.finishReason === 'bankrupt'){ try{ localStorage.removeItem(VS_SAVE_KEY); }catch(e){} location.reload(); }
    else S.paused = false;
  };
}

/* ---------- ライバル表示パネル ---------- */
function renderVsPanel(){
  const p = $('#vs-panel'); if(!p) return;
  if(!VS.active){ p.style.display = 'none'; return; }
  p.style.display = '';
  const mine = vsMyProg();
  const opp = VS.oppFinal || VS.oppProg;
  const remain = Math.max(0, VS.totalWeeks - vsElapsedWeeks());
  const status = VS.finished ? '🏁 対戦終了' : VS.reconnecting ? '🔄 再接続を試みています…' : '🟢 接続中';
  const lead = opp ? mine.fans - opp.fans : 0;
  const side = (label, d, isMe) => `
    <div class="vs-side ${isMe ? 'me' : ''}">
      <div class="vs-name">${isMe ? '🏢 ' : '⚔️ '}${label}</div>
      <div class="vs-nums">👥 ファン <b>${d ? fmtNum(d.fans) : '―'}</b><br>💰 資金 <b>${d ? fmtYen(d.funds) : '―'}</b><br>🎮 発売 <b>${d ? d.releases + '本' : '―'}</b> ／ ⭐ 最高 <b>${d ? d.bestReview + '点' : '―'}</b></div>
    </div>`;
  p.innerHTML = `
    <h3>⚔️ ライバル対決 <span style="margin-left:auto;font-size:12px">${status}</span></h3>
    <div style="font-size:12.5px;font-weight:800;color:#7a6552">${VS.years}年対決 ／ 残り <b style="color:var(--ink)">${remain}週</b>
      ${opp ? (lead > 0 ? `／ <span style="color:#e5484d">ファン +${fmtNum(lead)} リード中！</span>` : lead < 0 ? `／ <span style="color:#2470b8">ファン ${fmtNum(lead)}…追いつけ！</span>` : '／ ファン互角！') : '／ ライバルの情報を待っています…'}
      ${VS.oppFinal && !VS.finished ? '／ ライバルは期間終了済み' : ''}</div>
    <div class="vs-grid">${side(mine.name + '（あなた）', mine, true)}${side(VS.oppName, opp, false)}</div>
    <button class="sub-btn danger" id="vs-quit" style="margin-top:8px">対戦をやめる</button>`;
  const q = $('#vs-quit');
  if(q) q.onclick = () => { if(confirm('対戦をやめますか？（対戦データは破棄され、ソロプレイに戻ります）')){ vsTeardown(); try{ localStorage.removeItem(VS_SAVE_KEY); }catch(e){} location.reload(); } };
}

/* ---------- 切断・再接続 ---------- */
function onVsDisconnected(){
  if(!VS.started){
    vsSetStatus('<span style="color:#e5484d">接続が切れました。もう一度お試しください。</span>');
    return;
  }
  if(VS.finished) return;
  VS.reconnecting = true;
  VS.conn = null;
  stopHeartbeatVs();
  renderVsPanel();
  toast('⚠️ 接続が切れました。再接続を試みています…（経営はそのまま続けられます）');
  if(!VS.isHost) scheduleVsReconnect();
}
function scheduleVsReconnect(){
  clearTimeout(vsRetryTimer);
  let tries = 0;
  const attempt = () => {
    if(!VS.active || !VS.reconnecting) return;
    tries++;
    if(tries > 20){
      VS.reconnecting = false;
      renderVsPanel();
      toast('再接続できませんでした。対戦はこのまま続けられます');
      return;
    }
    vsRetryTimer = setTimeout(attempt, 5000);
    try{
      if(VS.peer){ try{ VS.peer.destroy(); }catch(e){} }
      VS.peer = new Peer(undefined, VS_PEER_OPTS);
      VS.peer.on('open', () => {
        const c = VS.peer.connect(VS_PEER_PREFIX + VS.roomCode, { reliable: true });
        vsSetupConn(c);
        c.on('open', () => { vsSend({ t:'hello', name: VS.myName }); });
      });
      VS.peer.on('error', () => {});
    }catch(e){}
  };
  vsRetryTimer = setTimeout(attempt, 1500);
}

/* ================= 配線と初期化 ================= */
$('#act-dev').onclick = () => { sfx.click(); openDevModal(null); };
$('#act-contract').onclick = () => { sfx.click(); openContracts(); };
$('#act-staff').onclick = () => { sfx.click(); openStaff(); };
$('#act-research').onclick = () => { sfx.click(); openResearch(); };
$('#act-data').onclick = () => { sfx.click(); openData(); };
$('#btn-sound').onclick = e => { soundOn = !soundOn; e.target.textContent = soundOn ? '🔊' : '🔇'; if(soundOn) sfx.click(); };
$('#btn-save').onclick = () => { save(false); sfx.ok(); };
$('#btn-versus').onclick = () => { sfx.click(); openVsLobby(); };
for(const s of [0,1,2,4]){
  $('#spd-'+s).onclick = () => {
    if(s === 0){ S.paused = true; }
    else { S.paused = false; S.speed = s; }
    sfx.click(); renderAll();
  };
}
document.addEventListener('visibilitychange', () => { if(document.hidden) save(true); });

if(load() && S.started){
  toast('👋 おかえりなさい！続きから再開します');
  if(!S.contractOffers || !S.contractOffers.length) refreshContracts();
  refreshCandidates(false);
} else {
  S = newState();
  showStart();
}
renderAll();
startLoop();
requestAnimationFrame(drawOffice);
</script>
