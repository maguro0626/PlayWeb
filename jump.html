<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ジャンプ＆ダッシュ Pro | PlayWeb</title>
<link rel="apple-touch-icon" href="icon-192.png">
<script src="account.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --ink:#1c2333; --sub:#6b7390; --line:rgba(20,30,60,.08);
    --card:#ffffff; --accent:#3b82f6; --gold:#f59e0b;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, #dbeafe 0%, transparent 55%),
      radial-gradient(900px 600px at 105% 110%, #fde68a55 0%, transparent 50%),
      linear-gradient(180deg,#f2f5fb,#e7ecf5);
    color:var(--ink); min-height:100%; display:flex; flex-direction:column; overflow-x:hidden;
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  header{
    position:sticky; top:var(--pw-header-h,46px); z-index:50; display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px; background:rgba(255,255,255,.72); backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--line);
  }
  header .ttl{font-weight:900; letter-spacing:.04em; font-size:16px; white-space:nowrap; flex:1; min-width:0; text-align:center}
  header .ttl small{display:block; font-size:9px; letter-spacing:.3em; color:var(--sub); font-weight:700}
  .hbtn{
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink);
    background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 14px;
    font-size:13px; font-weight:800; cursor:pointer; box-shadow:0 2px 8px rgba(20,30,60,.06); font-family:inherit;
    white-space:nowrap; flex-shrink:0;
  }
  /* UI被り対策: モバイル幅ではヘッダーのボタン文字が折り返してタイトルに重ならないよう圧縮 */
  @media(max-width:560px){
    header{padding:8px 10px}
    header .ttl{font-size:12.5px}
    .hbtn{padding:7px 9px; font-size:11px; gap:4px}
  }
  .hbtn:active{transform:scale(.95)}
  main{flex:1; width:100%; max-width:1020px; margin:0 auto; padding:12px 14px 22px; display:flex; flex-direction:column; gap:12px}

  /* HUD */
  #hud{display:flex; gap:10px; align-items:stretch; flex-wrap:wrap}
  .hud-card{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:9px 14px; box-shadow:0 4px 14px rgba(20,30,60,.05); display:flex; align-items:center; gap:10px}
  #hud-stage{flex:1 1 260px; min-width:230px}
  #hud-stage .nm{font-weight:900; font-size:14px; white-space:nowrap}
  #hud-stage .nm small{color:var(--sub); font-weight:800; letter-spacing:.12em; font-size:10px; display:block}
  #prog-wrap{flex:1; height:10px; background:#e8edf6; border-radius:99px; position:relative; overflow:visible; min-width:90px}
  #prog-bar{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#38bdf8,#3b82f6,#818cf8); transition:width .15s linear}
  .prog-tick{position:absolute; top:-3px; width:3px; height:16px; border-radius:2px; background:#cbd5e1}
  .prog-tick.on{background:#22c55e}
  #prog-pct{font-weight:900; font-variant-numeric:tabular-nums; font-size:15px; min-width:52px; text-align:right}
  .hud-num{font-weight:900; font-size:16px; font-variant-numeric:tabular-nums}
  .hud-lbl{font-size:9px; letter-spacing:.22em; color:var(--sub); font-weight:800}
  #hearts{font-size:16px; letter-spacing:2px}
  #coin-count.pop{animation:cpop .3s ease}
  @keyframes cpop{40%{transform:scale(1.35); color:var(--gold)}}

  /* ゲーム画面 */
  #game-container{
    position:relative; border-radius:22px; overflow:hidden; background:#0f172a;
    border:5px solid #101828; box-shadow:0 30px 60px rgba(15,23,42,.35), inset 0 0 40px rgba(0,0,0,.5);
    aspect-ratio:2/1; width:100%;
  }
  canvas{display:block; width:100%; height:100%}
  #toast{
    position:absolute; top:12%; left:50%; transform:translate(-50%,-50%) scale(.6); opacity:0; pointer-events:none;
    background:rgba(10,14,26,.88); color:#fff; font-weight:900; padding:10px 22px; border-radius:999px; font-size:17px;
    letter-spacing:.05em; z-index:6; white-space:nowrap; box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  #toast.show{animation:toast-anim 1.7s cubic-bezier(.175,.885,.32,1.2) forwards}
  @keyframes toast-anim{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-50%) scale(1.05);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-50%) scale(.85);opacity:0}}
  #big-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; z-index:5; text-align:center;
  }
  #big-center .big{font-size:min(15vw,96px); font-weight:900; color:#fff; text-shadow:0 6px 30px rgba(0,0,0,.55); letter-spacing:.03em}
  #big-center .small{font-size:min(4.5vw,20px); font-weight:800; color:rgba(255,255,255,.85); text-shadow:0 2px 12px rgba(0,0,0,.6); margin-top:4px}
  #big-center.pop .big{animation:bigpop .34s cubic-bezier(.175,.885,.32,1.5)}
  @keyframes bigpop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
  #overlay{
    position:absolute; inset:0; z-index:8; display:none; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:rgba(8,10,20,.62); backdrop-filter:blur(5px); text-align:center; padding:18px; overflow-y:auto;
  }
  #overlay.show{display:flex}
  #overlay h2{font-size:min(11vw,52px); font-weight:900; letter-spacing:.04em}
  #overlay .stats{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:4px 0 6px}
  #overlay .stat{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:8px 16px; color:#fff}
  #overlay .stat .v{font-size:20px; font-weight:900; font-variant-numeric:tabular-nums}
  #overlay .stat .k{font-size:9px; letter-spacing:.24em; opacity:.75; font-weight:800}
  #overlay p{color:rgba(255,255,255,.85); font-weight:700; font-size:14px}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:900; border-radius:999px; padding:13px 26px; font-size:15px;
    display:inline-flex; align-items:center; gap:8px; transition:transform .12s, box-shadow .12s; letter-spacing:.03em;
  }
  .btn:active{transform:scale(.95)}
  .btn.primary{background:linear-gradient(90deg,#2563eb,#7c3aed); color:#fff; box-shadow:0 12px 28px rgba(59,80,246,.4)}
  .btn.light{background:#fff; color:#111827; box-shadow:0 10px 24px rgba(0,0,0,.3)}
  .btn.ghost{background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.25)}
  .newrec{color:#fbbf24; font-weight:900; font-size:14px; animation:blink .55s ease-in-out infinite alternate}
  @keyframes blink{from{opacity:1}to{opacity:.4}}
  /* JUMPボタンはコース（ゲーム画面）を覆わないよう、画面外・下のバーとして配置する。
     以前は #game-container 内の右下に84px円で重ねており、地面付近の障害物・穴を隠していた */
  #jump-btn{
    align-self:flex-end; width:min(230px,58%); height:64px; border-radius:18px; flex:0 0 auto;
    border:none; background:linear-gradient(90deg,#2563eb,#7c3aed);
    color:#fff; font-weight:900; font-size:16px; letter-spacing:.08em; cursor:pointer; display:none;
    align-items:center; justify-content:center; text-align:center; line-height:1.25; font-family:inherit;
    box-shadow:0 10px 26px rgba(59,80,246,.35); touch-action:none;
  }
  #jump-btn.on{display:flex}
  #jump-btn:active{filter:brightness(1.15); transform:scale(.97)}

  /* パネル（メニュー） */
  #panel{background:rgba(255,255,255,.85); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:24px; padding:16px; box-shadow:0 10px 30px rgba(20,30,60,.06)}
  .sec-lbl{font-size:10px; font-weight:900; letter-spacing:.26em; color:var(--sub); margin:2px 2px 8px}
  .scroll-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
  .scroll-row::-webkit-scrollbar{display:none}
  .sel-card{
    flex:0 0 auto; text-align:left; border:2px solid transparent; background:#eef2f9; color:var(--ink);
    border-radius:16px; padding:11px 14px; cursor:pointer; font-family:inherit; min-width:138px; transition:all .15s;
  }
  .sel-card:active{transform:scale(.97)}
  .sel-card.selected{background:#fff; border-color:var(--accent); box-shadow:0 8px 20px rgba(59,130,246,.18); transform:translateY(-1px)}
  .sel-card.locked{opacity:.45; cursor:not-allowed}
  .sel-card .t{font-weight:900; font-size:14px; display:flex; align-items:center; gap:7px}
  .sel-card .d{font-size:11px; color:var(--sub); font-weight:700; margin-top:3px; line-height:1.45}
  .sel-card .best{font-size:10.5px; color:#b45309; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums}
  .dot{width:14px; height:14px; border-radius:50%; flex:0 0 auto; box-shadow:inset 0 -3px 5px rgba(0,0,0,.25)}
  .statbar{display:flex; align-items:center; gap:6px; margin-top:4px; font-size:9px; font-weight:800; color:var(--sub)}
  .statbar .tr{flex:1; height:5px; background:#dde4f0; border-radius:99px; overflow:hidden}
  .statbar .fl{height:100%; border-radius:99px; background:linear-gradient(90deg,#38bdf8,#818cf8)}
  #start-btn{
    width:100%; margin-top:6px; padding:16px; border:none; border-radius:18px; cursor:pointer; font-family:inherit;
    background:linear-gradient(90deg,#111827,#1f2937); color:#fff; font-weight:900; font-size:17px; letter-spacing:.14em;
    box-shadow:0 14px 30px rgba(17,24,39,.3); transition:transform .12s;
  }
  #start-btn:active{transform:scale(.98)}
  #play-hint{text-align:center; color:var(--sub); font-weight:800; font-size:13px; letter-spacing:.14em; padding:8px 0 2px; animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .hidden{display:none !important}

  /* モードタブ / オンラインロビー */
  .mode-tabs{display:flex; gap:8px; margin-bottom:14px}
  .mode-tab{
    flex:1; padding:11px 8px; border-radius:14px; border:2px solid transparent; background:#eef2f9;
    font-family:inherit; font-weight:900; font-size:14px; cursor:pointer; color:var(--ink); transition:all .15s;
  }
  .mode-tab.on{background:#fff; border-color:var(--accent); box-shadow:0 8px 20px rgba(59,130,246,.18)}
  .mode-tab:active{transform:scale(.97)}
  .online-box{background:#f6f8fc; border:1px solid var(--line); border-radius:16px; padding:12px 14px; margin-bottom:6px}
  .online-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0}
  .online-note{font-size:12px; color:var(--sub); font-weight:700; line-height:1.6; margin:4px 0}
  .online-status{font-size:13px; font-weight:800; line-height:1.6; margin-top:6px; min-height:1.2em}
  .online-status .err{color:#dc2626}
  .room-code{font-size:22px; letter-spacing:.18em; font-weight:900; color:var(--accent)}
  .mini-btn{
    border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:8px 16px;
    font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; box-shadow:0 2px 8px rgba(20,30,60,.06);
  }
  .mini-btn:active{transform:scale(.95)}
  .mini-btn.big{padding:11px 20px; font-size:14px}
  .code-input{
    flex:1 1 150px; min-width:0; padding:10px 14px; border-radius:999px; border:1px solid var(--line);
    font-family:inherit; font-size:15px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; background:#fff; color:var(--ink);
  }

  /* レースバー（進捗表示） */
  #race-bar{
    background:rgba(255,255,255,.88); backdrop-filter:blur(10px); border:1px solid var(--line);
    border-radius:18px; padding:10px 14px 12px; box-shadow:0 6px 18px rgba(20,30,60,.06);
  }
  .race-head{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  #race-status{flex:1; font-weight:900; font-size:13.5px; min-width:0}
  #race-status.warn{color:#dc2626}
  #race-clock{font-weight:900; font-variant-numeric:tabular-nums; font-size:13.5px; color:var(--sub); white-space:nowrap}
  #race-exit{padding:6px 12px; font-size:12px}
  .race-lane{display:flex; align-items:center; gap:9px; margin-top:5px}
  .race-who{font-size:11px; font-weight:900; width:40px; flex:0 0 auto; letter-spacing:.04em}
  .race-who.me{color:#2563eb}
  .race-who.opp{color:#dc2626}
  .race-track{flex:1; min-width:0; height:12px; background:#e8edf6; border-radius:99px; position:relative}
  .race-fill{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,#38bdf8,#3b82f6); transition:width .25s linear}
  .race-fill.opp{background:linear-gradient(90deg,#fb923c,#ef4444)}
  .race-flag{position:absolute; right:2px; top:50%; transform:translateY(-50%); font-size:11px; line-height:1}
  .race-pct{font-weight:900; font-variant-numeric:tabular-nums; font-size:12.5px; min-width:86px; text-align:right; flex:0 0 auto}
  footer{color:var(--sub); font-size:11.5px; text-align:center; line-height:1.9; padding:0 10px}
  @media (max-width:560px){
    #hud{gap:7px} .hud-card{padding:7px 10px} #jump-btn{width:min(210px,60%); height:60px; font-size:15px}
    /* UI被り・空白対策: ステージを左右フルブリードにして盤面を広げ、
       プレイ中は説明フッターを隠し、余った縦スペースを上下に配分する */
    #game-container{margin-left:-14px; margin-right:-14px; border-radius:0}
    body.playing footer{display:none}
    body.playing #game-container{margin-top:auto}
    body.playing #panel{margin-bottom:auto}
    /* 結果モーダル: スマホでは2:1枠に収まらないため全画面表示にする */
    #overlay{position:fixed; inset:0; z-index:60; gap:6px; padding:10px; justify-content:flex-start}
    #overlay > *:first-child{margin-top:auto}
    #overlay > *:last-child{margin-bottom:auto}
    #overlay h2{font-size:30px}
    #overlay p{font-size:12.5px}
    #overlay .stats{gap:6px; margin:2px 0}
    #overlay .stat{padding:6px 11px; border-radius:11px}
    #overlay .stat .v{font-size:16px}
    #overlay .btn{padding:9px 16px; font-size:13px}
  }
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#overlay,.scroll-row{overscroll-behavior:none;}
</style>
</head>
<body>
<header>
  <div class="ttl">ジャンプ＆ダッシュ Pro<small>JUMP &amp; DASH PRO</small></div>
  <div style="display:flex; gap:8px">
    <button class="hbtn" id="sound-btn">🔊 サウンド</button>
    <button class="hbtn" id="pause-btn">⏸ ポーズ</button>
  </div>
</header>

<main>
  <div id="hud">
    <div class="hud-card" id="hud-stage">
      <div class="nm"><small id="hud-stage-sub">STAGE 1</small><span id="hud-stage-name">草原の道</span></div>
      <div id="prog-wrap"><div id="prog-bar"></div></div>
      <div id="prog-pct">0%</div>
    </div>
    <div class="hud-card">
      <div><div class="hud-lbl">HEART</div><div id="hearts">❤️❤️❤️</div></div>
    </div>
    <div class="hud-card">
      <div><div class="hud-lbl">COIN</div><div class="hud-num">🪙 <span id="coin-count">0</span></div></div>
    </div>
    <div class="hud-card">
      <div><div class="hud-lbl">TIME</div><div class="hud-num" id="time-val">0.0</div></div>
    </div>
  </div>

  <div id="race-bar" class="hidden">
    <div class="race-head">
      <span id="race-status">🏁 ゴールレース</span>
      <span id="race-clock"></span>
      <button id="race-exit" class="hbtn">退出</button>
    </div>
    <div class="race-lane">
      <span class="race-who me">あなた</span>
      <div class="race-track"><div class="race-fill" id="race-fill-me"></div><span class="race-flag">🏁</span></div>
      <span class="race-pct" id="race-pct-me">0% ・ 🪙0</span>
    </div>
    <div class="race-lane">
      <span class="race-who opp">相手</span>
      <div class="race-track"><div class="race-fill opp" id="race-fill-opp"></div><span class="race-flag">🏁</span></div>
      <span class="race-pct" id="race-pct-opp">0% ・ 🪙0</span>
    </div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="1200" height="600"></canvas>
    <div id="big-center" class="hidden"><div class="big" id="big-text">3</div><div class="small" id="big-sub"></div></div>
    <div id="toast"></div>
    <div id="overlay">
      <h2 id="ov-title">STAGE CLEAR</h2>
      <div class="newrec hidden" id="ov-newrec">🎉 NEW RECORD！</div>
      <p id="ov-sub"></p>
      <div class="stats" id="ov-stats"></div>
      <div class="btn-row" id="ov-btns"></div>
    </div>
  </div>

  <button id="jump-btn">JUMP 👆</button>

  <div id="panel"></div>

  <footer>
    操作：画面タップ / クリック / スペースキーでジャンプ。長押しで高く跳び、離すと落下。<br>
    チェックポイントを通過すると、ミスしてもそこから再スタート（ハート3つまで）。コインを集めてベスト記録を更新しよう。
  </footer>
</main>

<script>
'use strict';
/* ================================================================
   ジャンプ＆ダッシュ Pro — オートラン・ジャンプアクション
   固定タイムステップ(60Hz)で元版の物理バランスを再現しつつ、
   パララックス背景/コイン/チェックポイント/可変ジャンプ等を追加
================================================================ */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* ---------------- データ ---------------- */
const CHARACTERS = [
  { id:'ninja',  name:'ニンジャ', desc:'標準。2段ジャンプ可。',        color:'#3b82f6', maxJumps:2, jumpForce:-13,   gravity:0.6,  size:40, shield:0 },
  { id:'slime',  name:'スライム', desc:'1回のみ。大ジャンプ。',        color:'#22c55e', maxJumps:1, jumpForce:-18,   gravity:0.65, size:36, shield:0 },
  { id:'ghost',  name:'ゴースト', desc:'落下が遅い。大穴に強い。',     color:'#a855f7', maxJumps:1, jumpForce:-11,   gravity:0.35, size:42, shield:0 },
  { id:'runner', name:'ランナー', desc:'落下が速く機敏に動く。',       color:'#eab308', maxJumps:2, jumpForce:-14,   gravity:0.9,  size:36, shield:0 },
  { id:'knight', name:'ナイト',   desc:'トゲを1度防ぐバリア持ち。',   color:'#64748b', maxJumps:1, jumpForce:-13,   gravity:0.6,  size:44, shield:1 },
];
const STAGES = [
  { id:0, name:'エンドレス', theme:'night',  bg:['#1e293b','#020617'], ground:'#1e293b', groundLine:'#475569', speed:8, length:Infinity, isEndless:true, obs:[] },
  { id:1, name:'草原の道',   theme:'plains', bg:['#bae6fd','#38bdf8'], ground:'#4ade80', groundLine:'#22c55e', speed:6, length:3000, obs:[
    {x:600,w:40,h:40,type:'spike'}, {x:1000,w:150,type:'pit'}, {x:1500,w:40,h:40,type:'spike'}, {x:1550,w:40,h:40,type:'spike'}, {x:2000,w:200,type:'pit'}, {x:2500,y:100,w:100,h:20,type:'block'} ]},
  { id:2, name:'古代遺跡',   theme:'ruins',  bg:['#fef3c7','#d97706'], ground:'#d97706', groundLine:'#b45309', speed:7, length:4000, obs:[

/* ---------------- サウンド (WebAudio) ---------------- */
let AC = null, masterGain = null, bgmTimer = null, bgmStep = 0;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = 0.5; masterGain.connect(AC.destination);
  } catch(e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay=0){
  if (!AC || !save.sound) return;
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(Math.max(30, f0), t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t + dur + 0.05);
}

  coin(){ tone(1318, 1318, 0.06, 'sine', 0.14); tone(1760, 1760, 0.12, 'sine', 0.12, 0.055); },
  checkpoint(){ [880, 1174, 1568].forEach((f, i) => tone(f, f, 0.14, 'triangle', 0.12, i * 0.07)); },
  hurt(){ tone(220, 55, 0.32, 'sawtooth', 0.16); },

const BGM_CHORDS = [ [130.8, 261.6, 329.6, 392.0], [110.0, 220.0, 261.6, 329.6], [87.3, 174.6, 220.0, 261.6], [98.0, 196.0, 246.9, 293.7] ];
function bgmTick(){
  if (!AC || !save.sound || gameState !== 'PLAYING') return;
  const chord = BGM_CHORDS[Math.floor(bgmStep / 8) % 4];
  const pos = bgmStep % 8;
  if (pos % 2 === 0) tone(chord[0], chord[0], 0.22, 'triangle', 0.10);
  tone(chord[1 + (pos % 3)], chord[1 + (pos % 3)], 0.11, 'sine', 0.045);
  bgmStep++;
}
function bgmStart(){ if (bgmTimer) return; bgmStep = 0; bgmTimer = setInterval(bgmTick, 150); }

function hash(n){ const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

/* ---------- パーティクル ---------- */
function addP(p){ if (particles.length < 700) particles.push(p); }
function burst(x, y, color, n, spd, life, size, grav=0){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random() * 0.7) * spd;
    addP({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.25, g: grav, life: life * (0.6 + Math.random() * 0.7), maxLife: life, size: size * (0.6 + Math.random() * 0.8), color, shape:'c', rot:0, vr:0 });
  }
}
function dust(x, y, color, n){

    addP({ x: x + (Math.random() - 0.5) * 26, y: y - Math.random() * 3, vx: -1 - Math.random() * 2.2, vy: -Math.random() * 1.1, g: -0.01, life: 22 + Math.random() * 16, maxLife: 38, size: 2.5 + Math.random() * 3.5, color, shape:'c', rot:0, vr:0 });
}
function sparkle(x, y){
  for (let i = 0; i < 7; i++){
    const a = (i / 7) * Math.PI * 2;
    addP({ x, y, vx: Math.cos(a) * 1.6, vy: Math.sin(a) * 1.6, g: 0, life: 16, maxLife: 16, size: 2.4, color:'#fde68a', shape:'c', rot:0, vr:0 });
  }
}
function confetti(x, y){

  for (let i = 0; i < 90; i++)

}

/* ---------- コイン / チェックポイント生成 ---------- */
function genCoinsForStage(st){
  const list = [];
  const put = (x, y) => { if (x > 260 && x < st.length - 160) list.push({ x, y, taken:false, ph: hash(x) * 6.3 }); };
  const arc = (cx, baseY, n, peak) => {
    for (let i = 0; i < n; i++){
      const t = n === 1 ? 0.5 : i / (n - 1);
      put(cx + (t - 0.5) * (n - 1) * 42, baseY - Math.sin(t * Math.PI) * peak);
    }
  };
  for (const o of st.obs){
    if (o.type === 'spike' && !o.y) arc(o.x + o.w / 2, GROUND_Y - 46, 5, 105 + o.h * 0.4);
    else if (o.type === 'spike' && o.y) put(o.x + o.w / 2, GROUND_Y - o.y - o.h - 42);
    else if (o.type === 'pit') arc(o.x + o.w / 2, GROUND_Y - 40, Math.max(4, Math.round(o.w / 55)), 120);
    else if (o.type === 'block'){
      const top = GROUND_Y - (o.y || 0) - o.h;
      const n = Math.max(2, Math.floor(o.w / 30));
      for (let i = 0; i < n; i++) put(o.x + 18 + i * ((o.w - 36) / Math.max(1, n - 1)), top - 34);
    }
  }
  for (let x = 520; x < st.length - 320; x += 46){
    const near = st.obs.some(o => x > o.x - 170 && x < o.x + (o.w || 40) + 170);
    if (!near && hash(x * 0.37) > 0.45){ for (let i = 0; i < 4; i++) put(x + i * 46, GROUND_Y - 38); x += 46 * 4 + 260; }
  }
  return list;
}
function snapToGround(st, x){
  for (let tries = 0; tries < 40; tries++){
    const pit = st.obs.find(o => o.type === 'pit' && x > o.x - 70 && x < o.x + o.w + 30);
    if (!pit) return x;
    x = pit.x + pit.w + 60;
  }
  return x;
}
function genCheckpoints(st){
  if (st.isEndless) return [];
  return [0.38, 0.72].map(r => ({ x: snapToGround(st, Math.floor(st.length * r)), on:false }));
}

/* ---------- ゲーム開始 ---------- */

  audioInit();

  particles = []; floaters = []; coins = []; coinCount = 0;
  hearts = 3; activeCp = -1; lastSafeScrollX = 0; lastDeathCause = null;
  shakeT = 0; camY = 0; camDip = 0; respawnT = 0;
  prevProg = -1; prevDist = -1;
  if (level.isEndless){
    level.lastObsX = CW + 200;
    coinTotal = 0;
  } else {
    coins = genCoinsForStage(level);
    coinTotal = coins.length;
  }
  checkpoints = genCheckpoints(level);
  clouds = [];
  for (let i = 0; i < 9; i++) clouds.push({ x: hash(i * 3.3) * 2600, y: 26 + hash(i * 7.1) * 150, s: 0.7 + hash(i * 5.7) * 0.9 });
  stars = [];
  for (let i = 0; i < 70; i++) stars.push({ x: hash(i * 1.7) * 2400, y: hash(i * 2.9) * (GROUND_Y - 60), r: 1 + hash(i * 4.3) * 1.8, ph: hash(i * 6.1) * 6.3 });
  ambient = [];
  player = {
    ...charData,
    x: PLAYER_X, y: GROUND_Y - charData.size, vy: 0,
    jumpsLeft: charData.maxJumps, grounded: true,
    coyoteUntil: -1, bufferUntil: -1, canCut: false,
    rotation: 0, spinVel: 0, squashX: 1, squashY: 1,

  };

  gameState = 'COUNTDOWN'; countT = 0; countShown = -1;

/* ---------- ジャンプ ---------- */
function doJump(second){
  player.vy = player.jumpForce;
  player.grounded = false;
  player.canCut = true;
  player.squashX = 0.72; player.squashY = 1.32;
  if (second) player.spinVel = 0.32;
  dust(player.x + player.size / 2, player.y + player.size, 'rgba(255,255,255,.85)', second ? 8 : 5);
  sfx.jump(second ? 2 : 1);
}
function pressJump(){
  audioInit();
  if (gameState !== 'PLAYING' || !player || player.dead) return;
  const now = frame;
  player.bufferUntil = now + 7; // 約120ms先行入力
  if (player.grounded || now <= player.coyoteUntil){
    player.jumpsLeft = player.maxJumps - 1;
    player.coyoteUntil = -1; player.bufferUntil = -1;
    doJump(false);
  } else if (player.jumpsLeft > 0){
    player.jumpsLeft--;
    player.bufferUntil = -1;
    doJump(true);
  }
}
function releaseJump(){
  if (gameState !== 'PLAYING' || !player) return;
  if (player.canCut && player.vy < player.jumpForce * 0.42){
    player.vy = player.jumpForce * 0.42;
    player.canCut = false;
  }
}

/* ---------- ダメージ / リスポーン ---------- */
function applyShake(mag, t){ shakeMag = mag; shakeT = t; }
function die(cause){
  if (player.dead) return;
  lastDeathCause = cause || null;
  burst(player.x + player.size / 2, Math.min(player.y + player.size / 2, CH - 30), player.color, 34, 6, 42, 4.5, 0.12);
  sfx.hurt(); applyShake(14, 18);
  hearts--; updateHearts();
  if (hearts <= 0){ gameOver(lastDeathCause); return; }
  player.dead = true;
  respawnT = 26;
  showToast(cause === 'pit' ? '落っこちた…！' : 'くらった…！');
}
function respawn(){
  const target = activeCp >= 0 ? checkpoints[activeCp].x - PLAYER_X : lastSafeScrollX;
  scrollX = Math.max(0, target);
  /* リスポーン直後に穴の上にならないよう前進調整 */
  for (let i = 0; i < 60; i++){
    const pit = level.obs.find(o => o.type === 'pit' && PLAYER_X + scrollX > o.x - 10 && PLAYER_X + scrollX < o.x + o.w - 30);
    if (!pit) break;
    scrollX = pit.x + pit.w - PLAYER_X + 30;
  }
  player.y = GROUND_Y - player.size;
  player.vy = 0; player.rotation = 0; player.spinVel = 0;
  player.jumpsLeft = player.maxJumps; player.grounded = true;
  player.invincibleUntil = frame + 75; // 約1.25秒無敵
  player.dead = false;
  burst(player.x + player.size / 2, player.y + player.size / 2, '#ffffff', 14, 3.4, 26, 3);
  addFloater(player.x + player.size / 2, player.y - 16, 'RESTART!', '#7dd3fc', 20);
}

/* ---------- クリア / ゲームオーバー ---------- */
function fmtTime(ms){ return (ms / 1000).toFixed(1); }
function stageClear(){
  /* クリア判定フレームは step() のHUD進捗更新前に return するため、HUDが前フレームの
     切り捨て値（例: 99%）で止まり、結果表示（scrollX>=length で100%）と食い違った。
     クリア時はHUD進捗も100%に寄せて一致させる（レース時も自分の進捗は100%が正） */
  setProg(1); prevProg = 100;
  if (raceActive){ onRaceGoal(); return; }
  gameState = 'CLEAR'; bgmStop();
  sfx.clear(); confetti(player.x + player.size / 2, player.y);
  const key = String(level.id);
  const prev = save.best[key] || {};
  const isNew = !prev.cleared || runTime < prev.time || coinCount > (prev.coins || 0);
  save.best[key] = { cleared:true, time: prev.cleared ? Math.min(prev.time, runTime) : runTime, coins: Math.max(prev.coins || 0, coinCount) };
  save.totalCoins += coinCount;
  if (selectedStageId > 0 && selectedStageId === save.unlocked && save.unlocked < STAGES.length - 1){
    save.unlocked++;
    unlockToastTimer = setTimeout(() => showToast('🔓 次のステージ解放！'), 900);
  }
  persist();
  showEnd(true, isNew);
}
function gameOver(cause){
  if (raceActive){ onRaceDnf(); return; }
  gameState = 'OVER'; bgmStop();
  sfx.over();
  let isNew = false;
  if (level.isEndless){
    const dist = Math.floor(scrollX / 10);
    if (dist > save.endlessBest){ save.endlessBest = dist; isNew = true; }
    save.totalCoins += coinCount;
    persist();
  }
  showEnd(false, isNew, cause !== undefined ? cause : lastDeathCause);
}
function showEnd(clear, isNew, deathCause){
  const ov = document.getElementById('overlay');
  const title = document.getElementById('ov-title');
  title.textContent = clear ? '🎉 STAGE CLEAR' : 'GAME OVER';
  title.style.color = clear ? '#4ade80' : '#f87171';
  document.getElementById('ov-newrec').classList.toggle('hidden', !isNew);
  document.getElementById('ov-sub').textContent = level.isEndless
    ? 'エンドレスの記録'
    : (clear ? `「${level.name}」を走破！`
      : deathCause === 'pit' ? '穴に落ちてしまった。'
      : deathCause === 'spike' ? '障害物にやられてしまった…'
      : 'やられてしまった…');
  const stats = [];
  if (level.isEndless) stats.push(['走行距離', Math.floor(scrollX / 10) + ' m'], ['ベスト', save.endlessBest + ' m']);
  else stats.push(['タイム', fmtTime(runTime) + ' 秒'], ['進捗', Math.min(100, Math.floor(scrollX / level.length * 100)) + ' %']);
  stats.push(['コイン', coinCount + (level.isEndless ? '' : ' / ' + coinTotal)]);
  document.getElementById('ov-stats').innerHTML = stats.map(s =>
    `<div class="stat"><div class="v">${s[1]}</div><div class="k">${s[0]}</div></div>`).join('');
  let btns = '';
  if (clear && selectedStageId > 0 && selectedStageId < STAGES.length - 1)
    btns += '<button class="btn primary" id="ov-next">次のステージ →</button>';
  btns += '<button class="btn light" id="ov-retry">↻ リトライ</button>';
  btns += '<button class="btn ghost" id="ov-menu">メニュー</button>';
  document.getElementById('ov-btns').innerHTML = btns;
  ov.classList.add('show');
  document.getElementById('jump-btn').classList.remove('on');
  const next = document.getElementById('ov-next');
  if (next) next.onclick = () => { sfx.click(); selectedStageId++; persistSelection(); startGame(); };
  document.getElementById('ov-retry').onclick = () => { sfx.click(); startGame(); };
  document.getElementById('ov-menu').onclick = () => { sfx.click(); toMenu(); };
}
function hideOverlay(){ document.getElementById('overlay').classList.remove('show'); }
function toMenu(){
  gameState = 'MENU'; bgmStop();
  resetTransientUi();

/* ---------- エンドレス生成 ---------- */
function genEndless(){
  if (level.speed < 18) level.speed += 0.0016;
  while (level.lastObsX < scrollX + CW * 1.6){
    const baseGap = 400 + (level.speed - 8) * 30;
    level.lastObsX += baseGap + Math.random() * 400;
    const types = ['spike', 'pit', 'block'];
    const type = types[Math.floor(Math.random() * types.length)];
    const obs = { x: level.lastObsX, type };
    if (type === 'spike'){ obs.w = 40; obs.h = 40 + Math.random() * (level.speed > 12 ? 80 : 40); }
    else if (type === 'pit'){ obs.w = 150 + Math.random() * (level.speed > 10 ? 300 : 150); }
    else {
      obs.w = 60 + Math.random() * 60; obs.h = 20; obs.y = 80 + Math.random() * 80;
      if (Math.random() < 0.3) level.obs.push({ x: level.lastObsX + 10, y: obs.y, w: 30, h: 30, type:'spike' });
    }
    level.obs.push(obs);
    /* コインも時々置く */
    const r = Math.random();
    if (type === 'pit' || r < 0.4){
      const n = type === 'pit' ? Math.max(4, Math.round(obs.w / 55)) : 4;
      for (let i = 0; i < n; i++){
        const t = n === 1 ? 0.5 : i / (n - 1);
        const cx = type === 'pit' ? obs.x + obs.w / 2 + (t - 0.5) * (n - 1) * 42 : obs.x + i * 46;
        const cy = type === 'pit' ? GROUND_Y - 40 - Math.sin(t * Math.PI) * 120 : GROUND_Y - 120 - Math.random() * 60;
        coins.push({ x: cx, y: cy, taken:false, ph: Math.random() * 6.3 });
      }
    }
  }
  level.obs = level.obs.filter(o => o.x - scrollX > -600);
  coins = coins.filter(c => !c.taken && c.x - scrollX > -300);
}

/* ---------- 物理ステップ（60Hz固定） ---------- */
function step(){
  frame++;
  if (player.dead){
    if (--respawnT <= 0) respawn();
    updateParticles();
    return;
  }
  runTime += STEP_MS;
  scrollX += level.speed;
  if (level.isEndless) genEndless();

  if (!level.isEndless && scrollX >= level.length){ stageClear(); return; }

  const p = player;
  const prevBottom = p.y + p.size;
  const wasGrounded = p.grounded;

  p.vy += p.gravity;
  p.y += p.vy;
  if (p.id !== 'slime') p.rotation += p.vy * 0.05 + p.spinVel;
  p.spinVel *= 0.86;
  p.squashX += (1 - p.squashX) * 0.16;
  p.squashY += (1 - p.squashY) * 0.16;
  p.blinkT = (p.blinkT + 1) % 210;
  if (p.grounded) p.runPhase += level.speed * 0.055;

  /* 支持面の決定 */
  const pL = p.x + 4, pR = p.x + p.size - 4;
  let support = GROUND_Y, overPit = false;
  for (const o of level.obs){
    if (o.type !== 'pit') continue;
    const ox = o.x - scrollX;
    if (ox > CW + 100 || ox + o.w < -100) continue;
    if (pR > ox && pL < ox + o.w){ support = Infinity; overPit = true; }
  }
  let onBlock = false;
  for (const o of level.obs){
    if (o.type !== 'block' || o.broken) continue;
    const ox = o.x - scrollX;
    if (ox > CW + 100 || ox + o.w < -100) continue;
    const top = GROUND_Y - (o.y || 0) - o.h;
    if (pR > ox && pL < ox + o.w && p.vy >= 0 && prevBottom <= top + Math.max(2, p.vy) && p.y + p.size >= top){
      if (top < support){ support = top; onBlock = true; }
    }
  }

  /* 着地・落下 */
  if (p.y + p.size >= support){
    const fallSpeed = p.vy;
    p.y = support - p.size;
    p.vy = 0;
    if (!wasGrounded){
      p.grounded = true;
      p.jumpsLeft = p.maxJumps;
      p.rotation = 0; p.spinVel = 0;
      if (fallSpeed > 4){
        p.squashX = 1.3; p.squashY = 0.68;
        camDip = Math.min(9, fallSpeed * 0.55);
        dust(p.x + p.size / 2, p.y + p.size, 'rgba(255,255,255,.9)', Math.min(10, 3 + fallSpeed | 0));
        sfx.land();
      }
      if (frame <= p.bufferUntil){ p.bufferUntil = -1; p.jumpsLeft = p.maxJumps - 1; doJump(false); }
    }
  } else {
    if (wasGrounded && p.jumpsLeft === p.maxJumps) p.coyoteUntil = frame + 6; // コヨーテタイム約100ms
    p.grounded = false;
  }
  if (!overPit && p.grounded && !onBlock) lastSafeScrollX = scrollX;
  else if (!overPit && p.grounded) lastSafeScrollX = Math.max(lastSafeScrollX, scrollX - 4);

  /* トゲ判定 */
  const invincible = frame <= p.invincibleUntil;
  for (const o of level.obs){
    if (o.type !== 'spike' || o.broken) continue;
    const ox = o.x - scrollX;
    if (ox < -120 || ox > CW + 120) continue;
    const sh = 8;
    const sL = ox + sh, sR = ox + o.w - sh;
    const sT = GROUND_Y - (o.y || 0) - o.h + sh, sB = GROUND_Y - (o.y || 0);
    if (p.x + p.size - sh > sL && p.x + sh < sR && p.y + p.size - sh > sT && p.y + sh < sB){
      if (invincible) continue;
      if (p.shield > 0){
        p.shield--; o.broken = true;
        p.invincibleUntil = frame + 60;
        burst(p.x + p.size / 2, p.y + p.size / 2, '#e0f2fe', 16, 4.5, 30, 3.4);
        showToast('🛡 シールドで防いだ！');
        sfx.shield(); applyShake(9, 10);
      } else { die('spike'); return; }
    }
  }

  /* 落下死 */
  if (p.y > CH + 60){ die('pit'); return; }

  /* コイン取得 */
  const pcx = p.x + p.size / 2, pcy = p.y + p.size / 2;
  for (const c of coins){
    if (c.taken) continue;
    const cx = c.x - scrollX;
    if (cx < -60 || cx > CW + 60) continue;
    const dx = cx - pcx, dy = c.y - pcy;
    if (dx * dx + dy * dy < Math.pow(p.size / 2 + 17, 2)){
      c.taken = true; coinCount++;
      sparkle(cx, c.y);
      addFloater(cx, c.y - 22, '+1', '#fde68a', 17);
      sfx.coin(); updateCoinUI(true);
    }
  }

  /* チェックポイント */
  checkpoints.forEach((cp, i) => {
    if (!cp.on && scrollX + PLAYER_X >= cp.x){
      cp.on = true; activeCp = i;
      sfx.checkpoint();
      showToast('🏁 チェックポイント！');
      burst(cp.x - scrollX, GROUND_Y - 90, '#4ade80', 14, 3.6, 30, 3);
      setProg(Math.min(1, scrollX / level.length));
    }
  });

  /* ランナーの残像・ゴーストの軌跡 */
  if (p.id === 'runner'){
    p.trail.unshift({ x: p.x, y: p.y, rot: p.rotation });
    if (p.trail.length > 5) p.trail.pop();
  }
  if (p.id === 'ghost' && Math.random() < 0.25)
    addP({ x: p.x + Math.random() * p.size, y: p.y + p.size, vx: -0.6, vy: 0.3, g: 0, life: 20, maxLife: 20, size: 2.4, color:'#d8b4fe', shape:'c', rot:0, vr:0 });
  if (p.grounded && frame % 7 === 0) dust(p.x + 6, p.y + p.size, 'rgba(255,255,255,.55)', 1);

  updateParticles();

  /* カメラ */
  const targetY = Math.max(-26, Math.min(30, (pcy - CH * 0.52) * 0.16));
  camY += (targetY - camY) * 0.06;
  camDip *= 0.88;

  /* HUD進捗 */
  if (level.isEndless){
    const d = Math.floor(scrollX / 10);
    if (d !== prevDist){
      prevDist = d;
      document.getElementById('prog-pct').textContent = d + 'm';
      document.getElementById('prog-bar').style.width = '100%';
      if (d > 0 && d % 100 === 0) showToast(d + 'm 突破！🎉');
    }
  } else {
    const pr = Math.floor(Math.min(100, scrollX / level.length * 100));
    if (pr !== prevProg){ prevProg = pr; setProg(scrollX / level.length); }
  }
  document.getElementById('time-val').textContent = fmtTime(runTime);
}
function updateParticles(){
  for (let i = particles.length - 1; i >= 0; i--){
    const pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.g; pt.rot += pt.vr; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--){
    const f = floaters[i];
    f.y -= 0.9; f.life--;
    if (f.life <= 0) floaters.splice(i, 1);
  }
  if (shakeT > 0) shakeT--;
}
/* ---------- 描画 ---------- */
function hillPath(factor, amp, base, seed){
  ctx.beginPath();
  ctx.moveTo(-4, CH);
  for (let x = -4; x <= CW + 24; x += 24){
    const wx = x + scrollX * factor;
    const y = base - (Math.sin(wx * 0.0038 + seed) * amp + Math.sin(wx * 0.0013 + seed * 2.7) * amp * 0.7);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(CW + 4, CH);
  ctx.closePath();
}
function drawCloud(x, y, s, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(x, y, 22 * s, 0, 6.29); ctx.arc(x + 24 * s, y + 5 * s, 17 * s, 0, 6.29);
  ctx.arc(x - 25 * s, y + 6 * s, 15 * s, 0, 6.29); ctx.arc(x + 2 * s, y + 9 * s, 18 * s, 0, 6.29);
  ctx.fill();
}
function drawDeco(theme, th){
  const deco = th.deco;
  if (deco === 'sun'){
    const sx = CW - 170, sy = 86;
    const g = ctx.createRadialGradient(sx, sy, 8, sx, sy, 90);
    g.addColorStop(0, 'rgba(253,224,71,.95)'); g.addColorStop(0.35, 'rgba(253,224,71,.5)'); g.addColorStop(1, 'rgba(253,224,71,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, 90, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 6.29); ctx.fill();
  } else if (deco === 'stars' || theme === 'sky'){
    ctx.fillStyle = '#fff';
    for (const s of stars){
      let sx = (s.x - scrollX * 0.06) % 2400; if (sx < 0) sx += 2400;
      ctx.globalAlpha = 0.35 + 0.3 * Math.sin(frame * 0.05 + s.ph);
      ctx.beginPath(); ctx.arc(sx % CW, s.y, s.r, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(CW - 140, 74, 25, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(30,27,75,.9)';
    ctx.beginPath(); ctx.arc(CW - 128, 66, 21, 0, 6.29); ctx.fill();
  } else if (deco === 'pillars'){
    ctx.fillStyle = 'rgba(120,53,15,.35)';
    for (let i = 0; i < 5; i++){
      let px = (i * 560 + 180 - scrollX * 0.22) % 2800; if (px < -120) px += 2800; px -= 60;
      const hgt = 130 + hash(i * 3.1) * 90;
      ctx.fillRect(px, GROUND_Y - hgt, 26, hgt);
      ctx.fillRect(px - 8, GROUND_Y - hgt - 12, 42, 12);
    }
  } else if (deco === 'islands'){
    ctx.fillStyle = 'rgba(76,29,149,.4)';
    for (let i = 0; i < 4; i++){
      let ix = (i * 700 + 260 - scrollX * 0.3) % 2800; if (ix < -160) ix += 2800; ix -= 80;
      const iy = 90 + hash(i * 8.4) * 130 + Math.sin(frame * 0.02 + i) * 5;
      ctx.beginPath();
      ctx.ellipse(ix, iy, 74, 17, 0, 0, 6.29); ctx.fill();
      ctx.beginPath(); ctx.moveTo(ix - 44, iy + 8); ctx.lineTo(ix + 44, iy + 8); ctx.lineTo(ix, iy + 44); ctx.closePath(); ctx.fill();
    }
  } else if (deco === 'volcano'){
    let vx = (1500 - scrollX * 0.12) % 3600; if (vx < -400) vx += 3600; vx -= 200;
    ctx.fillStyle = 'rgba(69,10,10,.65)';
    ctx.beginPath(); ctx.moveTo(vx - 230, GROUND_Y); ctx.lineTo(vx - 42, GROUND_Y - 240); ctx.lineTo(vx + 42, GROUND_Y - 240); ctx.lineTo(vx + 230, GROUND_Y); ctx.closePath(); ctx.fill();
    const g = ctx.createRadialGradient(vx, GROUND_Y - 248, 4, vx, GROUND_Y - 248, 60);
    g.addColorStop(0, 'rgba(249,115,22,.9)'); g.addColorStop(1, 'rgba(249,115,22,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(vx, GROUND_Y - 248, 60, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#f97316';
    ctx.beginPath(); ctx.ellipse(vx, GROUND_Y - 246, 40, 8, 0, 0, 6.29); ctx.fill();
  } else if (deco === 'castle'){
    let cx0 = (1900 - scrollX * 0.14) % 3800; if (cx0 < -320) cx0 += 3800; cx0 -= 160;
    ctx.fillStyle = 'rgba(88,28,135,.4)';
    ctx.fillRect(cx0, GROUND_Y - 150, 190, 150);
    ctx.fillRect(cx0 - 26, GROUND_Y - 190, 44, 190);
    ctx.fillRect(cx0 + 172, GROUND_Y - 190, 44, 190);

    ctx.beginPath(); ctx.moveTo(cx0 + 70, GROUND_Y - 226); ctx.lineTo(cx0 + 95, GROUND_Y - 262); ctx.lineTo(cx0 + 120, GROUND_Y - 226); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(253,224,71,.85)';
    ctx.fillRect(cx0 + 88, GROUND_Y - 130, 12, 16); ctx.fillRect(cx0 - 12, GROUND_Y - 140, 10, 13); ctx.fillRect(cx0 + 184, GROUND_Y - 120, 10, 13);

function drawAmbient(theme){
  const kind = theme === 'ice' ? 'snow' : theme === 'volcano' ? 'ember' : theme === 'plains' ? 'pollen' : null;
  if (!kind) return;
  const spd = level ? level.speed : 0;
  if (ambient.length < 46 && Math.random() < 0.5)
    ambient.push({ x: Math.random() * CW, y: kind === 'ember' ? CH + 8 : -8, vx: (Math.random() - 0.5) * 0.5, vy: 0, life: 500, ph: Math.random() * 6.3 });
  for (let i = ambient.length - 1; i >= 0; i--){
    const a = ambient[i];
    a.ph += 0.02;
    if (kind === 'snow'){ a.y += 1.1 + Math.sin(a.ph) * 0.3; a.x += Math.sin(a.ph) * 0.5 - spd * 0.12; }
    else if (kind === 'ember'){ a.y -= 1.3 + Math.random() * 0.7; a.x += Math.sin(a.ph) * 0.4 - spd * 0.1; }
    else { a.y += 0.45; a.x += Math.cos(a.ph) * 0.4 - spd * 0.15; }
    if (a.y < -14 || a.y > CH + 14 || a.x < -14){ ambient.splice(i, 1); continue; }
    ctx.globalAlpha = kind === 'ember' ? 0.75 : 0.55;
    ctx.fillStyle = kind === 'snow' ? '#ffffff' : kind === 'ember' ? '#fb923c' : '#fef9c3';
    ctx.beginPath(); ctx.arc(a.x, a.y, kind === 'snow' ? 2.4 : 2, 0, 6.29); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function draw(){
  const st = level || STAGES.find(s => s.id === selectedStageId);
  const th = THEMES[st.theme];
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, st.bg[0]); g.addColorStop(1, st.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);

  drawDeco(st.theme, th);
  for (const c of clouds){
    let cx = (c.x - scrollX * 0.18) % 2600; if (cx < -160) cx += 2600;
    drawCloud(cx - 80, c.y, c.s, th.cloud);
  }
  ctx.fillStyle = th.far; hillPath(0.22, 34, GROUND_Y - 66, 1.7); ctx.fill();
  ctx.fillStyle = th.mid; hillPath(0.45, 22, GROUND_Y - 18, 4.2); ctx.fill();

  ctx.save();
  let shX = 0, shY = 0;
  if (shakeT > 0){ shX = (Math.random() - 0.5) * shakeMag; shY = (Math.random() - 0.5) * shakeMag; }
  ctx.translate(shX, shY + camY + camDip);

  if (level && gameState !== 'MENU'){
    /* 地面（穴を除く） */
    ctx.fillStyle = st.ground;
    ctx.fillRect(-20, GROUND_Y, CW + 40, CH - GROUND_Y + 40);
    for (const o of level.obs){
      if (o.type !== 'pit') continue;
      const ox = o.x - scrollX;
      if (ox > CW + 60 || ox + o.w < -60) continue;
      const pg = ctx.createLinearGradient(0, GROUND_Y, 0, CH);
      pg.addColorStop(0, 'rgba(0,0,0,.55)'); pg.addColorStop(1, 'rgba(0,0,0,.92)');
      ctx.fillStyle = pg;
      ctx.fillRect(ox, GROUND_Y - 2, o.w, CH - GROUND_Y + 42);
      ctx.fillStyle = 'rgba(255,255,255,.22)';
      ctx.fillRect(ox, GROUND_Y - 2, 3, CH - GROUND_Y);
      ctx.fillRect(ox + o.w - 3, GROUND_Y - 2, 3, CH - GROUND_Y);
    }
    ctx.fillStyle = st.groundLine;
    ctx.fillRect(-20, GROUND_Y, CW + 40, 7);
    for (const o of level.obs){
      if (o.type !== 'pit') continue;
      const ox = o.x - scrollX;
      if (ox > CW + 60 || ox + o.w < -60) continue;
      ctx.fillStyle = st.ground;
      ctx.fillRect(ox, GROUND_Y, o.w, 7);
    }
    /* 地面の質感（草・小石） */
    const stepPx = 90;
    const startI = Math.floor((scrollX - 40) / stepPx);
    for (let i = startI; i < startI + 16; i++){
      const wx = i * stepPx + hash(i * 1.31) * 50;
      const sx = wx - scrollX;
      if (sx < -30 || sx > CW + 30) continue;
      if (level.obs.some(o => o.type === 'pit' && wx > o.x - 6 && wx < o.x + o.w + 6)) continue;
      const h = 6 + hash(i * 2.77) * 8;
      ctx.strokeStyle = st.groundLine; ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(sx, GROUND_Y + 2); ctx.lineTo(sx - 3, GROUND_Y + 2 - h);
      ctx.moveTo(sx + 5, GROUND_Y + 2); ctx.lineTo(sx + 7, GROUND_Y + 2 - h * 0.75);
      ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,.14)';
      ctx.beginPath(); ctx.ellipse(sx + 26, GROUND_Y + 34 + hash(i * 3.9) * 52, 9 + hash(i) * 12, 4.5, 0, 0, 6.29); ctx.fill();
    }

    /* 障害物 */
    for (const o of level.obs){
      if (o.broken) continue;
      const ox = o.x - scrollX;
      if (ox < -220 || ox > CW + 220) continue;
      if (o.type === 'block'){
        const top = GROUND_Y - (o.y || 0) - o.h;
        ctx.fillStyle = st.ground;
        ctx.beginPath(); ctx.roundRect(ox, top, o.w, o.h, 6); ctx.fill();
        ctx.fillStyle = st.groundLine;
        ctx.fillRect(ox, top, o.w, 6);
        ctx.fillStyle = 'rgba(255,255,255,.25)';
        ctx.fillRect(ox, top + o.h - 4, o.w, 3);
      } else if (o.type === 'spike'){
        const top = GROUND_Y - (o.y || 0) - o.h, base = GROUND_Y - (o.y || 0);
        const grad = ctx.createLinearGradient(ox, top, ox, base);
        grad.addColorStop(0, '#f87171'); grad.addColorStop(1, '#b91c1c');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.moveTo(ox + o.w / 2, top); ctx.lineTo(ox + o.w, base); ctx.lineTo(ox, base); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        ctx.beginPath(); ctx.moveTo(ox + o.w / 2, top); ctx.lineTo(ox + o.w / 2 + 5, base); ctx.lineTo(ox + o.w / 2, base); ctx.closePath(); ctx.fill();
      }
    }

    /* チェックポイント旗 */
    for (const cp of checkpoints){
      const cx = cp.x - scrollX;
      if (cx < -60 || cx > CW + 60) continue;
      ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx, GROUND_Y); ctx.lineTo(cx, GROUND_Y - 96); ctx.stroke();
      ctx.fillStyle = cp.on ? '#22c55e' : '#94a3b8';
      const wave = Math.sin(frame * 0.18) * 3;
      ctx.beginPath();
      ctx.moveTo(cx, GROUND_Y - 96);
      ctx.quadraticCurveTo(cx + 18, GROUND_Y - 100 + wave, cx + 36, GROUND_Y - 92 + wave);
      ctx.quadraticCurveTo(cx + 18, GROUND_Y - 86 + wave, cx, GROUND_Y - 80);
      ctx.closePath(); ctx.fill();
    }

    /* ゴール旗 */
    if (!level.isEndless){
      const gx = level.length - scrollX;
      if (gx > -80 && gx < CW + 80){
        ctx.fillStyle = 'rgba(251,191,36,.14)';
        ctx.fillRect(gx - 14, 0, 44, GROUND_Y);
        ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(gx + 8, GROUND_Y); ctx.lineTo(gx + 8, GROUND_Y - 190); ctx.stroke();
        const wave = Math.sin(frame * 0.15) * 4;
        for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++){
          ctx.fillStyle = (r + c) % 2 ? '#111827' : '#f8fafc';
          ctx.fillRect(gx + 8 + c * 11, GROUND_Y - 190 + r * 10 + Math.sin(frame * 0.15 + c * 0.5) * 2, 11, 10);
        }
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(gx + 8, GROUND_Y - 196, 6, 0, 6.29); ctx.fill();
      }
    }

    /* コイン */
    for (const c of coins){
      if (c.taken) continue;
      const cx = c.x - scrollX;
      if (cx < -40 || cx > CW + 40) continue;
      const sq = Math.abs(Math.sin(frame * 0.07 + c.ph));
      const bob = Math.sin(frame * 0.05 + c.ph) * 3;
      ctx.save();
      ctx.translate(cx, c.y + bob);
      ctx.scale(0.35 + 0.65 * sq, 1);
      const cg = ctx.createRadialGradient(-4, -5, 2, 0, 0, 14);
      cg.addColorStop(0, '#fef08a'); cg.addColorStop(0.6, '#facc15'); cg.addColorStop(1, '#d97706');
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, 6.29); ctx.fill();
      ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = 'rgba(180,83,9,.75)';
      ctx.font = '900 13px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('★', 0, 1);
      ctx.restore();
    }

    /* パーティクル */
    for (const pt of particles){
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      if (pt.shape === 'r'){
        ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
        ctx.fillRect(-pt.size / 2, -pt.size / 3, pt.size, pt.size * 0.66);
      } else {
        ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, 6.29); ctx.fill();
      }
      ctx.restore();
    }

    /* 相手ゴースト（オンライン対戦） */
    if (raceActive && oppProg.wx > 0 && gameState !== 'OVER') drawGhost();

    /* プレイヤー */
    if (!player.dead && gameState !== 'OVER') drawPlayer();

    /* フローター */
    for (const f of floaters){
      ctx.save();
      ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
      ctx.font = `900 ${f.size}px "Hiragino Maru Gothic ProN", sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.4)';
      ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
  } else {
    /* メニュー：選択中キャラのプレビュー */
    const c = CHARACTERS.find(x => x.id === selectedCharId);
    ctx.fillStyle = st.ground;
    ctx.fillRect(-20, GROUND_Y, CW + 40, CH - GROUND_Y + 40);
    ctx.fillStyle = st.groundLine;
    ctx.fillRect(-20, GROUND_Y, CW + 40, 7);
    const bob = Math.sin(frame * 0.06) * 5;
    const ghost = { ...c, x: CW / 2 - c.size, y: GROUND_Y - c.size * 2 + bob, size: c.size * 2, rotation: 0, squashX: 1, squashY: 1, blinkT: frame % 210, grounded: true, runPhase: 0, invincibleUntil: -1, trail: [] };
    const realPlayer = player;
    player = ghost; drawPlayer(); player = realPlayer;
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    ctx.font = '900 30px "Hiragino Maru Gothic ProN", sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 10;
    ctx.fillText(c.name, CW / 2, GROUND_Y - c.size * 2 - 44 + bob);
    ctx.shadowBlur = 0;
  }
  ctx.restore();
  drawAmbient(st.theme);
}
function drawPlayer(){
  const p = player;
  const invincible = frame <= p.invincibleUntil;
  if (invincible && Math.floor(frame / 4) % 2 === 0 && gameState === 'PLAYING') return; // 無敵点滅
  /* ランナー残像 */
  if (p.id === 'runner'){
    for (let i = p.trail.length - 1; i >= 0; i--){
      const t = p.trail[i];
      ctx.save();
      ctx.translate(t.x + p.size / 2, t.y + p.size / 2); ctx.rotate(t.rot);
      ctx.globalAlpha = 0.26 - i * 0.045; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.roundRect(-p.size / 2, -p.size * 0.4, p.size, p.size * 0.8, 6); ctx.fill();
      ctx.restore();
    }
  }
  /* 影（地面との距離で濃さ・大きさが変わる） */
  const airH = Math.max(0, GROUND_Y - (p.y + p.size));
  ctx.save();
  ctx.globalAlpha = Math.max(0.05, 0.22 - airH * 0.0006);
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(p.x + p.size / 2, GROUND_Y + 5, p.size * (0.44 - Math.min(0.18, airH * 0.0004)), 5, 0, 0, 6.29); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
  ctx.rotate(p.id === 'slime' ? 0 : p.rotation);
  const runSquash = p.grounded ? Math.sin(p.runPhase) * 0.05 : 0;
  ctx.scale(p.squashX * (1 - runSquash), p.squashY * (1 + runSquash));
  ctx.fillStyle = p.color;
  const s = p.size;
  if (p.id === 'slime'){
    ctx.beginPath(); ctx.arc(0, 0, s / 2, Math.PI, 0); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 2); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(-s * 0.16, -s * 0.28, s * 0.13, s * 0.07, -0.5, 0, 6.29); ctx.fill();
    ctx.fillStyle = p.color;
  } else if (p.id === 'ghost'){
    ctx.globalAlpha = 0.92;
    ctx.beginPath(); ctx.arc(0, -s / 4, s / 2, Math.PI, 0);
    ctx.lineTo(s / 2, s / 2); ctx.lineTo(s / 4, s / 4); ctx.lineTo(0, s / 2); ctx.lineTo(-s / 4, s / 4); ctx.lineTo(-s / 2, s / 2);
    ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (p.id === 'runner'){
    ctx.beginPath(); ctx.roundRect(-s / 2, -s * 0.4, s, s * 0.8, 6); ctx.fill();
  } else if (p.id === 'knight'){
    ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    ctx.fillRect(-s / 2 + 4, -s / 2 + 5, s - 8, 5);
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.moveTo(0, -s / 2 - 2); ctx.lineTo(5, -s / 2 + 7); ctx.lineTo(-5, -s / 2 + 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = p.color;
  } else {
    ctx.beginPath(); ctx.roundRect(-s / 2, -s / 2, s, s, 8); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; /* 鉢巻 */
    ctx.fillRect(-s / 2, -s * 0.32, s, s * 0.16);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.moveTo(-s / 2, -s * 0.24); ctx.lineTo(-s / 2 - 12, -s * 0.24 + Math.sin(frame * 0.3) * 3); ctx.lineTo(-s / 2, -s * 0.1);
    ctx.closePath(); ctx.fill();
  }
  /* 目（瞬き対応） */
  const blink = (p.blinkT > 196 && p.blinkT < 204) ? 0.12 : 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(s * 0.15, -s * 0.08, s * 0.155, s * 0.155 * blink, 0, 0, 6.29); ctx.fill();
  if (blink > 0.5){
    ctx.fillStyle = '#111827';
    ctx.beginPath(); ctx.arc(s * 0.2, -s * 0.08, s * 0.065, 0, 6.29); ctx.fill();
  }
  /* 足（走りアニメ） */
  if (p.grounded && p.id !== 'slime' && p.id !== 'ghost'){
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    const ph = Math.sin(p.runPhase) * s * 0.16;
    ctx.beginPath(); ctx.roundRect(-s * 0.3 + ph, s / 2 - 3, s * 0.24, 6, 3); ctx.fill();
    ctx.beginPath(); ctx.roundRect(s * 0.08 - ph, s / 2 - 3, s * 0.24, 6, 3); ctx.fill();
  }
  ctx.restore();
  /* シールドリング */
  if (p.shield > 0){
    ctx.save();
    ctx.translate(p.x + p.size / 2, p.y + p.size / 2);
    ctx.strokeStyle = 'rgba(186,230,253,.9)'; ctx.lineWidth = 3;
    ctx.setLineDash([10, 7]); ctx.lineDashOffset = -frame * 0.7;
    ctx.beginPath(); ctx.arc(0, 0, p.size * 0.72, 0, 6.29); ctx.stroke();
    ctx.restore();
  }
  /* 無敵オーラ */
  if (invincible && gameState === 'PLAYING'){
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.12 * Math.sin(frame * 0.4);
    ctx.strokeStyle = '#7dd3fc'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x + p.size / 2, p.y + p.size / 2, p.size * 0.78, 0, 6.29); ctx.stroke();
    ctx.restore();
  }
}

/* 相手のゴースト（半透明キャラ＋「相手」ラベル） */
function drawGhost(){
  const c = CHARACTERS.find(x => x.id === oppProg.char) || CHARACTERS[0];
  const sx = oppProg.wx - scrollX;
  if (sx < -100 || sx > CW + 100) return;
  const ghost = {
    ...c, x: sx, y: oppProg.y, rotation: 0, squashX: 1, squashY: 1,
    blinkT: frame % 210, grounded: oppProg.y >= GROUND_Y - c.size - 2,
    runPhase: frame * 0.3, invincibleUntil: -1, trail: [], shield: 0, dead: false,
  };
  ctx.save();
  ctx.globalAlpha = 0.45;
  const realPlayer = player;
  player = ghost; drawPlayer(); player = realPlayer;
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.font = '900 15px "Hiragino Maru Gothic ProN", sans-serif';
  ctx.textAlign = 'center';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.45)';
  const lx = sx + c.size / 2, ly = oppProg.y - 14;
  ctx.strokeText('相手', lx, ly);
  ctx.fillStyle = '#fca5a5'; ctx.fillText('相手', lx, ly);
  ctx.restore();
}

/* ---------- メインループ ---------- */
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  let dt = ts - lastTs;
  lastTs = ts;
  if (dt > 250) dt = 250;
  if (gameState === 'COUNTDOWN'){
    countT += dt;
    const remain = Math.ceil((1050 - countT) / 350);
    if (remain !== countShown && remain >= 1){
      countShown = remain;
      const bc = document.getElementById('big-center');
      bc.classList.remove('hidden');
      document.getElementById('big-text').textContent = remain;
      const st = STAGES.find(s => s.id === selectedStageId);
      document.getElementById('big-sub').textContent = (st.isEndless ? 'ENDLESS' : 'STAGE ' + st.id) + ' — ' + st.name;
      bc.classList.remove('pop'); void bc.offsetWidth; bc.classList.add('pop');
      sfx.count();
    }
    if (countT >= 1050){
      gameState = 'PLAYING';
      const bc = document.getElementById('big-center');
      document.getElementById('big-text').textContent = 'GO!';
      document.getElementById('big-sub').textContent = '';
      bc.classList.remove('pop'); void bc.offsetWidth; bc.classList.add('pop');
      sfx.go(); bgmStart();
      bigHideTimer = setTimeout(() => bc.classList.add('hidden'), 420);
    }
    frame++;
  } else if (gameState === 'PLAYING'){
    acc += dt;
    while (acc >= STEP_MS){ step(); acc -= STEP_MS; if (gameState !== 'PLAYING'){ acc = 0; break; } }
  } else {
    frame++;
    if (gameState === 'MENU' || gameState === 'CLEAR' || gameState === 'OVER') updateParticles();
  }
  draw();
}

/* ---------- ポーズ ---------- */
function togglePause(){
  if (raceActive) return; // レース中はポーズなし（時計が進み続けるため）
  if (gameState === 'PLAYING'){
    gameState = 'PAUSED'; bgmStop();
    const ov = document.getElementById('overlay');
    document.getElementById('ov-title').textContent = '⏸ ポーズ中';
    document.getElementById('ov-title').style.color = '#fff';
    document.getElementById('ov-newrec').classList.add('hidden');
    document.getElementById('ov-sub').textContent = 'ひと休み、ひと休み。';
    document.getElementById('ov-stats').innerHTML = '';
    document.getElementById('ov-btns').innerHTML =
      '<button class="btn primary" id="ov-resume">▶ つづける</button>' +
      '<button class="btn light" id="ov-retry2">↻ 最初から</button>' +
      '<button class="btn ghost" id="ov-menu2">メニュー</button>';
    ov.classList.add('show');
    document.getElementById('ov-resume').onclick = () => { sfx.click(); togglePause(); };
    document.getElementById('ov-retry2').onclick = () => { sfx.click(); startGame(); };
    document.getElementById('ov-menu2').onclick = () => { sfx.click(); toMenu(); };
  } else if (gameState === 'PAUSED'){
    gameState = 'PLAYING';
    hideOverlay();
    if (save.sound) bgmStart();
  }
}

soundBtn.addEventListener('click', () => {
  save.sound = !save.sound; persist(); refreshSoundBtn();
  if (!save.sound) bgmStop();
  else { audioInit(); if (gameState === 'PLAYING') bgmStart(); sfx.click(); }
});

  if (document.hidden && gameState === 'PLAYING') togglePause();
});

/* ---------- リサイズ（DPR対応） ---------- */
function fitCanvas(){
  const r = container.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.width / 2 * dpr);
  ctx.setTransform(canvas.width / CW, 0, 0, canvas.width / CW, 0, 0);
}
window.addEventListener('resize', fitCanvas);

/* ================================================================
   オンライン対戦「ゴールレース」（PeerJS / WebRTC P2P）
   同じステージを同時スタートし、先にゴールした方の勝ち。
   200〜300ms間隔で進捗 {t:'prog'} を送り合い、進捗バーと
   相手ゴーストを表示する。切断しても自分のレースは止めない。
   ============================================================ */
const PEER_PREFIX = 'playweb-jp-';
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
] } };
const RACE_LIMIT_MS = 5 * 60 * 1000; // 制限時間5分（過ぎたら進捗％で勝敗）
let netMode = 'solo';           // 'solo' | 'online'
let netRole = null;             // 'host' | 'guest'
let peer = null, conn = null, roomCode = '';
let netClosing = false;
let guestReady = false;         // ホスト側: ゲストが参加済みか
let onlineStatusHTML = 'フレンドを招待するとレースが始まります。';
let raceActive = false, raceFinished = false;
let raceStage = 1, raceStartAt = 0;
let raceStartTimer = null, raceInt = null, raceLive = false;
let myGoalTime = null, oppGoalTime = null, myDnf = false;
let oppProg = { wx: 0, y: 0, pct: 0, coins: 0, char: 'ninja', dnf: false };
let reconnecting = false, heartbeatTimer = null, guestRetryTimer = null, connTimer = null;

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; /* I,O,0,1 を除外 */
function genRoomCode(){
  let code = '';
  for (let i = 0; i < 6; i++) code += CODE_CHARS[(Math.random() * CODE_CHARS.length) | 0];
  return code;
}
function peerAvailable(){ return typeof window.Peer !== 'undefined'; }
function setOnlineStatus(html){
  onlineStatusHTML = html;
  const el = document.getElementById('online-status');
  if (el) el.innerHTML = html;
}
function sendNet(obj){
  if (conn && conn.open){ try{ conn.send(obj); }catch (e){} }
}
function startHeartbeat(){
  stopHeartbeat();
  heartbeatTimer = setInterval(() => { sendNet({t: 'ping'}); }, 8000);
}
function stopHeartbeat(){ if (heartbeatTimer) clearInterval(heartbeatTimer); heartbeatTimer = null; }
function armConnTimer(msg){
  clearTimeout(connTimer);
  connTimer = setTimeout(() => {
    if (!conn || !conn.open) setOnlineStatus('<span class="err">' + msg + '</span>');
  }, 25000);
}
function disarmConnTimer(){ clearTimeout(connTimer); }
function copyRoomCode(){
  if (!roomCode) return;
  const done = () => showToast('コードをコピーしました');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = roomCode; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch (e){}
    ta.remove(); done();
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(roomCode).then(done).catch(fallback);
  else fallback();
}

/* ---------- レース進行 ---------- */
function myPct(){
  if (myGoalTime !== null) return 1;
  if (!level || level.isEndless) return 0;
  return Math.max(0, Math.min(1, scrollX / level.length));
}
function sendProg(force){
  if (!raceActive || !level || level.isEndless) return;
  if (!force && !raceLive) return;
  sendNet({ t:'prog', wx: Math.round(scrollX + PLAYER_X), y: player ? Math.round(player.y) : 0,
            pct: myPct(), coins: coinCount, char: selectedCharId });
}
function updateRaceBar(){
  const me = myPct(), op = oppGoalTime !== null ? 1 : oppProg.pct;
  const fm = document.getElementById('race-fill-me'), fo = document.getElementById('race-fill-opp');
  if (fm) fm.style.width = (me * 100).toFixed(1) + '%';
  if (fo) fo.style.width = (op * 100).toFixed(1) + '%';
  const pm = document.getElementById('race-pct-me'), po = document.getElementById('race-pct-opp');
  if (pm) pm.textContent = (myGoalTime !== null ? '🏁 ' + fmtTime(myGoalTime) + '秒' : Math.floor(me * 100) + '%') + ' ・ 🪙' + coinCount;
  if (po) po.textContent = (oppGoalTime !== null ? '🏁 ' + fmtTime(oppGoalTime) + '秒' : Math.floor(op * 100) + '%') + ' ・ 🪙' + oppProg.coins;
}
function setRaceStatus(text, warn){
  const el = document.getElementById('race-status');
  if (el){ el.textContent = text; el.classList.toggle('warn', !!warn); }
}
function raceTick(){
  if (!raceActive) return;
  updateRaceBar();
  sendProg();
  const clock = document.getElementById('race-clock');
  const elapsed = Date.now() - raceStartAt;
  if (clock){
    if (elapsed < 0) clock.textContent = 'まもなくスタート';
    else {
      const remain = Math.max(0, RACE_LIMIT_MS - elapsed);
      clock.textContent = '残り ' + Math.floor(remain / 60000) + ':' + String(Math.floor(remain % 60000 / 1000)).padStart(2, '0');
    }
  }
  if (!raceFinished && elapsed >= RACE_LIMIT_MS) finishByProgress();
}
function beginRaceCountdown(stage, startAt){
  clearTimeout(raceStartTimer);
  raceStage = stage; raceStartAt = startAt;
  selectedStageId = stage;
  raceActive = true; raceFinished = false; raceLive = false;
  myGoalTime = null; oppGoalTime = null; myDnf = false;
  oppProg = { wx: 0, y: 0, pct: 0, coins: 0, char: 'ninja', dnf: false };
  document.getElementById('race-bar').classList.remove('hidden');
  setRaceStatus('🏁 ゴールレース — STAGE ' + stage + '「' + (STAGES.find(s => s.id === stage) || {}).name + '」');
  updateRaceBar();
  startHeartbeat();
  clearInterval(raceInt);
  raceInt = setInterval(raceTick, 250);
  raceStartTimer = setTimeout(() => { if (raceActive && !raceFinished){ raceLive = true; startGame(); } }, Math.max(0, startAt - 1050 - Date.now()));
}
function hostStartRace(){
  if (netRole !== 'host' || !guestReady) return;
  if (selectedStageId === 0){
    setOnlineStatus('<span class="err">レースは通常ステージ（Stage 1〜6）を選んでください。</span>');
    showToast('エンドレスはレースできません');
    return;
  }
  const startAt = Date.now() + 3000;
  sendNet({ t:'start', stage: selectedStageId, startAt });
  beginRaceCountdown(selectedStageId, startAt);
}
function stopRaceTimers(){
  clearInterval(raceInt); raceInt = null;
  clearTimeout(raceStartTimer);
}
function raceStatsHTML(){
  const mine = myGoalTime !== null ? ['あなたのタイム', fmtTime(myGoalTime) + ' 秒']
    : myDnf ? ['あなた', 'リタイア'] : ['あなたの進捗', Math.floor(myPct() * 100) + ' %'];
  const opp = oppGoalTime !== null ? ['相手のタイム', fmtTime(oppGoalTime) + ' 秒']
    : oppProg.dnf ? ['相手', 'リタイア'] : ['相手の進捗', Math.floor(oppProg.pct * 100) + ' %'];
  return [mine, opp, ['あなたのコイン', '🪙 ' + coinCount], ['相手のコイン', '🪙 ' + oppProg.coins]]
    .map(s => `<div class="stat"><div class="v">${s[1]}</div><div class="k">${s[0]}</div></div>`).join('');
}
function finishRace(result, reason){
  if (raceFinished) return;
  raceFinished = true;
  /* レースの勝敗確定地点: フレンド戦績へ記録（result は 'win'|'lose'|'draw'） */
  if (window.PWFriends && PWFriends.recordMatch) PWFriends.recordMatch(result);
  stopRaceTimers();
  sendProg(true);
  updateRaceBar();
  setRaceStatus(result === 'win' ? '🏆 勝利！' : result === 'lose' ? '😢 敗北…' : '🤝 引き分け');
  const ov = document.getElementById('overlay');
  const title = document.getElementById('ov-title');
  title.textContent = result === 'win' ? '🏆 YOU WIN!' : result === 'lose' ? '😢 YOU LOSE…' : '🤝 DRAW';
  title.style.color = result === 'win' ? '#4ade80' : result === 'lose' ? '#f87171' : '#fbbf24';
  document.getElementById('ov-newrec').classList.add('hidden');
  document.getElementById('ov-sub').textContent = reason;
  document.getElementById('ov-stats').innerHTML = raceStatsHTML();
  let btns = '<button class="btn primary" id="ov-rematch">🔁 再戦</button>';
  btns += '<button class="btn ghost" id="ov-exit">退出</button>';
  document.getElementById('ov-btns').innerHTML = btns;
  ov.classList.add('show');
  document.getElementById('jump-btn').classList.remove('on');
  if (result === 'win') sfx.clear(); else if (result === 'lose') sfx.over();
  document.getElementById('ov-rematch').onclick = () => {
    sfx.click(); hideOverlay();
    if (netRole === 'host') hostStartRace();
    else { sendNet({t: 'rematch'}); showToast('ホストに再戦を伝えました'); }
  };
  document.getElementById('ov-exit').onclick = () => { sfx.click(); exitRaceToMenu(); };
}
function finishByProgress(){
  if (myGoalTime !== null && oppGoalTime === null) return finishRace('win', '制限時間終了！あなただけがゴールしました');
  if (oppGoalTime !== null && myGoalTime === null) return finishRace('lose', '制限時間終了。相手がゴール済みでした');
  const me = myPct(), op = oppProg.pct;
  if (me > op) finishRace('win', '制限時間終了！進捗 ' + Math.floor(me * 100) + '% 対 ' + Math.floor(op * 100) + '% で勝利');
  else if (op > me) finishRace('lose', '制限時間終了。進捗 ' + Math.floor(me * 100) + '% 対 ' + Math.floor(op * 100) + '% で敗北');
  else if (coinCount !== oppProg.coins) finishRace(coinCount > oppProg.coins ? 'win' : 'lose', '制限時間終了！進捗同率のためコイン数で判定');
  else finishRace('draw', '制限時間終了。まったく互角の引き分け！');
}
function onRaceGoal(){
  gameState = 'CLEAR'; bgmStop();
  sfx.clear(); confetti(player.x + player.size / 2, player.y);
  myGoalTime = Math.max(0, Date.now() - raceStartAt);
  sendNet({ t:'goal', time: myGoalTime });
  sendProg(true);
  if (oppGoalTime !== null){
    finishRace(myGoalTime < oppGoalTime ? 'win' : myGoalTime > oppGoalTime ? 'lose' : 'draw',
      '両者ゴール！タイムで勝敗が決まりました');
  } else if (oppProg.dnf){
    finishRace('win', '相手がリタイア。あなたの勝利です！');
  } else {
    /* 相手の結果待ちオーバーレイ */
    setRaceStatus('🏁 ゴール！相手の結果を待っています…');
    const ov = document.getElementById('overlay');
    const title = document.getElementById('ov-title');
    title.textContent = '🏁 GOAL!';
    title.style.color = '#4ade80';
    document.getElementById('ov-newrec').classList.add('hidden');
    document.getElementById('ov-sub').textContent = 'ゴール！相手の結果を待っています…';
    document.getElementById('ov-stats').innerHTML = raceStatsHTML();
    document.getElementById('ov-btns').innerHTML = '<button class="btn ghost" id="ov-exit2">退出</button>';
    ov.classList.add('show');
    document.getElementById('jump-btn').classList.remove('on');
    document.getElementById('ov-exit2').onclick = () => { sfx.click(); exitRaceToMenu(); };
  }
}
function onRaceDnf(){
  gameState = 'OVER'; bgmStop();
  sfx.over();
  myDnf = true;
  sendNet({ t:'dnf' });
  if (oppGoalTime !== null) finishRace('lose', '相手が先にゴールしていました');
  else finishRace('lose', 'ハートが尽きてリタイア… 相手の勝利です');
}
function onOppGoal(){
  if (raceFinished) return;
  if (myGoalTime !== null){
    finishRace(myGoalTime < oppGoalTime ? 'win' : myGoalTime > oppGoalTime ? 'lose' : 'draw',
      '両者ゴール！タイムで勝敗が決まりました');
    return;
  }
  clearTimeout(raceStartTimer);
  if (gameState === 'PLAYING' || gameState === 'COUNTDOWN' || gameState === 'PAUSED'){ gameState = 'OVER'; bgmStop(); }
  document.getElementById('big-center').classList.add('hidden');
  finishRace('lose', '相手が先にゴールしました！');
}
function onOppDnf(){
  if (raceFinished) return;
  if (myGoalTime !== null){ finishRace('win', 'あなたがゴール済み。勝利です！'); return; }
  clearTimeout(raceStartTimer);
  if (gameState === 'PLAYING' || gameState === 'COUNTDOWN' || gameState === 'PAUSED'){ gameState = 'OVER'; bgmStop(); }
  document.getElementById('big-center').classList.add('hidden');
  finishRace('win', '相手がリタイアしました。あなたの勝利です！');
}
function exitRaceToMenu(){
  sendNet({ t:'bye' });
  leaveOnline();
  hideOverlay();
  toMenu();
}

/* ---------- 受信メッセージ処理（テストから直接呼べるよう関数として公開） ---------- */
function handleNetData(msg){
  if (!msg || typeof msg !== 'object') return;
  if (msg.t === 'ping') return;
  if (msg.t === 'hello'){
    if (netRole !== 'host') return;
    if (raceActive){
      /* 再接続: レースは止まっていないので開始情報と現在進捗を送り返す */
      reconnecting = false;
      sendNet({ t:'resume', stage: raceStage, startAt: raceStartAt });
      sendProg(true);
      startHeartbeat();
      setRaceStatus('🏁 ゴールレース — STAGE ' + raceStage);
      showToast('相手が再接続しました');
      return;
    }
    guestReady = true;
    setOnlineStatus('相手が参加しました！ステージを選んで「レーススタート」を押してください。');
    showToast('相手が参加しました！');
    if (gameState === 'MENU') buildMenu();
    return;
  }
  if (msg.t === 'resume'){
    reconnecting = false;
    clearTimeout(guestRetryTimer);
    startHeartbeat();
    sendProg(true);
    setRaceStatus('🏁 ゴールレース — STAGE ' + raceStage);
    showToast('再接続しました！レース続行中');
    return;
  }
  if (msg.t === 'start'){
    if (netRole !== 'guest') return;
    const stg = msg.stage | 0;
    if (stg < 1 || stg >= STAGES.length) return;
    beginRaceCountdown(stg, msg.startAt || (Date.now() + 3000));
    return;
  }
  if (msg.t === 'prog'){
    oppProg.wx = +msg.wx || 0;
    oppProg.y = +msg.y || 0;
    oppProg.pct = Math.max(0, Math.min(1, +msg.pct || 0));
    oppProg.coins = msg.coins | 0;
    if (typeof msg.char === 'string') oppProg.char = msg.char;
    updateRaceBar();
    return;
  }
  if (msg.t === 'goal'){
    oppGoalTime = +msg.time;
    onOppGoal();
    return;
  }
  if (msg.t === 'dnf'){
    oppProg.dnf = true;
    onOppDnf();
    return;
  }
  if (msg.t === 'rematch'){
    if (netRole === 'host' && raceFinished) hostStartRace();
    return;
  }
  if (msg.t === 'bye'){
    if (raceActive && !raceFinished){
      oppProg.dnf = true;
      onOppDnf();
      setRaceStatus('相手が退出しました', true);
    } else if (netRole === 'host'){
      guestReady = false;
      setOnlineStatus('相手が退出しました。');
      if (gameState === 'MENU') buildMenu();
    }
    return;
  }
}

/* ---------- 接続管理 ---------- */
function onNetDisconnected(){
  if (netMode !== 'online' || netClosing) return;
  conn = null;
  stopHeartbeat();
  if (raceActive){
    /* レース中の切断: 自分のプレイは止めず再接続を試みる */
    reconnecting = true;
    setRaceStatus('⚠ 接続が切れました。再接続を試みています…（レースは続きます）', true);
    showToast('接続が切れました。再接続を試みています…');
    if (netRole === 'guest') scheduleGuestReconnect();
    return;
  }
  if (netRole === 'host'){
    guestReady = false;
    setOnlineStatus('<span class="err">相手との接続が切れました。</span>');
    if (gameState === 'MENU') buildMenu();
  } else if (netRole === 'guest'){
    reconnecting = true;
    setOnlineStatus('<span class="err">接続が切れました。再接続を試みています…</span>');
    scheduleGuestReconnect();
  }
}
function scheduleGuestReconnect(){
  clearTimeout(guestRetryTimer);
  let tries = 0;
  const attempt = () => {
    if (netMode !== 'online' || !reconnecting) return;
    tries++;
    if (tries > 20){
      reconnecting = false;
      setOnlineStatus('<span class="err">再接続できませんでした。もう一度参加してください。</span>');
      setRaceStatus('⚠ 再接続できませんでした', true);
      return;
    }
    guestRetryTimer = setTimeout(attempt, 5000);
    try{
      if (peer){ try{ peer.destroy(); }catch (e){} }
      peer = new Peer(undefined, PEER_OPTS);
      peer.on('open', () => {
        const c = peer.connect(PEER_PREFIX + roomCode, { reliable: true });
        setupConn(c);
        c.on('open', () => {
          sendNet({t: 'hello'});
          if (!raceActive){
            reconnecting = false;
            setOnlineStatus('再接続しました！ホストのスタートを待っています…');
            if (gameState === 'MENU') buildMenu();
          }
        });
      });
      peer.on('error', () => {});
    }catch (e){}
  };
  guestRetryTimer = setTimeout(attempt, 1500);
}
function setupConn(c){
  conn = c;
  c.on('data', handleNetData);
  c.on('close', () => { if (conn === c) onNetDisconnected(); });
  c.on('error', () => { if (conn === c) onNetDisconnected(); });
  c.on('open', () => disarmConnTimer());
  c.on('iceStateChanged', st => {
    if (conn !== c) return;
    if ((st === 'failed' || st === 'disconnected') && !raceActive){
      disarmConnTimer();
      setOnlineStatus('<span class="err">接続を確立できませんでした。ネットワーク環境を変えて（Wi-Fi／モバイル回線の切替など）もう一度お試しください。</span>');
    }
  });
}
function teardownNet(){
  netClosing = true;
  stopHeartbeat();
  clearTimeout(guestRetryTimer);
  clearTimeout(connTimer);
  stopRaceTimers();
  try{ if (conn) conn.close(); }catch (e){}
  try{ if (peer) peer.destroy(); }catch (e){}
  conn = null; peer = null;
  /* 終了した部屋のコードを残すと friends.js が旧コードを拾って死んだ部屋へ
     招待してしまうため必ず消す（leaveOnline だけでなく内部 teardown でも） */
  window.PW_ROOM_CODE = '';
}
function hostRoom(){
  if (!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。通信環境を確認してください。</span>'); return; }
  teardownNet();
  netClosing = false;
  netRole = 'host';
  guestReady = false;
  roomCode = genRoomCode();
  /* PW_ROOM_CODE は Peer が実際に open してから立てる。先に立てると、登録が
     済んでいない部屋のコードを friends.js が拾って招待してしまう */
  setOnlineStatus('部屋を作成中…');
  try{ peer = new Peer(PEER_PREFIX + roomCode, PEER_OPTS); }
  catch (e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); netRole = null; buildMenu(); return; }
  const hostPeer = peer; let hostOpened = false;
  setTimeout(() => {
    if(peer === hostPeer && !hostOpened){
      teardownNet(); netClosing = false; netRole = null;
      setOnlineStatus('<span class="err">接続を確立できませんでした（部屋の作成がタイムアウトしました）。通信環境を確認してもう一度お試しください。</span>');
      buildMenu();
    }
  }, 15000);
  peer.on('open', () => {
    hostOpened = true;
    window.PW_ROOM_CODE = roomCode; /* friends.js の招待フローが検出に使う（画面には出さない） */
    setOnlineStatus('相手の参加を待っています… 招待したフレンドの参加を待っています。');
    buildMenu();
  });
  peer.on('connection', c => {
    setupConn(c);
    if (reconnecting) setOnlineStatus('相手が再接続しています…');
    else setOnlineStatus('相手が接続しました。参加の準備中…');
    armConnTimer('相手との接続を確立できませんでした。相手にもう一度参加してもらうか、ネットワーク環境を変えてお試しください。');
  });
  peer.on('error', err => {
    if (err && err.type === 'unavailable-id'){
      setOnlineStatus('<span class="err">コードが重複しました。もう一度「部屋を作る」を押してください。</span>');
    } else {
      setOnlineStatus('<span class="err">接続エラーが発生しました。</span>');
    }
  });
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch (e){} });
  buildMenu();
}
function joinRoom(codeArg){
  if (!peerAvailable()){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。通信環境を確認してください。</span>'); return; }
  const input = document.getElementById('join-code');
  const code = (typeof codeArg === 'string' && codeArg ? codeArg : ((input && input.value) || '')).trim().toUpperCase();
  if (code.length !== 6){ setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; }
  teardownNet();
  netClosing = false;
  netRole = 'guest';
  roomCode = code;
  window.PW_ROOM_CODE = code;
  setOnlineStatus('接続中…');
  try{ peer = new Peer(undefined, PEER_OPTS); }
  catch (e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); netRole = null; buildMenu(); return; }
  const joinPeer = peer;
  const joinDeadline = Date.now() + 20000;
  let joinPeerOpen = false, joinConnOpen = false;
  const tryJoinConnect = () => {
    armConnTimer('接続を確立できませんでした。コードが正しいか確認し、ネットワーク環境を変えてもう一度お試しください。');
    const c = peer.connect(PEER_PREFIX + code, { reliable: true });
    setupConn(c);
    c.on('open', () => {
      joinConnOpen = true;
      sendNet({t: 'hello'});
      setOnlineStatus('接続しました！ホストのスタートを待っています…');
      buildMenu();
    });
  };
  peer.on('open', () => { joinPeerOpen = true; tryJoinConnect(); });
  /* ゲスト側 Peer の 'open' 自体が来ない場合も固まらないようにする */
  setTimeout(() => {
    if(peer === joinPeer && !joinPeerOpen){
      teardownNet(); netClosing = false; netRole = null;
      setOnlineStatus('<span class="err">接続を確立できませんでした（タイムアウト）。通信環境を確認してもう一度お試しください。</span>');
      buildMenu();
    }
  }, 15000);
  peer.on('error', err => {
    if (err && err.type === 'peer-unavailable'){
      /* ホストの Peer 登録が間に合っていないだけのことがあるため即失敗にせず、
         同じ Peer から最大20秒ほど再接続を試みてから失敗にする */
      if(!joinConnOpen && Date.now() < joinDeadline){
        setOnlineStatus('接続中…（部屋を探しています）');
        setTimeout(() => { if(peer === joinPeer && !joinConnOpen) tryJoinConnect(); }, 1500);
        return;
      }
      setOnlineStatus('<span class="err">部屋が見つかりませんでした。コードを確認してください。</span>');
    } else {
      setOnlineStatus('<span class="err">接続エラーが発生しました。</span>');
    }
  });
  buildMenu();
}
function leaveOnline(){
  teardownNet();
  netClosing = false;
  netRole = null;
  window.PW_ROOM_CODE = '';
  guestReady = false;
  reconnecting = false;
  raceActive = false; raceFinished = false; raceLive = false;
  document.getElementById('race-bar').classList.add('hidden');
  setOnlineStatus('フレンドを招待するとレースが始まります。');
}
document.getElementById('race-exit').addEventListener('click', () => { sfx.click(); exitRaceToMenu(); });

/* ---------- フレンド招待制（friends.js 連携） ----------
   オンラインUIは buildMenu() が動的生成するため friends.js の自動変換が効かない。
   ここで UI なしのホスト作成/参加を公開し、招待フローから使えるようにする。
   ルームコードは window.PW_ROOM_CODE 経由で friends.js が検出する（画面には出さない）。 */
window.PW_AUTO_HOST = function(){
  if (netRole === 'host' && roomCode) return;
  netMode = 'online';
  hostRoom();
};
window.PW_AUTO_JOIN = function(code){
  const c = (code || '').toString().trim().toUpperCase();
  if (c.length !== 6) return;
  if (netRole === 'guest' && roomCode === c) return;
  netMode = 'online';
  joinRoom(c);
};

/* ---------- 初期化 ---------- */
buildMenu();
updateHudStage();
updateHearts();
refreshSoundBtn();
fitCanvas();
requestAnimationFrame(loop);
/* 招待リンク（?join= / ?hostinvite=）で来た場合は、コード入力UIを経由せず直接参加/作成する */
try {
  const _pwParams = new URLSearchParams(location.search);
  if (_pwParams.get('join')) window.PW_AUTO_JOIN(_pwParams.get('join'));
  else if (_pwParams.get('hostinvite')) window.PW_AUTO_HOST();
} catch (e) {}
</script>

<script src="friends.js"></script>
