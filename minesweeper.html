<html lang="ja">
<head>

<style>
  :root{ --bg:#0b0e1a; --panel:rgba(255,255,255,.05); --line:rgba(255,255,255,.1); --txt:#eef0ff; --sub:#98a0c3; }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(1000px 700px at 15% -10%, #17351f 0%, transparent 55%), radial-gradient(900px 700px at 95% 110%, #12294d 0%, transparent 55%), var(--bg);
    color:var(--txt); font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif; min-height:100%; display:flex; flex-direction:column; align-items:center; user-select:none; -webkit-user-select:none;}
  header{width:100%;max-width:760px;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 4px}
  .logo{font-weight:900;letter-spacing:.22em;font-size:19px;background:linear-gradient(90deg,#4ade80,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none}
  .hbtn:active{transform:scale(.96)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(8px);box-shadow:0 24px 60px rgba(0,0,0,.45);margin:10px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
  .seg{display:flex;background:rgba(0,0,0,.3);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;color:var(--sub);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.on{background:linear-gradient(90deg,#16a34a,#0891b2);color:#fff;box-shadow:0 4px 14px rgba(34,211,238,.3)}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .lcd{background:#05070f;border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#f87171;font-family:"Courier New",monospace;font-weight:700;font-size:24px;padding:4px 12px;min-width:86px;text-align:center;letter-spacing:.12em;box-shadow:inset 0 2px 10px rgba(0,0,0,.8)}
  .lcd.blue{color:#38bdf8}
  #face{font-size:30px;background:rgba(255,255,255,.07);border:1px solid var(--line);width:56px;height:56px;border-radius:50%;cursor:pointer;line-height:1}
  #face:active{transform:scale(.93)}
  #board{display:grid;gap:3px;justify-content:center}
  .cell{border:none;border-radius:7px;background:linear-gradient(145deg,#2b3f66,#1d2a47);color:#fff;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);transition:transform .06s;position:relative;font-family:inherit}
  .cell:hover{filter:brightness(1.25)}
  .cell.open{background:rgba(255,255,255,.055);box-shadow:inset 0 1px 4px rgba(0,0,0,.5);cursor:default;animation:pop .16s ease-out}
  @keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
  .cell.mine{background:linear-gradient(145deg,#7f1d1d,#450a0a)}
  .cell.boom{background:radial-gradient(circle,#ef4444,#7f1d1d);animation:shake .4s}
  @keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}}
  .cell.flag{background:linear-gradient(145deg,#3f6212,#274209)}
  .n1{color:#60a5fa}.n2{color:#4ade80}.n3{color:#f87171}.n4{color:#a78bfa}.n5{color:#fbbf24}.n6{color:#22d3ee}.n7{color:#f472b6}.n8{color:#e2e8f0}
  .msg{text-align:center;min-height:26px;font-weight:800;font-size:16px;margin-top:12px;letter-spacing:.05em}
  .best{text-align:center;color:var(--sub);font-size:12px;margin-top:4px}
  .modeRow{display:flex;justify-content:center;margin-top:10px}
  #flagMode{display:none}
  @media (pointer:coarse){ #flagMode{display:inline-block} }
  .help{color:var(--sub);font-size:12px;text-align:center;line-height:1.9;padding:0 16px 24px;max-width:640px}
  .panel{max-width:calc(100vw - 20px)}
  @media (max-width:480px){
    .panel{padding:12px;margin:8px;max-width:calc(100vw - 16px)}
    header{padding:12px 10px 2px}
    .logo{font-size:16px;letter-spacing:.14em}
    .hbtn{padding:6px 9px;font-size:12px;white-space:nowrap}
  }
  #boardWrap{max-width:100%;overflow-x:auto;padding-bottom:4px}
  .onlinePanel{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .onlinePanel.show{display:block}
  .orow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:10px}
  .codeDisp{font-family:"Courier New",monospace;font-size:26px;font-weight:700;letter-spacing:.3em;background:#05070f;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 12px 6px 20px;color:#4ade80}
  .codeInput{background:#05070f;border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--txt);font-size:16px;padding:8px 10px;width:132px;text-transform:uppercase;text-align:center;letter-spacing:.15em;font-family:inherit}
  .ostatus{text-align:center;color:var(--sub);font-size:13px;min-height:20px;line-height:1.6}
  .ostatus .err{color:#f87171;font-weight:700}
  .progWrap{margin-top:6px}
  .progRow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub);margin-top:6px}
  .progRow .plabel{width:40px;text-align:right;flex:none}
  .progBar{flex:1;height:12px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:999px;overflow:hidden;min-width:60px}
  .progFill{height:100%;width:0%;border-radius:999px;transition:width .25s}
  .progFill.me{background:linear-gradient(90deg,#16a34a,#4ade80)}
  .progFill.opp{background:linear-gradient(90deg,#b45309,#f59e0b)}
  .progPct{width:86px;flex:none;font-variant-numeric:tabular-nums}
  .modalOverlay{position:fixed;inset:0;background:rgba(3,5,12,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modalOverlay.show{display:flex}
  .modalCard{background:#12172b;border:1px solid var(--line);border-radius:18px;padding:24px 22px;max-width:400px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto}
  .modalCard h2{font-size:24px;margin-bottom:10px}
  .modalCard .stats{font-size:14px;line-height:2;color:var(--sub)}
  .modalCard .stats b{color:var(--txt)}
  .modalBtns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .bigbtn{background:linear-gradient(90deg,#16a34a,#0891b2);color:#fff;border:none;border-radius:12px;padding:11px 22px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .bigbtn:disabled{opacity:.45;cursor:default}
  .ghostbtn{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  /* 1画面フィット（ページスクロールを無くし、パネル内だけが最大でも僅かにスクロール）
     ※横方向のパネル余白は calcCellSize() の前提（chrome=42）と一致させるため変更しない */
  html,body{height:100%}
  body{height:100dvh;overflow:hidden}
  header{padding:10px 10px 2px}
  .hbtn{padding:5px 12px}
  .panel{flex:1;min-height:0;overflow-y:auto;padding:8px 12px;margin:6px 8px;display:flex;flex-direction:column}
  .panel>*{flex:none}
  .controls{margin-bottom:4px}
  .seg button{padding:5px 11px;font-size:12px}
  .hud{margin-bottom:4px}
  #face{width:44px;height:44px;font-size:24px}
  .lcd{font-size:19px;padding:3px 10px;min-width:72px}
  #boardWrap{padding-bottom:0;position:relative;overflow:hidden;width:100%;flex:1 1 auto;min-height:120px;touch-action:none}
  #board{width:max-content;justify-content:start;will-change:transform}
  .cell{touch-action:none}
  .msg{margin-top:8px;min-height:20px;font-size:15px}
  .best{margin-top:2px}
  .modeRow{margin-top:6px}
  .help{font-size:11px;line-height:1.5;padding:0 14px 8px}
</style>
<style>
/* バウンス抑止（麻雀方式：画面固定） */
html,body{overscroll-behavior:none;}
#boardWrap,.modalCard,.panel{overscroll-behavior:none;}
</style>
</head>
<body>
<header>
  <div class="logo">💣 MINESWEEPER</div>
  <div style="display:flex;gap:8px">
    <button class="hbtn" id="soundBtn">🔊 サウンド</button>
  </div>
</header>

<div class="panel">
  <div class="controls">
    <div class="seg" id="modeSeg">
      <button data-m="solo" class="on">ソロ</button>
      <button data-m="online">🌐 オンライン対戦</button>
    </div>
    <div class="seg" id="diffSeg">
      <button data-d="easy" class="on">初級 9×9</button>
      <button data-d="mid">中級 16×16</button>
      <button data-d="hard">上級 30×16</button>
    </div>
  </div>
  <div class="hud">
    <div class="lcd" id="mineCount">010</div>
    <button id="face" title="リスタート">😊</button>
    <div class="lcd blue" id="timer">000</div>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
  <div class="msg" id="msg"></div>
  <div class="best" id="best"></div>
  <div class="modeRow"><button class="hbtn" id="flagMode">🚩 フラグモード: OFF</button></div>

  <div class="onlinePanel" id="onlinePanel">
    <div class="orow">
      <button class="hbtn" id="hostBtn">🏠 部屋を作る</button>
      <input class="codeInput" id="joinCode" maxlength="6" placeholder="コード">
      <button class="hbtn" id="joinBtn">参加する</button>
    </div>
    <div class="orow" id="codeWrap" style="display:none">
      <span style="font-size:13px;color:var(--sub)">ルームコード</span>
      <span class="codeDisp" id="roomCodeText">------</span>
      <button class="hbtn" id="copyCodeBtn">📋 コピー</button>
    </div>
    <div class="ostatus" id="onlineStatus">オンラインはフレンド招待制です。「フレンドを招待して対戦」から始めましょう。</div>
    <div class="progWrap" id="progWrap" style="display:none">
      <div class="progRow"><span class="plabel">あなた</span><div class="progBar"><div class="progFill me" id="myProgFill"></div></div><span class="progPct" id="myProgText">0% (0)</span></div>
      <div class="progRow"><span class="plabel">相手</span><div class="progBar"><div class="progFill opp" id="oppProgFill"></div></div><span class="progPct" id="oppProgText">0% (0)</span></div>
    </div>
    <div class="orow" style="margin-top:10px;margin-bottom:0"><button class="hbtn" id="leaveBtn" style="display:none">🚪 退出する</button></div>
  </div>
</div>

<div class="modalOverlay" id="resultModal">
  <div class="modalCard">
    <h2 id="resultTitle">🏆 勝利！</h2>
    <div class="stats" id="resultStats"></div>
    <div class="modalBtns">
      <button class="bigbtn" id="rematchBtn">🔁 再戦する</button>
      <button class="ghostbtn" id="modalLeaveBtn">退出する</button>
    </div>
    <div class="ostatus" id="rematchNote" style="margin-top:10px"></div>
  </div>
</div>

<p class="help">左クリック / タップ: 開く　右クリック / 長押し: フラグ 🚩<br>数字を両ボタン同時押し（またはダブルタップ）で周囲を一括オープン（コード）。最初のクリックは絶対に安全です。<br>🌐 オンライン対戦: ふたりとも同じシード＋同じ初手ルールで生成した盤面で勝負。先に全部開けた方が勝ち、地雷を踏んだら負けです。</p>

<script>
"use strict";
const DIFFS = { easy:{w:9,h:9,mines:10,label:'初級'}, mid:{w:16,h:16,mines:40,label:'中級'}, hard:{w:30,h:16,mines:99,label:'上級'} };
const $ = id=>document.getElementById(id);
let diff='easy', W,H,M, cells, started, over, won, flags, opened, timerInt, seconds, timerT0=0, firstClickDone;
let soundOn=true, audioCtx=null, flagMode=false;
let rngFn=Math.random; // ソロは Math.random、レース中はシード付きRNGに差し替える
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function beep(f,d=0.06,type='square',v=0.045){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(v,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}

function init(){
  const d=DIFFS[diff]; W=d.w; H=d.h; M=d.mines;
  cells=[]; started=false; over=false; won=false; flags=0; opened=0; seconds=0; timerT0=0; firstClickDone=false;
  if(!raceActive) rngFn=Math.random;
  clearInterval(timerInt);
  $('timer').textContent='000';
  $('mineCount').textContent=String(M).padStart(3,'0');
  $('face').textContent='😊'; $('msg').textContent='';
  const bd=$('board');
  bd.innerHTML='';
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c={x,y,mine:false,n:0,open:false,flag:false,el:document.createElement('button')};
    c.el.className='cell';
    c.el.addEventListener('click', e=>{ if(suppressClick){suppressClick=false;return;} onCell(c); });
    c.el.addEventListener('contextmenu', e=>{ e.preventDefault(); if(Date.now()-lastLongFlagAt<700) return; toggleFlag(c); });
    c.el.addEventListener('dblclick', ()=>chord(c));
    bd.appendChild(c.el); cells.push(c);
  }
  panX=0; panY=0;
  applyBoardSize();
  showBest();
}
/* セルサイズを算出する。
   使える幅 = ビューポート幅 − パネルの横方向の余白（マージン+ボーダー+パディング）。
   CSS の @media (max-width:480px) でパネル余白が変わるため、控除量も切り替える。
   幅に収まる難易度はフィット表示、収まらない難易度は指で押せる最低サイズを
   死守し、はみ出し分は盤面パン（ドラッグ）で見る。 */
function calcCellSize(){
  const vw = document.documentElement.clientWidth || window.innerWidth;
  const chrome = vw <= 480 ? 42 : 54; // ≤480px: margin16+border2+padding24 / それ以外: margin20+border2+padding32
  const avail = vw - chrome;
  const MIN_CELL = 26; // これ未満は指で押せない
  /* ギャップ 3/2/1px のうちセルが最大になる組み合わせを選ぶ（同点ならギャップ大を優先） */
  let best = { size: 6, gap: 1 };
  for(const gap of [3, 2, 1]){
    const size = Math.min(32, Math.floor((avail - (W - 1) * gap) / W));
    if(size > best.size) best = { size, gap };
  }
  if(best.size >= MIN_CELL) return best;
  return { size: MIN_CELL, gap: 2 };
}
function applyBoardSize(){
  if(!W || !cells) return;
  const bd = $('board'); if(!bd) return;
  const { size, gap } = calcCellSize();
  const fs = size>=28?17 : size>=20?14 : size>=16?12 : size>=12?11 : size>=9?9 : 8;
  const br = Math.min(7, Math.max(2, Math.round(size * 0.22))) + 'px'; // 小さいセルでは角丸も弱めて四角く保つ
  bd.style.gap = gap + 'px';
  bd.style.gridTemplateColumns = `repeat(${W}, ${size}px)`;
  for(const c of cells){
    c.el.style.width = size + 'px'; c.el.style.height = size + 'px'; c.el.style.fontSize = fs + 'px'; c.el.style.borderRadius = br;
  }
  boardWpx = W * size + (W - 1) * gap;
  boardHpx = H * size + (H - 1) * gap;
  clampPan();
}
let resizeTimer = null;
window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer = setTimeout(applyBoardSize, 150); });
let suppressClick=false;
/* ===== 盤面入力の統合（タップ=開く / 長押し=フラグ / ドラッグ=盤面パン） =====
   画面に収まらない難易度はセル26pxを保ち、盤面をドラッグでずらして見る。
   ピンチズームは使わない（全ページ無効化の方針のため）。 */
let panX=0, panY=0, boardWpx=0, boardHpx=0;
let press=null, lastLongFlagAt=0;
const PAN_THRESHOLD=10; // これを超えて動いたら「タップ」ではなく「パン」とみなす
function clampPan(){
  const wrap=$('boardWrap'), bd=$('board');
  if(!wrap || !bd || !boardWpx) return;
  const vw=wrap.clientWidth, vh=wrap.clientHeight;
  if(!vw || !vh) return;
  panX = boardWpx<=vw ? (vw-boardWpx)/2 : Math.max(vw-boardWpx, Math.min(0, panX));
  panY = boardHpx<=vh ? (vh-boardHpx)/2 : Math.max(vh-boardHpx, Math.min(0, panY));
  bd.style.transform='translate('+panX+'px,'+panY+'px)';
}
function cellFromEvent(e){
  const t=e.target;
  const el = t && t.closest ? t.closest('.cell') : null;
  if(!el) return null;
  const i=Array.prototype.indexOf.call($('board').children, el);
  return i>=0 ? cells[i] : null;
}
$('board').addEventListener('pointerdown', e=>{
  if(e.button!==undefined && e.button>0) return; // 右ボタンは contextmenu（フラグ）に任せる
  const c=cellFromEvent(e); if(!c) return;
  press={ cell:c, id:e.pointerId, x:e.clientX, y:e.clientY, px:panX, py:panY, mode:'pending' };
  press.timer=setTimeout(()=>{
    if(press && press.mode==='pending'){ press.mode='flag'; lastLongFlagAt=Date.now(); toggleFlag(press.cell); suppressClick=true; }
  },380);
});
window.addEventListener('pointermove', e=>{
  if(!press || e.pointerId!==press.id) return;
  const dx=e.clientX-press.x, dy=e.clientY-press.y;
  if(press.mode==='pending' && Math.hypot(dx,dy)>PAN_THRESHOLD){
    press.mode='pan'; clearTimeout(press.timer); suppressClick=true; // 動いたら長押しフラグはキャンセル
  }
  if(press.mode==='pan'){ panX=press.px+dx; panY=press.py+dy; clampPan(); if(e.cancelable) e.preventDefault(); }
});
window.addEventListener('pointerup', e=>{
  if(!press || e.pointerId!==press.id) return;
  clearTimeout(press.timer);
  const p=press; press=null;
  suppressClick=true; // 直後に発生する click は盤面側で1回だけ無効化する
  if(p.mode==='pending') onCell(p.cell); // ほぼ動かさず離した = タップ
});
window.addEventListener('pointercancel', e=>{
  if(press && e.pointerId===press.id){ clearTimeout(press.timer); press=null; suppressClick=true; }
});
/* タップ/パン/長押しの直後に発生する click を、盤面のキャプチャ段階で1回だけ止める。
   セル外に着地した click でも suppress が残らない。ポインタを経ない click
   （キーボード操作や .click()）は suppress が立っていないのでそのまま通る。 */
$('board').addEventListener('click', e=>{
  if(suppressClick){ suppressClick=false; e.stopPropagation(); e.preventDefault(); }
}, true);
if(window.ResizeObserver){ try{ new ResizeObserver(()=>clampPan()).observe($('boardWrap')); }catch(e){} }
window.addEventListener('load', ()=>applyBoardSize());
const idx=(x,y)=>y*W+x;
const inB=(x,y)=>x>=0&&x<W&&y>=0&&y<H;
function neighbors(c){ const r=[]; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue; const nx=c.x+dx,ny=c.y+dy; if(inB(nx,ny)) r.push(cells[idx(nx,ny)]); } return r; }

function placeMines(safe){
  const banned=new Set([idx(safe.x,safe.y), ...neighbors(safe).map(c=>idx(c.x,c.y))]);
  let placed=0;
  while(placed<M){
    const i=Math.floor(rngFn()*cells.length);
    if(banned.has(i)||cells[i].mine) continue;
    cells[i].mine=true; placed++;
  }
  cells.forEach(c=>{ c.n=neighbors(c).filter(n=>n.mine).length; });
}
function timerElapsedSec(){ return timerT0 ? Math.floor((performance.now()-timerT0)/1000) : seconds; }
function renderTimer(){ $('timer').textContent=String(Math.min(999,Math.max(0,seconds))).padStart(3,'0'); }
function startTimer(){
  if(started) return; started=true;
  timerT0=performance.now(); seconds=0; renderTimer();
  clearInterval(timerInt);
  /* 経過は「tickで+1」ではなく開始時刻から算出する。tick間隔だけに頼ると、
     ゲームオーバー/クリアが最初のtick前に起きた場合や、バックグラウンドで
     インターバルが抑制された場合に、表示が 000 のまま固まって見えるため。
     終了時は stopTimer() が最終経過を確定してから止める。 */
  timerInt=setInterval(()=>{ seconds=Math.min(999,timerElapsedSec()); renderTimer(); },200);
}
function stopTimer(){
  if(timerT0){ seconds=Math.min(999,timerElapsedSec()); timerT0=0; }
  clearInterval(timerInt); renderTimer();
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && started && timerT0){ seconds=Math.min(999,timerElapsedSec()); renderTimer(); } });
function onCell(c){
  if(over) return;
  if(flagMode){ toggleFlag(c); return; }
  if(c.flag) return;
  if(c.open){ chord(c); return; }
  openCell(c);
}
function openCell(c){
  if(!firstClickDone){ if(raceActive) raceT0=performance.now(); placeMines(c); firstClickDone=true; }
  startTimer();
  if(c.mine){ lose(c); return; }
  const stack=[c];
  while(stack.length){
    const cur=stack.pop();
    if(cur.open||cur.flag) continue;
    cur.open=true; opened++;
    cur.el.classList.add('open');
    if(cur.n>0){ cur.el.textContent=cur.n; cur.el.classList.add('n'+cur.n); }
    else neighbors(cur).forEach(n=>{ if(!n.open&&!n.mine) stack.push(n); });
  }
  beep(660,0.04,'triangle',0.03);
  checkWin();
  sendProg(false);
}
function chord(c){
  if(over||!c.open||c.n===0) return;
  const ns=neighbors(c);
  if(ns.filter(n=>n.flag).length!==c.n) return;
  ns.forEach(n=>{ if(!n.flag&&!n.open) openCell(n); });
}
function toggleFlag(c){
  if(over||c.open) return;
  /* フラグだけではタイマーを開始しない（開始は最初のマス開け= openCell のみ）。
     旧コードは startTimer() を呼んでしまい、フラグ先行で計時が始まっていた。 */
  c.flag=!c.flag; flags+=c.flag?1:-1;
  c.el.textContent=c.flag?'🚩':'';
  c.el.classList.toggle('flag',c.flag);
  $('mineCount').textContent=String(Math.max(-99,M-flags)).padStart(3,'0');
  beep(c.flag?880:440,0.04,'square',0.03);
  sendProg(false);
}
function checkWin(){
  if(opened === W*H-M){
    won=true; over=true; stopTimer();
    cells.forEach(c=>{ if(c.mine&&!c.flag){ c.flag=true; c.el.textContent='🚩'; c.el.classList.add('flag'); } });
    $('mineCount').textContent='000';
    $('face').textContent='😎';
    $('msg').textContent='🎉 クリア！ '+seconds+'秒';
    [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'triangle',0.06),i*90));
    if(raceActive){
      myResult='clear';
      myClearMs = raceT0 ? Math.round(performance.now()-raceT0) : seconds*1000;
      $('msg').textContent='🎉 クリア！ '+(myClearMs/1000).toFixed(1)+'秒';
      sendProg(true);
      sendOnline({t:'clear', time:myClearMs});
      resolveRace();
    }else{
      const key='ms_best_'+diff, prev=+(localStorage.getItem(key)||0);
      if(seconds>=1&&(!prev||seconds<prev)) localStorage.setItem(key,seconds); // 1秒未満クリアで「0秒ベスト」を記録しない
    }
    showBest();
  }
}
function lose(hit){
  over=true; stopTimer();
  cells.forEach(c=>{
    if(c.mine){ c.el.classList.add('mine'); c.el.textContent='💣'; if(c.flag) c.el.textContent='🚩'; }
    else if(c.flag){ c.el.textContent='❌'; }
  });
  hit.el.classList.add('boom'); hit.el.textContent='💥';
  $('face').textContent='😵';
  $('msg').textContent='💥 ゲームオーバー… もう一度挑戦！';
  beep(120,0.4,'sawtooth',0.08);
  if(raceActive){
    myResult='boom';
    sendProg(true);
    sendOnline({t:'boom'});
    resolveRace();
  }
}
function showBest(){
  const v=localStorage.getItem('ms_best_'+diff);
  $('best').textContent = v ? `🏆 ${DIFFS[diff].label}ベスト: ${v}秒` : '';
}
document.querySelectorAll('#diffSeg button').forEach(b=>{
  b.onclick=()=>{ if(raceActive) return; document.querySelectorAll('#diffSeg button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); diff=b.dataset.d; init(); };
});
$('face').onclick=()=>{ if(netMode==='online') return; init(); };
$('soundBtn').onclick=()=>{ soundOn=!soundOn; $('soundBtn').textContent=soundOn?'🔊 サウンド':'🔇 ミュート'; };
$('flagMode').onclick=()=>{ flagMode=!flagMode; $('flagMode').textContent='🚩 フラグモード: '+(flagMode?'ON':'OFF'); };

/* ============================================================
   オンライン対戦「レースモード」（PeerJS / WebRTC P2P）
   公平性の設計: 両者ともホストが決めたシードで、既存の初手安全
   ルール（初手マス＋周囲8マスには地雷を置かない）のまま
   placeMines をシード付きRNGで実行する。同じ初手を選べば
   盤面（地雷配置）は完全一致し、どちらも初手で地雷を踏まない。
   勝敗: 先に全安全マスを開けた側の勝ち。地雷を踏んだら即負け。
   ============================================================ */
const PEER_PREFIX = 'playweb-ms-';
const PEER_OPTS = { config: { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
] } };
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; /* I,O,0,1 を除外 */
let netMode='solo'; // 'solo' | 'online'
let peer=null, conn=null, isHost=false, roomCode='', onlineClosing=false, connOpen=false;
let raceActive=false, raceResolved=false, raceSeed=0, raceT0=0;
let myResult=null, oppResult=null, myClearMs=0, oppClearMs=0; // 'clear' | 'boom' | null
let oppProg={pct:0, opened:0, flags:0};
let reconnecting=false, heartbeatTimer=null, guestRetryTimer=null, connTimer=null;
let lastProgSent=0, progFlushTimer=null;

function genRoomCode(){ let s=''; for(let i=0;i<6;i++) s+=CODE_CHARS[(Math.random()*CODE_CHARS.length)|0]; return s; }
function peerAvailable(){ return typeof window.Peer!=='undefined'; }
/* PeerJS（CDN）の読み込みが一瞬遅れた/失敗しただけで自動参加が即エラーに
   ならないよう、最大12秒ポーリングし、無ければ CDN スクリプトを1回だけ
   読み直してからコールバックする。?join 経由の自動参加はユーザーが
   リトライを押す機会がないため、この待ち合わせが無いと「接続エラー」で終わる。 */
let peerLoadRequested=false;
function ensurePeer(cb){
  if(peerAvailable()){ cb(true); return; }
  setOnlineStatus('オンライン機能を読み込んでいます…');
  if(!peerLoadRequested){
    peerLoadRequested=true;
    try{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
      document.head.appendChild(s);
    }catch(e){}
  }
  const t0=Date.now();
  const iv=setInterval(()=>{
    if(peerAvailable()){ clearInterval(iv); cb(true); }
    else if(Date.now()-t0>12000){ clearInterval(iv); cb(false); }
  },300);
}
function setOnlineStatus(html){ $('onlineStatus').innerHTML=html; }
function sendOnline(obj){ if(conn&&conn.open){ try{ conn.send(obj); }catch(e){} } }
function startHeartbeat(){ stopHeartbeat(); heartbeatTimer=setInterval(()=>{ sendOnline({t:'ping'}); },8000); }
function stopHeartbeat(){ if(heartbeatTimer) clearInterval(heartbeatTimer); heartbeatTimer=null; }
function armConnTimer(msg){
  clearTimeout(connTimer);
  connTimer=setTimeout(()=>{ if(!connOpen&&netMode==='online') setOnlineStatus('<span class="err">'+msg+'</span>'); },25000);
}
function disarmConnTimer(){ clearTimeout(connTimer); }
function currentPct(){ const total=W*H-M; return total>0 ? Math.floor(opened/total*100) : 0; }
function updateMyProg(){ const p=currentPct(); $('myProgFill').style.width=p+'%'; $('myProgText').textContent=p+'% ('+opened+')'; }
function updateOppProg(){ $('oppProgFill').style.width=oppProg.pct+'%'; $('oppProgText').textContent=oppProg.pct+'% ('+oppProg.opened+')'; }
function sendProg(force){
  if(!raceActive) return;
  updateMyProg();
  const now=performance.now();
  if(!force && now-lastProgSent<120){ clearTimeout(progFlushTimer); progFlushTimer=setTimeout(()=>sendProg(true),130); return; }
  lastProgSent=now;
  sendOnline({t:'prog', pct:currentPct(), opened, flags});
}
function sendMyStanding(){
  sendOnline({t:'prog', pct:currentPct(), opened, flags});
  if(myResult==='clear') sendOnline({t:'clear', time:myClearMs});
  else if(myResult==='boom') sendOnline({t:'boom'});
}
function fmtMs(ms){ return (ms/1000).toFixed(1)+'秒'; }

function startRace(seed, d){
  raceSeed=seed;
  if(DIFFS[d]){ diff=d; document.querySelectorAll('#diffSeg button').forEach(x=>x.classList.toggle('on', x.dataset.d===diff)); }
  raceActive=true; raceResolved=false; myResult=null; oppResult=null; myClearMs=0; oppClearMs=0; raceT0=0;
  oppProg={pct:0, opened:0, flags:0};
  rngFn=mulberry32(seed);
  init();
  $('resultModal').classList.remove('show');
  $('progWrap').style.display='';
  updateMyProg(); updateOppProg();
  startHeartbeat();
  $('msg').textContent='🏁 レース開始！同じ盤面で勝負';
}

function resolveRace(){
  if(raceResolved) return;
  if(!myResult && !oppResult) return;
  let title, detail;
  if(myResult==='boom'){ title='💥 敗北…'; detail='地雷を踏んでしまいました。相手の勝利です。'; }
  else if(oppResult==='boom'){ title='🏆 勝利！'; detail='相手が地雷を踏みました！'; }
  else if(myResult==='clear' && oppResult==='clear'){
    if(myClearMs<oppClearMs){ title='🏆 勝利！'; detail='両者クリア！タイム差で勝ちました。'; }
    else if(myClearMs>oppClearMs){ title='😢 敗北…'; detail='両者クリア！タイム差で負けました。'; }
    else { title='🤝 引き分け'; detail='まったく同じタイムでした！'; }
  }
  else if(myResult==='clear'){ title='🏆 勝利！'; detail='先にクリアしました！'; }
  else if(oppResult==='clear'){ title='😢 敗北…'; detail='相手が先にクリアしました。'; }
  else return;
  raceResolved=true; raceActive=false;
  over=true; stopTimer();
  /* フレンド戦績（friends.js）へ記録: resolveRace は勝敗確定時に1回だけ通る（退出時は通らない）。
     対戦レース形式: 自分/相手の地雷=負け/勝ち、両者クリア時はタイム差、同タイムは引き分け */
  if(window.PWFriends && PWFriends.recordMatch){
    let outcome = null;
    if(myResult==='boom') outcome = 'lose';
    else if(oppResult==='boom') outcome = 'win';
    else if(myResult==='clear' && oppResult==='clear') outcome = myClearMs < oppClearMs ? 'win' : myClearMs > oppClearMs ? 'lose' : 'draw';
    else if(myResult==='clear') outcome = 'win';
    else if(oppResult==='clear') outcome = 'lose';
    if(outcome) PWFriends.recordMatch(outcome);
  }
  showResult(title, detail);
}

function showResult(title, detail){
  const total=W*H-M;
  const myLine = myResult==='clear' ? 'クリア '+fmtMs(myClearMs)
    : myResult==='boom' ? '💥 地雷（進捗 '+currentPct()+'%）'
    : '進捗 '+currentPct()+'%（'+opened+'/'+total+'マス）';
  const oppLine = oppResult==='clear' ? 'クリア '+fmtMs(oppClearMs)
    : oppResult==='boom' ? '💥 地雷（進捗 '+oppProg.pct+'%）'
    : '進捗 '+oppProg.pct+'%（'+oppProg.opened+'/'+total+'マス）';
  $('resultTitle').textContent=title;
  $('resultStats').innerHTML = detail+'<br>あなた: <b>'+myLine+'</b><br>相手: <b>'+oppLine+'</b>';
  $('rematchBtn').textContent = isHost ? '🔁 再戦する' : '🔁 再戦を希望する';
  $('rematchBtn').disabled=false;
  $('rematchNote').textContent='';
  $('resultModal').classList.add('show');
}

/* 受信メッセージ処理（テストから直接呼べるよう関数として公開） */
function handleOnlineData(msg){
  if(!msg || typeof msg!=='object') return;
  if(msg.t==='ping'){ return; }
  if(msg.t==='hello'){
    if(!isHost) return;
    if(raceActive || raceResolved || myResult || oppResult){
      /* 再接続: レースはリセットせず、現在の進捗と結果を送り直す */
      reconnecting=false;
      sendMyStanding();
      startHeartbeat();
      setOnlineStatus('再接続しました！レースを続けます。');
      return;
    }
    raceSeed=(Math.random()*0x7fffffff)|0;
    startRace(raceSeed, diff);
    sendOnline({t:'start', seed:raceSeed, difficulty:diff});
    setOnlineStatus('相手が参加しました！レース開始。あなたはホストです。');
  }
  else if(msg.t==='start'){
    if(isHost) return;
    reconnecting=false;
    clearTimeout(guestRetryTimer);
    startRace(msg.seed|0, DIFFS[msg.difficulty]?msg.difficulty:'easy');
    setOnlineStatus('レース開始！先に全部開けた方が勝ちです。あなたはゲストです。');
  }
  else if(msg.t==='prog'){
    oppProg={pct:msg.pct|0, opened:msg.opened|0, flags:msg.flags|0};
    updateOppProg();
  }
  else if(msg.t==='clear'){
    if(!oppResult){ oppResult='clear'; oppClearMs=+msg.time||0; }
    resolveRace();
  }
  else if(msg.t==='boom'){
    if(!oppResult){ oppResult='boom'; }
    resolveRace();
  }
  else if(msg.t==='rematch'){
    if(isHost && !raceActive){
      raceSeed=(Math.random()*0x7fffffff)|0;
      startRace(raceSeed, diff);
      sendOnline({t:'start', seed:raceSeed, difficulty:diff});
      setOnlineStatus('再戦を開始しました！');
    }
  }
  else if(msg.t==='bye'){
    if(raceActive || raceResolved){
      raceResolved=true; raceActive=false; over=true; stopTimer();
      showResult('🚪 相手が退出しました', '対戦相手が退出したため、レースを終了しました。');
    }
    setOnlineStatus('相手が退出しました。');
  }
}

function onOnlineDisconnected(){
  if(netMode!=='online' || onlineClosing) return;
  conn=null; connOpen=false;
  stopHeartbeat();
  if(raceActive || raceResolved){
    /* レース中の切断: 自分のプレイは止めず、盤面を保持して再接続する */
    reconnecting=true;
    setOnlineStatus('<span class="err">接続が切れました。再接続を試みています…（レースは続きます）</span>');
    if(!isHost) scheduleGuestReconnect();
    return;
  }
  setOnlineStatus('<span class="err">相手との接続が切れました。</span>もう一度部屋を作るか、参加し直してください。');
}
function scheduleGuestReconnect(){
  clearTimeout(guestRetryTimer);
  let tries=0;
  const attempt=()=>{
    if(netMode!=='online' || !reconnecting) return;
    tries++;
    if(tries>20){
      reconnecting=false;
      setOnlineStatus('<span class="err">再接続できませんでした。退出して入り直してください。</span>');
      return;
    }
    guestRetryTimer=setTimeout(attempt, 5000);
    try{
      if(peer){ try{ peer.destroy(); }catch(e){} }
      peer=new Peer(undefined, PEER_OPTS);
      peer.on('open', ()=>{
        const c=peer.connect(PEER_PREFIX+roomCode, {reliable:true});
        setupConn(c);
        c.on('open', ()=>{
          disarmConnTimer();
          sendOnline({t:'hello'});
          sendMyStanding();
          setOnlineStatus('再接続しました！レースを続けます。');
        });
      });
      peer.on('error', ()=>{});
    }catch(e){}
  };
  guestRetryTimer=setTimeout(attempt, 1500);
}
function setupConn(c){
  conn=c;
  c.on('data', handleOnlineData);
  c.on('close', ()=>{ if(conn===c) onOnlineDisconnected(); });
  c.on('error', ()=>{ if(conn===c) onOnlineDisconnected(); });
  c.on('open', ()=>{ connOpen=true; disarmConnTimer(); });
  c.on('iceStateChanged', st=>{
    if(conn!==c) return;
    if((st==='failed'||st==='disconnected') && !raceActive && !raceResolved && !connOpen){
      disarmConnTimer();
      setOnlineStatus('<span class="err">接続を確立できませんでした。ネットワーク環境を変えて（Wi-Fi／モバイル回線の切替など）もう一度お試しください。</span>');
    }
  });
}
function teardownOnline(){
  onlineClosing=true;
  reconnecting=false;
  stopHeartbeat();
  clearTimeout(guestRetryTimer);
  clearTimeout(progFlushTimer);
  try{ if(conn) conn.close(); }catch(e){}
  try{ if(peer) peer.destroy(); }catch(e){}
  conn=null; peer=null; connOpen=false;
}
function hostRoom(){
  ensurePeer(ok=>{
    if(!ok){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。通信環境を確認してください。</span>'); return; }
    hostRoomNow();
  });
}
function hostRoomNow(){
  teardownOnline();
  onlineClosing=false;
  isHost=true;
  roomCode=genRoomCode();
  setOnlineStatus('部屋を作成中…');
  try{ peer=new Peer(PEER_PREFIX+roomCode, PEER_OPTS); }
  catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{
    $('roomCodeText').textContent=roomCode;
    $('codeWrap').style.display='';
    $('leaveBtn').style.display='';
    setOnlineStatus('フレンドの参加を待っています… 難易度はあなたの選択が適用されます。');
  });
  peer.on('connection', c=>{
    setupConn(c);
    if(reconnecting) setOnlineStatus('相手が再接続しています…');
    else setOnlineStatus('相手が接続しました。対局の準備中…');
    armConnTimer('相手との接続を確立できませんでした。相手にもう一度参加してもらうか、ネットワーク環境を変えてお試しください。');
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){
      setOnlineStatus('<span class="err">コードが重複しました。もう一度「部屋を作る」を押してください。</span>');
    }else{
      setOnlineStatus('<span class="err">接続エラーが発生しました。</span>');
    }
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}
function joinRoom(){
  const code=($('joinCode').value||'').trim().toUpperCase();
  if(code.length!==6){ setOnlineStatus('<span class="err">6文字のルームコードを入力してください。</span>'); return; }
  ensurePeer(ok=>{
    if(!ok){ setOnlineStatus('<span class="err">オンライン機能を読み込めませんでした。通信環境を確認してください。</span>'); return; }
    joinRoomNow(code);
  });
}
function joinRoomNow(code){
  teardownOnline();
  onlineClosing=false;
  isHost=false;
  roomCode=code;
  setOnlineStatus('接続中…');
  try{ peer=new Peer(undefined, PEER_OPTS); }
  catch(e){ setOnlineStatus('<span class="err">接続の作成に失敗しました。</span>'); return; }
  peer.on('open', ()=>{
    $('leaveBtn').style.display='';
    armConnTimer('接続を確立できませんでした。コードが正しいか確認し、ネットワーク環境を変えてもう一度お試しください。');
    const c=peer.connect(PEER_PREFIX+code, {reliable:true});
    setupConn(c);
    c.on('open', ()=>{
      sendOnline({t:'hello'});
      setOnlineStatus('接続しました！ホストがレースを開始するのを待っています…');
    });
  });
  peer.on('error', err=>{
    if(err && err.type==='peer-unavailable'){
      setOnlineStatus('<span class="err">部屋が見つかりませんでした。コードを確認してください。</span>');
    }else{
      setOnlineStatus('<span class="err">接続エラーが発生しました。</span>');
    }
  });
}
function leaveOnline(){
  if(conn && conn.open){ try{ conn.send({t:'bye'}); }catch(e){} }
  teardownOnline();
  onlineClosing=false;
  netMode='solo';
  raceActive=false; raceResolved=false; myResult=null; oppResult=null;
  $('onlinePanel').classList.remove('show');
  $('progWrap').style.display='none';
  $('leaveBtn').style.display='none';
  $('codeWrap').style.display='none';
  $('resultModal').classList.remove('show');
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on', x.dataset.m==='solo'));
  setOnlineStatus('オンラインはフレンド招待制です。「フレンドを招待して対戦」から始めましょう。');
  init();
}
function copyRoomCode(){
  if(!roomCode) return;
  const done=()=>{ $('copyCodeBtn').textContent='✅ コピー済み'; setTimeout(()=>{ $('copyCodeBtn').textContent='📋 コピー'; },1600); };
  const fallback=()=>{
    const ta=document.createElement('textarea');
    ta.value=roomCode; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    ta.remove(); done();
  };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(roomCode).then(done).catch(fallback);
  else fallback();
}

document.querySelectorAll('#modeSeg button').forEach(b=>{
  b.onclick=()=>{
    const m=b.dataset.m;
    if(m===netMode) return;
    if(m==='online'){
      netMode='online';
      document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.toggle('on', x===b));
      $('onlinePanel').classList.add('show');
      if(!peerAvailable()) setOnlineStatus('オンライン機能を読み込んでいます…（部屋の作成／参加時に自動で読み直します）');
    }else{
      leaveOnline();
    }
  };
});
$('hostBtn').onclick=hostRoom;
$('joinBtn').onclick=joinRoom;
$('leaveBtn').onclick=leaveOnline;
$('copyCodeBtn').onclick=copyRoomCode;
$('modalLeaveBtn').onclick=leaveOnline;
$('rematchBtn').onclick=()=>{
  if(raceActive) return;
  if(isHost){
    raceSeed=(Math.random()*0x7fffffff)|0;
    startRace(raceSeed, diff);
    sendOnline({t:'start', seed:raceSeed, difficulty:diff});
    setOnlineStatus('再戦を開始しました！');
  }else{
    sendOnline({t:'rematch'});
    $('rematchBtn').disabled=true;
    $('rematchNote').textContent='ホストの開始を待っています…';
  }
};
init();
</script>
<script>
window.PW_GAME='minesweeper';
window.PW_JOIN_CFG={openers:[{click:'button[data-m="online"]'}],input:'#joinCode',joinBtn:'#joinBtn',hostBtn:'#hostBtn'};
/* 招待参加/作成の minesweeper 側エントリ（friends.js は定義済みのこちらを尊重する。
   ?join の読み取りとログインゲート判定は friends.js の initHooks/runJoinHook が担い、
   最終的に #joinBtn クリック→ joinRoom() へ合流する。ここでは friends.js の
   DOMクリック経路に頼らず、モード切替→コード入力→ joinRoom() を直接行う経路も用意する） */
window.PW_AUTO_HOST=function(){
  if(window.PWFriends&&PWFriends.gateState&&PWFriends.gateState()!=='member') return; /* ゲストは friends.js 側の案内に従う */
  if(isHost&&roomCode) return;
  if(netMode!=='online'){ const b=document.querySelector('button[data-m="online"]'); if(b) b.click(); }
  hostRoom();
};
window.PW_AUTO_JOIN=function(code){
  if(window.PWFriends&&PWFriends.gateState&&PWFriends.gateState()!=='member') return;
  const c=(code||'').toString().trim().toUpperCase().replace(/[^A-HJ-NP-Z2-9]/g,'').slice(0,6);
  if(c.length!==6) return;
  if(!isHost&&roomCode===c&&peer) return; /* 参加処理中/参加済みへの二重発火を防ぐ */
  if(netMode!=='online'){ const b=document.querySelector('button[data-m="online"]'); if(b) b.click(); }
  const inp=document.getElementById('joinCode'); if(inp) inp.value=c;
  joinRoom();
};
</script>
<script src="friends.js"></script>
</body>
</html>
